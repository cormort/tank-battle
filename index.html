function checkTileCollision(x, y, size) {
  const c1 = (x/TILE)|0, r1 = (y/TILE)|0;
  const c2 = ((x+size-1)/TILE)|0, r2 = ((y+size-1)/TILE)|0;
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        const t = G.map[r][c];
        if (t === BRICK || t === STEEL || t === WATER || t === BASE || t === BASE_DEAD) return true;
      }
    }
  }
  return false;
}

// ==================== Tank 類別 ====================
class Tank {
  constructor(x, y, dir, type, isPlayer) {
    this.x = clampPos(x); this.y = clampPos(y); 
    this.dir = dir; this.aimDir = dir;
    this.isPlayer = isPlayer; this.type = type; 
    this.size = TILE - 4;
    this.bulletTimer = 0; this.alive = true; this.moving = false;
    this.flashTimer = 0; 
    this.aiChangeTimer = Math.random() * 50; 
    this.aiDir = dir;
    this.lastDist = Infinity;
    this.applyTypeStats();
  }

  applyTypeStats() {
    if (this.isPlayer) {
      this.maxHp = G.playerStats.maxHp;
      this.hp = G.playerStats.hp;
      this.speed = 2.5 * G.playerStats.speedMult;
      this.weapon = G.playerStats.weapon || 'NORMAL';
      this.weaponTier = G.playerStats.weaponTier || 0;
      this.pierce = G.playerStats.pierce;
      this.color = '#4a7a2e';
      const baseCD = G.isVSMode ? CONFIG.BULLET.PLAYER_COOLDOWN_VS : CONFIG.BULLET.PLAYER_COOLDOWN;
      this.bulletCooldown = Math.max(3, Math.floor(baseCD / G.playerStats.speedMult));
    } else {
      this.weapon = 'NORMAL'; this.pierce = false;
      if (this.type === 'FAST') { this.speed = 2.2; this.color = '#d4d'; this.hp = this.maxHp = 1; this.bulletCooldown = CONFIG.BULLET.ENEMY_FAST; }
      else if (this.type === 'HEAVY') { this.speed = 0.8; this.color = '#38a'; this.hp = this.maxHp = 4; this.bulletCooldown = CONFIG.BULLET.ENEMY_HEAVY; }
      else if (this.type === 'SUICIDE') { this.speed = 2.0; this.color = '#f50'; this.hp = this.maxHp = 1; this.bulletCooldown = 999; }
      else if (this.type === 'BOSS') {
        this.speed = 0.6; this.color = '#800';
        this.hp = this.maxHp = 15 + G.level*5;
        this.size = TILE * 1.5; this.weapon = 'SPREAD';
        this.bulletCooldown = CONFIG.BULLET.BOSS;
        this.bossPhase = 1;
        this.bossPhaseTimer = 0;
      }
      else {
        this.speed = 1.0 + Math.random() * 0.5;
        this.color = '#c33';
        this.hp = this.maxHp = 1;
        this.bulletCooldown = CONFIG.BULLET.ENEMY_NORMAL;
      }
      // 菁英詞綴
      this.elitePrefix = this.elitePrefix || null;
      if (this.elitePrefix && ELITE_PREFIXES[this.elitePrefix]) {
        const prefix = ELITE_PREFIXES[this.elitePrefix];
        this.maxHp = Math.ceil(this.maxHp * 1.5);
        this.hp = this.maxHp;
        this.eliteEffects = prefix;
      }
      // 特殊敵人類型初始化
      this.slowTimer = 0;
      this.shieldHits = this.elitePrefix === 'SHIELDED' ? 3 : 0;
      this.regenTimer = 0;
      this.summonTimer = 0;
    }
  }

  update() {
    if (!this.alive) return;
    this.moving = false;
    if (this.bulletTimer > 0) this.bulletTimer--;
    if (this.flashTimer > 0) this.flashTimer--;
  }

  _hasEntityCollision(nx, ny) {
    spatialGrid.queryRect(nx, ny, this.size, this.size, _queryBuf);
    Perf.collisionChecks += _queryBuf.length;
    
    for (let i = 0; i < _queryBuf.length; i++) {
      const o = _queryBuf[i];
      if (o === this || !o.alive) continue;
      if (rectsOverlap(nx, ny, this.size, this.size, o.x, o.y, o.size, o.size)) return true;
    }
    
    if (!this.isPlayer && G.player && G.player.alive) {
      if (rectsOverlap(nx, ny, this.size, this.size, G.player.x, G.player.y, G.player.size, G.player.size)) return true;
    }
    if (this.isPlayer && G.enemies) {
      for (let i = 0; i < G.enemies.length; i++) {
        const e = G.enemies[i];
        if (e && e.alive && rectsOverlap(nx, ny, this.size, this.size, e.x, e.y, e.size, e.size)) return true;
      }
    }
    return false;
  }

  _canMoveTo(nx, ny) {
    if (nx < 1 || nx + this.size > W - 1 || ny < 1 || ny + this.size > H - 1) return false;
    if (checkTileCollision(nx, ny, this.size)) return false;
    return !this._hasEntityCollision(nx, ny);
  }

  move(dir) {
    if (!this.alive) return;
    this.dir = dir; 
    this.moving = true;
    
    if (!this.isPlayer || !G.isVSMode) this.aimDir = dir;

    let nx = clampPos(this.x + DX[dir] * this.speed);
    let ny = clampPos(this.y + DY[dir] * this.speed);

    if (nx < 1 || nx + this.size > W - 1 || ny < 1 || ny + this.size > H - 1) {
      if (this.isPlayer || G.isVSMode) this._trySlide(dir);
      else this.aiChangeTimer = 0;
      return;
    }
    if (checkTileCollision(nx, ny, this.size)) {
      if (this.isPlayer || G.isVSMode) this._trySlide(dir);
      else this.aiChangeTimer = 0;
      return;
    }
    if (this._hasEntityCollision(nx, ny)) {
      if (this.isPlayer || G.isVSMode) this._trySlide(dir);
      else this.aiChangeTimer = 0;
      return;
    }
    
    this.x = nx; this.y = ny;
  }

  _trySlide(dir) {
    const nudges = [2, 3, 4, 6];
    for (const nudge of nudges) {
      for (const sign of [-1, 1]) {
        let tx, ty;
        if (dir === UP || dir === DOWN) {
          tx = clampPos(this.x + sign * nudge);
          ty = clampPos(this.y + DY[dir] * this.speed);
        } else {
          tx = clampPos(this.x + DX[dir] * this.speed);
          ty = clampPos(this.y + sign * nudge);
        }
        if (this._canMoveTo(tx, ty)) { 
          this.x = tx; this.y = ty; 
          return; 
        }
      }
    }
  }

  shoot() {
    if (this.isPlayer) {
      shootWeapon(this);
    } else {
      if (!this.alive || this.bulletTimer > 0) return;
      const hs = this.size / 2;
      const cx = this.x + hs;
      const cy = this.y + hs;
      const b = bulletsPool.acquire();
      b.dir = this.aimDir;
      b.isPlayer = false;
      b.pierce = false;
      b.x = cx - 3 + DX[this.aimDir]*(hs+2);
      b.y = cy - 3 + DY[this.aimDir]*(hs+2);
      b.speed = this.type === 'BOSS' ? CONFIG.BULLET.SPEED_BOSS : CONFIG.BULLET.SPEED_ENEMY;
      b.vx = DX[this.aimDir]; b.vy = DY[this.aimDir];
      b.power = this.weapon === 'SPREAD' ? 2 : 1;
      b.hitTanks.length = 0;
      this.bulletTimer = this.bulletCooldown;
    }
  }

  draw() {
    if (!this.alive) return;

    if (this.isPlayer && this.flashTimer > 30) {
      drawNESShield(this.x, this.y, this.size);
    }

    if (this.flashTimer > 0 && (G.frameCount & 2)) return;

    ctx.save();

    let colMain, colDark, colLight;
    if (this.isPlayer) {
      colMain = '#d4a72c';  colLight = '#fce560';  colDark = '#7a5a14';
    } else if (this.type === 'FAST') {
      colMain = '#dcdce8';  colLight = '#ffffff';  colDark = '#6a6a78';
    } else if (this.type === 'HEAVY') {
      colMain = '#5a8acc';  colLight = '#9ec0ff';  colDark = '#1c3a6a';
    } else if (this.type === 'SUICIDE') {
      colMain = '#e84418';  colLight = '#ff8c4a';  colDark = '#7a1a04';
    } else if (this.type === 'BOSS') {
      colMain = '#a02020';  colLight = '#e84040';  colDark = '#400000';
    } else {
      colMain = '#b8b8b8';  colLight = '#e8e8e8';  colDark = '#4a4a4a';
    }

    const s = this.size;
    const x = this.x | 0;
    const y = this.y | 0;
    const cx = x + s / 2;
    const cy = y + s / 2;
    const isHoriz = (this.aimDir === LEFT || this.aimDir === RIGHT);

    const trackW = Math.max(3, (s / 7) | 0);
    const seg = Math.max(2, (s / 6) | 0);
    const trackOffset = (G.frameCount >> 2) & 1;

    ctx.fillStyle = colDark;
    if (isHoriz) {
      ctx.fillRect(x, y, s, trackW);
      ctx.fillRect(x, y + s - trackW, s, trackW);
      ctx.fillStyle = colMain;
      for (let i = (trackOffset && this.moving) ? 0 : seg; i < s; i += seg * 2) {
        ctx.fillRect(x + i, y, seg, trackW);
        ctx.fillRect(x + i, y + s - trackW, seg, trackW);
      }
    } else {
      ctx.fillRect(x, y, trackW, s);
      ctx.fillRect(x + s - trackW, y, trackW, s);
      ctx.fillStyle = colMain;
      for (let i = (trackOffset && this.moving) ? 0 : seg; i < s; i += seg * 2) {
        ctx.fillRect(x, y + i, trackW, seg);
        ctx.fillRect(x + s - trackW, y + i, trackW, seg);
      }
    }

    const bodyPad = trackW + 1;
    ctx.fillStyle = colMain;
    ctx.fillRect(x + bodyPad, y + bodyPad, s - bodyPad * 2, s - bodyPad * 2);

    ctx.fillStyle = colLight;
    if (isHoriz) {
      ctx.fillRect(x + bodyPad, y + bodyPad, s - bodyPad * 2, 1);
    } else {
      ctx.fillRect(x + bodyPad, y + bodyPad, 1, s - bodyPad * 2);
    }

    const turretSize = Math.max(6, (s * 0.45) | 0);
    const tx = (cx - turretSize / 2) | 0;
    const ty = (cy - turretSize / 2) | 0;
    ctx.fillStyle = colMain;
    ctx.fillRect(tx, ty, turretSize, turretSize);
    ctx.fillStyle = colLight;
    ctx.fillRect(tx, ty, turretSize, 1);
    ctx.fillRect(tx, ty, 1, turretSize);
    ctx.fillStyle = colDark;
    ctx.fillRect(tx, ty + turretSize - 1, turretSize, 1);
    ctx.fillRect(tx + turretSize - 1, ty, 1, turretSize);

    const barrelW = Math.max(2, (s / 8) | 0);
    const barrelL = Math.max(6, (s * 0.45) | 0);
    ctx.fillStyle = colLight;
    if (this.aimDir === UP) {
      ctx.fillRect((cx - barrelW / 2) | 0, y, barrelW, (cy - y) | 0);
    } else if (this.aimDir === DOWN) {
      ctx.fillRect((cx - barrelW / 2) | 0, cy | 0, barrelW, (y + s - cy) | 0);
    } else if (this.aimDir === LEFT) {
      ctx.fillRect(x, (cy - barrelW / 2) | 0, (cx - x) | 0, barrelW);
    } else {
      ctx.fillRect(cx | 0, (cy - barrelW / 2) | 0, (x + s - cx) | 0, barrelW);
    }

    if (this.type === 'BOSS') {
      ctx.fillStyle = colDark;
      ctx.fillRect((cx - 2) | 0, (cy - 2) | 0, 4, 4);
    }

    if (this.elitePrefix && this.eliteEffects) {
      const eff = this.eliteEffects;
      ctx.fillStyle = eff.color;
      ctx.globalAlpha = 0.3 + Math.sin(G.frameCount * 0.1) * 0.2;
      ctx.fillRect(x - 1, y - 1, s + 2, s + 2);
      ctx.globalAlpha = 1;

      ctx.fillStyle = eff.color;
      ctx.font = '8px Arial';
      ctx.fillText(eff.icon, x + 2, y - 3);
    }

    if (this.maxHp > 1) {
      ctx.fillStyle = '#000';
      ctx.fillRect(x, y - 6, s, 3);
      ctx.fillStyle = this.isPlayer ? '#3cf03c' : '#ff4040';
      ctx.fillRect(x, y - 6, (s * (this.hp / this.maxHp)) | 0, 3);
    }

    ctx.restore();
  }
}

function drawNESSpawnEffect(x, y, size, life, maxLife) {
  ctx.save();
  const frame = (((maxLife - life) >> 2) % 4);
  const cx = x + size / 2;
  const cy = y + size / 2;
  const r = size / 2;
  ctx.fillStyle = '#ffffff';
  if (frame === 0) {
    ctx.fillRect((cx - 1) | 0, y, 2, size);
    ctx.fillRect(x, (cy - 1) | 0, size, 2);
  } else if (frame === 1) {
    ctx.fillRect((cx - 1) | 0, y, 2, size);
    ctx.fillRect(x, (cy - 1) | 0, size, 2);
    for (let i = -r + 2; i <= r - 2; i += 2) {
      ctx.fillRect((cx + i) | 0, (cy + i) | 0, 2, 2);
      ctx.fillRect((cx + i) | 0, (cy - i) | 0, 2, 2);
    }
  } else if (frame === 2) {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, y);    ctx.lineTo(x + size, cy);
    ctx.lineTo(cx, y + size);  ctx.lineTo(x, cy);
    ctx.closePath();
    ctx.stroke();
  } else {
    ctx.fillRect((cx - 3) | 0, (cy - 3) | 0, 6, 6);
  }
  ctx.restore();
}

function drawNESShield(x, y, size) {
  const phase = (G.frameCount >> 1) & 1;
  ctx.save();
  ctx.fillStyle = phase ? '#ffffff' : '#74c0fc';
  const t = 2;
  if (phase) {
    ctx.fillRect(x + size/2 - t/2, y - 2, t, size + 4);
    ctx.fillRect(x - 2, y + size/2 - t/2, size + 4, t);
  } else {
    ctx.fillRect(x, y, t, t);
    ctx.fillRect(x + size - t, y, t, t);
    ctx.fillRect(x, y + size - t, t, t);
    ctx.fillRect(x + size - t, y + size - t, t, t);
    ctx.fillRect(x + size/2 - t/2, y - 2, t, t);
    ctx.fillRect(x + size/2 - t/2, y + size, t, t);
    ctx.fillRect(x - 2, y + size/2 - t/2, t, t);
    ctx.fillRect(x + size, y + size/2 - t/2, t, t);
  }
  ctx.restore();
}

// ==================== 子彈邏輯 ====================
function updateBullet(b) {
  if (!b.alive) return;
  b.x += b.vx * b.speed; 
  b.y += b.vy * b.speed;

  if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) { 
    b.alive = false; return; 
  }

  const bc = ((b.x + 3) / TILE) | 0, br = ((b.y + 3) / TILE) | 0;
  if (br >= 0 && br < ROWS && bc >= 0 && bc < COLS) {
    const t = G.map[br][bc];
    if (t === BRICK) {
      b.alive = false; breakTile(bc, br);
      spawnExplosion(b.x, b.y, 'spark');
      Sound.hitBrick();
      return;
    }
    if (t === STEEL) {
      b.alive = false;
      spawnExplosion(b.x, b.y, 'spark');
      Sound.hitSteel();
      return;
    }
    if (t === BASE) {
      b.alive = false;
      if (G.wallTimer > 0 || G.permanentStats.permanentWall) {
        spawnExplosion(b.x, b.y, 'spark');
        return;
      }
      G.map[br][bc] = BASE_DEAD;
      G.baseDestroyed = true;
      for (let i = 0; i < G.dynamicTiles.length; i++) {
        const dt = G.dynamicTiles[i];
        if (dt.r === br && dt.c === bc) { dt.type = BASE_DEAD; break; }
      }
      spawnExplosion(bc*TILE+13, br*TILE+13, 'big');
      triggerShake(20, 8);
      Sound.baseDestroyed();
      return;
    }
  }

  if (b.isPlayer) {
    spatialGrid.queryRect(b.x - 4, b.y - 4, b.size + 8, b.size + 8, _queryBuf);
    Perf.collisionChecks += _queryBuf.length;
    
    for (let i = 0; i < _queryBuf.length; i++) {
      const t = _queryBuf[i];
      if (!t.alive || t.isPlayer || b.hitTanks.indexOf(t) !== -1) continue;
      
      if (rectsOverlap(b.x, b.y, b.size, b.size, t.x, t.y, t.size, t.size)) {
        handleBulletHit(b, t);
        if (!b.alive) return;
      }
    }
  } else {
    if (G.player && G.player.alive && G.player.flashTimer === 0) {
      Perf.collisionChecks++;
      if (rectsOverlap(b.x, b.y, b.size, b.size, G.player.x, G.player.y, G.player.size, G.player.size)) {
        handleBulletHit(b, G.player);
      }
    }
  }
}

function handleBulletHit(b, t) {
  if (t.shieldHits > 0) {
    t.shieldHits--;
    b.alive = false;
    spawnExplosion(b.x, b.y, 'shield');
    return;
  }

  if (G.playerStats.passives.includes('BARRIER') && G.playerStats.barrierTimer <= 0) {
    b.alive = false;
    spawnExplosion(b.x, b.y, 'shield');
    G.playerStats.barrierTimer = 120;
    return;
  }
  if (G.playerStats.barrierTimer > 0) {
    b.alive = false;
    spawnExplosion(b.x, b.y, 'shield');
    return;
  }

  if (G.playerStats.barrierTimer > 0) G.playerStats.barrierTimer--;

  let powerMult = 1;
  if (G.playerStats.passives.includes('RAGE') && G.player && t === G.player) {
    const hpRatio = G.playerStats.hp / G.playerStats.maxHp;
    powerMult = hpRatio < 0.5 ? 2 : hpRatio < 0.75 ? 1.5 : 1;
  }

  if (G.playerStats.passives.includes('WEAKEN') && t.type === 'BOSS') {
    powerMult *= 1.5;
  }

  b.hitTanks.push(t);
  if (!b.pierce) b.alive = false;

  t.hp -= b.power * powerMult;
  t.flashTimer = CONFIG.GAMEPLAY.PLAYER_HIT_FLASH;
  spawnExplosion(b.x, b.y, 'spark');

  if (t.hp <= 0) {
    t.alive = false;

    if (t.elitePrefix === 'EXPLOSIVE') {
      spawnExplosion(t.x + t.size/2, t.y + t.size/2, 'big');
      triggerShake(8, 6);
      if (G.player && G.player.alive && G.player.flashTimer === 0) {
        G.playerStats.hp -= 0.5;
      }
    }

    spawnExplosion(t.x + t.size/2, t.y + t.size/2, t.type === 'BOSS' ? 'big' : 'tank');
    if (t.type === 'BOSS') { triggerShake(15, 6); Sound.bigExplode(); }
    else Sound.explode();

    if (!b.isPlayer && t === G.player) {
      G.playerStats.hp -= 1;
      triggerShake(10, 5);
      Sound.hitPlayer();
      updateHUD();

      if (G.playerStats.hp <= 0) {
        setTimeout(showGameOver, 1000);
      } else {
        G.player.alive = true;
        G.player.flashTimer = CONFIG.GAMEPLAY.PLAYER_RESPAWN_INVUL;
        G.player.x = G.playerSpawnPos.x;
        G.player.y = G.playerSpawnPos.y;
        G.player.hp = G.playerStats.hp;
        spawnExplosion(G.player.x, G.player.y, 'spark');
      }
    } else {
      G.aliveEnemies--;
      const pts = t.type === 'BOSS' ? 1000 : (t.type === 'SUICIDE' ? 50 : (t.elitePrefix ? 150 : 100));
      G.score += pts;
      addScorePopup(t.x, t.y, `+${pts}`);
      addCombo(true);

      if (t.hasPowerUp && t.powerUpType) {
        G.powerUps.push({
          type: t.powerUpType,
          x: t.x + t.size/2,
          y: t.y + t.size/2,
          life: 600,
          maxLife: 600,
          alive: true
        });
      }

      if (b.isPlayer && (b.type === 'PLASMA' || b.speed > CONFIG.BULLET.SPEED_PLAYER)) {
        const result = applyPassiveEffects(t, b, 'laser_kill');
        if (result && result.triggered) {  }
      }

      if (G.playerStats.passives.includes('VAMPIRE')) {
        G.playerStats.hp = Math.min(G.playerStats.maxHp, G.playerStats.hp + 0.2);
      }

      updateHUD();

      checkLevelComplete();
    }
  }
}

// ==================== 粒子系統 ====================
function spawnExplosion(x, y, type) {
  let count;
  if (type === 'big') count = CONFIG.PARTICLE.BIG_COUNT;
  else if (type === 'tank') count = CONFIG.PARTICLE.TANK_DEATH_COUNT;
  else if (type === 'shield') count = 8;
  else count = CONFIG.PARTICLE.SPARK_COUNT;
  
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * (type === 'big' ? 4 : 2) + 0.5;

    const spark = particlesPool.acquire();
    spark.type = 'spark'; 
    spark.x = x; spark.y = y;
    spark.vx = Math.cos(angle) * speed; 
    spark.vy = Math.sin(angle) * speed;
    spark.life = spark.maxLife = 15 + Math.random() * 20; 
    spark.size = Math.random() * 3 + 1.5;
    
    if (type === 'shield') spark.color = '#5cd8ff';
    else spark.color = Math.random() > 0.5 ? '#ffaa00' : '#ff3300';

    if (type === 'big' || type === 'tank') {
      const smoke = particlesPool.acquire();
      smoke.type = 'smoke'; 
      smoke.x = x; smoke.y = y;
      smoke.vx = Math.cos(angle) * speed * 0.3; 
      smoke.vy = Math.sin(angle) * speed * 0.3 - 0.5;
      smoke.life = smoke.maxLife = 30 + Math.random() * 30; 
      smoke.size = Math.random() * 4 + 4;
      smoke.color = 'rgba(100, 100, 100, 0.5)';
    }
  }
}

function updateParticles() {
  const arr = particlesPool.active;
  for (let i = 0; i < arr.length; i++) {
    const p = arr[i];
    if (!p.alive) continue;
    p.x += p.vx; p.y += p.vy; p.life--;
    p.vx *= 0.94; p.vy *= 0.94;
    if (p.type === 'smoke') p.size += 0.1;
    if (p.life <= 0) p.alive = false;
  }
  particlesPool.sweep();
}

function drawParticles() {
  const arr = particlesPool.active;
  ctx.save();
  for (let i = 0; i < arr.length; i++) {
    const p = arr[i];
    if (!p.alive || p.type !== 'spark') continue;
    const t = p.life / p.maxLife;
    if (p.color === '#5cd8ff') {
      ctx.fillStyle = t > 0.5 ? '#ffffff' : '#74c0fc';
    } else {
      ctx.fillStyle = t > 0.7 ? '#ffeb50' : t > 0.4 ? '#ff9020' : '#c03030';
    }
    const sz = (p.size + 0.5) | 0;
    ctx.fillRect(p.x | 0, p.y | 0, sz, sz);
  }
  for (let i = 0; i < arr.length; i++) {
    const p = arr[i];
    if (!p.alive || p.type !== 'smoke') continue;
    const a = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = `rgba(80,80,80,${a * 0.5})`;
    ctx.fillRect(p.x | 0, p.y | 0, p.size | 0, p.size | 0);
  }
  ctx.restore();
}

function updateScorePopups() {
  for (let i = G.scorePopups.length - 1; i >= 0; i--) {
    const p = G.scorePopups[i];
    p.y += p.vy; p.vy *= 0.95; p.life--;
    if (p.life <= 0) G.scorePopups.splice(i, 1);
  }
}

function drawScorePopups() {
  ctx.save();
  ctx.font = '10px "Press Start 2P"';
  ctx.fillStyle = '#ffe680';
  for (let i = 0; i < G.scorePopups.length; i++) {
    const p = G.scorePopups[i];
    ctx.globalAlpha = p.life / 40;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.restore();
}

// ==================== 子彈批處理渲染 (NES 風格) ====================
function renderBullets() {
  const bullets = bulletsPool.active;
  if (bullets.length === 0) return;

  ctx.save();
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (!b.alive) continue;
    const cx = (b.x + b.size / 2) | 0;
    const cy = (b.y + b.size / 2) | 0;
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - 3, cy - 3, 6, 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 2, cy - 2, 4, 4);
    if (b.dir === UP)         ctx.fillRect(cx - 1, cy - 4, 2, 2);
    else if (b.dir === DOWN)  ctx.fillRect(cx - 1, cy + 2, 2, 2);
    else if (b.dir === LEFT)  ctx.fillRect(cx - 4, cy - 1, 2, 2);
    else                       ctx.fillRect(cx + 2, cy - 1, 2, 2);
  }
  ctx.restore();
}

// ==================== Director System（局內事件） ====================
const DIRECTOR_EVENTS = {
  SURGE: {
    name: '⚠️ ENEMY SURGE', duration: 600, desc: '敵軍生成加倍',
    activate() { G.spawnInterval = Math.max(4, G.spawnInterval / 2); },
    deactivate() { G.spawnInterval = Math.min(30, G.spawnInterval * 2); }
  },
  AIRDROP: {
    name: '📦 空投來了', duration: 900, desc: '高級物資出現',
    activate() {
      G.directorEvents.push({ type: 'airdrop', x: W/2, y: H/2, life: 300, maxLife: 300 });
    }
  },
  MINIBOSS: {
    name: '💀 BOSS 突襲', duration: 1200, desc: 'Mini Boss 出現',
    activate() {
      const e = new Tank(W/2, TILE, DOWN, 'BOSS', false);
      e.hp = e.maxHp = 8;
      G.enemies.push(e);
    }
  },
  ORBITAL: {
    name: '🚀 軌道轟炸', duration: 800, desc: '地面出現預警',
    activate() {
      G.directorEvents.push({ type: 'orbital', targets: [], stage: 0, timer: 0 });
    }
  },
  TRAIN: {
    name: '🚂 補給列車', duration: 600, desc: '高速物資列車',
    activate() {
      G.directorEvents.push({ type: 'train', x: 0, y: H/2, life: 360 });
    }
  }
};

function updateDirector() {
  if (!G.isVSMode || G.frameCount % 300 !== 0) return;

  if (Math.random() < 0.15 && G.directorEvents.length === 0) {
    const events = Object.keys(DIRECTOR_EVENTS);
    const eventName = events[(Math.random() * events.length) | 0];
    const event = DIRECTOR_EVENTS[eventName];
    event.activate();
    G.directorEvents.push({ name: event.name, desc: event.desc, life: event.duration, type: eventName });
  }
}

function updateDirectorEvents() {
  for (let i = G.directorEvents.length - 1; i >= 0; i--) {
    const ev = G.directorEvents[i];
    ev.life--;

    if (ev.type === 'airdrop') {
    } else if (ev.type === 'orbital') {
      ev.timer++;
      if (ev.timer % 60 === 0) {
        ev.stage++;
        const x = Math.random() * W;
        const y = Math.random() * H;
        ev.targets.push({ x, y, stage: ev.stage });
      }
      if (ev.timer > 240) {
        for (const t of ev.targets) {
          spawnExplosion(t.x, t.y, 'big');
        }
        ev.targets = [];
      }
    } else if (ev.type === 'train') {
      ev.x += 3;
      if (ev.x > W) ev.life = 0;
    }

    if (ev.life <= 0) {
      G.directorEvents.splice(i, 1);
    }
  }
}

// ==================== 地圖事件系統 ====================
const MAP_EVENTS = [
  { id: 'DESERT', name: '🏜️ 沙漠', effect: '移速 -30%', color: '#cc8844', duration: 600 },
  { id: 'ICE', name: '❄️ 冰原', effect: '坦克滑行慣性', color: '#88ccff', duration: 600 },
  { id: 'VOLCANIC', name: '🌋 火山', effect: '定期噴岩漿', color: '#ff4422', duration: 480 },
  { id: 'EMP', name: '⚡ EMP區域', effect: '子彈速度減半', color: '#aa44ff', duration: 600 },
  { id: 'NIGHT', name: '🌙 夜戰', effect: '視野縮小', color: '#222244', duration: 600 },
  { id: 'TOXIC', name: '☣️ 毒霧', effect: '持續扣血', color: '#44ff44', duration: 480 }
];

// 地圖事件狀態
let mapEventState = {
  active: false,
  type: null,
  timer: 0,
  duration: 0,
  volcanoTimer: 0,
  iceFriction: false,
  volcanoTargets: []
};

function rollMapEvent() {
  if (!G.isVSMode || G.level < 3) return null;
  if (Math.random() < 0.2) {
    const ev = MAP_EVENTS[(Math.random() * MAP_EVENTS.length) | 0];
    return ev;
  }
  return null;
}

function activateMapEvent(ev) {
  mapEventState.active = true;
  mapEventState.type = ev.id;
  mapEventState.timer = ev.duration;
  mapEventState.duration = ev.duration;
  mapEventState.volcanoTimer = 0;
  mapEventState.volcanoTargets = [];
  mapEventState.iceFriction = false;

  if (ev.id === 'ICE') G.playerStats.speedMult *= 0.6; 
  if (ev.id === 'EMP') {
    for (const b of bulletsPool.active) {
      if (b.isPlayer && b.alive) b.speed *= 0.5;
    }
  }
  addScorePopup(W / 2, H / 2 - 50, `${ev.name} 事件!`);
}

function updateMapEvent() {
  if (!mapEventState.active) return;
  mapEventState.timer--;

  switch (mapEventState.type) {
    case 'DESERT':
      break;

    case 'ICE':
      if (G.player && G.player.alive && G.player.moving) {
        G.player.moving = true;
      }
      break;

    case 'VOLCANIC':
      mapEventState.volcanoTimer++;
      if (mapEventState.volcanoTimer % 90 === 0) {
        const rx = Math.random() * (W - TILE * 4) + TILE * 2;
        const ry = Math.random() * (H - TILE * 4) + TILE * 2;
        mapEventState.volcanoTargets.push({ x: rx, y: ry, life: 60 });
        if (G.player && G.player.alive && Math.hypot(G.player.x - rx, G.player.y - ry) < TILE * 3) {
          G.playerStats.hp -= 0.3;
          triggerShake(5, 3);
        }
        for (const e of G.enemies) {
          if (e.alive && Math.hypot(e.x - rx, e.y - ry) < TILE * 2) {
            e.hp -= 1;
          }
        }
      }
      for (let i = mapEventState.volcanoTargets.length - 1; i >= 0; i--) {
        const vt = mapEventState.volcanoTargets[i];
        vt.life--;
        if (vt.life <= 0) mapEventState.volcanoTargets.splice(i, 1);
      }
      break;

    case 'EMP':
      break;

    case 'NIGHT':
      break;

    case 'TOXIC':
      if (G.frameCount % 60 === 0 && G.player && G.player.alive) {
        G.playerStats.hp -= 0.15;
      }
      break;
  }

  if (mapEventState.timer <= 0) {
    deactivateMapEvent();
  }
}

function deactivateMapEvent() {
  const evType = mapEventState.type;
  mapEventState.active = false;
  mapEventState.type = null;

  if (evType === 'ICE') {
    G.playerStats.speedMult /= 0.6; 
  }
  if (evType === 'EMP') {
  }
}

function drawMapEvent() {
  if (!mapEventState.active) return;

  switch (mapEventState.type) {
    case 'DESERT':
      ctx.fillStyle = 'rgba(204,136,68,0.05)';
      ctx.fillRect(0, 0, W, H);
      break;

    case 'ICE':
      ctx.fillStyle = 'rgba(136,204,255,0.04)';
      ctx.fillRect(0, 0, W, H);
      break;

    case 'VOLCANIC':
      ctx.fillStyle = 'rgba(255,68,34,0.06)';
      ctx.fillRect(0, 0, W, H);
      for (const vt of mapEventState.volcanoTargets) {
        const alpha = vt.life / 60;
        ctx.fillStyle = `rgba(255,100,0,${alpha * 0.4})`;
        ctx.beginPath();
        ctx.arc(vt.x, vt.y, TILE * 1.5 * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,200,0,${alpha * 0.6})`;
        ctx.beginPath();
        ctx.arc(vt.x, vt.y, TILE * 0.8 * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
      break;

    case 'EMP':
      ctx.fillStyle = 'rgba(170,68,255,0.04)';
      ctx.fillRect(0, 0, W, H);
      break;

    case 'NIGHT':
      ctx.fillStyle = 'rgba(0,0,20,0.55)';
      ctx.fillRect(0, 0, W, H);
      if (G.player && G.player.alive) {
        const gradient = ctx.createRadialGradient(
          G.player.x + TILE / 2, G.player.y + TILE / 2, 0,
          G.player.x + TILE / 2, G.player.y + TILE / 2, TILE * 8
        );
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,20,0.55)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, W, H);
      }
      break;

    case 'TOXIC':
      ctx.fillStyle = 'rgba(68,255,68,0.04)';
      ctx.fillRect(0, 0, W, H);
      break;
  }
}

// ==================== COMBO 系統 ====================
function addCombo(kill = true) {
  if (!kill) return;
  G.playerStats.combo++;
  G.playerStats.comboTimer = 120;

  const bonus = Math.min(G.playerStats.combo, 10) * 0.1;
  G.score += Math.floor((10 + G.level * 2) * (1 + bonus));

  if (G.playerStats.combo >= 10) {
    triggerShake(3, 5);
    addScorePopup(G.player.x, G.player.y - 20, '🔥 COMBO x10!');
  }
}

function updateCombo() {
  if (G.playerStats.comboTimer > 0) {
    G.playerStats.comboTimer--;
    if (G.playerStats.comboTimer === 0) {
      G.playerStats.combo = 0;
    }
  }
}

// ==================== 經濟系統 ====================
function getDynamicPrice(basePrice) {
  const turretCount = G.summonEntities.filter(e => e.type === 'turret').length;
  const priceMult = 1 + turretCount * 0.15;
  return Math.floor(basePrice * priceMult);
}

function updateEconomy() {
  if (G.frameCount % 600 === 0) {
    const interest = Math.floor(G.permanentStats.scr * 0.02);
    G.permanentStats.scr += interest;
  }
}

// ==================== 特殊敵人 AI ====================
function updateSpecialEnemyAI(e) {
  if (!e.alive) return;

  if (e.type === 'SNIPER') {
    if (G.player && G.player.alive) {
      const dx = G.player.x - e.x, dy = G.player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist > TILE * 8) {
        e.aimDir = Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? RIGHT : LEFT)
          : (dy > 0 ? DOWN : UP);
        if (G.frameCount % 90 === 0) e.shoot();
      }
    }
  }
  if (e.type === 'ENGINEER') {
    e.summonTimer = (e.summonTimer || 0) + 1;
    if (e.summonTimer >= 180) {
      e.summonTimer = 0;
      spawnEnemyAt(e.x, e.y);
    }
  }
  if (e.type === 'INTERFERER') {
    if (G.frameCount % 120 === 0 && G.player && G.player.alive) {
      G.summonEntities.push({
        type: 'bomb', x: G.player.x, y: G.player.y,
        life: 90, maxLife: 90, damage: 3, alive: true
      });
    }
  }
  if (e.type === 'GUARD') {
    if (G.player && G.player.alive) {
      const dx = G.player.x - e.x, dy = G.player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist > TILE * 6) {
        e.aimDir = Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? RIGHT : LEFT)
          : (dy > 0 ? DOWN : UP);
        e.move(e.aimDir);
      } else if (dist < TILE * 3) {
        e.aimDir = Math.abs(dx) > Math.abs(dy)
          ? (dx < 0 ? RIGHT : LEFT)
          : (dy < 0 ? DOWN : UP);
        e.move(e.aimDir);
      }
    }
  }
  if (e.type === 'MINELAYER') {
    e.mineTimer = (e.mineTimer || 0) + 1;
    if (e.mineTimer >= 60 && G.player && G.player.alive) {
      e.mineTimer = 0;
      G.summonEntities.push({
        type: 'mine', x: e.x, y: e.y,
        life: 600, maxLife: 600, damage: 2, alive: true
      });
    }
  }
}

function spawnEnemyAt(x, y) {
  if (G.enemies.length >= G.maxEnemies) return;
  const types = ['NORMAL', 'FAST', 'HEAVY'];
  const type = types[(Math.random() * types.length) | 0];
  const e = new Tank(
    clampPos(x + (Math.random() - 0.5) * TILE * 4),
    clampPos(y + (Math.random() - 0.5) * TILE * 4),
    (Math.random() * 4) | 0, type, false
  );
  if (Math.random() < 0.2) {
    e.hasPowerUp = true;
    const powerTypes = ['BOMB', 'WALL', 'STAR', 'TIME', 'SHIELD', 'ONEUP'];
    e.powerUpType = powerTypes[(Math.random() * powerTypes.length) | 0];
    e.glowTimer = 30;
  }
  G.enemies.push(e);
  G.aliveEnemies++;
}

// ==================== AI 系統（擴展菁英/BOSS） ====================
function updateEnemyAI(e) {
  e.update();

  let speedMult = 1;
  if (e.slowTimer > 0) { e.slowTimer--; speedMult = 0.5; }
  if (e.elitePrefix === 'BERSERKER') speedMult *= 1.8;
  if (e.elitePrefix === 'REGEN' && G.frameCount % 60 === 0) {
    e.hp = Math.min(e.maxHp, e.hp + 0.1);
  }
  if (e.elitePrefix === 'SUMMON') {
    e.summonTimer = (e.summonTimer || 0) + 1;
    if (e.summonTimer >= 180) { e.summonTimer = 0; spawnEnemy(); }
  }

  if (e.type === 'BOSS') {
    e.bossPhaseTimer = (e.bossPhaseTimer || 0) + 1;
    const hpRatio = e.hp / e.maxHp;
    if (hpRatio <= 0.25 && e.bossPhase < 4) { e.bossPhase = 4; triggerShake(10, 5); }
    else if (hpRatio <= 0.5 && e.bossPhase < 3) { e.bossPhase = 3; for (let i = 0; i < 5; i++) spawnEnemy(); }
    else if (hpRatio <= 0.75 && e.bossPhase < 2) { e.bossPhase = 2; e.speed *= 1.5; }
    if (G.frameCount % 30 === 0) e.shoot();
  }

  if (['SNIPER', 'ENGINEER', 'INTERFERER', 'GUARD', 'MINELAYER'].includes(e.type)) {
    updateSpecialEnemyAI(e);
  }

  if (G.isVSMode && G.player && G.player.alive) {
    if (G.frameCount % CONFIG.AI.VS_UPDATE_INTERVAL === 0 || e.aiChangeTimer <= 0) {
      const dx = G.player.x - e.x;
      const dy = G.player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist <= CONFIG.AI.VISION_RANGE * 1.5) {
        e.aiDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
        if (Math.abs(dist - e.lastDist) < 0.5) e.aiDir = (e.aiDir + (Math.random() < 0.5 ? 1 : 3)) % 4;
        e.lastDist = dist;
      } else {
        if (--e.aiChangeTimer <= 0) { e.aiDir = (Math.random() * 4) | 0; e.aiChangeTimer = CONFIG.AI.CHANGE_INTERVAL + Math.random() * 30; }
      }
    }
  } else if (--e.aiChangeTimer <= 0) {
    if (e.type === 'SUICIDE' && G.basePos) {
      const dx = G.basePos.c*TILE - e.x;
      const dy = G.basePos.r*TILE - e.y;
      e.aiDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
    } else {
      if (Math.random() < 0.4 && G.player && G.player.alive) {
        const dx = G.player.x - e.x;
        const dy = G.player.y - e.y;
        e.aiDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
      } else { e.aiDir = (Math.random() * 4) | 0; }
    }
    e.aiChangeTimer = CONFIG.AI.CHANGE_INTERVAL + Math.random() * 50;
  }

  const actualSpeed = e.speed * speedMult;
  const savedSpeed = e.speed;
  e.speed = actualSpeed;
  e.move(e.aiDir);
  e.speed = savedSpeed;

  const shootChance = G.isVSMode ? 0.005 : 0.02;
  if (Math.random() < shootChance) e.shoot();
}

// ==================== 敵人生成 ====================
function spawnEnemy() {
  if (G.baseDestroyed) return;
  
  let sx = -1, sy = -1;
  const isBoss = (!G.isVSMode && G.level % CONFIG.GAMEPLAY.BOSS_LEVEL_INTERVAL === 0 && G.enemiesSpawned === G.maxEnemies - 1);

  if (G.isVSMode) {
    const edge = (Math.random() * 4) | 0;
    if (edge === 0) { sx = TILE + Math.random()*(W-TILE*3); sy = TILE; }
    else if (edge === 1) { sx = W-TILE*2; sy = TILE + Math.random()*(H-TILE*3); }
    else if (edge === 2) { sx = TILE + Math.random()*(W-TILE*3); sy = H-TILE*2; }
    else { sx = TILE; sy = TILE + Math.random()*(H-TILE*3); }
    
    sx = ((sx/TILE)|0)*TILE; 
    sy = ((sy/TILE)|0)*TILE;

    let free = true;
    spatialGrid.queryRect(sx, sy, TILE, TILE, _queryBuf);
    for (let i = 0; i < _queryBuf.length; i++) {
      if (rectsOverlap(_queryBuf[i].x, _queryBuf[i].y, TILE, TILE, sx, sy, TILE, TILE)) {
        free = false; break;
      }
    }
    if (G.player && G.player.alive && rectsOverlap(G.player.x, G.player.y, G.player.size, G.player.size, sx, sy, TILE, TILE)) free = false;
    if (!free) sx = -1;
  } else {
    const pts = [[TILE,TILE], [TILE,((COLS/2)|0)*TILE], [TILE,(COLS-1)*TILE]];
    
    if (isBoss) {
      let centerFree = true;
      spatialGrid.queryRect(pts[1][1], pts[1][0], TILE, TILE, _queryBuf);
      for (let i = 0; i < _queryBuf.length; i++) {
        if (rectsOverlap(_queryBuf[i].x, _queryBuf[i].y, TILE, TILE, pts[1][1], pts[1][0], TILE, TILE)) {
          centerFree = false; break;
        }
      }
      if (G.player && G.player.alive && rectsOverlap(G.player.x, G.player.y, G.player.size, G.player.size, pts[1][1], pts[1][0], TILE, TILE)) centerFree = false;
      if (centerFree) { sx = pts[1][1]; sy = pts[1][0]; }
    }
    
    if (sx < 0) {
      for (const sp of pts.sort(() => Math.random() - 0.5)) {
        let free = true;
        spatialGrid.queryRect(sp[1], sp[0], TILE, TILE, _queryBuf);
        for (let i = 0; i < _queryBuf.length; i++) {
          if (rectsOverlap(_queryBuf[i].x, _queryBuf[i].y, TILE, TILE, sp[1], sp[0], TILE, TILE)) {
            free = false; break;
          }
        }
        if (G.player && G.player.alive && rectsOverlap(G.player.x, G.player.y, G.player.size, G.player.size, sp[1], sp[0], TILE, TILE)) free = false;
        if (free) { sx = sp[1]; sy = sp[0]; break; }
      }
    }
  }

  if (sx < 0) { 
    G.spawnTimer = 15; 
    return; 
  }

  let type = 'NORMAL';
  if (G.isVSMode) {
    const phase = Math.floor((G.frameCount - G.vsModeStartFrame) / 600);
    const rnd = Math.random();
    if (phase >= 2 && rnd < 0.15) type = 'HEAVY';
    else if (rnd < 0.35) type = 'FAST';
    else type = 'SUICIDE';
  } else if (isBoss) {
    type = 'BOSS';
  } else if (G.level > 1) {
    const r = Math.random();
    if (r < 0.15) type = 'FAST';
    else if (r < 0.3) type = 'HEAVY';
    else if (r < 0.4) type = 'SUICIDE';
  }

  let elitePrefix = null;
  if (G.isVSMode && G.level > 3 && Math.random() < 0.1) {
    const prefixes = Object.keys(ELITE_PREFIXES);
    elitePrefix = prefixes[(Math.random() * prefixes.length) | 0];
  }

  const e = new Tank(sx, sy, DOWN, type, false);
  e.elitePrefix = elitePrefix;
  e.slowTimer = 0;
  e.shieldHits = elitePrefix === 'SHIELDED' ? 3 : 0;
  e.regenTimer = 0;
  e.summonTimer = 0;
  G.enemies.push(e);
  G.enemiesSpawned++;
  G.aliveEnemies++;
  G.spawnEffects.push({ x: sx, y: sy, size: TILE, life: 24, maxLife: 24 });
  e.flashTimer = 24;
  Sound.spawn();
  updateHUD();
}

// ==================== 關卡與升級 ====================
function checkLevelComplete() {
  if (G.aliveEnemies <= 0 && G.enemiesSpawned >= G.maxEnemies) {
    G.state = 'levelComplete';
    if (G.level % 5 === 0) {
      setTimeout(showUpgradeScreen, 1200);
    } else {
      setTimeout(() => { G.level++; startLevel(); }, 1200);
    }
  }
}

function updateVSModeDifficulty() {
  if (!G.isVSMode || G.frameCount % 60 !== 0) return;
  const elapsed = G.frameCount - G.vsModeStartFrame;
  const phase = Math.floor(elapsed / 600);
  G.spawnInterval = Math.max(8, 18 - phase * 2);
}

function startLevel() {
  G.isVSMode = (G.level % CONFIG.GAMEPLAY.VS_MODE_INTERVAL === 0);

  if (G.isVSMode) {
    G.maxEnemies = 50 + G.level * 4;
    G.spawnInterval = 18;
    G.spawnTimer = 10;
    G.vsModeStartFrame = G.frameCount;
  } else {
    G.maxEnemies = 10 + G.level * 2;
    G.spawnInterval = Math.max(40, 120 - G.level * 8);
    G.spawnTimer = 30;
  }

  G.enemiesSpawned = 0;
  G.aliveEnemies = 0;
  G.baseDestroyed = false;
  bulletsPool.clear();
  particlesPool.clear();
  G.enemies = [];
  G.scorePopups = [];
  G.spawnEffects = [];
  deactivateMapEvent();

  if (G.isVSMode && G.level >= 3 && Math.random() < 0.25) {
    const ev = MAP_EVENTS[(Math.random() * MAP_EVENTS.length) | 0];
    if (ev) activateMapEvent(ev);
  }

  G.map = generateMap(G.level);
  cacheStaticMap();

  const ps = G.playerStats;
  if (!ps.weapon) ps.weapon = 'NORMAL';
  G.player = new Tank(G.playerSpawnPos.x, G.playerSpawnPos.y, UP, ps.weapon, true);
  G.player.flashTimer = 60;
  G.state = 'playing';
  document.getElementById('overlay').classList.add('hidden');
  updateMobileControlsForMode();
  updateHUD();
  Sound.jingleLevelStart();
}

function restartGame() {
  G.score = 0;
  G.level = 1;
  G.continues = CONFIG.GAMEPLAY.STARTING_CONTINUES;
  G.playerStats = {
    weapon: 'NORMAL', weaponTier: 0, pierce: false, speedMult: 1,
    maxHp: 3, hp: 3, route: null,
    passives: [], activeSkill: null, activeCooldown: 0,
    heatStacks: 0, rageMultiplier: 1, invulTimer: 0, barrierTimer: 0,
    combo: 0, comboTimer: 0, boostTimer: 0
  };
  G.summonEntities = [];
  G.mapEvent = null;
  G.directorEvents = [];
  G.permanentStats = { scr: 0, upgradePoints: 0 };
  G.mapEvent = rollMapEvent();

  document.getElementById('overlay').innerHTML = `

const MobileInput = {
  joyArea: document.getElementById('joystickArea'),
  joyBase: document.getElementById('joystickBase'),
  joyStick: document.getElementById('joystickStick'),
  fireBtn: document.getElementById('fireButton'),
  
  joyTouchId: null,
  fireTouchId: null,
  joyCenterX: 0,
  joyCenterY: 0,
  
  init() {
    if (!IS_MOBILE) return;
    
    this._updateJoyCenter();
    window.addEventListener('resize', () => this._updateJoyCenter());
    window.addEventListener('orientationchange', () => setTimeout(() => this._updateJoyCenter(), 200));
    
    this.joyArea.addEventListener('touchstart', this._onJoyStart.bind(this), { passive: false });
    this.joyArea.addEventListener('touchmove', this._onJoyMove.bind(this), { passive: false });
    this.joyArea.addEventListener('touchend', this._onJoyEnd.bind(this), { passive: false });
    this.joyArea.addEventListener('touchcancel', this._onJoyEnd.bind(this), { passive: false });
    
    this.fireBtn.addEventListener('touchstart', this._onFireStart.bind(this), { passive: false });
    this.fireBtn.addEventListener('touchend', this._onFireEnd.bind(this), { passive: false });
    this.fireBtn.addEventListener('touchcancel', this._onFireEnd.bind(this), { passive: false });
    
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());
  },
  
  _updateJoyCenter() {
    const rect = this.joyBase.getBoundingClientRect();
    this.joyCenterX = rect.left + rect.width / 2;
    this.joyCenterY = rect.top + rect.height / 2;
  },
  
  _onJoyStart(e) {
    e.preventDefault();
    if (this.joyTouchId !== null) return;
    
    const touch = e.changedTouches[0];
    this.joyTouchId = touch.identifier;
    
    const areaRect = this.joyArea.getBoundingClientRect();
    let cx = touch.clientX;
    let cy = touch.clientY;
    
    cx = Math.max(areaRect.left + 70, Math.min(areaRect.right - 70, cx));
    cy = Math.max(areaRect.top + 70, Math.min(areaRect.bottom - 70, cy));
    
    this.joyBase.style.left = (cx - areaRect.left - 65) + 'px';
    this.joyBase.style.bottom = (window.innerHeight - cy - 65) + 'px';
    this.joyCenterX = cx;
    this.joyCenterY = cy;
    
    this._processJoy(touch.clientX, touch.clientY);
  },
  
  _onJoyMove(e) {
    if (this.joyTouchId === null) return;
    e.preventDefault();
    
    for (const t of e.changedTouches) {
      if (t.identifier === this.joyTouchId) {
        this._processJoy(t.clientX, t.clientY);
        break;
      }
    }
  },
  
  _onJoyEnd(e) {
    if (this.joyTouchId === null) return;
    
    for (const t of e.changedTouches) {
      if (t.identifier === this.joyTouchId) {
        e.preventDefault();
        this.joyTouchId = null;
        G.touch.dir = -1;
        G.touch.joyActive = false;
        G.touch.joyDx = 0;
        G.touch.joyDy = 0;
        this.joyStick.style.left = '50%';
        this.joyStick.style.top = '50%';
        this.joyBase.style.left = '30px';
        this.joyBase.style.bottom = '30px';
        this._updateJoyCenter();
        break;
      }
    }
  },
  
  _processJoy(touchX, touchY) {
    const dx = touchX - this.joyCenterX;
    const dy = touchY - this.joyCenterY;
    const dist = Math.hypot(dx, dy);
    const maxR = CONFIG.MOBILE.JOYSTICK_MAX_RADIUS;
    
    const clampedDist = Math.min(dist, maxR);
    const ratio = dist > 0 ? clampedDist / dist : 0;
    const visualDx = dx * ratio;
    const visualDy = dy * ratio;
    
    this.joyStick.style.left = `calc(50% + ${visualDx}px)`;
    this.joyStick.style.top = `calc(50% + ${visualDy}px)`;
    
    const normDist = clampedDist / maxR;
    if (normDist < CONFIG.MOBILE.JOYSTICK_DEADZONE) {
      G.touch.dir = -1;
      G.touch.joyActive = false;
      G.touch.joyDx = 0;
      G.touch.joyDy = 0;
    } else {
      G.touch.joyActive = true;
      G.touch.joyDx = dx;
      G.touch.joyDy = dy;
      G.touch.dir = Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? RIGHT : LEFT)
        : (dy > 0 ? DOWN : UP);
    }
  },
  
  _onFireStart(e) {
    e.preventDefault();
    if (this.fireTouchId !== null) return;
    this.fireTouchId = e.changedTouches[0].identifier;
    G.touch.fire = true;
    this.fireBtn.classList.add('pressed');
  },
  
  _onFireEnd(e) {
    if (this.fireTouchId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier === this.fireTouchId) {
        e.preventDefault();
        this.fireTouchId = null;
        G.touch.fire = false;
        this.fireBtn.classList.remove('pressed');
        break;
      }
    }
  }
};

// ==================== 主迴圈 (固定時間步長 60Hz 模擬, 任意刷新率渲染) ====================
const TICK_HZ = 60;
const TICK_MS = 1000 / TICK_HZ;
const MAX_UPDATES_PER_FRAME = 5;
let _accumMs = 0;
let _lastFrameTime = 0;

function update() {
  G.frameCount++;

  if (G.state === 'playing') {
    spatialGrid.clear();
    for (let i = 0; i < G.enemies.length; i++) {
      spatialGrid.insert(G.enemies[i]);
    }

    if (G.keys['KeyQ'] && !G.keys._qUsed) { G.keys._qUsed = true; triggerActiveSkill(); }
    if (!G.keys['KeyQ']) G.keys._qUsed = false;

    if (G.playerStats.activeCooldown > 0) G.playerStats.activeCooldown--;
    if (G.playerStats.boostTimer > 0) G.playerStats.boostTimer--;
    if (G.playerStats.invulTimer > 0) G.playerStats.invulTimer--;
    applyPassiveTick();
    updateCombo();

    if (G.player && G.player.alive) {
      G.player.update();
      let moved = false;

      if (G.keys['ArrowUp'] || G.keys['KeyW']) { G.player.move(UP); moved = true; }
      else if (G.keys['ArrowRight'] || G.keys['KeyD']) { G.player.move(RIGHT); moved = true; }
      else if (G.keys['ArrowDown'] || G.keys['KeyS']) { G.player.move(DOWN); moved = true; }
      else if (G.keys['ArrowLeft'] || G.keys['KeyA']) { G.player.move(LEFT); moved = true; }
      else if (G.touch.dir >= 0) { G.player.move(G.touch.dir); moved = true; }

      if (!moved) G.player.moving = false;

      for (let i = 0; i < G.powerUps.length; i++) {
        const pu = G.powerUps[i];
        if (!pu.alive) continue;
        if (G.player && G.player.alive &&
            Math.hypot(pu.x - G.player.x - G.player.size/2, pu.y - G.player.y - G.player.size/2) < TILE) {
          activatePowerUp(pu.type);
          pu.alive = false;
          spawnPopup(G.player.x, G.player.y, POWER_UPS[pu.type].name, POWER_UPS[pu.type].color);
        }
      }

      if (G.isVSMode) {
        let nearest = null;
        let minDist = Infinity;
        for (let i = 0; i < G.enemies.length; i++) {
          const e = G.enemies[i];
          if (e.alive) {
            const d = Math.hypot(e.x - G.player.x, e.y - G.player.y);
            if (d < minDist) { minDist = d; nearest = e; }
          }
        }
        if (nearest) {
          const dx = nearest.x - G.player.x;
          const dy = nearest.y - G.player.y;
          G.player.aimDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
          G.player.shoot();
        }
      } else {
        if (G.keys['Space'] || G.keys['KeyJ'] || G.touch.fire) G.player.shoot();
      }
    }

    updateDirector();
    updateDirectorEvents();

    updateVSModeDifficulty();

    if (mapEventState.active) {
      updateMapEvent();
      drawMapEvent();
    }

    updateSummonEntities();

    const maxOnScreen = G.isVSMode ? CONFIG.GAMEPLAY.MAX_ENEMIES_ON_SCREEN_VS : CONFIG.GAMEPLAY.MAX_ENEMIES_ON_SCREEN;
    if (G.enemiesSpawned < G.maxEnemies && G.aliveEnemies < maxOnScreen) {
      if (--G.spawnTimer <= 0) {
        spawnEnemy();
        G.spawnTimer = G.spawnInterval;
      }
    }

    for (let i = 0; i < G.enemies.length; i++) {
      if (G.enemies[i].alive && G.timeFreezeTimer <= 0) updateEnemyAI(G.enemies[i]);
    }

    const ba = bulletsPool.active;
    for (let i = 0; i < ba.length; i++) updateBullet(ba[i]);
    bulletsPool.sweep();

    let writeIdx = 0;
    for (let i = 0; i < G.enemies.length; i++) {
      if (G.enemies[i].alive) {
        if (writeIdx !== i) G.enemies[writeIdx] = G.enemies[i];
        writeIdx++;
      }
    }
    G.enemies.length = writeIdx;

    if (G.baseDestroyed && !G.isVSMode) {
      G.state = 'gameover';
      setTimeout(showGameOver, 1200);
    }

    updateEconomy();
  }

  if (G.shakeTimer > 0) {
    G.shakeTimer--;
    G.shakeIntensity *= CONFIG.GAMEPLAY.SHAKE_DECAY;
  }
  for (let i = G.spawnEffects.length - 1; i >= 0; i--) {
    if (--G.spawnEffects[i].life <= 0) G.spawnEffects.splice(i, 1);
  }
  updateScorePopups();
  updateParticles();
}

function updateSummonEntities() {
  for (let i = G.summonEntities.length - 1; i >= 0; i--) {
    const se = G.summonEntities[i];
    se.life--;

    if (se.type === 'turret') {
      if (se.cooldown > 0) se.cooldown--;
      if (se.cooldown <= 0 && G.player) {
        const cx = se.x + TILE/2;
        const cy = se.y + TILE/2;
        let nearest = null;
        let minDist = 200;
        for (const e of G.enemies) {
          if (e.alive) {
            const d = Math.hypot(e.x - se.x, e.y - se.y);
            if (d < minDist) { minDist = d; nearest = e; }
          }
        }
        if (nearest) {
          const dx = nearest.x + TILE/2 - cx;
          const dy = nearest.y + TILE/2 - cy;
          let dir;
          if (Math.abs(dx) > Math.abs(dy)) {
            dir = dx > 0 ? RIGHT : LEFT;
          } else {
            dir = dy > 0 ? DOWN : UP;
          }
          spawnBullet(cx, cy, dir, true, false, se.damage);
        } else {
          const dirs = [UP, DOWN, LEFT, RIGHT];
          const randDir = dirs[(Math.random() * 4) | 0];
          spawnBullet(cx, cy, randDir, true, false, se.damage);
        }
        se.cooldown = 25;
      }
    }

    if (se.type === 'fire') {
      for (const e of G.enemies) {
        if (e.alive && Math.hypot(e.x - se.x, e.y - se.y) < TILE * 1.5) {
          e.hp -= se.damage;
        }
      }
    }

    if (se.life <= 0) se.alive = false;
  }

  let writeIdx = 0;
  for (let i = 0; i < G.summonEntities.length; i++) {
    if (G.summonEntities[i].alive) {
      if (writeIdx !== i) G.summonEntities[writeIdx] = G.summonEntities[i];
      writeIdx++;
    }
  }
  G.summonEntities.length = writeIdx;

  for (let i = G.powerUps.length - 1; i >= 0; i--) {
    const pu = G.powerUps[i];
    pu.life--;
    if (pu.life <= 0) pu.alive = false;
  }
  let puWrite = 0;
  for (let i = 0; i < G.powerUps.length; i++) {
    if (G.powerUps[i].alive) {
      if (puWrite !== i) G.powerUps[puWrite] = G.powerUps[i];
      puWrite++;
    }
  }
  G.powerUps.length = puWrite;

  if (G.wallTimer > 0) G.wallTimer--;
  if (G.timeFreezeTimer > 0) G.timeFreezeTimer--;
}

function drawSummonEntities() {
  for (const se of G.summonEntities) {
    if (!se.alive) continue;

    if (se.type === 'turret') {
      ctx.fillStyle = '#44aa44';
      ctx.fillRect(se.x, se.y, TILE, TILE);
      ctx.fillStyle = '#88ff88';
      ctx.fillRect(se.x + 4, se.y + 4, TILE - 8, TILE - 8);
      const hpRatio = se.life / se.maxLife;
      ctx.fillStyle = '#000';
      ctx.fillRect(se.x, se.y - 4, TILE, 2);
      ctx.fillStyle = '#44ff44';
      ctx.fillRect(se.x, se.y - 4, TILE * hpRatio, 2);
    } else if (se.type === 'decoy') {
      ctx.fillStyle = `rgba(255,200,200,${se.life / se.maxLife * 0.5})`;
      ctx.fillRect(se.x, se.y, TILE, TILE);
    } else if (se.type === 'fire') {
      const alpha = se.life / se.maxLife * 0.4;
      ctx.fillStyle = `rgba(255,100,0,${alpha})`;
      ctx.beginPath();
      ctx.arc(se.x + TILE/2, se.y + TILE/2, TILE * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPowerUps() {
  for (const pu of G.powerUps) {
    if (!pu.alive) continue;
    const info = POWER_UPS[pu.type];
    const alpha = pu.life / pu.maxLife;
    const blink = (G.frameCount % 30 < 15) ? 1 : 0.5;
    ctx.fillStyle = info.color;
    ctx.globalAlpha = alpha * blink;
    ctx.beginPath();
    ctx.arc(pu.x, pu.y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(info.icon, pu.x, pu.y + 4);
    ctx.globalAlpha = 1;
  }
}

function drawDirectorEvents() {
  for (const ev of G.directorEvents) {
    if (ev.type === 'orbital') {
      for (const t of ev.targets) {
        const alpha = (ev.timer > 180) ? 1 : (ev.timer % 60 < 30) ? 0.5 : 0.8;
        ctx.strokeStyle = `rgba(255,0,0,${alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(t.x, t.y, TILE * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (ev.type === 'airdrop') {
      ctx.fillStyle = `rgba(255,215,0,${Math.sin(G.frameCount * 0.1) * 0.3 + 0.5})`;
      ctx.fillRect(ev.x - 10, ev.y - 10, 20, 20);
    } else if (ev.type === 'train') {
      ctx.fillStyle = '#888';
      ctx.fillRect(ev.x, ev.y, 80, TILE);
      ctx.fillStyle = '#ff0';
      ctx.fillRect(ev.x + 10, ev.y + 5, 10, 10);
    }
  }

  if (G.directorEvents.length > 0 && G.directorEvents[0].name) {
    ctx.fillStyle = '#ffd700';
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(G.directorEvents[0].name, W/2, H - 20);
    ctx.textAlign = 'left';
  }
}

function render() {
  ctx.save();
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);

  if (G.mapEvent && G.mapEvent.id === 'NIGHT') {
    ctx.fillStyle = 'rgba(0,0,30,0.5)';
    ctx.fillRect(0, 0, W, H);
  }

  if (G.shakeTimer > 0) {
    ctx.translate((Math.random() - 0.5) * G.shakeIntensity, (Math.random() - 0.5) * G.shakeIntensity);
  }

  if (G.state !== 'menu') {
    ctx.drawImage(staticCanvas, 0, 0);
    const phase = ((G.frameCount >> 4) & 1);
    const tiles = G.dynamicTiles;
    for (let i = 0; i < tiles.length; i++) {
      const dt = tiles[i];
      if (dt.type === WATER) drawWaterDirect(ctx, dt.x, dt.y, phase);
      else if (dt.type === BASE) drawEagleDirect(ctx, dt.x, dt.y, false);
      else if (dt.type === BASE_DEAD) drawEagleDirect(ctx, dt.x, dt.y, true);
    }
  }

  for (let i = 0; i < G.spawnEffects.length; i++) {
    const sp = G.spawnEffects[i];
    drawNESSpawnEffect(sp.x, sp.y, sp.size, sp.life, sp.maxLife);
  }

  drawSummonEntities();
  drawPowerUps();
  for (let i = 0; i < G.enemies.length; i++) G.enemies[i].draw();
  if (G.player && G.state === 'playing') G.player.draw();

  renderBullets();

  if (G.state !== 'menu') ctx.drawImage(forestCanvas, 0, 0);

  drawParticles();
  drawDirectorEvents();
  if (G.state !== 'menu') drawScorePopups();

  if (G.playerStats.combo > 0) {
    ctx.fillStyle = '#ff6600';
    ctx.font = '12px "Press Start 2P"';
    ctx.fillText(`${G.playerStats.combo} COMBO`, 10, H - 30);
  }

  ctx.restore();
}

function gameLoop(now) {
  if (!_lastFrameTime) _lastFrameTime = now;
  let dt = now - _lastFrameTime;
  _lastFrameTime = now;
  if (dt > 250) dt = TICK_MS;
  _accumMs += dt;

  let updates = 0;
  while (_accumMs >= TICK_MS && updates < MAX_UPDATES_PER_FRAME) {
    Perf.begin();
    if (G.state !== 'paused') update();
    Perf.end();
    _accumMs -= TICK_MS;
    updates++;
  }
  if (_accumMs > TICK_MS * MAX_UPDATES_PER_FRAME) _accumMs = 0;

  render();
  Perf.updateUI();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
