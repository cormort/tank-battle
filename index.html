// 地圖事件狀態
let mapEventState = {
  active: false,
  type: null,
  timer: 0,
  duration: 0,
  volcanoTimer: 0,
  volcanoTargets: [],
  slideDir: -1,     // ICE：失去輸入後仍會沿著的最後方向
  slideTicks: 0     // ICE：剩餘滑行 tick 數
};

const ICE_SLIDE_TICKS = 14;   // 冰面滑行：放開方向後仍滑行約 0.23 秒

// EMP 地圖事件的效果必須對「事件期間生成的子彈」也生效，而不只是啟動瞬間場上那幾顆。
// 標準子彈的生成點一律走這裡，速度公式只有一份（鏈電／雷射光束等特效段不在此列）。
function bulletSpeed(base) {
  return (mapEventState.active && mapEventState.type === 'EMP') ? base * 0.5 : base;
}

function rollMapEvent() {
  if (!G.isVSMode || G.level < 3) return null;
  if (rnd() < 0.2) {
    const ev = MAP_EVENTS[(rnd() * MAP_EVENTS.length) | 0];
    return ev;
  }
  return null;
}

function activateMapEvent(ev) {
  mapEventState.active = true;
  mapEventState.type = ev.id;
  mapEventState.timer = ev.duration;
  mapEventState.duration = ev.duration;
  mapEventState.volcanoTimer = 0;
  mapEventState.volcanoTargets = [];

  if (ev.id === 'DESERT') G.playerStats.speedMult *= 0.7;   // 沙漠：移速 -30%（原本完全沒有實作）
  if (ev.id === 'ICE') { mapEventState.slideDir = -1; mapEventState.slideTicks = 0; }
  if (ev.id === 'EMP') {
    for (const b of bulletsPool.active) {
      if (b.isPlayer && b.alive) b.speed *= 0.5;
    }
  }
  addScorePopup(W / 2, H / 2 - 50, `${ev.name} 事件!`);
  refreshStaticBackgroundIfNeeded();   // NIGHT：底色烘在 staticCanvas 裡，換事件時要重烘
}

function updateMapEvent() {
  if (!mapEventState.active) return;
  mapEventState.timer--;

  switch (mapEventState.type) {
    case 'DESERT':
      break;

    case 'ICE':
      break;   // 滑行在移動段處理（需要看輸入），這裡不必做事

    case 'VOLCANIC':
      mapEventState.volcanoTimer++;
      if (mapEventState.volcanoTimer % 90 === 0) {
        const rx = rnd() * (W - TILE * 4) + TILE * 2;
        const ry = rnd() * (H - TILE * 4) + TILE * 2;
        mapEventState.volcanoTargets.push({ x: rx, y: ry, life: 60 });
        if (G.player && G.player.alive && Math.hypot(G.player.x - rx, G.player.y - ry) < TILE * 3) {
          G.playerStats.hp -= 0.3;
          triggerShake(5, 3);
        }
        for (const e of G.enemies) {
          if (e.alive && Math.hypot(e.x - rx, e.y - ry) < TILE * 2) {
            e.hp -= 1;
          }
        }
      }
      for (let i = mapEventState.volcanoTargets.length - 1; i >= 0; i--) {
        const vt = mapEventState.volcanoTargets[i];
        vt.life--;
        if (vt.life <= 0) mapEventState.volcanoTargets.splice(i, 1);
      }
      break;

    case 'EMP':
      break;

    case 'NIGHT':
      break;

    case 'TOXIC':
      if (G.frameCount % 60 === 0 && G.player && G.player.alive) {
        G.playerStats.hp -= 0.15;
      }
      break;
  }

  if (mapEventState.timer <= 0) {
    deactivateMapEvent();
  }
}

function deactivateMapEvent() {
  const evType = mapEventState.type;
  mapEventState.active = false;
  mapEventState.type = null;

  if (evType === 'DESERT') G.playerStats.speedMult /= 0.7;
  mapEventState.slideDir = -1;
  mapEventState.slideTicks = 0;
  refreshStaticBackgroundIfNeeded();   // NIGHT 結束 → 把底色烘回純黑
}

let _nightGradient = null, _nightGradientX = 0, _nightGradientY = 0;

function drawMapEvent() {
  if (!mapEventState.active) return;

  switch (mapEventState.type) {
    case 'DESERT':
      ctx.fillStyle = 'rgba(204,136,68,0.05)';
      ctx.fillRect(0, 0, W, H);
      break;

    case 'ICE':
      ctx.fillStyle = 'rgba(136,204,255,0.04)';
      ctx.fillRect(0, 0, W, H);
      break;

    case 'VOLCANIC':
      ctx.fillStyle = 'rgba(255,68,34,0.06)';
      ctx.fillRect(0, 0, W, H);
      for (const vt of mapEventState.volcanoTargets) {
        const alpha = vt.life / 60;
        ctx.fillStyle = `rgba(255,100,0,${alpha * 0.4})`;
        ctx.beginPath();
        ctx.arc(vt.x, vt.y, TILE * 1.5 * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,200,0,${alpha * 0.6})`;
        ctx.beginPath();
        ctx.arc(vt.x, vt.y, TILE * 0.8 * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
      break;

    case 'EMP':
      ctx.fillStyle = 'rgba(170,68,255,0.04)';
      ctx.fillRect(0, 0, W, H);
      break;

    case 'NIGHT':
      ctx.fillStyle = 'rgba(0,0,20,0.55)';
      ctx.fillRect(0, 0, W, H);
      if (G.player && G.player.alive) {
        // 漸層只在玩家移動超過 8px 時重建：舊版每幀都 createRadialGradient + 兩次 addColorStop
        // （字串解析）＋ 520×520 全螢幕漸層填色，NIGHT 一觸發就是連續 10 秒的掉幀。
        const npx = G.player.x + TILE / 2, npy = G.player.y + TILE / 2;
        if (!_nightGradient || Math.abs(npx - _nightGradientX) > 8 || Math.abs(npy - _nightGradientY) > 8) {
          _nightGradient = ctx.createRadialGradient(npx, npy, 0, npx, npy, TILE * 8);
          _nightGradient.addColorStop(0, 'rgba(0,0,0,0)');
          _nightGradient.addColorStop(1, 'rgba(0,0,20,0.55)');
          _nightGradientX = npx; _nightGradientY = npy;
        }
        ctx.fillStyle = _nightGradient;
        ctx.fillRect(0, 0, W, H);
      }
      break;

    case 'TOXIC':
      ctx.fillStyle = 'rgba(68,255,68,0.04)';
      ctx.fillRect(0, 0, W, H);
      break;
  }
}

// ==================== COMBO 系統 ====================
function addCombo(kill = true) {
  if (!kill) return;
  G.playerStats.combo++;
  progress.recordCombo(G.playerStats.combo);
  fx.set('combo', 120);

  const bonus = Math.min(G.playerStats.combo, 10) * 0.1;
  G.score += Math.floor((10 + G.level * 2) * (1 + bonus));

  // 每 COMBO_REWARDS.every 連擊一次里程碑：額外分數 + 一個「強化自己」的道具。
  // 舊版只有 10 連擊時彈一行文字，連擊本身沒有任何實質回饋。
  const { every, scorePerTier, maxTier, pool } = COMBO_REWARDS;
  if (G.playerStats.combo % every === 0) {
    const tier = Math.min(G.playerStats.combo / every, maxTier);
    const extra = scorePerTier * tier;
    G.score += extra;
    triggerShake(3 + tier, 5);
    Sound.jingleLevelClear();
    if (G.player && G.player.alive) {
      const type = pool[(rnd() * pool.length) | 0];
      // 掉在玩家腳邊：拾取半徑 TILE*1.5，所以下一 tick 就會被吃掉（不會掉在牆裡拿不到）
      G.powerUps.push({ type, x: G.player.x, y: G.player.y + TILE, life: 600, maxLife: 600, alive: true });
      addScorePopup(G.player.x, G.player.y - 20, `🔥 COMBO x${G.playerStats.combo}! +${extra}`);
    }
  }
}

function getDynamicPrice(basePrice) {
  const turretCount = G.summonEntities.filter(e => e.type === 'turret').length;
  const priceMult = 1 + turretCount * 0.15;
  return Math.floor(basePrice * priceMult);
}

function updateEconomy() {
  if (G.frameCount % 600 === 0) {
    const interest = Math.floor(G.permanentStats.scr * 0.02);
    G.permanentStats.scr += interest;
  }
}

// ==================== 特殊敵人 AI ====================
function updateSpecialEnemyAI(e) {
  if (!e.alive) return;

  if (e.type === 'SNIPER') {
    if (G.player && G.player.alive) {
      const dx = G.player.x - e.x, dy = G.player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist > TILE * 8) {
        e.aimDir = Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? RIGHT : LEFT)
          : (dy > 0 ? DOWN : UP);
        if (G.frameCount % 90 === 0) e.shoot();
      }
    }
  }
  if (e.type === 'ENGINEER') {
    e.summonTimer = (e.summonTimer || 0) + 1;
    if (e.summonTimer >= 180) {
      e.summonTimer = 0;
      spawnEnemyAt(e.x, e.y);
    }
  }
  if (e.type === 'INTERFERER') {
    if (G.frameCount % 120 === 0 && G.player && G.player.alive) {
      G.summonEntities.push({
        type: 'bomb', x: G.player.x, y: G.player.y,
        life: 90, maxLife: 90, damage: 3, alive: true
      });
    }
  }
  if (e.type === 'GUARD') {
    if (G.player && G.player.alive) {
      const dx = G.player.x - e.x, dy = G.player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist > TILE * 6) {
        e.aimDir = Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? RIGHT : LEFT)
          : (dy > 0 ? DOWN : UP);
        e.move(e.aimDir);
      } else if (dist < TILE * 3) {
        e.aimDir = Math.abs(dx) > Math.abs(dy)
          ? (dx < 0 ? RIGHT : LEFT)
          : (dy < 0 ? DOWN : UP);
        e.move(e.aimDir);
      }
    }
  }
  if (e.type === 'MINELAYER') {
    e.mineTimer = (e.mineTimer || 0) + 1;
    if (e.mineTimer >= 60 && G.player && G.player.alive) {
      e.mineTimer = 0;
      G.summonEntities.push({
        type: 'mine', x: e.x, y: e.y,
        life: 600, maxLife: 600, damage: 2, alive: true
      });
    }
  }
}


function assignPowerUpDrop(e) {
  if (rnd() < 0.3) {
    e.hasPowerUp = true;
    let powerTypes = [];
    const playerRoute = G.playerStats.route;

    if (playerRoute) {
      const routeWeapons = Object.keys(WEAPON_TREE).filter(k => WEAPON_TREE[k].route === playerRoute);
      const playerWeapon = G.playerStats.weapon;
      const currentTier = WEAPON_TREE[playerWeapon]?.tier || 0;
      const availableWeapons = routeWeapons.filter(w => (WEAPON_TREE[w].tier || 0) <= currentTier + 1);
      if (availableWeapons.length > 0) {
        powerTypes = availableWeapons.map(w => w + '_DROP').filter(t => POWER_UPS[t]);
      }
    }

    if (powerTypes.length === 0) powerTypes = [...WEAPON_DROPS_T1];

    if (rnd() < 0.3 && G.playerStats.weaponTier >= 2) {
      powerTypes = powerTypes.concat(WEAPON_DROPS_T2);
    }

    // 15% 機率掉落非武器道具（BOMB/WALL/STAR 等）
    if (rnd() < 0.15) {
      e.powerUpType = COMMON_DROPS[(rnd() * COMMON_DROPS.length) | 0];
    } else {
      e.powerUpType = powerTypes[(rnd() * powerTypes.length) | 0];
    }
    e.glowTimer = 30;
  }
}

function spawnEnemyAt(x, y) {
  if (G.enemies.length >= G.maxEnemies) return;
  const types = ['NORMAL', 'FAST', 'HEAVY'];
  const type = types[(rnd() * types.length) | 0];
  const e = new Tank(
    clampPos(x + (rnd() - 0.5) * TILE * 4),
    clampPos(y + (rnd() - 0.5) * TILE * 4),
    (rnd() * 4) | 0, type, false
  );
  assignPowerUpDrop(e);
  G.enemies.push(e);
  G.aliveEnemies++;
}

// ==================== AI 系統（擴展菁英/BOSS） ====================

// 敌人排斥机制 - 防止互相挤压
Tank.prototype.applyRepulsion = function() {
  if (!this.alive) return;
  const range = this.size * 1.5;
  spatialGrid.queryRect(this.x - range, this.y - range, range * 2, range * 2, _queryBuf);
  for (const other of _queryBuf) {
    if (other === this || !other.alive || other.isPlayer) continue;
    const dx = this.x - other.x, dy = this.y - other.y;
    const dist = Math.sqrt(dx * dx + dy * dy);   // 熱路徑（每敵人每幀）不用 Math.hypot
    if (dist < this.size && dist > 0) {
      const push = 0.5;
      this.x += (dx / dist) * push;
      this.y += (dy / dist) * push;
    }
  }
};

function updateEnemyAI(e) {
  e.update();

  // 1. 排斥机制 - 先处理位置避免挤压
  e.applyRepulsion();

  let speedMult = 1;
  if (e.slowTimer > 0) { e.slowTimer--; speedMult = 0.5; }
  if (e.elitePrefix === 'BERSERKER') speedMult *= 1.8;
  if (e.elitePrefix === 'REGEN' && G.frameCount % 60 === 0) {
    e.hp = Math.min(e.maxHp, e.hp + 0.1);
  }
  if (e.elitePrefix === 'SUMMONER') {   // 舊版寫成 'SUMMON'，與 ELITE_PREFIXES 的 key 不符 → 召喚詞綴永遠不發動
    e.summonTimer = (e.summonTimer || 0) + 1;
    if (e.summonTimer >= 180) { e.summonTimer = 0; spawnEnemy(); }
  }

  // BOSS：階段升級（每隻王都有）+ 原型攻擊模式（三型各不相同）
  let bossMoved = false;      // 這一 tick 的移動是否已由攻擊模式處理（CHARGE 衝刺）
  if (e.type === 'BOSS') {
    e.bossPhaseTimer = (e.bossPhaseTimer || 0) + 1;
    const hpRatio = e.hp / e.maxHp;
    if (hpRatio <= 0.25 && e.bossPhase < 4) { e.bossPhase = 4; triggerShake(10, 5); }
    else if (hpRatio <= 0.5 && e.bossPhase < 3) { e.bossPhase = 3; for (let i = 0; i < 5; i++) spawnEnemy(); }
    else if (hpRatio <= 0.75 && e.bossPhase < 2) { e.bossPhase = 2; e.speed *= 1.5; }
    if (G.frameCount % 30 === 0) e.shoot();
    bossMoved = updateBossPattern(e);
  }

  if (SPECIAL_ENEMY_TYPES.has(e.type)) {
    updateSpecialEnemyAI(e);
  }

  // 2. AI 方向更新
  if (G.isVSMode && G.player && G.player.alive) {
    if (G.frameCount % CONFIG.AI.VS_UPDATE_INTERVAL === 0 || e.aiChangeTimer <= 0) {
      const dx = G.player.x - e.x;
      const dy = G.player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist <= CONFIG.AI.VISION_RANGE * 1.5) {
        e.aiDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
        if (Math.abs(dist - e.lastDist) < 0.5) e.aiDir = (e.aiDir + (rnd() < 0.5 ? 1 : 3)) % 4;
        e.lastDist = dist;
      } else {
        if (--e.aiChangeTimer <= 0) { e.aiDir = (rnd() * 4) | 0; e.aiChangeTimer = CONFIG.AI.CHANGE_INTERVAL + rnd() * 30; }
      }
    }
  } else if (--e.aiChangeTimer <= 0) {
    if (e.type === 'SUICIDE' && G.basePos) {
      const dx = G.basePos.c*TILE - e.x;
      const dy = G.basePos.r*TILE - e.y;
      e.aiDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
    } else {
      if (rnd() < 0.4 && G.player && G.player.alive) {
        const dx = G.player.x - e.x;
        const dy = G.player.y - e.y;
        e.aiDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
      } else { e.aiDir = (rnd() * 4) | 0; }
    }
    e.aiChangeTimer = CONFIG.AI.CHANGE_INTERVAL + rnd() * 50;
  }

  if (!bossMoved) {
    const actualSpeed = e.speed * speedMult;
    const savedSpeed = e.speed;
    e.speed = actualSpeed;
    e.move(e.aiDir);
    e.speed = savedSpeed;
  }

  const shootChance = G.isVSMode ? 0.005 : 0.02;
  if (rnd() < shootChance) e.shoot();
}

// ==================== BOSS 原型行為（三型輪替：攻城／獵殺／蜂巢） ====================
// 資料在 src/data/bosses.js，這裡只負責「依 pattern 分派」。新增一隻王＝加一筆資料 +
// 一個 pattern 分支（verify-core 會掃「資料裡的 pattern 在程式碼裡有沒有分支」）。
function bossArchOf(e) {
  return BOSS_TYPES[e.bossType] || BOSS_TYPES.SIEGE;
}

/**
 * @returns {boolean} true = 這一 tick 的移動已由原型處理（或刻意原地不動），
 *                    呼叫端不要再跑一般 AI 移動（否則衝刺會變成兩倍速、蓄力會邊走邊蓄）。
 */
function updateBossPattern(e) {
  const arch = bossArchOf(e);
  if (arch.pattern === 'CHARGE') return updateBossCharge(e, arch);

  e.patternTimer = (e.patternTimer || 0) + 1;
  if (arch.pattern === 'ARTILLERY') {
    if (e.patternTimer >= arch.volleyCooldown) {
      e.patternTimer = 0;
      fireBossVolley(e, arch);
    }
  } else if (arch.pattern === 'SPAWN') {
    if (e.patternTimer >= arch.spawnCooldown) {
      e.patternTimer = 0;
      for (let i = 0; i < arch.spawnCount; i++) spawnEnemy();
      addScorePopup(e.x + e.size / 2, e.y - TILE, arch.icon + ' 召喚');
    }
  }
  return false;
}

/** 攻城核心：一輪 volleyCount 發砲彈，朝玩家（以及左右偏移的落點）飛過去，落地爆炸。 */
function fireBossVolley(e, arch) {
  const cx = e.x + e.size / 2, cy = e.y + e.size / 2;
  const hasP = G.player && G.player.alive;
  const tx0 = hasP ? G.player.x + G.player.size / 2 : cx;
  const ty0 = hasP ? G.player.y + G.player.size / 2 : cy + TILE * 5;

  for (let i = 0; i < arch.volleyCount; i++) {
    const off = (i - (arch.volleyCount - 1) / 2) * TILE * 1.6;
    const dx = (tx0 + off) - cx, dy = ty0 - cy;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;

    const b = bulletsPool.acquire();
    b.x = cx - 3; b.y = cy - 3;
    b.dir = DOWN;
    b.isPlayer = false;
    b.vx = dx / len; b.vy = dy / len;
    b.speed = arch.shellSpeed;
    b.power = arch.blastPower;
    b.shell = true;
    b.shellBoss = arch.id;
    b.fuse = arch.shellFuse;
  }
  addScorePopup(cx, cy - TILE, arch.icon + ' 炮擊');
  Sound.shoot();
}

/**
 * 衝刺走一步。撞到磚牆時**直接撞碎再往前衝**（鋼板與畫面邊界才會把牠停下來）：
 * 少了這條，王從最上排往下衝的第一格就是磚牆 → 每一輪都立刻暈眩，永遠貼不到玩家，
 * 打起來就變成「站在上面發呆的大隻小兵」。撞碎磚牆同時也是很好的預告（玩家看得到牠往哪衝）。
 * @returns {boolean} 這一步有沒有真的移動（false = 被擋住，呼叫端要暈眩）
 */
function chargeStep(e, arch) {
  const x0 = e.x, y0 = e.y;
  const savedSpeed = e.speed;
  e.speed = arch.chargeSpeed;
  e.move(e.chargeDir);
  if (e.x === x0 && e.y === y0) {
    // 被擋住：把「往前一步之後身體覆蓋到的格子」裡的磚牆全部撞碎（王是 2×2 格，
    // 只撞中心那一格的話，磚牆擋在邊角時永遠撞不開 → 每一輪都立刻暈眩、貼不到玩家）。
    const nx = clampPos(e.x + DX[e.chargeDir] * arch.chargeSpeed);
    const ny = clampPos(e.y + DY[e.chargeDir] * arch.chargeSpeed);
    const c1 = (nx / TILE) | 0, r1 = (ny / TILE) | 0;
    const c2 = ((nx + e.size - 1) / TILE) | 0, r2 = ((ny + e.size - 1) / TILE) | 0;
    let broke = false;
    for (let r = r1; r <= r2; r++) {
      for (let c = c1; c <= c2; c++) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
        if (G.map[r][c] !== BRICK) continue;
        breakTile(c, r);
        spawnExplosion(c * TILE + TILE / 2, r * TILE + TILE / 2, 'spark');
        broke = true;
      }
    }
    if (broke) e.move(e.chargeDir);
  }
  e.speed = savedSpeed;
  return e.x !== x0 || e.y !== y0;
}

/** 獵殺者：蓄力（畫面上有警示圈）→ 高速衝刺 → 撞鋼板／邊界則硬直。 */
function updateBossCharge(e, arch) {
  if (e.stunTicks > 0) {           // 撞牆硬直：不動 → 玩家的輸出窗口
    e.stunTicks--;
    return true;
  }

  if (e.chargeTicks > 0) {
    e.chargeTicks--;
    triggerShake(2, 1);
    if (chargeStep(e, arch)) {
      e.chargeTravel = (e.chargeTravel || 0) + arch.chargeSpeed;
    } else {
      // 撞到鋼板／邊界：結束衝刺。**只有真的衝出去過**才暈眩 —— 否則王貼著鋼板時每輪都暈眩，
      // 看起來就像卡在牆邊發呆；沒衝出去就只是換方向再蓄力。
      e.chargeTicks = 0;
      if ((e.chargeTravel || 0) >= TILE) {
        e.stunTicks = arch.recoverTicks;
        triggerShake(8, 5);
        spawnExplosion(e.x + e.size / 2, e.y + e.size / 2, 'spark');
      }
      e.chargeTravel = 0;
      e.aiChangeTimer = 0;
    }
    return true;
  }

  // 蓄力中照常慢慢逼近（一般 AI 移動），這樣牠才不會因為「每輪都撞牆」而卡在原地：
  // 舊寫法在蓄力時也回傳 true，結果王除了衝刺那一瞬間之外完全不會移動。
  e.patternTimer = (e.patternTimer || 0) + 1;
  if (e.patternTimer < arch.chargeWindup) return false;

  e.patternTimer = 0;
  const p = G.player && G.player.alive ? G.player : null;
  e.chargeDir = p
    ? (Math.abs(p.x - e.x) > Math.abs(p.y - e.y) ? (p.x > e.x ? RIGHT : LEFT) : (p.y > e.y ? DOWN : UP))
    : DOWN;
  e.chargeTicks = arch.chargeTicks;
  e.chargeTravel = 0;
  Sound.spawn();
  return true;
}

/** 砲彈爆炸：範圍傷害（只打玩家 —— 讓王的炮不會順手清掉自己的小兵、白送玩家分數）。 */
function explodeShell(b) {
  const arch = BOSS_TYPES[b.shellBoss] || BOSS_TYPES.SIEGE;
  const bx = b.x + 3, by = b.y + 3;
  spawnExplosion(bx, by, 'big');
  triggerShake(6, 4);
  Sound.explode();
  if (!G.player || !G.player.alive) return;
  const dx = (G.player.x + G.player.size / 2) - bx;
  const dy = (G.player.y + G.player.size / 2) - by;
  const r = arch.blastRadius;
  if (dx * dx + dy * dy <= r * r) {
    damagePlayerFromHazard(bx - TILE / 2, by - TILE / 2, arch.blastPower);
  }
}

// ==================== 敵人生成 ====================
function spawnEnemy() {
  if (G.baseDestroyed) return;
  
  let sx = -1, sy = -1;
  const isBoss = (!G.isVSMode && G.level % CONFIG.GAMEPLAY.BOSS_LEVEL_INTERVAL === 0 && G.enemiesSpawned === G.maxEnemies - 1);

  if (G.isVSMode) {
    const edge = (rnd() * 4) | 0;
    if (edge === 0) { sx = TILE + rnd()*(W-TILE*3); sy = TILE; }
    else if (edge === 1) { sx = W-TILE*2; sy = TILE + rnd()*(H-TILE*3); }
    else if (edge === 2) { sx = TILE + rnd()*(W-TILE*3); sy = H-TILE*2; }
    else { sx = TILE; sy = TILE + rnd()*(H-TILE*3); }
    
    sx = ((sx/TILE)|0)*TILE; 
    sy = ((sy/TILE)|0)*TILE;

    let free = true;
    spatialGrid.queryRect(sx, sy, TILE, TILE, _queryBuf);
    for (let i = 0; i < _queryBuf.length; i++) {
      if (rectsOverlap(_queryBuf[i].x, _queryBuf[i].y, TILE, TILE, sx, sy, TILE, TILE)) {
        free = false; break;
      }
    }
    if (G.player && G.player.alive && rectsOverlap(G.player.x, G.player.y, G.player.size, G.player.size, sx, sy, TILE, TILE)) free = false;
    if (!free) sx = -1;
  } else {
    const pts = [[TILE,TILE], [TILE,((COLS/2)|0)*TILE], [TILE,(COLS-1)*TILE]];
    
    if (isBoss) {
      let centerFree = true;
      spatialGrid.queryRect(pts[1][1], pts[1][0], TILE, TILE, _queryBuf);
      for (let i = 0; i < _queryBuf.length; i++) {
        if (rectsOverlap(_queryBuf[i].x, _queryBuf[i].y, TILE, TILE, pts[1][1], pts[1][0], TILE, TILE)) {
          centerFree = false; break;
        }
      }
      if (G.player && G.player.alive && rectsOverlap(G.player.x, G.player.y, G.player.size, G.player.size, pts[1][1], pts[1][0], TILE, TILE)) centerFree = false;
      if (centerFree) { sx = pts[1][1]; sy = pts[1][0]; }
    }
    
    if (sx < 0) {
      shuffle(pts);
      for (const sp of pts) {
        let free = true;
        spatialGrid.queryRect(sp[1], sp[0], TILE, TILE, _queryBuf);
        for (let i = 0; i < _queryBuf.length; i++) {
          if (rectsOverlap(_queryBuf[i].x, _queryBuf[i].y, TILE, TILE, sp[1], sp[0], TILE, TILE)) {
            free = false; break;
          }
        }
        if (G.player && G.player.alive && rectsOverlap(G.player.x, G.player.y, G.player.size, G.player.size, sp[1], sp[0], TILE, TILE)) free = false;
        if (free) { sx = sp[1]; sy = sp[0]; break; }
      }
    }
  }

  if (sx < 0) { 
    G.spawnTimer = 15; 
    return; 
  }

  let type = 'NORMAL';
  if (G.isVSMode) {
    const phase = Math.floor((G.frameCount - G.vsModeStartFrame) / 600);
    const roll = rnd();     // 同上：避免與全域 rnd 同名
    if (phase >= 2 && roll < 0.15) type = 'HEAVY';
    else if (roll < 0.35) type = 'FAST';
    else type = 'SUICIDE';
  } else if (isBoss) {
    type = 'BOSS';
    G.bossSpawned = true;
  } else if (G.level > 1) {
    const fastChance = Math.min(0.3, 0.1 + G.level * 0.01);
    const heavyChance = Math.min(0.25, 0.05 + G.level * 0.012);
    const suicideChance = Math.min(0.2, 0.05 + G.level * 0.008);
    const r = rnd();
    if (r < fastChance) type = 'FAST';
    else if (r < fastChance + heavyChance) type = 'HEAVY';
    else if (r < fastChance + heavyChance + suicideChance) type = 'SUICIDE';

    // 特殊敵人（SNIPER / ENGINEER / INTERFERER / GUARD / MINELAYER）：
    // updateSpecialEnemyAI 早就寫好了 58 行，但生成端從來沒有產生過這些型別 ——
    // 整段 AI 與 SPECIAL_ENEMY_TYPES 都是死碼。這裡在第 4 關之後以低機率生成。
    if (G.level >= 4 && rnd() < 0.07) {
      const specials = Array.from(SPECIAL_ENEMY_TYPES);
      type = specials[(rnd() * specials.length) | 0];
    }
  }

  let elitePrefix = null;
  if (G.isVSMode && G.level > 3 && rnd() < 0.1) {
    const prefixes = Object.keys(ELITE_PREFIXES);
    elitePrefix = prefixes[(rnd() * prefixes.length) | 0];
  }

  const e = new Tank(sx, sy, DOWN, type, false);
  e.elitePrefix = elitePrefix;
  // 菁英的 1.5 倍血與 eliteEffects（光環/圖示）都在 applyTypeStats 裡，而建構子已經先呼叫過一次
  // → 舊版在 new Tank 之後才指派 elitePrefix，等於這些效果永遠不會生效，菁英看起來跟小兵一樣。
  if (elitePrefix) e.applyTypeStats();
  e.slowTimer = 0;
  e.shieldHits = elitePrefix === 'SHIELDED' ? 3 : 0;
  e.summonTimer = 0;
  assignPowerUpDrop(e);
  G.enemies.push(e);
  G.enemiesSpawned++;
  G.aliveEnemies++;
  G.spawnEffects.push({ x: sx, y: sy, size: TILE, life: 24, maxLife: 24 });
  e.flashTimer = 24;
  Sound.spawn();
  // 王出場時把原型告訴玩家（不然「這隻會炮擊還是會衝撞」只能靠被打才知道）
  if (e.type === 'BOSS') {
    const arch = BOSS_TYPES[e.bossType] || BOSS_TYPES.SIEGE;
    addScorePopup(sx + TILE / 2, sy + TILE * 2, `${arch.icon} ${arch.name}`);
    Sound.bigExplode();
  }
  updateHUD();
}

// ==================== 關卡與升級 ====================
function checkLevelComplete() {
  // BOSS 關：王是第 maxEnemies 隻才生，而結算條件是 enemiesSpawned >= maxEnemies-5
  // → 玩家在倒數 5 隻內清光場面就會直接跳關，王從來沒出現過。這裡等王真的出生才允許結算。
  if (!G.isVSMode && G.level % CONFIG.GAMEPLAY.BOSS_LEVEL_INTERVAL === 0 && !G.bossSpawned) return;
  if (G.aliveEnemies <= 0 && G.enemiesSpawned >= G.maxEnemies - 5 && G.player && G.player.alive) {
    G.state = STATE.LEVEL_COMPLETE;
    G.levelClearedCount++;
    if (G.level % CONFIG.GAMEPLAY.UPGRADE_INTERVAL === 0) {
      setTimeout(showUpgradeScreen, 1200);
    } else {
      setTimeout(() => { G.level++; startLevel(); }, 1200);
    }
  }
}

function updateVSModeDifficulty() {
  if (!G.isVSMode || G.frameCount % 60 !== 0) return;
  const elapsed = G.frameCount - G.vsModeStartFrame;
  const phase = Math.floor(elapsed / 600);
  G.spawnInterval = Math.max(8, 18 - phase * 2);
}

/** 實際生成間隔＝基準值 × 事件修飾子（SURGE）。唯一的讀取端，避免兩處各算一份。 */
function effectiveSpawnInterval() {
  return Math.max(4, Math.round(G.spawnInterval * (G.spawnIntervalMul || 1)));
}

function startLevel() {
  progress.recordLevel(G.level);
  G.isVSMode = (G.level % CONFIG.GAMEPLAY.VS_MODE_INTERVAL === 0);

  G.bossSpawned = false;      // 每關重新等待 BOSS 出生（見 checkLevelComplete）

  if (G.level % CONFIG.GAMEPLAY.UPGRADE_INTERVAL !== 0) {
    G.levelWeaponStacks = {};
    G.playerStats.weaponDamageBonus = 0;
  }

  if (G.isVSMode) {
    G.maxEnemies = 50 + G.level * 4;
    G.spawnInterval = 18;
    G.spawnTimer = 10;
    G.vsModeStartFrame = G.frameCount;
  } else {
    const diffMult = 1;
    G.maxEnemies = Math.floor((10 + G.level * 2) * diffMult);
    G.spawnInterval = Math.max(40, Math.floor((120 - G.level * 8) * 1));
    G.spawnTimer = 30;
  }
  G.spawnIntervalMul = 1;      // 新關卡從乾淨的基準開始（上一關的 SURGE 不該跨關）
  G.directorEvents.length = 0; // 上一關的局內事件同理：留著會讓 life 繼續遞減並在關卡開頭觸發 deactivate

  G.enemiesSpawned = 0;
  G.aliveEnemies = 0;
  G.baseDestroyed = false;
  bulletsPool.clear();
  particlesPool.clear();
  G.enemies = [];
  G.scorePopups = [];
  G.spawnEffects = [];
  deactivateMapEvent();

  // 地圖事件的唯一啟動點。舊版只把 rollMapEvent() 的結果塞進一個從來沒人讀的 G.mapEvent
  // → activateMapEvent() 沒有任何呼叫端，整個子系統（updateMapEvent 與 6 種事件效果）是死碼。
  // 注意順序：必須排在 deactivateMapEvent() 之後，否則剛啟動的 DESERT 減速會在同一次
  // startLevel 內被立刻除回去（等於沒有效果）。
  const mapEv = rollMapEvent();
  if (mapEv) {
    activateMapEvent(mapEv);
    G.directorEvents.push({ name: `${mapEv.icon || ''} ${mapEv.name}`, desc: mapEv.effect, life: 240 });
  }

  G.map = generateMap(G.level);
  cacheStaticMap();

  const ps = G.playerStats;
  if (!ps.weapon) ps.weapon = 'NORMAL';
  G.player = new Tank(G.playerSpawnPos.x, G.playerSpawnPos.y, UP, ps.weapon, true);
  G.player.flashTimer = 60;
  G.state = STATE.PLAYING;
  document.getElementById('overlay').classList.add('hidden');
  updateMobileControlsForMode();
  updateHUD();
  Sound.jingleLevelStart();
  const isBossLevel = !G.isVSMode && G.level % CONFIG.GAMEPLAY.BOSS_LEVEL_INTERVAL === 0;
  Music.play(G.isVSMode ? 'BOSS' : isBossLevel ? 'BOSS' : 'LEVEL');
}

function restartGame() {
  G.score = 0;
  G.level = 1;
  G.continues = CONFIG.GAMEPLAY.STARTING_CONTINUES;
  G.levelWeaponStacks = {};
  G.levelClearedCount = 0;

  G.playerStats = {
    weapon: 'NORMAL', weaponTier: 0, pierce: false, speedMult: 1,
    maxHp: 3, hp: 3, route: null,
    passives: [], activeSkill: null,
    heatStacks: 0, rageMultiplier: 1,
    combo: 0, weaponDamageBonus: 0, shopFireRateBonus: 0
  };
  fx.clearAll();                 // 重新開始就該清空所有時效（契約由 verify-core 驗證）
  updateHUD();
  G.summonEntities = [];
  G.directorEvents = [];
  G.permanentStats = { scr: 0, upgradePoints: 0 };
  screens.renderMenu();          // 標題畫面（實作在 src/ui/screens.js）
  startLevel();
}



function continueGame() {
  G.continues--;
  G.playerStats.hp = G.playerStats.maxHp;
  document.getElementById('overlay').classList.add('hidden');
  startLevel();
}

// ==================== 鍵盤輸入 ====================
document.addEventListener('keydown', e => {
  G.keys[e.code] = true;
  const tag = (e.target && e.target.tagName) || '';
  const editable = tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
  const result = applyKey(input, e.code, true, { editable, skillKey: activeSkillKey });
  if (result.preventDefault) e.preventDefault();
  if (!e.repeat) {
    if (e.code === 'F3') { e.preventDefault(); Perf.toggle(); }
    else if (e.code === 'KeyM') { e.preventDefault(); Sound.toggle(); }
    else if (e.code === 'KeyN') { e.preventDefault(); Music.toggle(); }
    else if (e.code === 'KeyP' && (G.state === STATE.PLAYING || G.state === STATE.PAUSED)) { e.preventDefault(); togglePause(); }
    else if (e.code === 'KeyB' && (G.state === STATE.PLAYING || G.state === STATE.PAUSED)) { 
      e.preventDefault(); 
      if (G.state === STATE.PAUSED) togglePause();
      openShop(); 
    }
    else if (e.code === 'Escape' && G.state === STATE.SHOP) { e.preventDefault(); closeShop(); }
    else if (e.code === 'Escape' && codexScreen.isOpen()) { e.preventDefault(); codexScreen.close(); }
    else if ((e.code === 'Enter' || e.code === 'Space') && G.state === STATE.MENU && !codexScreen.isOpen()) {
      e.preventDefault();
      const startBtn = document.getElementById('startBtn');
      if (startBtn) startBtn.click();
    }
  }
  // Space／方向鍵的 preventDefault 由平台層依「是否聚焦在 UI 元件」決定
  // （舊版無條件攔截，導致已聚焦的按鈕按 Space 沒反應，只能用 Enter）。
});
document.addEventListener('keyup', e => {
  G.keys[e.code] = false;
  applyKey(input, e.code, false, { skillKey: activeSkillKey });
});

// ── 生命週期：切到背景或失去焦點 ──
// 舊版完全沒有 blur/visibilitychange 監聽（全檔 0 筆）：
//   1. 按著 D 再切到別的分頁／視窗，keyup 永遠收不到 → 回來時坦克一直往同方向跑。
//   2. 分頁被遮住時 rAF 只會被節流、不會停 → 玩家站著挨打直到死亡。
function releaseAllInput() {
  G.keys = {};
  releaseAllKeys(input);          // 平台層：意圖狀態
  releaseTouch(G.touch);          // 平台層：觸控狀態
  if (typeof MobileInput !== 'undefined' && MobileInput.reset) MobileInput.reset();
}
function autoPauseIfPlaying() {
  if (G.state === STATE.PLAYING) togglePause();   // 自動暫停（不需要記狀態：玩家自己按 P 恢復）
}
function resumeAudioIfNeeded() {
  if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.resume();
}
// 事件 → 意圖的對應集中在 src/platform/lifecycle.js（可在 Node 用 stub 測）
bindLifecycle({
  onLeave: () => { releaseAllInput(); autoPauseIfPlaying(); },
  onReturn: resumeAudioIfNeeded,
});

function buyItem(itemId) {
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  if (!item) return;
  if (item.type === 'pierce' && G.playerStats.pierce) {
    addScorePopup(G.player.x, G.player.y - 30, '已擁有穿甲能力!', '#888');
    return;
  }
  // 武器已滿級時要在「扣分之前」擋掉：舊版先扣分、才在 switch 裡發現不能升級，
  // 玩家花 1500 分只換到一句「已達最大等級!」。
  if (item.type === 'weapon') {
    const wp0 = WEAPON_TREE[G.playerStats.weapon];
    if (!wp0 || !wp0.next) {
      addScorePopup(G.player.x, G.player.y - 30, '已達最大等級!', '#ff4444');
      return;
    }
  }
  const price = getShopPrice(item.price);
  if (G.score < price) {
    addScorePopup(G.player.x, G.player.y - 30, '分數不足!', '#ff4444');
    return;
  }
  
  G.score -= price;
  updateHUD();
  
  switch (item.type) {
    case 'health':
      G.playerStats.maxHp++;
      G.playerStats.hp = G.playerStats.maxHp;
      addScorePopup(G.player.x, G.player.y - 30, '生命+1!', '#ff69b4');
      break;
    case 'speed':
      G.playerStats.speedMult *= 1.2;
      addScorePopup(G.player.x, G.player.y - 30, '速度+20%!', '#44ff44');
      break;
    case 'pierce':
      G.playerStats.pierce = true;
      addScorePopup(G.player.x, G.player.y - 30, '穿甲彈!', '#ffaa00');
      break;
    case 'rapid':
      G.playerStats.shopFireRateBonus = (G.playerStats.shopFireRateBonus || 0) + 0.2;
      addScorePopup(G.player.x, G.player.y - 30, '射速+20%!', '#ff6b00');
      break;
    case 'life':
      G.continues++;
      addScorePopup(G.player.x, G.player.y - 30, '額外生命+1!', '#ff0000');
      break;
    case 'wall':
      fx.set('wall', 900);
      addScorePopup(G.player.x, G.player.y - 30, '堡壘 15秒!', '#888888');
      break;
    case 'weapon': {
      const currentWp = WEAPON_TREE[G.playerStats.weapon];
      if (currentWp && currentWp.next) {
        const nextWp = WEAPON_TREE[currentWp.next];
        G.playerStats.weapon = nextWp.id;
        G.playerStats.weaponTier = nextWp.tier;
        G.playerStats.route = nextWp.route;
        if (G.player) G.player.applyTypeStats();
        addScorePopup(G.player.x, G.player.y - 30, nextWp.name, '#ffd700');
      } else {
        addScorePopup(G.player.x, G.player.y - 30, '已達最大等級!', '#ff4444');
      }
      break;
    }
  }
  
  Sound.pulse(660, 0.1, 0.3, 'square');
  openShop();
}


// ==================== 手機觸控輸入 ====================

function updateMobileControlsForMode() {
  if (!IS_MOBILE) return;

  if (G.isVSMode) {
    fireBtn.classList.add('auto');

  } else {

}

const MobileInput = makeTouchInput({

MobileInput.init();

// 畫面流程（暫停／商店／接關／結束）：實作在 src/ui/screens.js
// 「按了按鈕會發生什麼」在這裡一眼看得出來（全部經由 hooks 注入）
const screens = makeScreens({
  doc: document,
  getGame: () => G,
  states: STATE,
  tables: { shopItems: SHOP_ITEMS },
  hooks: {
    getShopPrice,
    buyItem,

    playMusic: (name) => Music.play(name),
    jingleGameOver: () => Sound.jingleGameOver(),
    jingleLevelClear: () => Sound.jingleLevelClear(),
    stopMusic: () => Music.stop(),
    isMobile: () => IS_MOBILE,
    isMusicEnabled: () => Music.enabled,
  },
});
const { togglePause, openShop, closeShop, showGameOver, showContinuePrompt, showFinalGameOver } = screens;
const updateMusicIcon = screens.updateMusicIcon;   // 音樂圖示（按鈕與 N 鍵共用）

// ==================== 主迴圈 (固定時間步長 60Hz 模擬, 任意刷新率渲染) ====================
const TICK_HZ = 60;
const TICK_MS = 1000 / TICK_HZ;
let _speedMult = 1;        // URL param: ?speed=N  (1-20)
let _maxUpdatesPerFrame = 5;
let _accumMs = 0;
let _lastFrameTime = 0;

function update() {
  if (window.__botPreUpdate) window.__botPreUpdate();
  G.frameCount++;

  if (G.state === STATE.PLAYING) {
    spatialGrid.clear();
    for (let i = 0; i < G.enemies.length; i++) {
      spatialGrid.insert(G.enemies[i]);
    }

    // 主動技能：按鍵由 ACTIVE_SKILLS[].key 決定（資料是唯一來源），且為邊緣觸發 ——
    // 平台層在 keydown 時設 skillPressed，這裡消費一次（不再每幀查表、也不會按住連發）
    if (input.skillPressed) { input.skillPressed = false; triggerActiveSkill(); }

    // 所有玩家／全域時效的唯一遞減進入點（舊版散在 5 處，其中兩處還在 PLAYING 之外，
    // 導致暫停與商店期間堡壘時間照样流失）。
    const expired = fx.tick();
    if (expired.includes('slow')) applyPlayerSpeed();
    if (expired.includes('combo')) G.playerStats.combo = 0;
    applyPassiveTick();

    if (G.player && G.player.alive) {
      G.player.update();
      let moved = false;

      // 移動方向由平台層的意圖決定（鍵盤優先，其次觸控搖桿）
      const moveDir = dirFromInput(input, G.touch.dir >= 0 ? G.touch.dir : -1);
      if (moveDir >= 0) {
        G.player.move(moveDir); moved = true;
        mapEventState.slideDir = moveDir; mapEventState.slideTicks = ICE_SLIDE_TICKS;
      } else if (mapEventState.active && mapEventState.type === 'ICE' &&
                 mapEventState.slideTicks > 0 && mapEventState.slideDir >= 0) {
        // 冰面：沒有輸入時仍沿最後方向滑行，直到滑行量用完（地圖事件 ICE = '坦克滑行慣性'）
        G.player.move(mapEventState.slideDir); moved = true; mapEventState.slideTicks--;
      }

      if (!moved) G.player.moving = false;

      for (let i = 0; i < G.powerUps.length; i++) {
        const pu = G.powerUps[i];
        if (!pu.alive) continue;
        if (G.player && G.player.alive &&
            Math.hypot(pu.x - G.player.x - G.player.size/2, pu.y - G.player.y - G.player.size/2) < TILE * 1.5) {
          activatePowerUp(pu.type);
          pu.alive = false;
          addScorePopup(G.player.x, G.player.y, POWER_UPS[pu.type].name);
        }
      }

      if (G.isVSMode) {
        let nearest = null;
        let minDist = Infinity;
        for (let i = 0; i < G.enemies.length; i++) {
          const e = G.enemies[i];
          if (e.alive) {
            const d = Math.hypot(e.x - G.player.x, e.y - G.player.y);
            if (d < minDist) { minDist = d; nearest = e; }
          }
        }
        if (nearest) {
          const dx = nearest.x - G.player.x;
          const dy = nearest.y - G.player.y;
          G.player.aimDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
          G.player.shoot();
        }
      } else {
        if (input.fire || G.touch.fire) G.player.shoot();
      }
    }

    updateDirector();
    updateDirectorEvents();

    updateVSModeDifficulty();

    if (mapEventState.active) {
      updateMapEvent();
    }

    updateSummonEntities();

    const maxOnScreen = G.isVSMode ? CONFIG.GAMEPLAY.MAX_ENEMIES_ON_SCREEN_VS : CONFIG.GAMEPLAY.MAX_ENEMIES_ON_SCREEN;
    if (G.enemiesSpawned < G.maxEnemies) {
      if (G.aliveEnemies < maxOnScreen) {
        if (--G.spawnTimer <= 0) {
          spawnEnemy();
          G.spawnTimer = effectiveSpawnInterval();
        }
      }
    }

    if (!fx.has('freeze')) {
      for (let i = 0; i < G.enemies.length; i++) {
        if (G.enemies[i].alive) updateEnemyAI(G.enemies[i]);
      }
    }

    const ba = bulletsPool.active;
    for (let i = 0; i < ba.length; i++) updateBullet(ba[i]);
    bulletsPool.sweep();

    compact(G.enemies);

    if (G.baseDestroyed && !G.isVSMode) {
      G.state = STATE.GAMEOVER;
      setTimeout(showGameOver, 1200);
    }

    updateEconomy();

    // 關卡結算：舊版只在 handleBulletHit（子彈命中）裡呼叫，用 BOMB／空襲／核融合／火山
    // 等範圍技清掉最後一批敵人時就永遠不會結算 —— 場上沒敵人、關卡不結束的軟鎖。
    // 這裡每個 tick 檢查一次（單一比較，成本可忽略），涵蓋所有擊殺路徑。
    checkLevelComplete();
  }

  if (G.shakeTimer > 0) {
    G.shakeTimer--;
    G.shakeIntensity *= CONFIG.GAMEPLAY.SHAKE_DECAY;
  }
  for (let i = G.spawnEffects.length - 1; i >= 0; i--) {
    if (--G.spawnEffects[i].life <= 0) G.spawnEffects.splice(i, 1);
  }
  updateScorePopups();
  updateParticles();
}

// 環境／召喚物造成的傷害：統一走 handleBulletHit，讓護盾、無敵與死亡判定維持同一條路徑
// （避免出现「血量變負但沒死」這種雙軌問題）。
const _hazardBullet = { x: 0, y: 0, size: TILE, power: 1, isPlayer: false, alive: true, hitTanks: [] };
function damagePlayerFromHazard(x, y, power) {
  if (!G.player || !G.player.alive) return;
  _hazardBullet.x = x; _hazardBullet.y = y; _hazardBullet.power = power;
  _hazardBullet.alive = true; _hazardBullet.hitTanks.length = 0;
  handleBulletHit(_hazardBullet, G.player);
}

function updateSummonEntities() {
  for (let i = G.summonEntities.length - 1; i >= 0; i--) {
    const se = G.summonEntities[i];
    se.life--;

    if (se.type === 'turret') {
      if (se.cooldown > 0) se.cooldown--;
      if (se.cooldown <= 0 && G.player) {
        const cx = se.x + TILE/2;
        const cy = se.y + TILE/2;
        let nearest = null;
        let minDist = 200;
        for (const e of G.enemies) {
          if (e.alive) {
            const d = Math.hypot(e.x - se.x, e.y - se.y);
            if (d < minDist) { minDist = d; nearest = e; }
          }
        }
        if (nearest) {
          const dx = nearest.x + TILE/2 - cx;
          const dy = nearest.y + TILE/2 - cy;
          let dir;
          if (Math.abs(dx) > Math.abs(dy)) {
            dir = dx > 0 ? RIGHT : LEFT;
          } else {
            dir = dy > 0 ? DOWN : UP;
          }
          spawnBullet(cx, cy, dir, true, false, se.damage);
        } else {
          const dirs = [UP, DOWN, LEFT, RIGHT];
          const randDir = dirs[(rnd() * 4) | 0];
          spawnBullet(cx, cy, randDir, true, false, se.damage);
        }
        se.cooldown = 25;
      }
    }

    // INTERFERER 放的炸彈：到期或玩家靠近就引爆（舊版沒有任何分支，只會倒數後消失）
    if (se.type === 'bomb') {
      const near = G.player && G.player.alive &&
        Math.hypot(G.player.x - se.x, G.player.y - se.y) < TILE;
      if (se.life <= 0 || near) {
        spawnExplosion(se.x, se.y, 'big');
        if (near) damagePlayerFromHazard(se.x, se.y, se.damage || 2);
        se.alive = false;
      }
    }

    // MINELAYER 放的地雷：玩家踩到就爆
    if (se.type === 'mine') {
      const near = G.player && G.player.alive &&
        Math.hypot(G.player.x - se.x, G.player.y - se.y) < TILE * 0.9;
      if (near) {
        spawnExplosion(se.x, se.y, 'tank');
        damagePlayerFromHazard(se.x, se.y, se.damage || 2);
        se.alive = false;
      }
    }

    if (se.life <= 0) se.alive = false;
  }

  compact(G.summonEntities);

  for (let i = G.powerUps.length - 1; i >= 0; i--) {
    const pu = G.powerUps[i];
    pu.life--;
    if (pu.life <= 0) pu.alive = false;
  }
  compact(G.powerUps);

  // 堡壘與時間凍結已納入 fx，由 update() 的單一進入點遞減
  // （順帶修正：暫停與商店期間不再倒數）
}

function drawSummonEntities() {
  for (const se of G.summonEntities) {
    if (!se.alive) continue;

    if (se.type === 'turret') {
      const tImg = art('turret');
      if (tImg) ctx.drawImage(tImg, se.x, se.y, TILE, TILE);
      else {
        ctx.fillStyle = '#44aa44';
        ctx.fillRect(se.x, se.y, TILE, TILE);
        ctx.fillStyle = '#88ff88';
        ctx.fillRect(se.x + 4, se.y + 4, TILE - 8, TILE - 8);
      }
      const hpRatio = se.life / se.maxLife;
      ctx.fillStyle = '#000';
      ctx.fillRect(se.x, se.y - 4, TILE, 2);
      ctx.fillStyle = '#44ff44';
      ctx.fillRect(se.x, se.y - 4, TILE * hpRatio, 2);
    } else if (se.type === 'mine') {
      // 地雷原本完全沒畫（只有踩到才知道）；有素材時畫出來，閃紅燈
      const mImg = art('mine');
      if (mImg) {
        ctx.globalAlpha = (G.frameCount & 16) ? 1 : 0.75;
        ctx.drawImage(mImg, se.x + 4, se.y + 4, TILE - 8, TILE - 8);
        ctx.globalAlpha = 1;
      }
    } else if (se.type === 'bomb') {
      // INTERFERER 丟的定時炸彈原本也沒畫；快爆時閃爍
      const bImg = art('gaga_bomb');
      if (bImg) {
        ctx.globalAlpha = se.life < 30 && (G.frameCount & 4) ? 0.5 : 1;
        ctx.drawImage(bImg, se.x, se.y, TILE, TILE);
        ctx.globalAlpha = 1;
      }
    } else if (se.type === 'decoy') {
      ctx.fillStyle = `rgba(255,200,200,${se.life / se.maxLife * 0.5})`;
      ctx.fillRect(se.x, se.y, TILE, TILE);
    }
  }
}

function drawPowerUps() {
  for (const pu of G.powerUps) {
    if (!pu.alive) continue;
    const info = POWER_UPS[pu.type];
    const alpha = pu.life / pu.maxLife;
    const blink = (G.frameCount % 30 < 15) ? 1 : 0.5;
    const puImg = art('pu_' + pu.type);
    if (puImg) {
      ctx.globalAlpha = alpha * (blink === 1 ? 1 : 0.7);
      ctx.drawImage(puImg, pu.x - 13, pu.y - 13, 26, 26);
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.fillStyle = info.color;
    ctx.globalAlpha = alpha * blink;
    ctx.beginPath();
    ctx.arc(pu.x, pu.y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(info.icon, pu.x, pu.y + 4);
    ctx.textAlign = 'left';    // 舊版只還原 globalAlpha；textAlign='center' 會洩漏給之後的
    ctx.globalAlpha = 1;       // 菁英詞綴圖示與分數彈出（兩者都靠左對齊定位 → 位置會偏掉）
  }
}

function drawDirectorEvents() {
  for (const ev of G.directorEvents) {
    if (ev.type === 'orbital') {
      const reticle = art('orbital');
      for (const t of ev.targets) {
        const alpha = (ev.timer > 180) ? 1 : (ev.timer % 60 < 30) ? 0.5 : 0.8;
        if (reticle) {
          ctx.globalAlpha = alpha;
          drawRotated(ctx, reticle, t.x, t.y, TILE * 4, TILE * 4, G.frameCount * 0.02);
          ctx.globalAlpha = 1;
          continue;
        }
        ctx.strokeStyle = `rgba(255,0,0,${alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(t.x, t.y, TILE * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (ev.type === 'airdrop' && art('airdrop')) {
      ctx.globalAlpha = Math.sin(G.frameCount * 0.1) * 0.2 + 0.8;
      ctx.drawImage(art('airdrop'), ev.x - 13, ev.y - 13, 26, 26);
      ctx.globalAlpha = 1;
    } else if (ev.type === 'train' && art('train')) {
      const tr = art('train');
      ctx.drawImage(tr, ev.x, ev.y + TILE / 2 - (80 * tr.height / tr.width) / 2, 80, 80 * tr.height / tr.width);
    } else if (ev.type === 'airdrop') {
      ctx.fillStyle = `rgba(255,215,0,${Math.sin(G.frameCount * 0.1) * 0.3 + 0.5})`;
      ctx.fillRect(ev.x - 10, ev.y - 10, 20, 20);
    } else if (ev.type === 'train') {
      ctx.fillStyle = '#888';
      ctx.fillRect(ev.x, ev.y, 80, TILE);
      ctx.fillStyle = '#ff0';
      ctx.fillRect(ev.x + 10, ev.y + 5, 10, 10);
    }
  }
}

/** 導演事件名稱：畫面座標（不跟鏡頭走），由 render() 在還原鏡頭後呼叫。 */
function drawDirectorEventName() {
  if (G.directorEvents.length > 0 && G.directorEvents[0].name) {
    ctx.fillStyle = '#ffd700';
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(G.directorEvents[0].name, W/2, H - 20);
    ctx.textAlign = 'left';
  }
}

// ==================== 鏡頭與小地圖 ====================
// 鏡頭：以玩家為中心、放大 CAM_ZOOM 倍，夾在地圖邊界內（地圖邊緣不會露出空白）。
const _cam = { x: 0, y: 0 };
function updateCamera() {
  const vw = W / CAM_ZOOM, vh = H / CAM_ZOOM;
  const p = G.player;
  const fx = p ? p.x + p.size / 2 : W / 2, fy = p ? p.y + p.size / 2 : H / 2;
  _cam.x = Math.max(0, Math.min(W - vw, fx - vw / 2));
  _cam.y = Math.max(0, Math.min(H - vh, fy - vh / 2));
}

// 小地圖：地形縮圖每 30 幀才重烘一次（磚會被打掉）；單位每幀畫。
// 位置從四個角挑一個不蓋住玩家的（玩家靠地圖邊時鏡頭夾邊，玩家會偏離畫面中央）。
const MINI = 104, MINI_PAD = 6;
const _miniCanvas = document.createElement('canvas');
_miniCanvas.width = _miniCanvas.height = MINI * RENDER_SCALE;
let _miniBakedFrame = -999, _miniCorner = 0;
function drawMinimap() {
  const p = G.player;
  const k = MINI / W;
  if (G.frameCount - _miniBakedFrame >= 30 || G.frameCount < _miniBakedFrame) {
    const mc = _miniCanvas.getContext('2d');
    mc.drawImage(staticCanvas, 0, 0, _miniCanvas.width, _miniCanvas.height);
    const s = RENDER_SCALE * k;
    for (const f of G.forestTiles) { mc.fillStyle = '#1f6b2a'; mc.fillRect(f.x * s, f.y * s, TILE * s, TILE * s); }
    for (const d of G.dynamicTiles) { mc.fillStyle = d.type === WATER ? '#2aa6a0' : '#ffd700'; mc.fillRect(d.x * s, d.y * s, TILE * s, TILE * s); }
    _miniBakedFrame = G.frameCount;
  }
  const corners = [[W - MINI - MINI_PAD, MINI_PAD], [MINI_PAD, MINI_PAD], [W - MINI - MINI_PAD, H - MINI - MINI_PAD], [MINI_PAD, H - MINI - MINI_PAD]];
  if (p) {
    const ps = p.size * CAM_ZOOM, psx = (p.x - _cam.x) * CAM_ZOOM, psy = (p.y - _cam.y) * CAM_ZOOM;
    const covers = ([cx, cy]) => rectsOverlap(cx - 10, cy - 10, MINI + 20, MINI + 20, psx, psy, ps, ps);
    if (covers(corners[_miniCorner])) {   // 目前的角沒擋到就不換，避免玩家在邊界附近時小地圖來回跳
      const free = corners.findIndex((c) => !covers(c));
      if (free >= 0) _miniCorner = free;
    }
  }
  const [mx, my] = corners[_miniCorner];
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#000';
  ctx.fillRect(mx - 2, my - 2, MINI + 4, MINI + 4);
  ctx.drawImage(_miniCanvas, mx, my, MINI, MINI);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ff3b3b';
  for (const e of G.enemies) if (e.alive) ctx.fillRect(mx + (e.x + e.size / 2) * k - 2, my + (e.y + e.size / 2) * k - 2, e.type === 'BOSS' ? 6 : 4, e.type === 'BOSS' ? 6 : 4);
  ctx.fillStyle = '#ffe14d';
  for (const pu of G.powerUps) if (pu.alive) ctx.fillRect(mx + pu.x * k - 1.5, my + pu.y * k - 1.5, 3, 3);
  if (p && p.alive) { ctx.fillStyle = '#4dff6a'; ctx.fillRect(mx + (p.x + p.size / 2) * k - 2.5, my + (p.y + p.size / 2) * k - 2.5, 5, 5); }
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1;
  ctx.strokeRect(mx + _cam.x * k, my + _cam.y * k, (W / CAM_ZOOM) * k, (H / CAM_ZOOM) * k);
  ctx.strokeStyle = '#8a6a2a';
  ctx.strokeRect(mx - 1.5, my - 1.5, MINI + 3, MINI + 3);
  ctx.restore();
}

// 暫停時畫面是完全靜止的（frameCount 不再前進 → 水波相位、履帶相位、發光呼吸都凍結），
// 所以同一幀只需要畫一次：暫停中的 rAF 不再每幀重畫整個戰場（手機上暫停很久時的耗電來源）。
let _pausedRenderedFrame = -1;

function render() {
  if (G.state === STATE.PAUSED) {
    if (_pausedRenderedFrame === G.frameCount) return;
    _pausedRenderedFrame = G.frameCount;
  } else if (_pausedRenderedFrame !== -1) {
    _pausedRenderedFrame = -1;
  }

  const isGameplay = G.state === STATE.PLAYING || G.state === STATE.PAUSED || G.state === STATE.GAMEOVER;

  ctx.save();
  // 遊戲中的底色（含 NIGHT 事件底色）已經烘在 staticCanvas 裡 → 不必每幀全螢幕填色。
  // 非遊戲狀態（選單）沒有 staticCanvas 那一層，還是要自己填。
  // 注意：用 mapEventState（真正在跑的狀態機）判斷；G.mapEvent 只在 restartGame 被賦值，
  // rollMapEvent() 因為此時 G.level 已重置為 1（條件要求 level>=3）永遠回 null。
  if (!isGameplay) paintBackground(ctx, 0, 0, W, H);

  if (G.shakeTimer > 0) {
    ctx.translate((visualRnd() - 0.5) * G.shakeIntensity, (visualRnd() - 0.5) * G.shakeIntensity);
  }
  if (isGameplay) {
    updateCamera();
    ctx.scale(CAM_ZOOM, CAM_ZOOM);
    ctx.translate(-_cam.x, -_cam.y);
  }

  if (isGameplay) {
    ctx.drawImage(staticCanvas, 0, 0, W, H);
    const phase = ((G.frameCount >> 4) & 1);
    const tiles = G.dynamicTiles;
    for (let i = 0; i < tiles.length; i++) {
      const dt = tiles[i];
      if (dt.type === WATER) drawWaterDirect(ctx, dt.x, dt.y, phase);
      else if (dt.type === BASE) drawEagleDirect(ctx, dt.x, dt.y, false);
      else if (dt.type === BASE_DEAD) drawEagleDirect(ctx, dt.x, dt.y, true);
    }
  }

  drawMapEvent();

  for (let i = 0; i < G.spawnEffects.length; i++) {
    const sp = G.spawnEffects[i];
    drawNESSpawnEffect(sp.x, sp.y, sp.size, sp.life, sp.maxLife);
  }

  drawSummonEntities();
  drawPowerUps();
  for (let i = 0; i < G.enemies.length; i++) G.enemies[i].draw();
  // 暫停時也要畫玩家：舊版只在 PLAYING 畫，於是「按 P 暫停」會讓自己的坦克當場消失
  // （每一幀都會重畫整片戰場，所以那一格不會被保留下來）。GAMEOVER 不畫（死亡後 alive=false，
  // 但接關畫面不該留下上一條命的坦克）。
  if (G.player && (G.state === STATE.PLAYING || G.state === STATE.PAUSED)) G.player.draw();

  renderBullets();

  if (isGameplay) {
    // 樹林只貼有樹的格子：全螢幕貼一張 1040×1040 的透明圖層實測 1.1 ms／幀（DPR 2、SwiftShader），
    // 而一張地圖通常只有十幾格樹 → 實測降到 0.14 ms。
    // 四邊各多貼 1 個邏輯像素：樹叢的圓形 blob 中心可能落在格子邊界外（例如 x+size*0.15、半徑 4），
    // 抗鋸齒會溢出格子 1 個 device 像素以內；不帶這圈邊界就會少掉那一列半透明像素，
    // 雖然肉眼難辨，但「跟原本全螢幕貼法逐像素相同」是這個改動能被驗證的前提。
    // 來源座標是 device pixel，目的地是邏輯座標（ctx 已 setTransform(scale…)）。
    const ft = G.forestTiles;
    const pad = 1, span = TILE + pad * 2;
    for (let i = 0; i < ft.length; i++) {
      const f = ft[i];
      ctx.drawImage(forestCanvas,
        (f.x - pad) * BAKE_SCALE, (f.y - pad) * BAKE_SCALE, span * BAKE_SCALE, span * BAKE_SCALE,
        f.x - pad, f.y - pad, span, span);
    }
  }

  drawParticles();
  drawDirectorEvents();
  if (isGameplay) drawScorePopups();

  // 以下是畫面座標（HUD 類）：還原掉鏡頭與震動
  ctx.restore();
  ctx.save();
  drawDirectorEventName();
  if (isGameplay) drawMinimap();

  if (G.playerStats && G.playerStats.combo > 0 && isGameplay) {
    ctx.fillStyle = '#ff6600';
    ctx.font = '12px "Press Start 2P"';
    ctx.fillText(`${G.playerStats.combo} COMBO`, 10, H - 30);
    // 距離下一個連擊獎勵的進度條：沒有這條，玩家不知道「再 3 次會有東西」
    const every = COMBO_REWARDS.every;
    const progress = (G.playerStats.combo % every) / every;
    ctx.fillStyle = '#552200';
    ctx.fillRect(10, H - 25, 64, 3);
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(10, H - 25, (64 * progress) | 0, 3);
  }

  ctx.restore();
}

function gameLoop(now) {
  // 舊版的 requestAnimationFrame(gameLoop) 是函式最後一行：update()/render() 只要丟一次例外，
  // 下一幀就永遠不會被排程 —— 畫面整個凍結、只有 console 有訊息（實測塞一個 null 進 G.enemies
  // 就能讓 frameCount 永久停住）。這裡保證「無論如何都會排下一幀」。
  try {
  if (!_lastFrameTime) _lastFrameTime = now;
  let dt = now - _lastFrameTime;
  _lastFrameTime = now;
  if (dt > 250) dt = TICK_MS;
  _accumMs += dt * _speedMult;

  Perf.beginFrame();

  let updates = 0;
  while (!DETERMINISTIC && _accumMs >= TICK_MS && updates < _maxUpdatesPerFrame) {
    Perf.begin();
    if (G.state !== STATE.PAUSED) update();
    _accumMs -= TICK_MS;
    updates++;
  }
  if (_accumMs > TICK_MS * _maxUpdatesPerFrame) _accumMs = 0;

  render();
  Perf.end();
  Perf.updateUI();
  } catch (err) {
    reportRuntimeError(err);
  }
  requestAnimationFrame(gameLoop);
}

// 執行期錯誤：顯示一次提示（不要每幀洗版），並讓遊戲繼續跑 —— 單一敵人或粒子的資料異常
// 不該讓整場遊戲變成靜止畫面。
let _lastReportedError = null;
// ── 確定性測試用的鉤子（M2）──
// step(n)：同步跑 n 個 update()。測試靠這個「按 tick 驅動」，不受 rAF 排程與真實時間影響，
// 因此「同一組 seed + 同一串輸入」可以被精確重現。
function stepTicks(n) {
  for (let i = 0; i < n; i++) {
    if (G.state === STATE.PLAYING) update();
    else G.frameCount++;          // 非 PLAYING 也要推進，讓測試知道時間有在前進
  }
}

// checksum：把「會影響玩法結果」的狀態壓成一個數字。replay 測試比較這個值，
// 刻意不含粒子、爆炸、鏡頭抖動等純視覺狀態。
function gameChecksum() {
  const parts = [G.frameCount, G.score, G.level, G.state, G.playerStats.hp, G.playerStats.weapon,
    G.aliveEnemies, G.enemiesSpawned, Math.round(G.playerStats.weaponDamageBonus * 1000)];
  if (G.player) parts.push(Math.round(G.player.x * 100), Math.round(G.player.y * 100), Math.round(G.player.hp * 100), G.player.aimDir);
  for (const e of G.enemies) parts.push(e.type, Math.round(e.x * 100), Math.round(e.y * 100), Math.round(e.hp * 100));
  parts.push('bullets:' + bulletsPool.active.length, 'rng:' + rnd.state());
  const text = parts.join(',');
  let h = 2166136261 >>> 0;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}

function reportRuntimeError(err) {
  const msg = (err && err.message) || String(err);
  if (msg === _lastReportedError) return;
  _lastReportedError = msg;
  console.error('[tank-battle] 執行期錯誤（遊戲會繼續）:', err);
  const box = document.getElementById('errorBanner');
  if (box) {
    box.textContent = '⚠️ 執行期錯誤：' + msg + '（遊戲已繼續，可回報此訊息）';
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; _lastReportedError = null; }, 8000);
  }
}

window.addEventListener('error', (event) => reportRuntimeError(event.error || event.message));
window.addEventListener('unhandledrejection', (event) => reportRuntimeError(event.reason));

requestAnimationFrame(gameLoop);

/* ── Game speed & Bot loader ── */
(function(){
  var p = new URLSearchParams(location.search);
  var s = parseFloat(p.get('speed'));
  if (s > 0 && s <= 20) { _speedMult = s; _maxUpdatesPerFrame = Math.ceil(5 * s); console.log('[Speed] x' + s); }
  if (p.has('mute') || p.has('bot')) { Sound.enabled = false; Music.enabled = false; Music.stop(); if (Sound.ctx) Sound.ctx.suspend(); }
  if (!p.has('bot')) return;
  /* expose game internals so dynamically-loaded scripts can access them */
  // 模組化之後這些符號不再是 window 上的全域變數；驗證工具（tools/verify-game.mjs）
  // 需要它們才能驅動內部狀態，所以在 ?bot 時一併掛出來。
  window.__T = {
    // 驗證工具會呼叫的函式
    applyUpgrade, generateUpgradeOptions, buyItem, handleBulletHit, updateBullet, drawEagleDirect, eagleSprite,
    spawnEnemy, updateDirector, updateDirectorEvents, updateSummonEntities, damagePlayerFromHazard,
    stepTicks, gameChecksum, seed: SEED, deterministic: DETERMINISTIC, fx, CAM_ZOOM, progress,
    // update／render 分開掛出來：headless 的 rAF 不可靠（實測空頁面只有 8.8 fps），
    // 效能工具必須能自行同步呼叫，才能把「模擬」與「繪製」的成本分開量。
    update, render, effectiveSpawnInterval, cacheStaticMap,
    applyPlayerSpeed, input, gameState, STATES, releaseAllInput,
    rngState: () => rnd.state(), setRngState: (v) => rnd.setState(v),
    drawParticles, drawPowerUps, drawMapEvent, buildTankSprite, rollMapEvent,
    activateMapEvent, deactivateMapEvent, updateMapEvent, spawnBullet,
    // 驗證工具會讀寫的模組層狀態（掛物件本身，屬性讀寫才有效）
    mapEventState, eagleCache, tankSpriteCache: _tankSpriteCache, smokeColor: SMOKE_COLOR,
    ctx, canvas,   // 主畫布與其 2D context（工具用來檢查繪圖狀態，例如 textAlign）
    // 資料表（工具用來做等價比對與死欄位掃描）
    WEAPON_REGISTRY, MAP_EVENTS, DIRECTOR_EVENTS, STARTER_WEAPONS, WEAPON_DROPS_T1, WEAPON_DROPS_T2,
    COMMON_DROPS, SPECIAL_ENEMY_TYPES: Array.from(SPECIAL_ENEMY_TYPES),
    G: G, STATE: STATE, CONFIG: CONFIG,
    UP: UP, DOWN: DOWN, LEFT: LEFT, RIGHT: RIGHT,
    DX: DX, DY: DY, TILE: TILE, W: W, H: H,
    EMPTY: EMPTY, BRICK: BRICK, STEEL: STEEL, WATER: WATER, FOREST: FOREST, BASE: BASE,
    bulletsPool: bulletsPool, particlesPool: particlesPool,
    WEAPON_TREE: WEAPON_TREE, POWER_UPS: POWER_UPS,
    BOSS_TYPES, BOSS_ORDER, bossTypeForLevel, COMBO_REWARDS, addCombo, explodeShell,
    ACTIVE_SKILLS: ACTIVE_SKILLS, PASSIVE_SKILLS: PASSIVE_SKILLS,
    ELITE_PREFIXES: ELITE_PREFIXES, SHOP_ITEMS: SHOP_ITEMS,
    Sound: Sound, Music: Music, Perf: Perf,
    Tank: Tank, Pool: Pool, SpatialGrid: SpatialGrid,
    generateMap: generateMap, startLevel: startLevel,
    restartGame: restartGame, continueGame: continueGame,
    showGameOver: showGameOver, showFinalGameOver: showFinalGameOver,
    openShop: openShop, closeShop: closeShop,
    togglePause: togglePause, checkLevelComplete: checkLevelComplete, showUpgradeScreen: showUpgradeScreen,
  };
  ['bot.js','data-collector.js'].forEach(function(src){
    var s = document.createElement('script');
    s.src = src;
    s.async = false;
    document.body.appendChild(s);
  });
})();
</script>
