<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>坦克大戰 v2 - 優化版</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #1a1a26 0%, #0a0a10 50%, #050508 100%), #0a0a0e;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: 'Press Start 2P', 'Courier New', monospace;
    flex-direction: column; user-select: none; position: relative;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 4px 4px; pointer-events: none; z-index: 100;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%); pointer-events: none; z-index: 101;
  }

  #hud, #powerStatus, #gameContainer, #controls, #perfMonitor { position: relative; z-index: 2; }
  #gameContainer {
    position: relative; border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(255,215,0,0.08), 0 0 30px rgba(255,170,0,0.1), 0 0 60px rgba(0,0,0,0.85);
  }
  
  canvas { 
    display: block; border: 3px solid #3a3a45;
    border-top: none; background-color: #000; image-rendering: pixelated; box-sizing: border-box;
    border-radius: 0 0 6px 6px;
  }
  
  #hud {
    display: flex; justify-content: space-between; align-items: center; width: 520px; gap: 8px;
    background: linear-gradient(180deg, #1e1e28 0%, #14141c 60%, #0e0e15 100%); color: #fff; font-size: 11px;
    border: 3px solid #3a3a45; border-bottom: 1px solid #222; border-radius: 6px 6px 0 0;
  }
  .hud-item { display: flex; align-items: center; gap: 6px; }
  .label { color: #6a6a78; font-size: 9px; }
  .value { font-weight: bold; }
  .value.lives { color: #ff6b6b; text-shadow: 0 0 10px rgba(255,107,107,0.6); }
  .value.level { color: #6cc3ff; text-shadow: 0 0 10px rgba(108,195,255,0.6); }
  .value.score { color: #ffdd55; text-shadow: 0 0 12px rgba(255,221,85,0.7); }
  .vs-alert { color: #ff0055 !important; text-shadow: 0 0 15px rgba(255,0,85,0.9) !important; animation: blink 1s infinite; }
  #soundToggle {
    background: transparent; border: 1px solid #2a2a35; color: #ffd700;
    font-size: 14px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
    font-family: inherit; line-height: 1;
  }
  #soundToggle:hover, #soundToggle:active { background: rgba(255,215,0,0.1); border-color: #ffd700; }
  #pauseToggle {
    background: transparent; border: 1px solid #2a2a35; color: #ffd700;
    font-size: 14px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
    font-family: inherit; line-height: 1;
  }
  #pauseToggle:hover, #pauseToggle:active { background: rgba(255,215,0,0.1); border-color: #ffd700; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  
  #powerStatus {
    width: 520px; height: 26px; padding: 0; background: linear-gradient(180deg, #0a0a10, #0e0e16);
    border-left: 3px solid #3a3a45; border-right: 3px solid #3a3a45;
    border-bottom: 3px solid #3a3a45;
    color: #fff; font-size: 9px; display: flex; align-items: center; gap: 8px;
  }
  #powerStatus:empty::before { content: '◇ SYSTEM STANDBY'; color: #2a2a35; letter-spacing: 2px; }
  .power-chip { display: inline-flex; padding: 2px 8px; border-radius: 9px; background: #111; border: 1px solid #2a2a35; color: #5cd8ff; }
  
  #overlay, #upgradeUI {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column;
    justify-content: center; align-items: center; background: rgba(0,0,0,0.85); color: #fff; z-index: 10; backdrop-filter: blur(4px);
    padding: 20px;
  }
  #overlay.hidden, #upgradeUI.hidden { display: none !important; }
  #overlay.translucent { background: rgba(0,0,0,0.7); }
  #overlay h1, #upgradeUI h1 { font-size: 32px; color: #ffd700; text-shadow: 3px 3px 0 #8b0000; margin-bottom: 8px; animation: titlePulse 2.4s infinite; text-align: center; }
  @keyframes titlePulse { 0%,100% { transform: scale(1); text-shadow: 3px 3px 0 #8b0000, 0 0 35px rgba(255,215,0,0.5); } 50% { transform: scale(1.03); text-shadow: 3px 3px 0 #8b0000, 0 0 60px rgba(255,215,0,0.8); } }
  #overlay h2 { font-size: 24px; color: #ff5050; margin-bottom: 14px; text-shadow: 2px 2px 0 #500; text-align: center; }
  #overlay p { font-size: 10px; color: #aaa; margin: 6px 0; line-height: 1.8; text-align: center; }
  
  .card-container { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; justify-content: center; max-width: 480px; }
  .upgrade-card {
    background: linear-gradient(180deg, #1e1e28, #111); border: 2px solid #3a3a45; padding: 20px 15px; width: 140px;
    border-radius: 6px; cursor: pointer; transition: all 0.2s ease; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .upgrade-card:hover, .upgrade-card:active, .upgrade-card:focus { border-color: #ffd700; transform: translateY(-5px); box-shadow: 0 8px 20px rgba(255,215,0,0.3); outline: none; }
  .card-title { color: #5cd8ff; font-size: 11px; margin-bottom: 12px; line-height: 1.4; text-shadow: 0 0 5px rgba(92,216,255,0.4); }
  .card-desc { color: #888; font-size: 8px; line-height: 1.6; }

  .start-btn {
    margin-top: 28px; padding: 14px 40px; font-size: 14px; font-family: 'Press Start 2P', monospace;
    background: linear-gradient(180deg, rgba(255,215,0,0.08), rgba(255,170,0,0.02)); color: #ffd700;
    border: 2px solid #ffd700; border-radius: 4px; cursor: pointer; text-shadow: 0 0 8px rgba(255,215,0,0.5);
  }
  .start-btn:hover, .start-btn:active { background: linear-gradient(180deg, #ffe14d, #ffb700); color: #000; text-shadow: none; box-shadow: 0 0 25px rgba(255,215,0,0.7); }
  #controls { color: #6a6a78; font-size: 8px; margin-top: 12px; text-align: center; letter-spacing: 2px; }
  
  /* 性能監測面板 */
  #perfMonitor {
    position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #6cff6c;
    padding: 8px 12px; font-size: 9px; border: 1px solid #2a2a35; border-radius: 4px;
    z-index: 200; min-width: 130px; line-height: 1.6; display: none;
  }
  #perfMonitor.show { display: block; }
  #perfMonitor .row { display: flex; justify-content: space-between; }
  #perfMonitor .lbl { color: #6a6a78; }
  #perfMonitor .warn { color: #ffaa00; }
  #perfMonitor .bad { color: #ff5050; }

  /* ==================== 手機操作介面 ==================== */
  #mobileControls {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 220px; pointer-events: none; z-index: 50;
    padding: 0 20px 30px;
    padding-bottom: calc(30px + env(safe-area-inset-bottom));
  }
  body.mobile #mobileControls { display: block; }

  /* 虛擬搖桿 */
  #joystickArea {
    position: absolute; left: 0; bottom: 0;
    width: 50%; height: 100%;
    pointer-events: auto;
    touch-action: none;
  }
  #joystickBase {
    position: absolute; left: 30px; bottom: 30px;
    width: 130px; height: 130px;
    border: 3px solid rgba(255, 215, 0, 0.35);
    background: radial-gradient(circle, rgba(255,215,0,0.08) 0%, rgba(0,0,0,0.4) 70%);
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(255,170,0,0.2), inset 0 0 15px rgba(0,0,0,0.6);
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #joystickStick {
    position: absolute;
    left: 50%; top: 50%;
    width: 56px; height: 56px;
    margin-left: -28px; margin-top: -28px;
    background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255,215,0,0.7);
    pointer-events: none;
  }
  /* 方向指示 */
  #joystickBase::before {
    content: ''; position: absolute; inset: 8px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 12%, rgba(255,215,0,0.25) 0%, transparent 12%),
      radial-gradient(circle at 88% 50%, rgba(255,215,0,0.25) 0%, transparent 12%),
      radial-gradient(circle at 50% 88%, rgba(255,215,0,0.25) 0%, transparent 12%),
      radial-gradient(circle at 12% 50%, rgba(255,215,0,0.25) 0%, transparent 12%);
  }

  /* 射擊按鈕 */
  #fireButton {
    position: absolute; right: 30px; bottom: 35px;
    width: 110px; height: 110px;
    border: 3px solid #ff5050;
    background: radial-gradient(circle, rgba(255,80,80,0.3) 0%, rgba(80,0,0,0.6) 100%);
    border-radius: 50%;
    color: #ffcccc;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    text-shadow: 0 0 8px rgba(255,80,80,0.8);
    box-shadow: 0 0 20px rgba(255,80,80,0.4), inset 0 0 15px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    transition: transform 0.05s, box-shadow 0.05s;
  }
  #fireButton.pressed {
    transform: scale(0.92);
    background: radial-gradient(circle, rgba(255,140,140,0.5) 0%, rgba(120,0,0,0.7) 100%);
    box-shadow: 0 0 30px rgba(255,80,80,0.8), inset 0 0 20px rgba(0,0,0,0.5);
  }
  #fireButton.auto {
    border-color: #5cd8ff;
    background: radial-gradient(circle, rgba(92,216,255,0.2) 0%, rgba(0,40,80,0.6) 100%);
    color: #88e8ff;
    text-shadow: 0 0 8px rgba(92,216,255,0.8);
    box-shadow: 0 0 20px rgba(92,216,255,0.4), inset 0 0 15px rgba(0,0,0,0.6);
  }

  /* 響應式：行動版佈局 */
  body.mobile {
    align-items: stretch;
    justify-content: flex-start;
    padding-top: env(safe-area-inset-top);
  }
  body.mobile #hud,
  body.mobile #powerStatus,
  body.mobile #gameContainer { 
    width: 100%; max-width: 100vw; 
  }
  body.mobile #hud {
    border-radius: 0; border-left: none; border-right: none;
    font-size: 10px;
    padding: 8px 10px;
  }
  body.mobile #hud .label { font-size: 8px; }
  body.mobile #powerStatus {
    border-left: none; border-right: none;
    font-size: 8px;
    padding: 0 10px;
  }
  body.mobile canvas {
    width: 100% !important;
    height: auto !important;
    max-width: 100vw;
    border-left: none;
    border-right: none;
  }
  body.mobile #controls { display: none; }
  /* 行動版升級卡縮小 */
  body.mobile #overlay h1,
  body.mobile #upgradeUI h1 { font-size: 22px; }
  body.mobile #overlay h2 { font-size: 18px; }
  body.mobile #overlay p { font-size: 9px; }
  body.mobile .upgrade-card { width: 105px; padding: 14px 10px; }
  body.mobile .card-title { font-size: 9px; }
  body.mobile .card-desc { font-size: 7px; }
  body.mobile .card-container { gap: 10px; max-width: 100%; }
  body.mobile .start-btn { padding: 16px 36px; font-size: 13px; }

  /* 橫向手機 */
  @media (orientation: landscape) and (max-height: 500px) {
    body.mobile #hud { padding: 4px 10px; font-size: 9px; }
    body.mobile #powerStatus { height: 20px; }
    body.mobile #mobileControls { height: 180px; padding-bottom: 15px; }
    body.mobile #joystickBase { width: 110px; height: 110px; left: 20px; bottom: 20px; }
    body.mobile #fireButton { width: 95px; height: 95px; right: 20px; bottom: 25px; }
  }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-item"><span class="label">SCR</span><span class="value score" id="scoreDisplay">0</span></div>
  <div class="hud-item"><span class="label">LV</span><span class="value level" id="levelDisplay">1</span></div>
  <div class="hud-item"><span class="label">HP</span><span class="value lives" id="livesDisplay">♥♥♥</span></div>
  <div class="hud-item"><span class="label">EN</span><span class="value" id="enemiesDisplay">0</span></div>
  <button id="soundToggle" title="切換音效 (M)" aria-label="切換音效">🔊</button>
  <button id="pauseToggle" title="暫停 (P)" aria-label="暫停">⏸</button>
</div>
<div id="powerStatus"></div>

<div id="gameContainer">
  <canvas id="gameCanvas" width="520" height="520"></canvas>
  
  <div id="overlay">
    <h1>TANK WARS v2</h1>
    <p>消滅敵軍,每 10 關進入生存割草模式!</p>
    <p style="margin-top:12px; color:#ffd700;" class="kbd-hint">WASD / 方向鍵 <b>移動</b></p>
    <p style="color:#ffd700;" class="kbd-hint">空白鍵 <b>射擊</b> · F3 <b>性能監測</b></p>
    <p style="margin-top:12px; color:#ffd700;" class="touch-hint" hidden>左搖桿 <b>移動</b></p>
    <p style="color:#ffd700;" class="touch-hint" hidden>右按鈕 <b>射擊</b></p>
    <button class="start-btn" id="startBtn">START</button>
  </div>

  <div id="upgradeUI" class="hidden">
    <h1>LEVEL CLEAR</h1>
    <p style="color: #6cc3ff;">選擇安裝升級模組</p>
    <div class="card-container" id="cards"></div>
  </div>
</div>
<div id="controls">WASD / ARROWS MOVE &nbsp; · &nbsp; SPACE FIRE &nbsp; · &nbsp; F3 PERF</div>

<div id="mobileControls">
  <div id="joystickArea">
    <div id="joystickBase">
      <div id="joystickStick"></div>
    </div>
  </div>
  <button id="fireButton">FIRE</button>
</div>

<div id="perfMonitor">
  <div class="row"><span class="lbl">FPS</span><span id="perfFPS">--</span></div>
  <div class="row"><span class="lbl">FRAME</span><span id="perfFrame">-- ms</span></div>
  <div class="row"><span class="lbl">ENEMIES</span><span id="perfEnemies">0</span></div>
  <div class="row"><span class="lbl">BULLETS</span><span id="perfBullets">0</span></div>
  <div class="row"><span class="lbl">PARTICLES</span><span id="perfParticles">0</span></div>
  <div class="row"><span class="lbl">COL.CHK</span><span id="perfCollisions">0</span></div>
</div>

<script>
'use strict';

// ==================== 集中常數管理 ====================
const CONFIG = {
  CANVAS: { W: 520, H: 520, TILE: 26 },
  BULLET: {
    PLAYER_COOLDOWN: 14,
    PLAYER_COOLDOWN_VS: 8,
    ENEMY_NORMAL: 70,
    ENEMY_FAST: 60,
    ENEMY_HEAVY: 70,
    BOSS: 45,
    SPEED_PLAYER: 6,
    SPEED_ENEMY: 3.5,
    SPEED_BOSS: 4,
    SIZE: 6,
  },
  PARTICLE: {
    SPARK_COUNT: 6,
    TANK_DEATH_COUNT: 15,
    BIG_COUNT: 30,
    POOL_SIZE: 400,
  },
  POOL: {
    BULLET_INITIAL: 200,
    BULLET_MAX: 500,
  },
  AI: {
    VISION_RANGE: 26 * 12,
    CHANGE_INTERVAL: 30,
    VS_UPDATE_INTERVAL: 12,
  },
  GAMEPLAY: {
    POSITION_PRECISION: 0.5,
    SHAKE_DECAY: 0.88,
    PLAYER_RESPAWN_INVUL: 90,
    PLAYER_HIT_FLASH: 8,
    MAX_ENEMIES_ON_SCREEN: 4,
    MAX_ENEMIES_ON_SCREEN_VS: 18,
    BOSS_LEVEL_INTERVAL: 5,
    VS_MODE_INTERVAL: 10,
    STARTING_CONTINUES: 3,
  },
  GRID: {
    CELL_SIZE: 26 * 2,
  },
  MOBILE: {
    JOYSTICK_DEADZONE: 0.25,   // 死區百分比
    JOYSTICK_MAX_RADIUS: 50,   // 搖桿最大半徑(px)
  }
};

const W = CONFIG.CANVAS.W, H = CONFIG.CANVAS.H, TILE = CONFIG.CANVAS.TILE;
const COLS = (W / TILE) | 0, ROWS = (H / TILE) | 0;

const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, FOREST = 4, BASE = 5, BASE_DEAD = 6;
const UP = 0, RIGHT = 1, DOWN = 2, LEFT = 3;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

// ==================== 手機偵測 ====================
const IS_MOBILE = (() => {
  const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  const isNarrow = window.matchMedia('(max-width: 820px)').matches;
  const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  return hasTouch && (isNarrow || isMobileUA);
})();

if (IS_MOBILE) {
  document.body.classList.add('mobile');
  document.querySelectorAll('.kbd-hint').forEach(el => el.hidden = true);
  document.querySelectorAll('.touch-hint').forEach(el => el.hidden = false);
}

// ==================== Canvas 初始化 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const staticCanvas = document.createElement('canvas');
staticCanvas.width = W; staticCanvas.height = H;
const staticCtx = staticCanvas.getContext('2d');

const forestCanvas = document.createElement('canvas');
forestCanvas.width = W; forestCanvas.height = H;
const forestCtx = forestCanvas.getContext('2d');

// ==================== 音效系統 (Web Audio API NES 合成) ====================
const Sound = {
  ctx: null,
  master: null,
  noiseBuf: null,
  enabled: true,
  ready: false,

  init() {
    if (this.ready) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.18;
      this.master.connect(this.ctx.destination);
      // 預生成 1 秒白噪音 buffer
      const sr = this.ctx.sampleRate;
      const buf = this.ctx.createBuffer(1, sr, sr);
      const data = buf.getChannelData(0);
      for (let i = 0; i < sr; i++) data[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      this.ready = true;
    } catch (e) { /* ignore */ }
  },

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  toggle() {
    this.enabled = !this.enabled;
    if (this.master) this.master.gain.value = this.enabled ? 0.18 : 0;
    const btn = document.getElementById('soundToggle');
    if (btn) btn.textContent = this.enabled ? '🔊' : '🔇';
  },

  // 脈波 (方波) — NES pulse channel
  pulse(freq, dur, vol = 0.4, type = 'square', sweep = 0) {
    if (!this.ready || !this.enabled) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gn = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (sweep) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t + dur);
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gn).connect(this.master);
    osc.start(t);
    osc.stop(t + dur);
  },

  // 噪音 — NES noise channel (爆炸/打擊)
  noise(dur, vol = 0.4, freq = 1200, q = 1) {
    if (!this.ready || !this.enabled) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const filt = this.ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = freq;
    filt.Q.value = q;
    const gn = this.ctx.createGain();
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filt).connect(gn).connect(this.master);
    src.start(t);
    src.stop(t + dur);
  },

  // 序列播放 (簡易 jingle)
  seq(notes) {
    if (!this.ready || !this.enabled) return;
    let offset = 0;
    for (const [freq, dur, vol] of notes) {
      setTimeout(() => this.pulse(freq, dur, vol ?? 0.35), offset * 1000);
      offset += dur * 0.9;
    }
  },

  // ===== 遊戲音效 =====
  shoot()        { this.pulse(880, 0.05, 0.25, 'square', -700); },
  hitBrick()     { this.noise(0.07, 0.35, 1800, 1.5); },
  hitSteel()     { this.pulse(2200, 0.05, 0.3, 'square'); this.noise(0.05, 0.2, 4000, 2); },
  explode()      { this.noise(0.25, 0.5, 600, 0.7); this.pulse(120, 0.18, 0.3, 'triangle', -80); },
  bigExplode()   { this.noise(0.5, 0.6, 300, 0.5); this.pulse(80, 0.4, 0.4, 'triangle', -50); },
  spawn()        { this.pulse(220, 0.04, 0.2); setTimeout(() => this.pulse(440, 0.04, 0.2), 60); setTimeout(() => this.pulse(660, 0.06, 0.2), 120); },
  hitPlayer()    { this.pulse(180, 0.15, 0.45, 'square', -100); this.noise(0.15, 0.3, 800, 1); },
  baseDestroyed(){ this.noise(0.6, 0.6, 200, 0.5); this.pulse(60, 0.5, 0.5, 'triangle', -30); },

  // ===== Jingles =====
  jingleLevelStart() {
    this.seq([[523, 0.1], [659, 0.1], [784, 0.18]]);

// ==================== 性能監測系統 ====================
const Perf = {
  enabled: false,
  frameStart: 0,
  frameTimes: new Float64Array(60),
  frameTimeIdx: 0,
  frameTimeCount: 0,
  fpsTimer: 0,
  fps: 60,
  collisionChecks: 0,

  begin() {
    if (this.enabled) this.frameStart = performance.now();
    this.collisionChecks = 0;
  },

  end() {
    if (!this.enabled) return;
    const dt = performance.now() - this.frameStart;
    this.frameTimes[this.frameTimeIdx] = dt;
    this.frameTimeIdx = (this.frameTimeIdx + 1) % 60;
    if (this.frameTimeCount < 60) this.frameTimeCount++;
  },

  updateUI() {
    if (!this.enabled || G.frameCount % 15 !== 0) return;

    let avgFrame = 0;
    if (this.frameTimeCount > 0) {
      for (let i = 0; i < this.frameTimeCount; i++) avgFrame += this.frameTimes[i];
      avgFrame /= this.frameTimeCount;
    }
    const fps = avgFrame > 0 ? Math.min(60, Math.round(1000 / avgFrame)) : 60;

    const fpsEl = document.getElementById('perfFPS');
    fpsEl.textContent = fps;
    fpsEl.className = fps < 30 ? 'bad' : fps < 50 ? 'warn' : '';

    const frameEl = document.getElementById('perfFrame');
    frameEl.textContent = avgFrame.toFixed(1) + ' ms';
    frameEl.className = avgFrame > 20 ? 'bad' : avgFrame > 12 ? 'warn' : '';

    document.getElementById('perfEnemies').textContent = G.enemies.length;
    document.getElementById('perfBullets').textContent = bulletsPool.active.length;
    document.getElementById('perfParticles').textContent = particlesPool.active.length;
    document.getElementById('perfCollisions').textContent = this.collisionChecks;
  },

  toggle() {
    this.enabled = !this.enabled;
    document.getElementById('perfMonitor').classList.toggle('show', this.enabled);
  }
};

// ==================== 升級卡系統（分支流派） ====================
// 每局提供 3 張升級卡：武器路線進化、被動技能、主動技能

function generateUpgradeOptions() {
  const options = [];
  const ps = G.playerStats;

  // 1. 武器進化（如果可以）
  const weapon = ps.weapon || 'NORMAL';
  const currentWeapon = WEAPON_TREE[weapon];
  if (currentWeapon && currentWeapon.next) {
    const next = WEAPON_TREE[currentWeapon.next];
    options.push({
      type: 'weapon',
      id: next.id,
      title: `[${next.route}路線] ${next.name}`,
      desc: next.desc,
      icon: next.icon,
      color: next.color
    });
  }

  // 2. 初始武器選擇（如果還沒選路線）
  if (!ps.route && weapon === 'NORMAL') {
    const starters = ['RAPID', 'SPREAD', 'PLASMA', 'SUMMON'];
    for (const w of starters) {
      const wp = WEAPON_TREE[w];
      options.push({
        type: 'starter',
        id: w,
        title: `${wp.name}`,
        desc: wp.desc,
        icon: wp.icon,
        color: wp.color
      });
    }
  }

  // 3. 被動技能（最多 3 個）
  const availablePassives = PASSIVE_SKILLS.filter(p => !ps.passives.includes(p.id));
  const shuffledPassives = availablePassives.sort(() => 0.5 - Math.random()).slice(0, 2);
  for (const p of shuffledPassives) {
    options.push({
      type: 'passive',
      id: p.id,
      title: p.name,
      desc: p.desc,
      icon: p.icon,
      color: p.color
    });
  }

  // 4. 主動技能
  if (!ps.activeSkill && ACTIVE_SKILLS.length > 0) {
    const shuffledActive = ACTIVE_SKILLS.sort(() => 0.5 - Math.random()).slice(0, 1);
    for (const a of shuffledActive) {
      options.push({
        type: 'active',
        id: a.id,
        title: a.name,
        desc: `${a.desc} [${a.key}]`,
        icon: a.icon,
        color: '#ffd700'
      });
    }
  }

  // 5. 通用升級（如果武器卡不夠 3 張）
  const generalUpgrades = [
    { id: 'SPEED', title: '引擎增壓', desc: '移動速度 +20%', icon: '⚡', color: '#44ff44' },
    { id: 'HEAL', title: '裝甲修復', desc: '最大生命 +1', icon: '💚', color: '#ff44ff' },
    { id: 'PIERCE', title: '穿甲彈頭', desc: '子彈可貫穿', icon: '🎯', color: '#ffaa00' }
  ];
  const shuffledGeneral = generalUpgrades.sort(() => 0.5 - Math.random()).slice(0, 1);
  for (const g of shuffledGeneral) {
    options.push(g);
  }

  // 只保留 3 張，隨機
  return options.sort(() => 0.5 - Math.random()).slice(0, 3);
}

function showUpgradeScreen() {
  G.state = 'upgrade';
  Sound.jingleLevelClear();
  const ui = document.getElementById('upgradeUI');
  const container = document.getElementById('cards');
  ui.classList.remove('hidden');
  container.innerHTML = '';

  const options = generateUpgradeOptions();
  options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'upgrade-card';
    div.style.borderColor = opt.color;
    div.style.boxShadow = `0 0 15px ${opt.color}33`;
    div.tabIndex = 0;
    div.setAttribute('role', 'button');
    div.innerHTML = `
      <div style="font-size:24px;margin-bottom:8px;">${opt.icon || '⬆️'}</div>
      <div class="card-title" style="color:${opt.color}">${opt.title}</div>
      <div class="card-desc">${opt.desc}</div>
    `;
    div.onclick = () => applyUpgrade(opt);
    div.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); applyUpgrade(opt); }
    };
    container.appendChild(div);
  });
  setTimeout(() => container.firstChild && container.firstChild.focus(), 0);
}

function applyUpgrade(opt) {
  const ps = G.playerStats;

  if (opt.type === 'weapon' || opt.type === 'starter') {
    ps.weapon = opt.id;
    const wp = WEAPON_TREE[opt.id];
    if (wp) {
      ps.route = wp.route;
      ps.weaponTier = wp.tier;
    }
  }

  if (opt.type === 'passive') {
    ps.passives.push(opt.id);
  }

  if (opt.type === 'active') {
    ps.activeSkill = opt.id;
    const skillData = ACTIVE_SKILLS.find(s => s.id === opt.id);
    ps.activeCooldown = skillData ? skillData.cooldown : 0;
  }

  if (opt.id === 'SPEED') ps.speedMult *= 1.2;
  if (opt.id === 'HEAL') { ps.maxHp++; ps.hp = ps.maxHp; }
  if (opt.id === 'PIERCE') ps.pierce = true;

  document.getElementById('upgradeUI').classList.add('hidden');
  G.level++;
  startLevel();
}

// ==================== 被動技能效果系統 ====================
function applyPassiveEffects(target, source, effectType) {
  const ps = G.playerStats;
  let result = { damageMult: 1, triggered: false };

  for (const passiveId of ps.passives) {
    const passive = PASSIVE_SKILLS.find(p => p.id === passiveId);
    if (!passive) continue;

    switch (passiveId) {
      case 'HEAT':
        if (effectType === 'shoot') {
          ps.heatStacks = Math.min(ps.heatStacks + 1, 20);
          result.triggered = true;
        }
        break;
      case 'RAGE':
        if (effectType === 'damage_dealt' && source) {
          result.damageMult *= source.hp < source.maxHp * 0.5 ? 2 : (source.hp < source.maxHp * 0.75 ? 1.5 : 1);
          result.triggered = true;
        }
        break;
      case 'WEAKEN':
        if (effectType === 'boss_damage' && target && target.type === 'BOSS') {
          result.damageMult *= 1.5;
          result.triggered = true;
        }
        break;
      case 'CHAIN':
        if (effectType === 'bullet_hit' && target) {
          spawnChainBullet(source.x, source.y, target);
          result.triggered = true;
        }
        break;
      case 'OVERCHARGE':
        if (effectType === 'laser_kill' && target) {
          chainLightning(target.x, target.y, target);
          result.triggered = true;
        }
        break;
    }
  }
  return result;
}

function getHeatStacksMultiplier() {
  return 1 + (G.playerStats.heatStacks * 0.03);
}

function applyPassiveTick() {
  const ps = G.playerStats;
  if (ps.passives.includes('HEAT') && ps.heatStacks > 0) {
    ps.heatStacks = Math.max(0, ps.heatStacks - 0.5);
  }
  // 被動技能：再生（每秒回血）
  if (ps.passives.includes('REGEN')) {
    ps.hp = Math.min(ps.maxHp, ps.hp + 0.02);
  }
  // 被動技能：核融合引擎（移動時對周圍敵人造成持續灼燒傷害）
  if (ps.passives.includes('NUCLEAR') && G.player && G.player.alive && G.player.moving) {
    for (const e of G.enemies) {
      if (e.alive && Math.hypot(e.x - G.player.x, e.y - G.player.y) < TILE * 2) {
        e.hp -= 0.05;
        if (e.hp <= 0) {
          e.alive = false;
          spawnExplosion(e.x + e.size/2, e.y + e.size/2, e.type === 'BOSS' ? 'big' : 'tank');
          Sound.explode();
          G.aliveEnemies--;
          const pts = e.type === 'BOSS' ? 1000 : 100;
          G.score += pts;
          addScorePopup(e.x, e.y, `+${pts}`);
        }
      }
    }
  }
}

// ==================== 主動技能觸發 ====================
function triggerActiveSkill() {
  const ps = G.playerStats;
  if (!ps.activeSkill || ps.activeCooldown > 0) return;

  const skillData = ACTIVE_SKILLS.find(s => s.id === ps.activeSkill);
  if (!skillData) return;

  switch (ps.activeSkill) {
    case 'EMP':
      empPulse();
      break;
    case 'DASH':
      dashPlayer();
      break;
    case 'STRIKE':
      callAirStrike();
      break;
    case 'SLOW':
      slowField();
      break;
    case 'DECOY':
      spawnDecoy();
      break;
    case 'BOOST':
      boostMode();
      break;
  }

  ps.activeCooldown = skillData.cooldown;
  triggerShake(5, 3);
  Sound.pulse(600, 0.15, 0.4, 'square');
}

function empPulse() {
  const ba = bulletsPool.active;
  for (let i = 0; i < ba.length; i++) {
    if (!ba[i].isPlayer && ba[i].alive) {
      spawnExplosion(ba[i].x, ba[i].y, 'spark');
      ba[i].alive = false;
    }
  }
}

function dashPlayer() {
  if (!G.player || !G.player.alive) return;
  const dir = G.player.aimDir;
  const nx = G.player.x + DX[dir] * 100;
  const ny = G.player.y + DY[dir] * 100;
  G.player.x = Math.max(0, Math.min(W - TILE, nx));
  G.player.y = Math.max(0, Math.min(H - TILE, ny));
  G.player.invulTimer = 10;
  spawnExplosion(G.player.x, G.player.y, 'shield');
}

function callAirStrike() {
  for (let i = 0; i < 12; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    setTimeout(() => {
      spawnExplosion(x, y, 'big');
      triggerShake(3, 4);
      Sound.bigExplode();
      for (let j = 0; j < G.enemies.length; j++) {
        const e = G.enemies[j];
        if (e && e.alive) {
          const dx = e.x - x, dy = e.y - y;
          const dist = Math.hypot(dx, dy);
          if (dist < 40) {
            e.hp -= 3;
            spawnPopup(e.x, e.y, '-3', '#ff0');
            if (e.hp <= 0) { e.alive = false; G.score += e.type === 'BOSS' ? 500 : 50; }
          }
        }
      }
    }, i * 100);
  }
}

function slowField() {
  for (let i = 0; i < G.enemies.length; i++) {
    G.enemies[i].slowTimer = 120;
  }
}

function spawnDecoy() {
  if (!G.player) return;
  G.summonEntities.push({
    type: 'decoy', x: G.player.x, y: G.player.y,
    life: 180, maxLife: 180, alive: true
  });
}

function boostMode() {
  G.playerStats.boostTimer = 180;
  G.playerStats.rapidFire = true;
}

function activatePowerUp(type) {
  const pu = POWER_UPS[type];
  if (!pu) return;
  Sound.play('click');

  switch (type) {
    case 'BOMB':
      for (let i = 0; i < G.enemies.length; i++) {
        const e = G.enemies[i];
        if (e && e.alive) {
          e.hp = 0;
          e.alive = false;
          spawnExplosion(e.x + e.size/2, e.y + e.size/2, 'big');
          G.score += e.type === 'BOSS' ? 500 : 50;
          G.aliveEnemies--;
        }
      }
      triggerShake(15, 8);
      Sound.bigExplode();
      break;
    case 'WALL':
      G.wallTimer = G.permanentStats.permanentWall ? 999999 : 900;
      break;
    case 'STAR':
      const currentWp = WEAPON_TREE[G.playerStats.weapon];
      if (currentWp && currentWp.next) {
        const nextWp = WEAPON_TREE[currentWp.next];
        G.playerStats.weapon = nextWp.id;
        G.playerStats.weaponTier = nextWp.tier;
        G.playerStats.route = nextWp.route;
        G.player.applyTypeStats();
      }
      break;
    case 'TIME':
      G.timeFreezeTimer = 600;
      break;
    case 'SHIELD':
      G.playerStats.invulTimer = 600;
      break;
    case 'ONEUP':
      G.continues++;
      break;
  }
}

// ==================== 武器射擊系統（擴展） ====================
function shootWeapon(player) {
  if (!player.alive || player.bulletTimer > 0) return;

  const hs = player.size / 2;
  const cx = player.x + hs;
  const cy = player.y + hs;

  let cooldownMult = getHeatStacksMultiplier();
  if (G.playerStats.boostTimer > 0) cooldownMult *= 2;

  const baseCD = G.isVSMode ? CONFIG.BULLET.PLAYER_COOLDOWN_VS : CONFIG.BULLET.PLAYER_COOLDOWN;
  const actualCD = Math.max(2, Math.floor(baseCD * cooldownMult));
  player.bulletTimer = actualCD;

  switch (player.weapon) {
    case 'NORMAL':
      spawnBullet(cx, cy, player.aimDir, true, player.pierce);
      break;
    case 'RAPID':
    case 'GATLING':
    case 'CHAINGUN':
    case 'OVERDRIVE':
      spawnBullet(cx, cy, player.aimDir, true, true);
      if (player.weapon === 'GATLING' || player.weapon === 'OVERDRIVE') spawnBullet(cx, cy - 2, player.aimDir, true, true);
      if (player.weapon === 'CHAINGUN') spawnBullet(cx, cy + 2, player.aimDir, true, true);
      if (player.weapon === 'OVERDRIVE') {
        spawnBullet(cx, cy - 4, player.aimDir, true, true);
        spawnBullet(cx, cy + 4, player.aimDir, true, true);
      }
      break;
    case 'SPREAD':
    case 'CLUSTER':
    case 'NAPALM':
    case 'APOCALYPSE':
      if (player.weapon === 'SPREAD') spawnSpreadBullets(cx, cy, 3, 0.25);
      else if (player.weapon === 'CLUSTER') spawnSpreadBullets(cx, cy, 5, 0.3);
      else if (player.weapon === 'NAPALM') { spawnSpreadBullets(cx, cy, 3, 0.25); spawnFireZone(cx, cy); }
      else if (player.weapon === 'APOCALYPSE') spawnSpreadBullets(cx, cy, 5, 0.4);
      if (player.weapon === 'APOCALYPSE' && G.frameCount % 180 === 0) {
        for (let i = 0; i < 20; i++) {
          const bx = Math.random() * W;
          const by = Math.random() * H;
          setTimeout(() => {
            spawnExplosion(bx, by, 'big');
            triggerShake(4, 5);
          }, i * 50);
        }
      }
      break;
    case 'PLASMA':
    case 'D_LASER':
    case 'T_LASER':
    case 'OMEGA':
      spawnBullet(cx, cy, player.aimDir, true, true, 2);
      if (player.weapon === 'D_LASER') spawnBullet(cx, cy - 3, player.aimDir, true, true, 2);
      if (player.weapon === 'T_LASER') {
        spawnBullet(cx, cy - 3, player.aimDir, true, true, 2);
        spawnBullet(cx, cy + 3, player.aimDir, true, true, 2);
      }
      if (player.weapon === 'OMEGA') {
        spawnLaserBeam(player.aimDir);
      }
      break;
    case 'SUMMON':
    case 'DRONE':
    case 'TURRET':
    case 'FORTRESS':
      spawnBullet(cx, cy, player.aimDir, true, false, 1);
      const maxTurrets = 1 + player.weaponTier;
      if (G.summonEntities.filter(e => e.type === 'turret').length < maxTurrets) {
        G.summonEntities.push({
          type: 'turret', x: player.x, y: player.y,
          life: 300 + player.weaponTier * 100, maxLife: 300,
          damage: 1 + player.weaponTier, cooldown: 0, alive: true
        });
      }
      break;
  }

  triggerShake(2, 1);
  Sound.shoot();
  applyPassiveEffects(null, player, 'shoot');
}

function spawnBullet(x, y, dir, isPlayer, pierce = false, power = 1) {
  const b = bulletsPool.acquire();
  b.x = x - 3; b.y = y - 3;
  b.dir = dir;
  b.isPlayer = isPlayer;
  b.pierce = pierce;
  b.power = power;
  b.vx = DX[dir];
  b.vy = DY[dir];
  b.speed = isPlayer ? CONFIG.BULLET.SPEED_PLAYER : CONFIG.BULLET.SPEED_ENEMY;
  b.hitTanks.length = 0;
}

function spawnSpreadBullets(cx, cy, count, spreadAngle) {
  const baseDir = G.player ? G.player.aimDir : DOWN;
  const dx = DX[baseDir], dy = DY[baseDir];

  for (let i = 0; i < count; i++) {
    const angle = spreadAngle * (i - (count - 1) / 2);
    const cos = Math.cos(angle), sin = Math.sin(angle);
    const vx = dx * cos - dy * sin;
    const vy = dx * sin + dy * cos;

    const b = bulletsPool.acquire();
    b.x = cx - 3; b.y = cy - 3;
    b.dir = baseDir;
    b.isPlayer = true;
    b.vx = vx;
    b.vy = vy;
    b.speed = CONFIG.BULLET.SPEED_PLAYER * 0.8;
    b.power = 1;
    b.hitTanks.length = 0;
  }
}

function spawnFireZone(x, y) {
  G.summonEntities.push({
    type: 'fire', x, y, life: 120, maxLife: 120, damage: 0.5, alive: true
  });
}

function spawnLaserBeam(dir) {
  for (let i = 0; i < 30; i++) {
    const b = bulletsPool.acquire();
    b.x = G.player.x + i * 15 * DX[dir];
    b.y = G.player.y + i * 15 * DY[dir];
    b.dir = dir;
    b.isPlayer = true;
    b.vx = 0;
    b.vy = 0;
    b.speed = 0;
    b.laserLife = 15;
    b.hitTanks.length = 0;
  }
}

function spawnChainBullet(x, y, target) {
  let nearest = null;
  let minDist = 80;
  for (const e of G.enemies) {
    if (e.alive && e !== target) {
      const d = Math.hypot(e.x - x, e.y - y);
      if (d < minDist) { minDist = d; nearest = e; }
    }
  }
  if (nearest) {
    const b = bulletsPool.acquire();
    b.x = target.x; b.y = target.y;
    b.dir = DOWN;
    const dx = nearest.x - target.x;
    const dy = nearest.y - target.y;
    const len = Math.hypot(dx, dy) || 1;
    b.vx = dx / len; b.vy = dy / len;
    b.speed = 8;
    b.isPlayer = true;
    b.power = 0.5;
    b.chainCount = 1;
    b.hitTanks.length = 0;
  }
}

// OVERCHARGE 連鎖電擊：雷射擊殺後觸發
function chainLightning(x, y, source) {
  for (let i = 0; i < 3; i++) {
    let nearest = null;
    let minDist = 120;
    const exclude = source ? [source] : [];
    for (const e of G.enemies) {
      if (e.alive && !exclude.includes(e) && e !== source) {
        const d = Math.hypot(e.x - x, e.y - y);
        if (d < minDist) { minDist = d; nearest = e; }
      }
    }
    if (!nearest) break;
    const b = bulletsPool.acquire();
    b.x = x; b.y = y;
    b.dir = DOWN;
    const dx = nearest.x - x;
    const dy = nearest.y - y;
    const len = Math.hypot(dx, dy) || 1;
    b.vx = dx / len; b.vy = dy / len;
    b.speed = 10;
    b.isPlayer = true;
    b.pierce = false;
    b.power = 1;
    b.type = 'PLASMA';
    b.hitTanks.length = 0;
    spawnExplosion(x, y, 'spark');
    x = nearest.x; y = nearest.y; source = nearest;
  }
}

// ==================== 物件池 ====================
class Pool {
  constructor(factory, reset, initial, maxSize) {
    this._factory = factory; this._reset = reset;
    this._pool = []; this.active = [];
    this._maxSize = maxSize || initial * 3;
    this._peakActive = 0;
    for (let i = 0; i < initial; i++) this._pool.push(factory());
  }
  acquire() {
    const obj = this._pool.length > 0 ? this._pool.pop() : this._factory();
    this._reset(obj); 
    this.active.push(obj);
    if (this.active.length > this._peakActive) this._peakActive = this.active.length;
    return obj;
  }
  release(obj) { 
    if (this._pool.length < this._maxSize) this._pool.push(obj); 
  }
  sweep() {
    let writeIdx = 0;
    for (let i = 0; i < this.active.length; i++) {
      if (this.active[i].alive) {
        if (writeIdx !== i) this.active[writeIdx] = this.active[i];
        writeIdx++;
      } else {
        this.release(this.active[i]);
      }
    }
    this.active.length = writeIdx;
  }
  clear() { 
    for (const obj of this.active) this.release(obj); 
    this.active.length = 0; 
  }
}

// ==================== 空間分割網格 ====================
class SpatialGrid {
  constructor(w, h, cellSize) {
    this.cellSize = cellSize;
    this.cols = Math.ceil(w / cellSize);
    this.rows = Math.ceil(h / cellSize);
    this.cells = [];
    for (let i = 0; i < this.cols * this.rows; i++) this.cells.push([]);
  }
  
  _idx(cx, cy) { return cy * this.cols + cx; }
  
  clear() {
    for (let i = 0; i < this.cells.length; i++) this.cells[i].length = 0;
  }
  
  insert(entity) {
    if (!entity.alive) return;
    const cx = (entity.x / this.cellSize) | 0;
    const cy = (entity.y / this.cellSize) | 0;
    if (cx >= 0 && cx < this.cols && cy >= 0 && cy < this.rows) {
      this.cells[this._idx(cx, cy)].push(entity);
    }
  }
  
  queryRect(x, y, w, h, out) {
    out.length = 0;
    const cx1 = Math.max(0, (x / this.cellSize) | 0);
    const cy1 = Math.max(0, (y / this.cellSize) | 0);
    const cx2 = Math.min(this.cols - 1, ((x + w) / this.cellSize) | 0);
    const cy2 = Math.min(this.rows - 1, ((y + h) / this.cellSize) | 0);
    
    for (let cy = cy1; cy <= cy2; cy++) {
      for (let cx = cx1; cx <= cx2; cx++) {
        const cell = this.cells[this._idx(cx, cy)];
        for (let i = 0; i < cell.length; i++) out.push(cell[i]);
      }
    }
    return out;
  }
}

// ==================== 地圖生成 ====================
function generateMap(level) {
  const map = Array.from({length: ROWS}, () => new Uint8Array(COLS));
  const baseR = ROWS - 2, baseC = (COLS / 2) | 0;

  if (G.isVSMode) {
    G.basePos = null;
    G.playerSpawnPos = { x: ((COLS/2)|0)*TILE, y: ((ROWS/2)|0)*TILE };
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) map[r][c] = STEEL;
        else if (Math.random() < 0.03) map[r][c] = FOREST;
      }
    }
    return map;
  }

  G.basePos = { r: baseR, c: baseC };
  G.playerSpawnPos = { x: (baseC - 3) * TILE, y: (ROWS - 2) * TILE };
  map[baseR][baseC] = BASE;
  [[-1,-1],[-1,0],[-1,1],[0,-1],[0,1]].forEach(([dr,dc]) => map[baseR+dr][baseC+dc] = BRICK);

  for (let r = 2; r < ROWS - 2; r++) {
    for (let c = 1; c < COLS - 1; c++) {
      if (r >= ROWS - 4 && c >= baseC - 3 && c <= baseC + 3) continue;
      const rnd = Math.random();
      if (rnd < 0.12) map[r][c] = BRICK;
      else if (rnd < 0.18) map[r][c] = STEEL;
      else if (rnd < 0.22) map[r][c] = WATER;
      else if (rnd < 0.26) map[r][c] = FOREST;
    }
  }
  return map;
}

function drawBrickNES(cx2d, x, y, size) {
  const half = size / 2;
  cx2d.fillStyle = '#7a7a7a';
  cx2d.fillRect(x, y, size, size);
  cx2d.fillStyle = '#b8401c';
  cx2d.fillRect(x + 1, y + 1, half - 2, half - 2);
  cx2d.fillRect(x + half + 1, y + 1, half - 2, half - 2);
  cx2d.fillRect(x + 1, y + half + 1, (half / 2) - 1, half - 2);
  cx2d.fillRect(x + (half / 2) + 1, y + half + 1, half - 2, half - 2);
  cx2d.fillRect(x + size - (half / 2), y + half + 1, (half / 2) - 1, half - 2);
  cx2d.fillStyle = '#d96846';
  cx2d.fillRect(x + 1, y + 1, half - 2, 1);
  cx2d.fillRect(x + half + 1, y + 1, half - 2, 1);
  cx2d.fillRect(x + 1, y + half + 1, (half / 2) - 1, 1);
  cx2d.fillRect(x + (half / 2) + 1, y + half + 1, half - 2, 1);
  cx2d.fillRect(x + size - (half / 2), y + half + 1, (half / 2) - 1, 1);
}

function drawSteelNES(cx2d, x, y, size) {
  const half = size / 2;
  for (let qy = 0; qy < 2; qy++) {
    for (let qx = 0; qx < 2; qx++) {
      const px = x + qx * half;
      const py = y + qy * half;
      cx2d.fillStyle = '#9a9aa8';
      cx2d.fillRect(px, py, half, half);
      cx2d.fillStyle = '#dcdce8';
      cx2d.fillRect(px, py, half - 1, 1);
      cx2d.fillRect(px, py, 1, half - 1);
      cx2d.fillStyle = '#5a5a66';
      cx2d.fillRect(px + 1, py + half - 1, half - 1, 1);
      cx2d.fillRect(px + half - 1, py + 1, 1, half - 1);
    }
  }
}

function drawForestNES(cx2d, x, y, size) {
  cx2d.fillStyle = '#0a4a0a';
  cx2d.fillRect(x, y, size, size);
  cx2d.fillStyle = '#1f7a1f';
  const blobs = [
    [size*0.25, size*0.30, 5],
    [size*0.70, size*0.30, 5],
    [size*0.40, size*0.65, 5],
    [size*0.80, size*0.75, 4],
    [size*0.15, size*0.75, 4],
  ];
  for (const [bx, by, br] of blobs) {
    cx2d.beginPath(); cx2d.arc(x+bx, y+by, br, 0, Math.PI*2); cx2d.fill();
  }
  cx2d.fillStyle = '#2eaf2e';
  for (const [bx, by, br] of blobs) {
    cx2d.fillRect(x+bx-1, y+by-br+1, 2, 2);
  }
}

function cacheStaticMap() {

    for (let c = 0; c < COLS; c++) {
      const t = G.map[r][c], x = c*TILE, y = r*TILE;
      if (t === BRICK) drawBrickNES(staticCtx, x, y, TILE);
      else if (t === STEEL) drawSteelNES(staticCtx, x, y, TILE);
      else if (t === FOREST) drawForestNES(forestCtx, x, y, TILE);
      else if (t === WATER || t === BASE) {
        G.dynamicTiles.push({ type: t, x, y, r, c });
      }
    }
  }
}

function clampPos(v) { 
  return Math.round(v / CONFIG.GAMEPLAY.POSITION_PRECISION) * CONFIG.GAMEPLAY.POSITION_PRECISION;
