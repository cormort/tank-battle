<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>坦克大戰 v2 - 優化版</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #1a1a26 0%, #0a0a10 50%, #050508 100%), #0a0a0e;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: 'Press Start 2P', 'Courier New', monospace;
    flex-direction: column; user-select: none; position: relative;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 4px 4px; pointer-events: none; z-index: 100;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%); pointer-events: none; z-index: 101;
  }

  #hud, #powerStatus, #gameContainer, #controls, #perfMonitor { position: relative; z-index: 2; }
  #gameContainer {
    position: relative; border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(255,215,0,0.08), 0 0 30px rgba(255,170,0,0.1), 0 0 60px rgba(0,0,0,0.85);
  }
  
  canvas { 
    /* 桌機窄視窗（<530px）時原本固定 520px 會超出並被 overflow:hidden 裁掉且無法捲動 */
    display: block; width: min(520px, 100vw); border: 3px solid #3a3a45;
    border-top: none; background-color: #000; image-rendering: pixelated; box-sizing: border-box;
    border-radius: 0 0 6px 6px;
  }
  
  #hud {
    display: flex; justify-content: space-between; align-items: center; width: min(520px, 100vw); gap: 8px;
    background: linear-gradient(180deg, #1e1e28 0%, #14141c 60%, #0e0e15 100%); color: #fff; font-size: 11px;
    border: 3px solid #3a3a45; border-bottom: none; border-radius: 6px 6px 0 0;
  }
  .hud-item { display: flex; align-items: center; gap: 6px; }
  .label { color: #6a6a78; font-size: 9px; }
  .value { font-weight: bold; }
  .value.lives { color: #ff6b6b; text-shadow: 0 0 10px rgba(255,107,107,0.6); }
  .value.level { color: #6cc3ff; text-shadow: 0 0 10px rgba(108,195,255,0.6); }
  .value.score { color: #ffdd55; text-shadow: 0 0 12px rgba(255,221,85,0.7); }
  .vs-alert { color: #ff0055 !important; text-shadow: 0 0 15px rgba(255,0,85,0.9) !important; animation: blink 1s infinite; }
  #soundToggle {
    background: transparent; border: 1px solid #2a2a35; color: #ffd700;
    font-size: 14px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
    font-family: inherit; line-height: 1;
  }
  #soundToggle:hover, #soundToggle:active { background: rgba(255,215,0,0.1); border-color: #ffd700; }
  #pauseToggle {
    background: transparent; border: 1px solid #2a2a35; color: #ffd700;
    font-size: 14px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
    font-family: inherit; line-height: 1;
  }
  #pauseToggle:hover, #pauseToggle:active { background: rgba(255,215,0,0.1); border-color: #ffd700; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  
  #powerStatus {
    width: 520px; height: 26px; padding: 0; background: linear-gradient(180deg, #0a0a10, #0e0e16);
    border-left: 3px solid #3a3a45; border-right: 3px solid #3a3a45;
    border-bottom: 3px solid #3a3a45;
    color: #fff; font-size: 9px; display: flex; align-items: center; gap: 8px;
  }
  #powerStatus:empty::before { content: '◇ SYSTEM STANDBY'; color: #2a2a35; letter-spacing: 2px; }
  .power-chip { display: inline-flex; padding: 2px 8px; border-radius: 9px; background: #111; border: 1px solid #2a2a35; color: #5cd8ff; }
  
  #overlay, #upgradeUI {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column;
    justify-content: center; align-items: center; background: rgba(0,0,0,0.85); color: #fff; z-index: 10; backdrop-filter: blur(4px);
    padding: 20px;
    /* 小螢幕（尤其手機橫向）內容會超出容器；不能捲動的話「退出商店」按不到 → 玩家卡在商店 */
    overflow-y: auto;
    touch-action: pan-y;
    overscroll-behavior: contain;
  }
  body.mobile .shop-grid { grid-template-columns: repeat(2, 1fr); }
  #overlay.hidden, #upgradeUI.hidden { display: none !important; }
  #overlay.translucent { background: rgba(0,0,0,0.7); }
  #overlay h1, #upgradeUI h1 { font-size: 32px; color: #ffd700; text-shadow: 3px 3px 0 #8b0000; margin-bottom: 8px; animation: titlePulse 2.4s infinite; text-align: center; }
  @keyframes titlePulse { 0%,100% { transform: scale(1); text-shadow: 3px 3px 0 #8b0000, 0 0 35px rgba(255,215,0,0.5); } 50% { transform: scale(1.03); text-shadow: 3px 3px 0 #8b0000, 0 0 60px rgba(255,215,0,0.8); } }
  #overlay h2 { font-size: 24px; color: #ff5050; margin-bottom: 14px; text-shadow: 2px 2px 0 #500; text-align: center; }
  #overlay p { font-size: 10px; color: #aaa; margin: 6px 0; line-height: 1.8; text-align: center; }
  
  .codex-btn { margin-top: 10px; font-size: 11px; background: linear-gradient(180deg, #2a2236, #17121f); border-color: #8a6a2a; }
  #codexUI {
    position: absolute; inset: 0; z-index: 20; background: rgba(6,6,10,0.96); color: #ddd;
    display: flex; flex-direction: column; padding: 10px 12px; overflow: hidden;
  }
  #codexUI.hidden { display: none !important; }
  .codex-head { display: flex; justify-content: space-between; align-items: center; }
  .codex-head h2 { font-size: 18px; color: #ffd700; text-shadow: 2px 2px 0 #8b0000; margin: 0; }
  .codex-close { background: none; border: 1px solid #3a3a45; color: #ffd700; font-family: inherit; font-size: 12px; padding: 4px 8px; cursor: pointer; border-radius: 4px; }
  .codex-tabs { display: flex; gap: 6px; margin: 8px 0; }
  .codex-tabs button { flex: 1; background: #14141c; border: 1px solid #3a3a45; color: #888; font-family: inherit; font-size: 10px; padding: 7px 4px; cursor: pointer; border-radius: 4px; }
  .codex-tabs button.on { color: #ffd700; border-color: #ffd700; background: #221c10; }
  .codex-body { overflow-y: auto; flex: 1; touch-action: pan-y; overscroll-behavior: contain; padding-right: 4px; }
  .codex-body h3 { font-size: 11px; color: #6cc3ff; margin: 10px 0 6px; }
  .codex-sum { font-size: 9px; color: #aaa; margin: 2px 0 6px; }
  .codex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .codex-card { background: linear-gradient(180deg, #1e1e28, #111); border: 1px solid #3a3a45; border-radius: 6px; padding: 6px 4px; text-align: center; font-family: inherit; color: inherit; }
  .codex-card img { width: 64px; height: 64px; object-fit: contain; display: block; margin: 0 auto 4px; }
  .codex-card img.locked { filter: brightness(0) drop-shadow(0 0 1px #6a6a88); opacity: 0.8; }
  .codex-card .noimg { width: 64px; height: 64px; margin: 0 auto 4px; display: grid; place-items: center; color: #444; }
  .codex-name { font-size: 9px; color: #fff; line-height: 1.4; min-height: 2.8em; }
  .codex-meta { font-size: 8px; color: #8a8a99; margin-top: 2px; }
  .codex-bar { height: 3px; background: #2a2a35; margin-top: 4px; border-radius: 2px; overflow: hidden; }
  .codex-bar i { display: block; height: 100%; background: #ffaa00; }
  .codex-card.skin { cursor: pointer; }
  .codex-card.skin:not(:disabled):hover, .codex-card.skin:focus-visible { border-color: #ffd700; outline: none; }
  .codex-card.skin:disabled { cursor: default; }
  .codex-card.is-current { border-color: #4dff6a; box-shadow: 0 0 10px rgba(77,255,106,0.35); }
  .codex-card.is-current .codex-meta { color: #4dff6a; }
  .ach-list { display: flex; flex-direction: column; gap: 6px; }
  .ach { display: grid; grid-template-columns: 22px 1fr; column-gap: 8px; align-items: center; background: #14141c; border: 1px solid #2a2a35; border-radius: 4px; padding: 6px 8px; opacity: 0.6; }
  .ach span { grid-row: span 2; font-size: 14px; }
  .ach b { font-size: 10px; color: #fff; font-weight: normal; }
  .ach em { font-size: 8px; color: #888; font-style: normal; }
  .ach.is-done { opacity: 1; border-color: #8a6a2a; }
  .ach.is-done b { color: #ffd700; }
  #toasts { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  .toast { background: rgba(20,16,8,0.94); border: 1px solid #ffd700; color: #ffe680; font-size: 10px; padding: 7px 14px; border-radius: 4px; box-shadow: 0 0 16px rgba(255,215,0,0.35); animation: toastIn 2.8s ease forwards; white-space: nowrap; }
  @keyframes toastIn { 0% { opacity: 0; transform: translateY(-8px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  .card-container { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; justify-content: center; max-width: 480px; }
  .upgrade-card {
    background: linear-gradient(180deg, #1e1e28, #111); border: 2px solid #3a3a45; padding: 20px 15px; width: 140px;
    border-radius: 6px; cursor: pointer; transition: all 0.2s ease; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .upgrade-card:hover, .upgrade-card:active, .upgrade-card:focus { border-color: #ffd700; transform: translateY(-5px); box-shadow: 0 8px 20px rgba(255,215,0,0.3); outline: none; }
  .card-title { color: #5cd8ff; font-size: 11px; margin-bottom: 12px; line-height: 1.4; text-shadow: 0 0 5px rgba(92,216,255,0.4); }
  .card-desc { color: #888; font-size: 8px; line-height: 1.6; }

  .shop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 520px; margin: 15px auto; }
  .shop-item {
    background: linear-gradient(180deg, #1e1e28, #111); border: 2px solid #3a3a45; padding: 12px 8px;
    border-radius: 6px; cursor: pointer; transition: all 0.2s ease; text-align: center;
  }
  .shop-item:hover { border-color: #ffd700; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(255,215,0,0.3); }

  .start-btn {
    margin-top: 28px; padding: 14px 40px; font-size: 14px; font-family: 'Press Start 2P', monospace;
    background: linear-gradient(180deg, rgba(255,215,0,0.08), rgba(255,170,0,0.02)); color: #ffd700;
    border: 2px solid #ffd700; border-radius: 4px; cursor: pointer; text-shadow: 0 0 8px rgba(255,215,0,0.5);
  }
  .start-btn:hover, .start-btn:active { background: linear-gradient(180deg, #ffe14d, #ffb700); color: #000; text-shadow: none; box-shadow: 0 0 25px rgba(255,215,0,0.7); }
  #controls { color: #6a6a78; font-size: 8px; margin-top: 12px; text-align: center; letter-spacing: 2px; }
  
  /* 性能監測面板 */
  #perfMonitor {
    position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #6cff6c;
    padding: 8px 12px; font-size: 9px; border: 1px solid #2a2a35; border-radius: 4px;
    /* pointer-events:none：z-index 200 的浮層在窄視窗會蓋住 HUD 按鈕，讓它們點不到 */
    z-index: 200; min-width: 130px; line-height: 1.6; display: none; pointer-events: none;
  }
  #perfMonitor.show { display: block; }
  #perfMonitor .row { display: flex; justify-content: space-between; }
  #perfMonitor .lbl { color: #6a6a78; }
  #perfMonitor .warn { color: #ffaa00; }
  #perfMonitor .bad { color: #ff5050; }

  /* ==================== 手機操作介面 ==================== */
  #mobileControls {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 220px; pointer-events: none; z-index: 50;
    padding: 0 20px 30px;
    padding-bottom: calc(30px + env(safe-area-inset-bottom));
  }
  body.mobile #mobileControls { display: block; }

  /* 虛擬搖桿 */
  #joystickArea {
    position: absolute; left: 0; bottom: 0;
    width: 50%; height: 100%;
    pointer-events: auto;
    touch-action: none;
  }
  #joystickBase {
    position: absolute; left: 30px; bottom: 30px;
    width: 130px; height: 130px;
    border: 3px solid rgba(255, 215, 0, 0.35);
    background: radial-gradient(circle, rgba(255,215,0,0.08) 0%, rgba(0,0,0,0.4) 70%);
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(255,170,0,0.2), inset 0 0 15px rgba(0,0,0,0.6);
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #joystickStick {
    position: absolute;
    left: 50%; top: 50%;
    width: 56px; height: 56px;
    margin-left: -28px; margin-top: -28px;
    background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255,215,0,0.7);
    pointer-events: none;
  }
  /* 方向指示 */
  #joystickBase::before {
    content: ''; position: absolute; inset: 8px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 12%, rgba(255,215,0,0.25) 0%, transparent 12%),
      radial-gradient(circle at 88% 50%, rgba(255,215,0,0.25) 0%, transparent 12%),
      radial-gradient(circle at 50% 88%, rgba(255,215,0,0.25) 0%, transparent 12%),
      radial-gradient(circle at 12% 50%, rgba(255,215,0,0.25) 0%, transparent 12%);
  }

  /* 射擊按鈕 */
  #fireButton {
    position: absolute; right: 30px; bottom: 35px;
    width: 110px; height: 110px;
    border: 3px solid #ff5050;
    background: radial-gradient(circle, rgba(255,80,80,0.3) 0%, rgba(80,0,0,0.6) 100%);
    border-radius: 50%;
    color: #ffcccc;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    text-shadow: 0 0 8px rgba(255,80,80,0.8);
    box-shadow: 0 0 20px rgba(255,80,80,0.4), inset 0 0 15px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    transition: transform 0.05s, box-shadow 0.05s;
  }
  #fireButton.pressed {
    transform: scale(0.92);
    background: radial-gradient(circle, rgba(255,140,140,0.5) 0%, rgba(120,0,0,0.7) 100%);
    box-shadow: 0 0 30px rgba(255,80,80,0.8), inset 0 0 20px rgba(0,0,0,0.5);
  }
  #fireButton.auto {
    border-color: #5cd8ff;
    background: radial-gradient(circle, rgba(92,216,255,0.2) 0%, rgba(0,40,80,0.6) 100%);
    color: #88e8ff;
    text-shadow: 0 0 8px rgba(92,216,255,0.8);
    box-shadow: 0 0 20px rgba(92,216,255,0.4), inset 0 0 15px rgba(0,0,0,0.6);
  }

  /* 響應式：行動版佈局 */
  body.mobile {
    align-items: stretch;
    justify-content: flex-start;
    padding-top: env(safe-area-inset-top);
  }
  body.mobile #hud,
  body.mobile #powerStatus,
  body.mobile #gameContainer { 
    width: 100%; max-width: 100vw; 
  }
  body.mobile #hud {
    border-radius: 0; border-left: none; border-right: none;
    font-size: 10px;
    padding: 8px 10px;
  }
  body.mobile #hud .label { font-size: 8px; }
  body.mobile #powerStatus {
    border-left: none; border-right: none;
    font-size: 8px;
    padding: 0 10px;
  }
  body.mobile canvas {
    /* 用 min(100vw, 可用高度) 而不是固定 100%：畫布是正方形，橫向手機（844×390）下
       100% 會變成 844 高，把 START GAME 推到畫面外（elementFromPoint 為 null），
       而 body 是 overflow:hidden + touch-action:none → 手機橫向連遊戲都開不起來。 */
    width: min(100vw, calc(100dvh - 96px)) !important;
    height: auto !important;
    max-width: 100vw;
    margin: 0 auto;
    border-left: none;
    border-right: none;
  }
  body.mobile #hud {
    width: min(100vw, calc(100dvh - 96px));
    margin: 0 auto;
  }
  /* 觸控目標：原本 36×20 / 27×20 px，遠低於 44×44 的可點範圍，手機常誤觸中斷遊戲 */
  body.mobile #hud button { min-width: 44px; min-height: 44px; font-size: 16px; padding: 0 6px; }
  body.mobile #hud { gap: 6px; padding: 4px 8px; }
  body.mobile #pauseToggle { margin-left: 6px; }
  body.mobile #controls { display: none; }
  /* 行動版升級卡縮小 */
  body.mobile #overlay h1,
  body.mobile #upgradeUI h1 { font-size: 22px; }
  body.mobile #overlay h2 { font-size: 18px; }
  body.mobile #overlay p { font-size: 9px; }
  body.mobile .upgrade-card { width: 105px; padding: 14px 10px; }
  body.mobile .card-title { font-size: 9px; }
  body.mobile .card-desc { font-size: 7px; }
  body.mobile .card-container { gap: 10px; max-width: 100%; }
  body.mobile .start-btn { padding: 16px 36px; font-size: 13px; }

  /* 橫向手機 */
  @media (orientation: landscape) and (max-height: 500px) {
    body.mobile #hud { padding: 4px 10px; font-size: 9px; }
    body.mobile #powerStatus { height: 20px; }
    body.mobile #mobileControls { height: 180px; padding-bottom: 15px; }
    body.mobile #joystickBase { width: 110px; height: 110px; left: 20px; bottom: 20px; }
    body.mobile #fireButton { width: 95px; height: 95px; right: 20px; bottom: 25px; }
  }
</style>

<body>

<div id="hud">
  <div class="hud-item"><span class="label">SCR</span><span class="value score" id="scoreDisplay">0</span></div>
  <div class="hud-item"><span class="label">LV</span><span class="value level" id="levelDisplay">1</span></div>
  <div class="hud-item"><span class="label">HP</span><span class="value lives" id="livesDisplay">♥♥♥</span></div>
  <div class="hud-item"><span class="label">EN</span><span class="value" id="enemiesDisplay">0</span></div>
  <button id="soundToggle" title="切換音效 (M)" aria-label="切換音效">🔊</button>
  <button id="musicToggle" title="切換音樂 (N)" aria-label="切換音樂" style="background:transparent;border:1px solid #2a2a35;color:#ffd700;font-size:14px;padding:2px 8px;border-radius:4px;cursor:pointer;font-family:inherit;line-height:1;">🎵</button>
  <button id="shopToggle" title="商店 (B)" aria-label="商店" style="background:transparent;border:1px solid #2a2a35;color:#ffd700;font-size:14px;padding:2px 8px;border-radius:4px;cursor:pointer;font-family:inherit;line-height:1;">🏪</button>
  <button id="pauseToggle" title="暫停 (P)" aria-label="暫停">⏸</button>
</div>
<div id="powerStatus"></div>

<div id="gameContainer">
  <canvas id="gameCanvas" width="520" height="520"></canvas>
  
  <div id="overlay">
    <h1>TANK WARS v2</h1>
    <p>消滅敵軍,每 10 關進入生存割草模式!</p>
    <p style="margin-top:12px; color:#ffd700;" class="kbd-hint">WASD / 方向鍵 <b>移動</b></p>
    <p style="color:#ffd700;" class="kbd-hint">空白鍵 <b>射擊</b> · F3 <b>性能監測</b></p>
    <p style="margin-top:12px; color:#ffd700;" class="touch-hint" hidden>左搖桿 <b>移動</b></p>
    <p style="color:#ffd700;" class="touch-hint" hidden>右按鈕 <b>射擊</b></p>
    <button class="start-btn" id="startBtn">START GAME</button>
    <button class="start-btn codex-btn" id="codexBtn">📖 圖鑑 · 坦克 · 成就</button>
  </div>
  <div id="codexUI" class="hidden"></div>
  <div id="toasts" aria-live="polite"></div>

  <div id="upgradeUI" class="hidden">
    <h1>LEVEL CLEAR</h1>
    <p style="color: #6cc3ff;">選擇安裝升級模組</p>
    <div class="card-container" id="cards"></div>
  </div>
</div>
<div id="errorBanner" role="alert" style="display:none; position:fixed; left:50%; transform:translateX(-50%); bottom:12px; z-index:300; background:rgba(80,0,0,0.92); color:#ffd0d0; border:1px solid #ff5050; border-radius:4px; padding:8px 14px; font-size:10px; max-width:90vw; text-align:center;"></div>
<div id="controls">WASD / ARROWS MOVE &nbsp; · &nbsp; SPACE FIRE &nbsp; · &nbsp; F3 PERF &nbsp; · &nbsp; N MUSIC</div>

<div id="mobileControls">
  <div id="joystickArea">
    <div id="joystickBase">

const Perf = {
  enabled: false,
  frameStart: 0,
  frameTimes: new Float64Array(60),
  frameTimeIdx: 0,
  frameTimeCount: 0,
  fpsTimer: 0,
  fps: 60,

  // 量「整幀」（update + render）而不是只看 update：舊版把 begin/end 放在固定時間步長的

  beginFrame() {
    if (!this.enabled) return;
    this.frameStart = performance.now();
    this.collisionChecks = 0;
    this.updatesThisFrame = 0;
  },

  begin() {
    this.updatesThisFrame = (this.updatesThisFrame || 0) + 1;
  },

  end() {
    if (!this.enabled) return;
    const dt = performance.now() - this.frameStart;
    this.frameTimes[this.frameTimeIdx] = dt;
    this.frameTimeIdx = (this.frameTimeIdx + 1) % 60;
    if (this.frameTimeCount < 60) this.frameTimeCount++;
  },

  _els: null,
  updateUI() {
    if (!this.enabled || G.frameCount % 15 !== 0) return;
    // 元素快取 + 只在值真的變了才寫 DOM：舊版每次 flush 都 5 次 getElementById 且無條件賦值

    if (!this._els) {
      this._els = {
        fps: document.getElementById('perfFPS'), frame: document.getElementById('perfFrame'),
        enemies: document.getElementById('perfEnemies'), bullets: document.getElementById('perfBullets'),
        particles: document.getElementById('perfParticles'), collisions: document.getElementById('perfCollisions'),
        peak: document.getElementById('perfPeak'),
      };
    }
    const set = (el, value) => { if (el && el.textContent !== String(value)) el.textContent = value; };

    let avgFrame = 0;
    if (this.frameTimeCount > 0) {
      for (let i = 0; i < this.frameTimeCount; i++) avgFrame += this.frameTimes[i];
      avgFrame /= this.frameTimeCount;
    }
    const fps = avgFrame > 0 ? Math.min(60, Math.round(1000 / avgFrame)) : 60;

    const fpsEl = this._els.fps, frameEl = this._els.frame;
    set(fpsEl, fps);
    // 不再用 Math.min(60, ...) 蓋掉真實掉幀：低於 60 就照實顯示
    const fpsClass = fps < 30 ? 'bad' : fps < 50 ? 'warn' : '';
    if (fpsEl && fpsEl.className !== fpsClass) fpsEl.className = fpsClass;

    set(frameEl, avgFrame.toFixed(1) + ' ms');
    const frameClass = avgFrame > 20 ? 'bad' : avgFrame > 12 ? 'warn' : '';
    if (frameEl && frameEl.className !== frameClass) frameEl.className = frameClass;

    set(this._els.enemies, G.enemies.length);
    set(this._els.bullets, bulletsPool.active.length);
    set(this._els.particles, particlesPool.active.length);
    set(this._els.collisions, this.collisionChecks);

  },

  toggle() {

// Fisher-Yates 洗牌
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 陣列原地壓縮（移除 !alive 的元素）
function compact(arr, aliveKey = 'alive') {
  let w = 0;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i][aliveKey]) { if (w !== i) arr[w] = arr[i]; w++; }
  }
  arr.length = w;
  return arr;
}

// 距離平方（取代 Math.hypot 進行中）
function distSq(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx * dx + dy * dy;
}

// ==================== 武器管理器 (Weapon Manager) ====================
const WeaponManager = {
  fire(tank) {
    if (!tank.isPlayer) {
      // 敵人：維持原本行為（單發、各自冷卻、BOSS 用專用彈速、不觸發震屏/音效/特效）
      if (!tank.alive || tank.bulletTimer > 0) return;
      const hs = tank.size / 2;
      const cx = tank.x + hs;
      const cy = tank.y + hs;
      const b = bulletsPool.acquire();
      b.dir = tank.aimDir;
      b.isPlayer = false;
      b.pierce = false;
      b.x = cx - 3 + DX[tank.aimDir] * (hs + 2);
      b.y = cy - 3 + DY[tank.aimDir] * (hs + 2);
      b.speed = bulletSpeed(tank.type === 'BOSS' ? CONFIG.BULLET.SPEED_BOSS : CONFIG.BULLET.SPEED_ENEMY);
      b.vx = DX[tank.aimDir]; b.vy = DY[tank.aimDir];
      b.power = tank.weapon === 'SPREAD' ? 2 : 1;
      b.hitTanks.length = 0;
      tank.bulletTimer = tank.bulletCooldown;
      return;
    }

    const weaponKey = tank.weapon || 'NORMAL';
    const config = WEAPON_REGISTRY[weaponKey] || WEAPON_REGISTRY.NORMAL;
    
    // 攻速計算
    let cooldownMult = getHeatStacksMultiplier();
    // cooldownMult 是冷卻倍率（越小越快；HEAT 也是用 1/(1+stacks*0.03) 變快）。
    // 舊版寫 *= 2 讓「超頻爆發」期間冷卻加倍＝射速砍半，按下去是懲罰而不是爆發。
    if (fx.has('boost')) cooldownMult *= 0.5;
    const fireRateBonus = G.playerStats.shopFireRateBonus || 0;
    const actualCD = Math.max(2, Math.floor(config.fireRate * cooldownMult * (1 - fireRateBonus)));
    tank.bulletTimer = actualCD;

    // 获取基础伤害
    const basePower = config.power;
    const weaponData = WEAPON_TREE[weaponKey];
    const weaponTreePower = weaponData ? weaponData.basePower : 1.0;
    const damageBonus = tank.isPlayer ? (G.playerStats.weaponDamageBonus || 0) : 0;
    const finalPower = weaponTreePower * basePower + damageBonus;

    // 生成子弹
    for (let i = 0; i < config.count; i++) {
      const angle = config.spread * (i - (config.count - 1) / 2);
      this.spawnBullet(tank, angle, finalPower, config.effect);
    }

    // 触发特殊效果
    if (config.effect === 'BOMBARD') this.triggerBombard();
    if (config.effect === 'SPAWN_TURRET') this.spawnTurret(tank);

    triggerShake(2, 1);
    Sound.shoot();
    if (tank.isPlayer) applyPassiveEffects(null, tank, 'shoot');
  },

  spawnBullet(tank, angle, power, effect) {
    const hs = tank.size / 2;
    const cx = tank.x + hs;
    const cy = tank.y + hs;
    
    const baseDir = tank.aimDir;
    const dx = DX[baseDir], dy = DY[baseDir];
    const cos = Math.cos(angle), sin = Math.sin(angle);
    
    const vx = dx * cos - dy * sin;
    const vy = dx * sin + dy * cos;

    const b = bulletsPool.acquire();
    b.x = cx - 3; b.y = cy - 3;
    b.dir = baseDir;
    b.isPlayer = tank.isPlayer;
    b.freezing = !tank.isPlayer && tank.elitePrefix === 'FREEZING';   // FREEZING 精英的子彈會凍緩玩家
    b.vx = vx; b.vy = vy;
    b.speed = bulletSpeed(tank.isPlayer ? CONFIG.BULLET.SPEED_PLAYER : CONFIG.BULLET.SPEED_ENEMY);
    b.power = power;
    b.pierce = (effect === 'PIERCE' || effect === 'LASER_BEAM' || tank.pierce);
    b.hitTanks.length = 0;
    b.ignoreTiles = (effect === 'LASER_BEAM');
    
    if (effect === 'LASER_BEAM') {
      b.laserLife = 15;
      for (let i = 1; i < 30; i++) {
        const lb = bulletsPool.acquire();
        // 從砲口中心往外排（舊版從坦克左上角起算，整條光束偏離砲管約半個車身）
        lb.x = b.x + i * 15 * DX[baseDir];
        lb.y = b.y + i * 15 * DY[baseDir];
        lb.dir = baseDir;
        lb.isPlayer = true;
        lb.vx = 0; lb.vy = 0;
        lb.speed = 0;
        lb.power = power;
        lb.laserLife = 15;
        lb.ignoreTiles = true;
        lb.hitTanks.length = 0;
      }
    }
  },

  triggerBombard() {
    if (G.frameCount % 180 === 0) {
      for (let i = 0; i < 20; i++) {
        const bx = rnd() * W;
        const by = rnd() * H;
        setTimeout(() => {
          if (G.level === G.level && G.state === STATE.PLAYING) {
            spawnExplosion(bx, by, 'big');
            triggerShake(4, 5);
          }
        }, i * 50);
      }
    }
  },

  spawnTurret(tank) {
    const maxTurrets = 1 + (tank.weaponTier || 0);
    const existingTurrets = G.summonEntities.filter(e => e.type === 'turret').length;
    if (existingTurrets < maxTurrets) {
      G.summonEntities.push({
        type: 'turret',
        x: tank.x,
        y: tank.y,
        life: 300 + (tank.weaponTier || 0) * 100,
        maxLife: 300 + (tank.weaponTier || 0) * 100,
        damage: 1 + (tank.weaponTier || 0),
        cooldown: 0,
        alive: true
      });
    }
  }
};

// ── 狀態機（src/core/state.js）──
// G.state 變成存取器：既有的 `G.state = X`（9 處）不必改寫，但會被白名單檢查與記錄，
// 「從 gameover 直接跳 playing」這類未宣告轉移會留下警告（測試以警告數 0 當閘門）。
const gameState = makeStateMachine({
  initial: STATE.MENU,
  onUnexpected: ({ from, to, reason }) => {
    console.warn(`[tank-battle] ${reason}：${from} → ${to}`);
  },
});
Object.defineProperty(G, 'state', {
  get: () => gameState.get(),
  set: (value) => { gameState.set(value); },
  enumerable: true,
  configurable: true,
});

let activeSkillKey = 'KeyQ';
function refreshActiveSkillKey() {
  const skill = ACTIVE_SKILLS.find((s) => s.id === G.playerStats.activeSkill);
  activeSkillKey = (skill && skill.key) || 'KeyQ';
}


// ==================== 升級卡系統（分支流派） ====================
// 每局提供 3 張升級卡：武器路線進化、被動技能、主動技能

function upgradeCard(type, data, titlePrefix = '') {
  return {
    type,
    id: data.id,
    title: `${titlePrefix}${data.name}`,
    desc: data.desc,
    icon: data.icon,
    color: data.color,
  };
}

// ==================== 升級卡系統（簡化：武器進化「一定」出現） ====================
// 規則只有兩條：
//   1. 還沒選流派 → 一次給 4 張流派卡（就這一次，不跟其他卡混著抽）
//   2. 之後每 3 關 → 第 1 張固定是「下一階武器」，另外 2 張從被動／主動／通用裡抽
//
// 舊版是把武器卡和其他卡一起洗牌後取 3 張 ——「升級畫面裡沒有武器卡」是常態，
// 玩家看得到一堆被動技能卻不知道自己的武器要怎麼長大。這是「武器系統很複雜」的主因：
// 不是武器太多，而是**成長路徑是隨機的**。
function generateUpgradeOptions() {
  const ps = G.playerStats;
  const weapon = ps.weapon || 'NORMAL';
  const current = WEAPON_TREE[weapon];

  // 1. 第一次升級：直接讓玩家選流派（四條路線各一張，選完就固定了）
  if (!ps.route && weapon === 'NORMAL') {
    return STARTER_WEAPONS
      .filter((id) => WEAPON_TREE[id])
      .map((id) => upgradeCard('starter', WEAPON_TREE[id]));
  }

  const options = [];

  // 2. 武器進化：固定第一張（不用抽，抽不到是設計缺陷）
  if (current && current.next && WEAPON_TREE[current.next]) {
    const next = WEAPON_TREE[current.next];
    options.push(upgradeCard('weapon', next, `[${next.route} 路線] `));
  }

  // 3. 補到 3 張：被動技能（沒拿過的）＋ 主動技能（還沒有才給）＋ 通用升級
  const extras = [];
  const passives = shuffle(PASSIVE_SKILLS.filter((p) => !ps.passives.includes(p.id)));
  for (const p of passives.slice(0, 2)) {
    extras.push({ type: 'passive', id: p.id, title: p.name, desc: p.desc, icon: p.icon, color: p.color });
  }
  if (!ps.activeSkill && ACTIVE_SKILLS.length > 0) {
    const a = ACTIVE_SKILLS[(rnd() * ACTIVE_SKILLS.length) | 0];
    extras.push({ type: 'active', id: a.id, title: a.name, desc: `${a.desc} [${a.key}]`, icon: a.icon, color: '#ffd700' });
  }
  const general = [
    { id: 'SPEED', title: '引擎增壓', desc: '移動速度 +20%', icon: '⚡', color: '#44ff44' },
    { id: 'HEAL', title: '裝甲修復', desc: '最大生命 +1', icon: '💚', color: '#ff44ff' },
    { id: 'PIERCE', title: '穿甲彈頭', desc: '子彈可貫穿', icon: '🎯', color: '#ffaa00' },
  ];
  shuffle(general);
  extras.push(general[0]);

  // 打亂補位卡，但武器卡永遠留在第一張（玩家一眼就知道「這次能進化」）
  shuffle(extras);
  for (const e of extras) {
    if (options.length >= 3) break;
    options.push(e);
  }
  return options;
}

function showUpgradeScreen() {
  // 畫面在 src/ui/screens.js；選卡後的規則留在遊戲層（applyUpgrade）
  screens.renderUpgrade(generateUpgradeOptions(), (opt) => applyUpgrade(opt));
}

function applyUpgrade(opt) {
  const ps = G.playerStats;

  if (opt.type === 'weapon' || opt.type === 'starter') {
    if (opt.id === 'RANDOM') {
      // 隨機派系
      const starters = ['RAPID', 'SPREAD', 'PLASMA', 'SUMMON'];
      const chosen = starters[(rnd() * starters.length) | 0];
      ps.weapon = chosen;
      const wp = WEAPON_TREE[chosen];
      if (wp) {
        ps.route = wp.route;
        ps.weaponTier = wp.tier;
      }
      ps.weaponDamageBonus = (ps.weaponDamageBonus || 0) + 0.1;
    } else {
      ps.weapon = opt.id;
      const wp = WEAPON_TREE[opt.id];
      if (wp) {
        ps.route = wp.route;
        ps.weaponTier = wp.tier;
      }
    }
  }

  if (opt.type === 'passive') {
    ps.passives.push(opt.id);
  }

  if (opt.type === 'active') {
    ps.activeSkill = opt.id;
    const skillData = ACTIVE_SKILLS.find(s => s.id === opt.id);
    refreshActiveSkillKey();
    fx.set('skill', skillData ? skillData.cooldown : 0);
  }

  if (opt.id === 'SPEED') ps.speedMult *= 1.2;
  if (opt.id === 'HEAL') { ps.maxHp++; ps.hp = ps.maxHp; }
  if (opt.id === 'PIERCE') ps.pierce = true;
  if (opt.id === 'SHIELD') fx.set('invul', 30); // 抵擋一次

  document.getElementById('upgradeUI').classList.add('hidden');
  G.level++;
  startLevel();
}

// ==================== 被動技能效果系統 ====================
function applyPassiveEffects(target, source, effectType) {
  const ps = G.playerStats;
  // 回傳值從來沒有被任何呼叫端使用（兩個呼叫點都丟棄），各 case 的效果直接作用在狀態上。
  // 保留 triggered 會變成「寫了卻沒有讀取」的死欄位（見 verify-core 的 Y 組掃描）。
  const effect = { damageMult: 1 };

  for (const passiveId of ps.passives) {
    const passive = PASSIVE_SKILLS.find(p => p.id === passiveId);
    if (!passive) continue;

    switch (passiveId) {
      case 'HEAT':
        if (effectType === 'shoot') {
          ps.heatStacks = Math.min(ps.heatStacks + 1, 20);
        }
        break;
      case 'RAGE':
        if (effectType === 'damage_dealt' && source) {
          effect.damageMult *= source.hp < source.maxHp * 0.5 ? 2 : (source.hp < source.maxHp * 0.75 ? 1.5 : 1);
        }
        break;
      case 'WEAKEN':
        if (effectType === 'boss_damage' && target && target.type === 'BOSS') {
          effect.damageMult *= 1.5;
        }
        break;
      case 'CHAIN':
        if (effectType === 'bullet_hit' && target) {
          spawnChainBullet(source.x, source.y, target);
        }
        break;
      case 'OVERCHARGE':
        if (effectType === 'laser_kill' && target) {
          chainLightning(target.x, target.y, target);
        }
        break;
    }
  }
  return effect;
}

function getHeatStacksMultiplier() {
  return 1 / (1 + G.playerStats.heatStacks * 0.03);
}

function applyPassiveTick() {
  const ps = G.playerStats;
  if (ps.passives.includes('HEAT') && ps.heatStacks > 0) {
    ps.heatStacks = Math.max(0, ps.heatStacks - 0.5);
  }
  // 被動技能：再生（每秒回血）
  if (ps.passives.includes('REGEN')) {
    ps.hp = Math.min(ps.maxHp, ps.hp + 0.02);
  }
  // 被動技能：核融合引擎（移動時對周圍敵人造成持續灼燒傷害）
  if (ps.passives.includes('NUCLEAR') && G.player && G.player.alive && G.player.moving) {
    const nucRangeSq = (TILE * 2) ** 2;
    for (const e of G.enemies) {
      if (e.alive && distSq(e, G.player) < nucRangeSq) {
        e.hp -= 0.05;
        if (e.hp <= 0) {
          e.alive = false;
          spawnExplosion(e.x + e.size/2, e.y + e.size/2, e.type === 'BOSS' ? 'big' : 'tank');
          Sound.explode();
          if (G.aliveEnemies > 0) G.aliveEnemies--;
          progress.recordKill(tankArtKey(e));
          const pts = e.type === 'BOSS' ? 1000 : 100;
          G.score += pts;
          addScorePopup(e.x, e.y, `+${pts}`);
        }
      }
    }
  }
}

// ==================== 主動技能觸發 ====================
function triggerActiveSkill() {
  const ps = G.playerStats;
  if (!ps.activeSkill || fx.has('skill')) return;

  const skillData = ACTIVE_SKILLS.find(s => s.id === ps.activeSkill);
  if (!skillData) return;

  switch (ps.activeSkill) {
    case 'EMP':
      empPulse();
      break;
    case 'DASH':
      dashPlayer();
      break;
    case 'STRIKE':
      callAirStrike();
      break;
    case 'SLOW':
      slowField();
      break;
    case 'DECOY':
      spawnDecoy();
      break;
    case 'BOOST':
      boostMode();
      break;
  }

  refreshActiveSkillKey();
  fx.set('skill', skillData.cooldown);
  triggerShake(5, 3);
  Sound.pulse(600, 0.15, 0.4, 'square');
}

function empPulse() {
  const ba = bulletsPool.active;
  for (let i = 0; i < ba.length; i++) {
    if (!ba[i].isPlayer && ba[i].alive) {
      spawnExplosion(ba[i].x, ba[i].y, 'spark');
      ba[i].alive = false;
    }
  }
}

function dashPlayer() {
  if (!G.player || !G.player.alive) return;
  const dir = G.player.aimDir;
  const nx = G.player.x + DX[dir] * 100;
  const ny = G.player.y + DY[dir] * 100;
  G.player.x = Math.max(0, Math.min(W - TILE, nx));
  G.player.y = Math.max(0, Math.min(H - TILE, ny));
  fx.set('invul', 10);
  spawnExplosion(G.player.x, G.player.y, 'shield');
}

function callAirStrike() {
  const currentLevel = G.level;
  for (let i = 0; i < 12; i++) {
    const x = rnd() * W;
    const y = rnd() * H;
    setTimeout(() => {
      if (G.level !== currentLevel || G.state !== STATE.PLAYING) return;
      spawnExplosion(x, y, 'big');
      triggerShake(3, 4);
      Sound.bigExplode();
      for (let j = 0; j < G.enemies.length; j++) {
        const e = G.enemies[j];
        if (e && e.alive) {
          const dx = e.x - x, dy = e.y - y;
          const dist = Math.hypot(dx, dy);
          if (dist < 40) {
            e.hp -= 3;
            addScorePopup(e.x, e.y, '-3');
            if (e.hp <= 0) { 
              e.alive = false; 
              G.score += e.type === 'BOSS' ? 500 : 50; 
              if (G.aliveEnemies > 0) G.aliveEnemies--;
              progress.recordKill(tankArtKey(e));
            }
          }
        }
      }
    }, i * 100);
  }
}

function slowField() {
  for (let i = 0; i < G.enemies.length; i++) {
    G.enemies[i].slowTimer = 120;
  }
}

function spawnDecoy() {
  if (!G.player) return;
  G.summonEntities.push({
    type: 'decoy', x: G.player.x, y: G.player.y,
    life: 180, maxLife: 180, alive: true
  });
}

function boostMode() {
  // 效果統一由 fx('boost') 在 shoot() 的冷卻計算裡實現（見 index.html 的 cooldownMult）。
  // 舊版另外寫了一個 rapidFire 旗標，但全檔沒有任何地方讀它（純死寫入）。
  fx.set('boost', 180);
}

function activatePowerUp(type) {
  const pu = POWER_UPS[type];
  if (!pu) return;
  Sound.pulse(440, 0.05, 0.2, 'square');

  switch (type) {
    case 'BOMB':
      for (let i = 0; i < G.enemies.length; i++) {
        const e = G.enemies[i];
        if (e && e.alive) {
          e.hp = 0;
          e.alive = false;
          spawnExplosion(e.x + e.size/2, e.y + e.size/2, 'big');
          G.score += e.type === 'BOSS' ? 500 : 50;
          if (G.aliveEnemies > 0) G.aliveEnemies--;
          progress.recordKill(tankArtKey(e));
          addCombo(true);
        }
      }
      triggerShake(15, 8);
      Sound.bigExplode();
      break;
    case 'WALL':
      fx.set('wall', 900);
      break;
    case 'STAR': {
      const currentWp = WEAPON_TREE[G.playerStats.weapon];
      if (!currentWp) {
        // NORMAL 武器不在 WEAPON_TREE，給傷害加成代替
        G.playerStats.weaponDamageBonus = (G.playerStats.weaponDamageBonus || 0) + 0.2;
        addScorePopup(G.player.x, G.player.y - 30, '火力 +20%', '#ffd700');
      } else if (currentWp.next) {
        const nextWp = WEAPON_TREE[currentWp.next];
        G.playerStats.weapon = nextWp.id;
        G.playerStats.weaponTier = nextWp.tier;
        G.playerStats.route = nextWp.route;
        G.player.applyTypeStats();
        addScorePopup(G.player.x, G.player.y - 30, nextWp.name, '#ffd700');
      } else {
        addScorePopup(G.player.x, G.player.y - 30, '已達最大等級!', '#ff4444');
      }
      break;
    }
    case 'TIME':
      fx.set('freeze', 600);
      break;
    case 'SHIELD':
      fx.set('invul', 600);
      break;
    case 'ONEUP':
      G.continues++;
      break;
    default:
      if (pu.weaponType) {
        applyLevelWeapon(pu.weaponType);
      }
      break;
  }
}

function applyLevelWeapon(weaponType) {
  const stackKey = weaponType;
  if (!G.levelWeaponStacks[stackKey]) {
    G.levelWeaponStacks[stackKey] = 0;
  }

  const weaponData = WEAPON_TREE[weaponType];
  if (!weaponData) return;

  const currentRoute = G.playerStats.route;
  const isSameRoute = currentRoute && currentRoute === weaponData.route;
  const isFirstWeapon = !currentRoute;

  if (isFirstWeapon) {
    // 第一次獲得武器，設定武器和路線
    G.playerStats.weapon = weaponType;
    G.playerStats.weaponTier = weaponData.tier;
    G.playerStats.route = weaponData.route;
    G.levelWeaponStacks[stackKey]++;
    if (G.player) G.player.applyTypeStats();
    addScorePopup(G.player.x, G.player.y - 20, weaponData.name);
  } else if (isSameRoute) {
    // 同路線：可以進化或疊加
    G.levelWeaponStacks[stackKey]++;

    if (G.levelClearedCount >= CONFIG.GAMEPLAY.UPGRADE_INTERVAL) {
      // 已通關足夠關卡：疊加傷害+20%
      G.playerStats.weaponDamageBonus = (G.playerStats.weaponDamageBonus || 0) + 0.2;
      addScorePopup(G.player.x, G.player.y - 20, `疊加 +20%`);
    } else {
      // 尚未通關足夠關卡：不疊加，只顯示提示
      addScorePopup(G.player.x, G.player.y - 20, weaponData.name);
    }
  } else {
    // 不同路線：不更換武器，只加少量傷害
    G.playerStats.weaponDamageBonus = (G.playerStats.weaponDamageBonus || 0) + 0.1;
    addScorePopup(G.player.x, G.player.y - 20, `+10%`);
  }
}

// ==================== 武器射擊系統（擴展） ====================
function spawnBullet(x, y, dir, isPlayer, pierce = false, power = 1) {
  const b = bulletsPool.acquire();
  b.x = x - 3; b.y = y - 3;
  b.dir = dir;
  b.isPlayer = isPlayer;
  b.pierce = pierce;
  let finalPower = power;
  if (isPlayer && G.playerStats.weaponDamageBonus) {
    finalPower = power + G.playerStats.weaponDamageBonus;
  }
  b.power = finalPower;
  b.vx = DX[dir];
  b.vy = DY[dir];
  b.speed = bulletSpeed(isPlayer ? CONFIG.BULLET.SPEED_PLAYER : CONFIG.BULLET.SPEED_ENEMY);
  b.hitTanks.length = 0;
}

function spawnChainBullet(x, y, target) {
  let nearest = null;
  let minDist = 80;
  for (const e of G.enemies) {
    if (e.alive && e !== target) {
      const d = Math.hypot(e.x - x, e.y - y);
      if (d < minDist) { minDist = d; nearest = e; }
    }
  }
  if (nearest) {
    const b = bulletsPool.acquire();
    b.x = target.x; b.y = target.y;
    b.dir = DOWN;
    const dx = nearest.x - target.x;
    const dy = nearest.y - target.y;
    const len = Math.hypot(dx, dy) || 1;
    b.vx = dx / len; b.vy = dy / len;
    b.speed = 8;
    b.isPlayer = true;
    const basePower = WEAPON_TREE[G.playerStats.weapon]?.basePower || 1;
    const powerBonus = G.playerStats.weaponDamageBonus || 0;
    b.power = 0.5 * basePower + powerBonus;
    b.hitTanks.length = 0;
  }
}

// OVERCHARGE 連鎖電擊：雷射擊殺後觸發
function chainLightning(x, y, source) {
  for (let i = 0; i < 3; i++) {
    let nearest = null;
    let minDist = 120;
    const exclude = source ? [source] : [];
    for (const e of G.enemies) {
      if (e.alive && !exclude.includes(e) && e !== source) {
        const d = Math.hypot(e.x - x, e.y - y);
        if (d < minDist) { minDist = d; nearest = e; }
      }
    }
    if (!nearest) break;
    const b = bulletsPool.acquire();
    b.x = x; b.y = y;
    b.dir = DOWN;
    const dx = nearest.x - x;
    const dy = nearest.y - y;
    const len = Math.hypot(dx, dy) || 1;
    b.vx = dx / len; b.vy = dy / len;
    b.speed = 10;
    b.isPlayer = true;
    b.pierce = false;
    const basePower = WEAPON_TREE[G.playerStats.weapon]?.basePower || 1;
    const powerBonus = G.playerStats.weaponDamageBonus || 0;
    b.power = basePower + powerBonus;
    b.type = 'PLASMA';
    b.hitTanks.length = 0;
    spawnExplosion(x, y, 'spark');
    x = nearest.x; y = nearest.y; source = nearest;
  }
}

// ==================== 物件池 ====================
class Pool {
  constructor(factory, reset, initial, maxSize) {
    this._factory = factory; this._reset = reset;
    this._pool = []; this.active = [];
    this._maxSize = maxSize || initial * 3;
    this._peakActive = 0;
    for (let i = 0; i < initial; i++) this._pool.push(factory());
  }
  acquire() {
    const obj = this._pool.length > 0 ? this._pool.pop() : this._factory();
    this._reset(obj); 
    this.active.push(obj);
    if (this.active.length > this._peakActive) this._peakActive = this.active.length;
    return obj;
  }
  release(obj) { 
    if (this._pool.length < this._maxSize) this._pool.push(obj); 
  }
  sweep() {
    let writeIdx = 0;
    for (let i = 0; i < this.active.length; i++) {
      if (this.active[i].alive) {
        if (writeIdx !== i) this.active[writeIdx] = this.active[i];
        writeIdx++;
      } else {
        this.release(this.active[i]);
      }
    }
    this.active.length = writeIdx;
  }
  clear() { 
    for (const obj of this.active) this.release(obj); 
    this.active.length = 0; 
  }
}

const particlesPool = new Pool(
  () => ({ type:'', x:0, y:0, vx:0, vy:0, life:0, maxLife:0, size:0, color:'#fff', alive:false }),
  (p) => { p.alive = true; }, 
  CONFIG.PARTICLE.POOL_SIZE
);

const bulletsPool = new Pool(
  () => ({ x:0, y:0, dir:0, vx:0, vy:0, isPlayer:false, speed:0, size:CONFIG.BULLET.SIZE, alive:false, power:1, pierce:false, hitTanks:[], ignoreTiles:false, _isChild:false, laserLife:0, freezing:false, shell:false, fuse:0, shellBoss:null }),
  (b) => { 
    b.alive = true; 
    b.size = CONFIG.BULLET.SIZE; 
    b.pierce = false; 
    b.hitTanks.length = 0;
    b.ignoreTiles = false;
    b._isChild = false;
    b.laserLife = 0;
    b.freezing = false;
    b.shell = false;          // 攻城核心的砲彈：命中地形／引信到期都會爆炸
    b.fuse = 0;
    b.shellBoss = null;
  }, 
  CONFIG.POOL.BULLET_INITIAL,
  CONFIG.POOL.BULLET_MAX
);

// ==================== 空間分割網格 ====================
class SpatialGrid {
  constructor(w, h, cellSize) {
    this.cellSize = cellSize;
    this.cols = Math.ceil(w / cellSize);
    this.rows = Math.ceil(h / cellSize);
    this.cells = [];
    for (let i = 0; i < this.cols * this.rows; i++) this.cells.push([]);
  }
  
  _idx(cx, cy) { return cy * this.cols + cx; }
  
  clear() {
    for (let i = 0; i < this.cells.length; i++) this.cells[i].length = 0;
  }
  
  insert(entity) {
    if (!entity.alive) return;
    const cx = (entity.x / this.cellSize) | 0;
    const cy = (entity.y / this.cellSize) | 0;
    if (cx >= 0 && cx < this.cols && cy >= 0 && cy < this.rows) {
      this.cells[this._idx(cx, cy)].push(entity);
    }
  }
  
  queryRect(x, y, w, h, out) {
    out.length = 0;
    const cx1 = Math.max(0, (x / this.cellSize) | 0);
    const cy1 = Math.max(0, (y / this.cellSize) | 0);
    const cx2 = Math.min(this.cols - 1, ((x + w) / this.cellSize) | 0);
    const cy2 = Math.min(this.rows - 1, ((y + h) / this.cellSize) | 0);
    
    for (let cy = cy1; cy <= cy2; cy++) {
      for (let cx = cx1; cx <= cx2; cx++) {
        const cell = this.cells[this._idx(cx, cy)];
        for (let i = 0; i < cell.length; i++) out.push(cell[i]);
      }
    }
    return out;
  }
}

const spatialGrid = new SpatialGrid(W, H, CONFIG.GRID.CELL_SIZE);
const _queryBuf = [];

// ==================== 地圖生成 ====================
function generateMap(level) {
  const map = Array.from({length: ROWS}, () => new Uint8Array(COLS));
  const baseR = ROWS - 1, baseC = (COLS / 2) | 0;

  if (G.isVSMode) {
    G.basePos = null;
    G.playerSpawnPos = { x: ((COLS/2)|0)*TILE, y: ((ROWS/2)|0)*TILE };
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) map[r][c] = STEEL;
        else if (rnd() < 0.03) map[r][c] = FOREST;
      }
    }
    return map;
  }

  G.basePos = { r: baseR, c: baseC };
  G.playerSpawnPos = { x: (baseC - 3) * TILE, y: (ROWS - 1) * TILE };
  map[baseR][baseC] = BASE;
  [[-1,-1],[-1,0],[-1,1],[0,-1],[0,1]].forEach(([dr,dc]) => map[baseR+dr][baseC+dc] = BRICK);

  const density = Math.min(0.45, 0.22 + level * 0.012);
  const steelRatio = Math.min(0.35, 0.06 + level * 0.015);
  for (let r = 2; r < ROWS - 2; r++) {
    for (let c = 1; c < COLS - 1; c++) {
      if (r >= ROWS - 4 && c >= baseC - 3 && c <= baseC + 3) continue;
      const roll = rnd();      // 不可命名為 rnd：會蓋掉全域產生器並自我引用（TDZ）
      if (roll < density * 0.55) map[r][c] = BRICK;
      else if (roll < density * (0.55 + steelRatio)) map[r][c] = STEEL;
      else if (roll < density * (0.55 + steelRatio + 0.04)) map[r][c] = WATER;
      else if (roll < density * (0.55 + steelRatio + 0.08)) map[r][c] = FOREST;
    }
  }
  return map;
}







// 離屏快取：基地老鷹是固定圖樣，舊版卻在 render() 每幀逐像素重畫
// （實測 ALIVE 有 127 個非零像素 → 每幀 127 次 fillStyle + 127 次 fillRect = 254 次 canvas API，
//   只為了畫一格 26×26 的圖磚；而且這條路徑在遊戲進行中是無條件執行的）。

// 背景底色（含 NIGHT 事件的底色）由 cacheStaticMap 烘進 staticCanvas，
// render() 就不必每幀再做一次全螢幕填色（實測：1040×1040 的一次全螢幕 fillRect ≈ 0.32 ms）。
const BG_BASE = '#050508';
const BG_NIGHT = 'rgba(0,0,30,0.5)';

function isNightLayerActive() {
  return mapEventState.active && mapEventState.type === 'NIGHT';
}

/** 背景底色。cacheStaticMap／breakTile 共用同一份畫法，像素才會完全一致（含 NIGHT 的半透明疊色）。 */
// 地圖背景每關輪替：第 1 關是原本的戰場，之後輪流用 gaga-survivor 的 16 張地面。
// 亮度在 tools/wh40k-process.py 已壓到同一水準（亮的雪地／沙漠不會蓋過地形與坦克）。
const GROUNDS = ['tile_ground', 'ground_core', 'ground_storm', 'ground_swamp', 'ground_lab', 'ground_foundry',
  'ground_frost', 'ground_street', 'ground_makaimura', 'ground_voidroad', 'ground_subway', 'ground_inkmount',
  'ground_td_redalert', 'ground_td_starcraft', 'ground_td_warcraft', 'ground_frostvoid', 'ground_endless'];
const _groundPatterns = new Map();
function groundPattern(c) {
  const name = GROUNDS[(Math.max(1, G.level | 0) - 1) % GROUNDS.length];
  const img = art(name) || art('tile_ground');
  if (!img) return null;
  let pat = _groundPatterns.get(img);
  if (!pat) {
    pat = c.createPattern(img, 'repeat');
    // 原本的戰場紋理細節小、4 格一循環；gaga 的地面是大場景，10 格一循環才不會擠成一團
    const k = TILE * (img === art('tile_ground') ? 4 : 10) / img.width;
    pat.setTransform({ a: k, b: 0, c: 0, d: k, e: 0, f: 0 });
    _groundPatterns.set(img, pat);
  }
  return pat;
}
function paintBackground(c, x, y, w, h) {
  c.fillStyle = groundPattern(c) || BG_BASE;
  c.fillRect(x, y, w, h);
  if (isNightLayerActive()) {
    c.fillStyle = BG_NIGHT;
    c.fillRect(x, y, w, h);
  }
}

// NIGHT 何時開始／結束會改變「烘進 staticCanvas 的底色」，所以只有那兩個時刻需要重建，
// 不是每次地圖事件都重建（重建一次要重畫 400 格）。
let _staticNightBaked = false;

function cacheStaticMap() {
  staticCtx.clearRect(0, 0, W, H);
  forestCtx.clearRect(0, 0, W, H);
  paintBackground(staticCtx, 0, 0, W, H);   // 黑底烘進去：地形之外的空地不必每幀再填一次
  G.dynamicTiles = [];
  G.forestTiles = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = G.map[r][c], x = c*TILE, y = r*TILE;
      if (t === BRICK) drawBrickNES(staticCtx, x, y, TILE);
      else if (t === STEEL) drawSteelNES(staticCtx, x, y, TILE);
      else if (t === FOREST) {
        drawForestNES(forestCtx, x, y, TILE);
        G.forestTiles.push({ x, y });        // 只貼有樹的格子，不再每幀貼一張全螢幕
      } else if (t === WATER || t === BASE) {
        G.dynamicTiles.push({ type: t, x, y, r, c });
      }
    }
  }
  _staticNightBaked = isNightLayerActive();
}

function refreshStaticBackgroundIfNeeded() {
  if (!G.map || G.map.length !== ROWS) return;   // 地圖還沒生成（boot 階段的地圖是空的）
  if (_staticNightBaked !== isNightLayerActive()) cacheStaticMap();
}

function breakTile(c, r) { 
  G.map[r][c] = EMPTY; 
  paintBackground(staticCtx, c*TILE, r*TILE, TILE, TILE);   // 不能 clearRect：staticCanvas 現在是不透明的背景層
}

// ==================== 共用工具 ====================
function rectsOverlap(x1,y1,w1,h1, x2,y2,w2,h2) { 
  return x1<x2+w2 && x1+w1>x2 && y1<y2+h2 && y1+h1>y2; 
}

function clampPos(v) { 
  return Math.round(v / CONFIG.GAMEPLAY.POSITION_PRECISION) * CONFIG.GAMEPLAY.POSITION_PRECISION; 
}

function triggerShake(f, i) { G.shakeTimer = f; G.shakeIntensity = i; }

function addScorePopup(x, y, text) { 
  G.scorePopups.push({ x, y, text, life: 40, vy: -1 }); 
}

function checkTileCollision(x, y, size) {
  const c1 = (x/TILE)|0, r1 = (y/TILE)|0;
  const c2 = ((x+size-1)/TILE)|0, r2 = ((y+size-1)/TILE)|0;
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        const t = G.map[r][c];
        if (t === BRICK || t === STEEL || t === WATER || t === BASE || t === BASE_DEAD) return true;
      }
    }
  }
  return false;
}

// ==================== Tank 類別 ====================
class Tank {
  constructor(x, y, dir, type, isPlayer) {
    this.x = clampPos(x); this.y = clampPos(y); 
    this.dir = dir; this.aimDir = dir;
    this.isPlayer = isPlayer; this.type = type; 
    this.size = TILE - 4;
    this.bulletTimer = 0; this.alive = true; this.moving = false;
    this.flashTimer = 0; 
    this.aiChangeTimer = rnd() * 50; 
    this.aiDir = dir;
    this.lastDist = Infinity;
    this.visualIdx = _tankVisualCounter++;
    this.applyTypeStats();
  }

  applyTypeStats() {
    if (this.isPlayer) {
      this.maxHp = G.playerStats.maxHp;
      this.hp = G.playerStats.hp;
      // 凍緩（FREEZING 詞綴）係數在這裡套用：換關會建立新的玩家 Tank，
      // 若只在外部的 applyPlayerSpeed() 調整，換關後速度就會被重設而失效。
      this.speed = 2.5 * G.playerStats.speedMult * (fx.has('slow') ? 0.5 : 1);
      this.weapon = G.playerStats.weapon || 'NORMAL';
      this.weaponTier = G.playerStats.weaponTier || 0;
      this.pierce = G.playerStats.pierce;
      this.color = '#4a7a2e';
      const baseCD = G.isVSMode ? CONFIG.BULLET.PLAYER_COOLDOWN_VS : CONFIG.BULLET.PLAYER_COOLDOWN;
      this.bulletCooldown = Math.max(3, Math.floor(baseCD / G.playerStats.speedMult));
    } else {
      this.weapon = 'NORMAL'; this.pierce = false;
      if (this.type === 'FAST') { this.speed = 2.2; this.color = '#d4d'; this.hp = this.maxHp = 1; this.bulletCooldown = CONFIG.BULLET.ENEMY_FAST; }
      else if (this.type === 'HEAVY') { this.speed = 0.8; this.color = '#38a'; this.hp = this.maxHp = 4; this.bulletCooldown = CONFIG.BULLET.ENEMY_HEAVY; }
      else if (this.type === 'SUICIDE') { this.speed = 2.0; this.color = '#f50'; this.hp = this.maxHp = 1; this.bulletCooldown = 999; }
      else if (this.type === 'BOSS') {
        // BOSS 原型（每 5 關輪替）：血量／速度／體型／顏色都從資料表來，
        // 行為（ARTILLERY／CHARGE／SPAWN）由 updateBossPattern 分派。
        const archId = bossTypeForLevel(G.level, CONFIG.GAMEPLAY.BOSS_LEVEL_INTERVAL);
        const arch = BOSS_TYPES[archId] || BOSS_TYPES.SIEGE;
        this.bossType = arch.id;
        this.speed = 0.6 * arch.speedMult;
        this.color = arch.color;
        this.hp = this.maxHp = Math.round((15 + G.level * 5) * arch.hpMult);
        this.size = TILE * arch.sizeMult; this.weapon = 'SPREAD';
        this.bulletCooldown = CONFIG.BULLET.BOSS;
        this.bossPhase = 1;
        this.bossPhaseTimer = 0;
        this.patternTimer = 0;     // 每個 pattern 自己的節拍器（+1 計數型）
        this.chargeTicks = 0;      // CHARGE：剩餘衝刺 tick（遞減型）
        this.chargeTravel = 0;     // CHARGE：這一輪衝刺累積的位移（決定撞牆是否暈眩）
        this.chargeDir = DOWN;
        this.stunTicks = 0;        // CHARGE：撞牆後硬直（遞減型）
      }
      else {
        this.speed = 1.0 + rnd() * 0.5;
        this.color = '#c33';
        this.hp = this.maxHp = 1;
        this.bulletCooldown = CONFIG.BULLET.ENEMY_NORMAL;
      }
      // 菁英詞綴
      this.elitePrefix = this.elitePrefix || null;
      if (this.elitePrefix && ELITE_PREFIXES[this.elitePrefix]) {
        const prefix = ELITE_PREFIXES[this.elitePrefix];
        this.maxHp = Math.ceil(this.maxHp * 1.5);
        this.hp = this.maxHp;
        this.eliteEffects = prefix;
      }
      // 特殊敵人類型初始化
      this.slowTimer = 0;
      this.shieldHits = this.elitePrefix === 'SHIELDED' ? 3 : 0;
      this.summonTimer = 0;
    }
  }

  update() {
    if (!this.alive) return;
    this.moving = false;
    if (this.bulletTimer > 0) this.bulletTimer--;
    if (this.flashTimer > 0) this.flashTimer--;
  }

  _hasEntityCollision(nx, ny) {
    spatialGrid.queryRect(nx, ny, this.size, this.size, _queryBuf);
    Perf.collisionChecks += _queryBuf.length;
    
    for (let i = 0; i < _queryBuf.length; i++) {
      const o = _queryBuf[i];
      if (o === this || !o.alive) continue;
      if (rectsOverlap(nx, ny, this.size, this.size, o.x, o.y, o.size, o.size)) return true;
    }
    
    if (!this.isPlayer && G.player && G.player.alive) {
      if (rectsOverlap(nx, ny, this.size, this.size, G.player.x, G.player.y, G.player.size, G.player.size)) return true;
    }
    if (this.isPlayer && G.enemies) {
      for (let i = 0; i < G.enemies.length; i++) {
        const e = G.enemies[i];
        if (e && e.alive && rectsOverlap(nx, ny, this.size, this.size, e.x, e.y, e.size, e.size)) return true;
      }
    }
    return false;
  }

  _canMoveTo(nx, ny) {
    if (nx < 1 || nx + this.size > W - 1 || ny < 1 || ny + this.size > H - 1) return false;
    if (checkTileCollision(nx, ny, this.size)) return false;
    return !this._hasEntityCollision(nx, ny);
  }

  move(dir) {
    if (!this.alive) return;
    this.dir = dir; 
    this.moving = true;
    
    if (!this.isPlayer || !G.isVSMode) this.aimDir = dir;

    let nx = clampPos(this.x + DX[dir] * this.speed);
    let ny = clampPos(this.y + DY[dir] * this.speed);

    if (nx < 1 || nx + this.size > W - 1 || ny < 1 || ny + this.size > H - 1) {
      if (this.isPlayer || G.isVSMode) this._trySlide(dir);
      else this.aiChangeTimer = 0;
      return;
    }
    if (checkTileCollision(nx, ny, this.size)) {
      if (this.isPlayer || G.isVSMode) this._trySlide(dir);
      else this.aiChangeTimer = 0;
      return;
    }
    if (this._hasEntityCollision(nx, ny)) {
      if (this.isPlayer || G.isVSMode) this._trySlide(dir);
      else this.aiChangeTimer = 0;
      return;
    }
    
    this.x = nx; this.y = ny;
  }

  _trySlide(dir) {
    const nudges = [2, 3, 4, 6];
    for (const nudge of nudges) {
      for (const sign of [-1, 1]) {
        let tx, ty;
        if (dir === UP || dir === DOWN) {
          tx = clampPos(this.x + sign * nudge);
          ty = clampPos(this.y + DY[dir] * this.speed);
        } else {
          tx = clampPos(this.x + DX[dir] * this.speed);
          ty = clampPos(this.y + sign * nudge);
        }
        if (this._canMoveTo(tx, ty)) { 
          this.x = tx; this.y = ty; 
          return; 
        }
      }
    }
  }

  shoot() {
    if (!this.alive || this.bulletTimer > 0) return;
    WeaponManager.fire(this);
  }

  draw() {
    if (!this.alive) return;

    if (this.isPlayer && this.flashTimer > 30) {
      drawNESShield(this.x, this.y, this.size);
    }

    if (this.flashTimer > 0 && (G.frameCount & 2)) return;

    const s = this.size;
    const x = this.x | 0;
    const y = this.y | 0;
    const trackOffset = (G.frameCount >> 2) & 1;
    // 履帶相位：移動中 0/1 交替；靜止固定用 seg 起點樣式（與原本 (trackOffset && moving) ? 0 : seg 一致）
    const phase = this.moving ? trackOffset : 0;

    // sprite 直接快取在坦克實例上：舊版每幀為每隻坦克組字串 key 再查 Map，
    // 字串串接會產生 rope，而 Map 雜湊必須先把它攤平（每次呼叫都多一次配置）。
    // 18 隻敵人 × 144Hz ≈ 每秒 2600 個短命字串，而組合只有 type × aimDir × phase 約 50 種。
    if (!this._spr || this._sprDir !== this.aimDir || this._sprPhase !== phase || this._sprSize !== s) {
      const key = (this.isPlayer ? 'P' : this.type) + '|' + this.aimDir + '|' + phase + '|' + s;
      let spr = _tankSpriteCache.get(key);
      if (!spr) {
        spr = buildTankSprite(this.isPlayer ? 'PLAYER' : this.type, this.aimDir, phase, s);
        _tankSpriteCache.set(key, spr);
      }
      this._spr = spr; this._sprDir = this.aimDir; this._sprPhase = phase; this._sprSize = s;
    }
    const artImg = tankArt(this);
    if (artImg) drawRotated(ctx, artImg, x + s / 2, y + s / 2, s * 1.2, s * 1.2, isUprightArt(this) ? 0 : this.aimDir * Math.PI / 2);
    else ctx.drawImage(this._spr, x, y);

    // 帶道具的敵人發光：glowTimer 原本只被寫入、沒有任何讀取端 → 玩家看不出哪隻會掉寶
    if (this.glowTimer > 0) {
      this.glowTimer--;
      const R = this.size * 1.8;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.25 + Math.sin(G.frameCount * 0.2) * 0.1;
      ctx.drawImage(glowCanvas('#ffd700'), x + this.size / 2 - R / 2, y + this.size / 2 - R / 2, R, R);
      ctx.restore();
    }

    if (this.elitePrefix && this.eliteEffects) {
      const eff = this.eliteEffects;
      ctx.fillStyle = eff.color;
      ctx.globalAlpha = 0.3 + Math.sin(G.frameCount * 0.1) * 0.2;
      ctx.fillRect(x - 1, y - 1, s + 2, s + 2);
      ctx.globalAlpha = 1;

      ctx.fillStyle = eff.color;
      ctx.font = '8px Arial';
      ctx.fillText(eff.icon, x + 2, y - 3);
    }

    // BOSS 原型標記：外框顏色 = 原型色、上方標原型圖示。
    // 舊版每隻王都長得一樣（同一個紅色大坦克），玩家分不出「這隻會炮擊還是會衝撞」。
    if (this.bossType && BOSS_TYPES[this.bossType]) {
      const arch = BOSS_TYPES[this.bossType];
      ctx.strokeStyle = arch.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 2, y - 2, s + 4, s + 4);
      ctx.font = '10px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(arch.icon, x + s / 2, y - 8);
      ctx.textAlign = 'left';          // textAlign 不能洩漏（C7 守著這條）
      // 蓄力警示：衝撞前的紅色擴散圈（衝刺中不畫，避免蓋住坦克）
      if (arch.pattern === 'CHARGE' && this.chargeTicks === 0 && this.stunTicks === 0) {
        const windup = Math.min(1, (this.patternTimer || 0) / Math.max(1, arch.chargeWindup));
        ctx.globalAlpha = 0.25 + windup * 0.45;
        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x + s / 2, y + s / 2, s * (0.9 - windup * 0.35), 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    if (this.maxHp > 1) {
      ctx.fillStyle = '#000';
      ctx.fillRect(x, y - 6, s, 3);
      ctx.fillStyle = this.isPlayer ? '#3cf03c' : '#ff4040';
      ctx.fillRect(x, y - 6, (s * (this.hp / this.maxHp)) | 0, 3);
    }
  }
}

// ==================== 坦克 Sprite 離屏快取 ====================
// 本體（履帶/車身/砲塔/砲管/BOSS 標記）靜態預渲染，僅按 型別|方向|相位|尺寸 快取。
// 動態層（elite 特效、HP bar、護盾、受擊閃爍）仍每幀繪製，保持原有視覺。
const _tankSpriteCache = new Map();

// 敵方勢力（純外觀）：每關一個勢力輪替，四種角色（一般／快速／重裝／自爆）各有自己的造型。
// 用關卡決定而不是亂數 → 不動到模擬用的 rnd()，replay checksum 不受影響。
const ENEMY_FACTIONS = ['chaos', 'ork', 'aeldari', 'tyranid', 'necron'];
// gaga-survivor 的角色：特殊敵人各一個；部分勢力的一般敵人每 3 隻有 1 隻是步兵（純外觀）
const SPECIAL_ART = { SNIPER: 'gaga_sniper', ENGINEER: 'gaga_engineer', INTERFERER: 'gaga_interferer', GUARD: 'gaga_guard', MINELAYER: 'gaga_minelayer' };
const FACTION_INFANTRY = { chaos: ['gaga_poxwalker'], ork: ['gaga_ork_boy'], tyranid: ['gaga_genestealer', 'gaga_hormagaunt', 'gaga_termagant'] };
let _tankVisualCounter = 0;   // 只給外觀用（輪流挑步兵造型），不進 checksum、不用 rnd()
/** gaga 的角色是直立的側視圖：不跟著方向旋轉（轉 180° 會倒立）。 */
function isUprightArt(t) {
  return !t.isPlayer && (!!SPECIAL_ART[t.type] || (t.type === 'NORMAL' && t.visualIdx % 3 === 2 && !!FACTION_INFANTRY[enemyFaction()]));
}
function enemyFaction() {
  // 輪替跳過 BOSS 關：5 個勢力 × 每 5 關一王，不跳的話某個勢力永遠只出現在 BOSS／VS 關
  const lvl = Math.max(1, G.level | 0);
  const n = lvl - Math.floor(lvl / CONFIG.GAMEPLAY.BOSS_LEVEL_INTERVAL);
  return ENEMY_FACTIONS[(n - 1) % ENEMY_FACTIONS.length];
}
/** 這輛坦克畫哪張素材（也是圖鑑 id：擊殺時用它計數）。 */
function tankArtKey(t) {
  if (t.isPlayer) return progress.skin();
  if (t.type === 'BOSS') return 'boss_' + String(t.bossType || 'SIEGE').toLowerCase();
  if (SPECIAL_ART[t.type]) return SPECIAL_ART[t.type];
  const faction = enemyFaction();
  if (isUprightArt(t)) {
    const list = FACTION_INFANTRY[faction];
    return list[((t.visualIdx / 3) | 0) % list.length];
  }
  const role = (t.type === 'FAST' || t.type === 'HEAVY' || t.type === 'SUICIDE') ? t.type.toLowerCase() : 'normal';
  return (faction + '_' + role) in WH40K_ART_DATA ? faction + '_' + role : 'tank_' + role;   // 該勢力缺圖就用通用造型
}
function tankArt(t) {
  return art(tankArtKey(t)) || (t.isPlayer ? art('tank_player') : art('tank_normal'));
}

function buildTankSprite(type, aimDir, phase, s) {
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(s) + 1;
  cv.height = Math.ceil(s) + 1;
  const c2 = cv.getContext('2d');

  let colMain, colDark, colLight;
  if (type === 'PLAYER') {
    colMain = '#d4a72c';  colLight = '#fce560';  colDark = '#7a5a14';
  } else if (type === 'FAST') {
    colMain = '#dcdce8';  colLight = '#ffffff';  colDark = '#6a6a78';
  } else if (type === 'HEAVY') {
    colMain = '#5a8acc';  colLight = '#9ec0ff';  colDark = '#1c3a6a';
  } else if (type === 'SUICIDE') {
    colMain = '#e84418';  colLight = '#ff8c4a';  colDark = '#7a1a04';
  } else if (type === 'BOSS') {
    colMain = '#a02020';  colLight = '#e84040';  colDark = '#400000';
  } else {
    colMain = '#b8b8b8';  colLight = '#e8e8e8';  colDark = '#4a4a4a';
  }

  const x = 0, y = 0;
  const cx = s / 2;
  const cy = s / 2;
  const isHoriz = (aimDir === LEFT || aimDir === RIGHT);

  const trackW = Math.max(3, (s / 7) | 0);
  const seg = Math.max(2, (s / 6) | 0);
  const trackOffset = phase === 0 ? 0 : 1;

  c2.fillStyle = colDark;
  if (isHoriz) {
    c2.fillRect(x, y, s, trackW);
    c2.fillRect(x, y + s - trackW, s, trackW);
    c2.fillStyle = colMain;
    for (let i = trackOffset ? 0 : seg; i < s; i += seg * 2) {
      c2.fillRect(x + i, y, seg, trackW);
      c2.fillRect(x + i, y + s - trackW, seg, trackW);
    }
  } else {
    c2.fillRect(x, y, trackW, s);
    c2.fillRect(x + s - trackW, y, trackW, s);
    c2.fillStyle = colMain;
    for (let i = trackOffset ? 0 : seg; i < s; i += seg * 2) {
      c2.fillRect(x, y + i, trackW, seg);
      c2.fillRect(x + s - trackW, y + i, trackW, seg);
    }
  }

  const bodyPad = trackW + 1;
  c2.fillStyle = colMain;
  c2.fillRect(x + bodyPad, y + bodyPad, s - bodyPad * 2, s - bodyPad * 2);

  c2.fillStyle = colLight;
  if (isHoriz) {
    c2.fillRect(x + bodyPad, y + bodyPad, s - bodyPad * 2, 1);
  } else {
    c2.fillRect(x + bodyPad, y + bodyPad, 1, s - bodyPad * 2);
  }

  const turretSize = Math.max(6, (s * 0.45) | 0);
  const tx = (cx - turretSize / 2) | 0;
  const ty = (cy - turretSize / 2) | 0;
  c2.fillStyle = colMain;
  c2.fillRect(tx, ty, turretSize, turretSize);
  c2.fillStyle = colLight;
  c2.fillRect(tx, ty, turretSize, 1);
  c2.fillRect(tx, ty, 1, turretSize);
  c2.fillStyle = colDark;
  c2.fillRect(tx, ty + turretSize - 1, turretSize, 1);
  c2.fillRect(tx + turretSize - 1, ty, 1, turretSize);

  const barrelW = Math.max(2, (s / 8) | 0);
  const barrelL = Math.max(6, (s * 0.45) | 0);
  c2.fillStyle = colLight;
  if (aimDir === UP) {
    c2.fillRect((cx - barrelW / 2) | 0, y, barrelW, (cy - y) | 0);
  } else if (aimDir === DOWN) {
    c2.fillRect((cx - barrelW / 2) | 0, cy | 0, barrelW, (y + s - cy) | 0);
  } else if (aimDir === LEFT) {
    c2.fillRect(x, (cy - barrelW / 2) | 0, (cx - x) | 0, barrelW);
  } else {
    c2.fillRect(cx | 0, (cy - barrelW / 2) | 0, (x + s - cx) | 0, barrelW);
  }

  if (type === 'BOSS') {
    c2.fillStyle = colDark;
    c2.fillRect((cx - 2) | 0, (cy - 2) | 0, 4, 4);
  }

  return cv;
}


function drawNESShield(x, y, size) {
  const phase = (G.frameCount >> 1) & 1;
  const shieldImg = art('shield');
  if (shieldImg) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';   // 素材中心是暗色：疊加後暗部等於透明，不會蓋住坦克
    ctx.globalAlpha = phase ? 0.9 : 0.6;
    drawRotated(ctx, shieldImg, x + size / 2, y + size / 2, size * 1.7, size * 1.7, G.frameCount * 0.05);
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.fillStyle = phase ? '#ffffff' : '#74c0fc';
  const t = 2;
  if (phase) {
    ctx.fillRect(x + size/2 - t/2, y - 2, t, size + 4);
    ctx.fillRect(x - 2, y + size/2 - t/2, size + 4, t);
  } else {
    ctx.fillRect(x, y, t, t);
    ctx.fillRect(x + size - t, y, t, t);
    ctx.fillRect(x, y + size - t, t, t);
    ctx.fillRect(x + size - t, y + size - t, t, t);
    ctx.fillRect(x + size/2 - t/2, y - 2, t, t);
    ctx.fillRect(x + size/2 - t/2, y + size, t, t);
    ctx.fillRect(x - 2, y + size/2 - t/2, t, t);
    ctx.fillRect(x + size, y + size/2 - t/2, t, t);
  }
  ctx.restore();
}

// ==================== 子彈邏輯 ====================
function updateBullet(b) {
  if (!b.alive) return;

  // 有壽命的子彈（OMEGA 光束段）：laserLife 先前只被寫入、從不遞減，
  // 於是每次射擊留下 29 顆 vx=vy=0、ignoreTiles=true 的永久子彈 → 池無界成長、FPS 崩落。
  if (b.laserLife > 0 && --b.laserLife <= 0) { b.alive = false; return; }

  // BOSS 砲彈：引信到期就炸（就算沒打到任何東西）
  if (b.shell && --b.fuse <= 0) { b.alive = false; explodeShell(b); return; }

  // 記錄移動前的位置，用於碰撞回溯
  const prevX = b.x, prevY = b.y;

  b.x += b.vx * b.speed;
  b.y += b.vy * b.speed;

  if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
    b.alive = false; return;
  }

  const bc = ((b.x + 3) / TILE) | 0, br = ((b.y + 3) / TILE) | 0;
  if (br >= 0 && br < ROWS && bc >= 0 && bc < COLS && !b.ignoreTiles) {
    const t = G.map[br][bc];
    if (b.shell && (t === BRICK || t === STEEL || t === BASE)) {
      // 砲彈打到地形就炸：攻城核心的威脅是「逼你離開落點」，不是慢慢飛過來
      b.alive = false;
      if (t === BRICK) breakTile(bc, br);
      if (t === BASE && !fx.has('wall')) {
        G.map[br][bc] = BASE_DEAD;
        G.baseDestroyed = true;
        for (let i = 0; i < G.dynamicTiles.length; i++) {
          const dt = G.dynamicTiles[i];
          if (dt.r === br && dt.c === bc) { dt.type = BASE_DEAD; break; }
        }
        Sound.baseDestroyed();
      }
      explodeShell(b);
      return;
    }
    if (t === BRICK) {
      b.alive = false; breakTile(bc, br);
      spawnExplosion(b.x, b.y, 'spark');
      Sound.hitBrick();
      return;
    }
    if (t === STEEL) {
      b.alive = false;
      spawnExplosion(b.x, b.y, 'spark');
      Sound.hitSteel();
      return;
    }
    if (t === BASE) {
      b.alive = false;
      if (fx.has('wall')) {
        spawnExplosion(b.x, b.y, 'spark');
        return;
      }
      G.map[br][bc] = BASE_DEAD;
      G.baseDestroyed = true;
      for (let i = 0; i < G.dynamicTiles.length; i++) {
        const dt = G.dynamicTiles[i];
        if (dt.r === br && dt.c === bc) { dt.type = BASE_DEAD; break; }
      }
      spawnExplosion(bc*TILE+13, br*TILE+13, 'big');
      triggerShake(20, 8);
      Sound.baseDestroyed();
      return;
    }
  }

  if (b.isPlayer) {
    // 擴大查詢範圍：覆蓋子彈移動距離 + 安全邊際
    const speed = b.speed;
    const margin = b.size + TILE; // 查詢範圍覆蓋整個格子
    const qx = Math.min(prevX, b.x) - margin;
    const qy = Math.min(prevY, b.y) - margin;
    const qw = Math.abs(b.x - prevX) + margin * 2;
    const qh = Math.abs(b.y - prevY) + margin * 2;
    spatialGrid.queryRect(qx, qy, qw, qh, _queryBuf);
    Perf.collisionChecks += _queryBuf.length;

    for (let i = 0; i < _queryBuf.length; i++) {
      const t = _queryBuf[i];
      if (!t.alive || t.isPlayer) continue;
      if (b.hitTanks.indexOf(t) !== -1) continue;

      // 掃描碰撞檢測：沿子彈軌跡取樣，避免高速穿透
      let hit = false;
      const steps = Math.max(1, Math.ceil(b.speed / 4)); // 每 4px 取樣
      const hitDist = (b.size + t.size) * 0.45, hitDist2 = hitDist * hitDist;
      for (let s = 0; s <= steps; s++) {
        const tLerp = s / steps;
        const bx = prevX + (b.x - prevX) * tLerp;
        const by = prevY + (b.y - prevY) * tLerp;
        const dx = (bx + b.size/2) - (t.x + t.size/2);
        const dy = (by + b.size/2) - (t.y + t.size/2);
        if (dx*dx + dy*dy < hitDist2) {
          hit = true;
          break;
        }
      }

      if (hit) {
        handleBulletHit(b, t);
        if (!b.alive) return;
      }
    }
  } else {
    if (G.player && G.player.alive && G.player.flashTimer === 0) {
      Perf.collisionChecks++;
      // 掃描碰撞檢測：玩家子弹
      let hit = false;
      const steps = Math.max(1, Math.ceil(b.speed / 4));
      const hitDist = (b.size + G.player.size) * 0.45, hitDist2 = hitDist * hitDist;
      for (let s = 0; s <= steps; s++) {
        const tLerp = s / steps;
        const bx = prevX + (b.x - prevX) * tLerp;
        const by = prevY + (b.y - prevY) * tLerp;
        const dx = (bx + b.size/2) - (G.player.x + G.player.size/2);
        const dy = (by + b.size/2) - (G.player.y + G.player.size/2);
        if (dx*dx + dy*dy < hitDist2) {
          hit = true;
          break;
        }
      }
      if (hit) {
        // 砲彈碰到玩家也是「爆炸」，不是一般子彈命中的 1 點傷害（傷害走爆炸那條路徑，
        // 護盾／無敵／反應護盾的判定才只有一份）
        if (b.shell) { b.alive = false; explodeShell(b); }
        else handleBulletHit(b, G.player);
      }
    }
  }
}

function handleBulletHit(b, t) {
  // t 是被击中的目标
  // b.isPlayer === true  → 玩家子弹击中敌人
  // b.isPlayer === false → 敌人子弹击中玩家

  // 装甲护盾：只在玩家目标时生效
  if (t === G.player) {
    if (t.shieldHits > 0) {
      t.shieldHits--;
      b.alive = false;
      spawnExplosion(b.x, b.y, 'shield');
      return;
    }
    // BARRIER：被打到時吸收該次傷害，並開啟 2 秒（120 tick）護盾；護盾期間再被打也一律吸收。
    // 舊版 barrierTimer 全檔沒有任何遞減（grep `barrierTimer--` = 0 次），所以第一次被打到
    // 之後就永久無敵 —— 玩家不會掉血、不會死，整局的平衡與計分都失去意義。
    if (G.playerStats.passives.includes('BARRIER') || fx.has('barrier')) {
      b.alive = false;
      spawnExplosion(b.x, b.y, 'shield');
      if (!fx.has('barrier')) fx.set('barrier', 120);
      return;
    }
    if (fx.has('invul')) {
      b.alive = false;
      spawnExplosion(b.x, b.y, 'shield');
      return;
    }
    // FREEZING 詞綴：凍緩 2 秒；到期時把速度還原（效果系統的 onExpire，不再需要 _slowed 旗標）
    if (b.freezing) {
      fx.set('slow', 120, { onExpire: applyPlayerSpeed });
      applyPlayerSpeed();
    }
  }

  // 计算伤害倍率
  let powerMult = 1;

  // RAGE 被动：受伤加倍（被击中时）
  if (G.playerStats.passives.includes('RAGE') && t === G.player) {
    const hpRatio = G.playerStats.hp / G.playerStats.maxHp;
    powerMult = hpRatio < 0.5 ? 2 : hpRatio < 0.75 ? 1.5 : 1;
  }

  // RAGE 攻击增益：玩家生命越低伤害越高
  if (b.isPlayer && G.playerStats.passives.includes('RAGE')) {
    const hpRatio = G.playerStats.hp / G.playerStats.maxHp;
    powerMult *= hpRatio < 0.5 ? 2 : hpRatio < 0.75 ? 1.5 : 1;
  }

  // WEAKEN 被动：对 Boss 额外伤害（只在敌人被玩家击中时）
  if (b.isPlayer && G.playerStats.passives.includes('WEAKEN') && t.type === 'BOSS') {
    powerMult *= 1.5;
  }

  b.hitTanks.push(t);
  if (!b.pierce) b.alive = false;

  // CLUSTER 分裂：擊中後分裂成 5 發小彈
  if (b.isPlayer && G.playerStats.weapon === 'CLUSTER' && !b._isChild) {
    const childPower = b.power * 0.5;
    const dir = b.dir;
    for (let i = 0; i < 5; i++) {
      const angle = 0.3 * (i - 2);
      const cos = Math.cos(angle), sin = Math.sin(angle);
      const c = bulletsPool.acquire();
      c.x = t.x + t.size/2 - 3; c.y = t.y + t.size/2 - 3;
      c.dir = dir;
      c.isPlayer = true;
      c.vx = DX[dir] * cos - DY[dir] * sin;
      c.vy = DX[dir] * sin + DY[dir] * cos;
      c.speed = bulletSpeed(CONFIG.BULLET.SPEED_PLAYER * 0.8);
      c.power = childPower;
      c._isChild = true;
    }
  }

  // CHAIN 被动：子彈彈跳到附近敵人
  if (b.isPlayer && G.playerStats.passives.includes('CHAIN') && !b._isChild) {
    spawnChainBullet(t.x + t.size/2, t.y + t.size/2, t);
  }

  t.hp -= b.power * powerMult;
  t.flashTimer = CONFIG.GAMEPLAY.PLAYER_HIT_FLASH;
  spawnExplosion(b.x, b.y, 'spark');

  if (t.hp <= 0) {
    t.alive = false;

    if (t.elitePrefix === 'EXPLOSIVE') {
      spawnExplosion(t.x + t.size/2, t.y + t.size/2, 'big');
      triggerShake(8, 6);
      if (G.player && G.player.alive && G.player.flashTimer === 0) {
        G.playerStats.hp -= 0.5;
      }
    }

    spawnExplosion(t.x + t.size/2, t.y + t.size/2, t.type === 'BOSS' ? 'big' : 'tank');
    if (t.type === 'BOSS') { triggerShake(15, 6); Sound.bigExplode(); }
    else Sound.explode();

    if (!b.isPlayer && t === G.player) {
      G.playerStats.hp -= 1;
      triggerShake(10, 5);
      Sound.hitPlayer();
      updateHUD();

      if (G.playerStats.hp <= 0) {
        setTimeout(showGameOver, 1000);
      } else {
        G.player.alive = true;
        G.player.flashTimer = CONFIG.GAMEPLAY.PLAYER_RESPAWN_INVUL;
        G.player.x = G.playerSpawnPos.x;
        G.player.y = G.playerSpawnPos.y;
        G.player.hp = G.playerStats.hp;
        spawnExplosion(G.player.x, G.player.y, 'spark');
      }
    } else {
      if (G.aliveEnemies > 0) G.aliveEnemies--;
      progress.recordKill(tankArtKey(t));
      const pts = t.type === 'BOSS' ? 1000 : (t.type === 'SUICIDE' ? 50 : (t.elitePrefix ? 150 : 100));
      G.score += pts;
      addScorePopup(t.x, t.y, `+${pts}`);
      addCombo(true);

      if (t.hasPowerUp && t.powerUpType) {
        G.powerUps.push({
          type: t.powerUpType,
          x: t.x + t.size/2,
          y: t.y + t.size/2,
          life: 600,
          maxLife: 600,
          alive: true
        });
      }

      if (b.isPlayer && G.playerStats.route === 'C') {
        applyPassiveEffects(t, b, 'laser_kill');
      }

      if (G.playerStats.passives.includes('VAMPIRE')) {
        G.playerStats.hp = Math.min(G.playerStats.maxHp, G.playerStats.hp + 0.2);
      }

      updateHUD();

      checkLevelComplete();
    }
  }
}

const SMOKE_COLOR = '#505050';   // 煙霧固定色：舊版每顆每幀用樣板字串組 rgba() 再指派 fillStyle

// 光暈精靈（顏色 → 離屏畫布，快取重複使用）：src/render/sprites.js

  art,
});
const { drawParticles, drawNESSpawnEffect, drawScorePopups, renderBullets } = effectRenderer;

// ==================== 粒子系統 ====================
function spawnExplosion(x, y, type) {
  let count;
  if (type === 'big') count = CONFIG.PARTICLE.BIG_COUNT;
  else if (type === 'tank') count = CONFIG.PARTICLE.TANK_DEATH_COUNT;
  else if (type === 'shield') count = 8;
  else count = CONFIG.PARTICLE.SPARK_COUNT;
  
  for (let i = 0; i < count; i++) {
    const angle = rnd() * Math.PI * 2;
    const speed = rnd() * (type === 'big' ? 4 : 2) + 0.5;

    const spark = particlesPool.acquire();
    spark.type = 'spark'; 
    spark.x = x; spark.y = y;
    spark.vx = Math.cos(angle) * speed; 
    spark.vy = Math.sin(angle) * speed;
    spark.life = spark.maxLife = 15 + rnd() * 20; 
    spark.size = rnd() * 3 + 1.5;
    
    if (type === 'shield') spark.color = '#5cd8ff';
    else spark.color = rnd() > 0.5 ? '#ffaa00' : '#ff3300';

    if (type === 'big' || type === 'tank') {
      const smoke = particlesPool.acquire();
      smoke.type = 'smoke'; 
      smoke.x = x; smoke.y = y;
      smoke.vx = Math.cos(angle) * speed * 0.3; 
      smoke.vy = Math.sin(angle) * speed * 0.3 - 0.5;
      smoke.life = smoke.maxLife = 30 + rnd() * 30; 
      smoke.size = rnd() * 4 + 4;
      smoke.color = 'rgba(100, 100, 100, 0.5)';
    }
  }
}

function updateParticles() {
  const arr = particlesPool.active;
  for (let i = 0; i < arr.length; i++) {
    const p = arr[i];
    if (!p.alive) continue;
    p.x += p.vx; p.y += p.vy; p.life--;
    p.vx *= 0.94; p.vy *= 0.94;
    if (p.type === 'smoke') p.size += 0.1;
    if (p.life <= 0) p.alive = false;
  }
  particlesPool.sweep();
}


function updateScorePopups() {
  for (let i = G.scorePopups.length - 1; i >= 0; i--) {
    const p = G.scorePopups[i];
    p.y += p.vy; p.vy *= 0.95; p.life--;
    if (p.life <= 0) G.scorePopups.splice(i, 1);
  }
}

// ==================== Director System（局內事件） ====================

function updateDirector() {
  if (!G.isVSMode || G.frameCount % 300 !== 0) return;

  if (rnd() < 0.15 && G.directorEvents.length === 0) {
    const events = Object.keys(DIRECTOR_EVENTS);
    const eventName = events[(rnd() * events.length) | 0];
    const event = DIRECTOR_EVENTS[eventName];
    event.activate();
    G.directorEvents.push({ name: event.name, desc: event.desc, life: event.duration, type: eventName });
  }
}

function updateDirectorEvents() {
  for (let i = G.directorEvents.length - 1; i >= 0; i--) {
    const ev = G.directorEvents[i];
    ev.life--;

    if (ev.life <= 0 && ev.type && DIRECTOR_EVENTS[ev.type] && DIRECTOR_EVENTS[ev.type].deactivate) {
      // 事件結束時呼叫 deactivate：SURGE 會把 spawnInterval 減半，舊版從來不還原 →
      // 敵軍生成速率在第一次 SURGE 之後就永久加倍（deactivate 宣告了卻沒有任何呼叫端）。
      DIRECTOR_EVENTS[ev.type].deactivate();
    }

    if (ev.type === 'airdrop') {
      // 舊版這裡是空分支：玩家看到「📦 空投來了」卻什麼都沒發生。
      // 空投箱落地時掉一個道具（用既有的 POWER_UPS 池與掉落清單）。
      if (ev.life % 30 === 0 && ev.life > 0) {
        const pool = COMMON_DROPS;
        const type = pool[(rnd() * pool.length) | 0];
        const px = Math.max(TILE, Math.min(W - TILE * 2, ev.x + (rnd() - 0.5) * TILE * 4));
        const py = Math.max(TILE, Math.min(H - TILE * 2, ev.y + (rnd() - 0.5) * TILE * 4));
        G.powerUps.push({ type, x: px, y: py, life: 600, maxLife: 600, alive: true });
      }
    } else if (ev.type === 'orbital') {
      ev.timer++;
      if (ev.timer % 60 === 0) {
        ev.stage++;
        const x = rnd() * W;
        const y = rnd() * H;
        ev.targets.push({ x, y, stage: ev.stage });
      }
      if (ev.timer > 240) {
        for (const t of ev.targets) {
          spawnExplosion(t.x, t.y, 'big');
        }
        ev.targets = [];
      }
    } else if (ev.type === 'train') {
      ev.x += 3;
      if (ev.x > W) ev.life = 0;
    }

    if (ev.life <= 0) {
      G.directorEvents.splice(i, 1);
    }
  }
}
