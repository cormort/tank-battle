const { togglePause, openShop, closeShop, showGameOver, showContinuePrompt, showFinalGameOver } = screens;
const updateMusicIcon = screens.updateMusicIcon;   // 音樂圖示（按鈕與 N 鍵共用）

// ==================== 主迴圈 (固定時間步長 60Hz 模擬, 任意刷新率渲染) ====================
const TICK_HZ = 60;
const TICK_MS = 1000 / TICK_HZ;
let _speedMult = 1;        // URL param: ?speed=N  (1-20)
let _maxUpdatesPerFrame = 5;
let _accumMs = 0;
let _lastFrameTime = 0;

function update() {
  if (window.__botPreUpdate) window.__botPreUpdate();
  G.frameCount++;

  if (G.state === STATE.PLAYING) {
    spatialGrid.clear();
    for (let i = 0; i < G.enemies.length; i++) {
      spatialGrid.insert(G.enemies[i]);
    }

    // 主動技能：按鍵由 ACTIVE_SKILLS[].key 決定（資料是唯一來源），且為邊緣觸發 ——
    // 平台層在 keydown 時設 skillPressed，這裡消費一次（不再每幀查表、也不會按住連發）
    if (input.skillPressed) { input.skillPressed = false; triggerActiveSkill(); }

    // 所有玩家／全域時效的唯一遞減進入點（舊版散在 5 處，其中兩處還在 PLAYING 之外，
    // 導致暫停與商店期間堡壘時間照样流失）。
    const expired = fx.tick();
    if (expired.includes('slow')) applyPlayerSpeed();
    if (expired.includes('combo')) G.playerStats.combo = 0;
    applyPassiveTick();

    if (G.player && G.player.alive) {
      G.player.update();
      let moved = false;

      // 移動方向由平台層的意圖決定（鍵盤優先，其次觸控搖桿）
      const moveDir = dirFromInput(input, G.touch.dir >= 0 ? G.touch.dir : -1);
      if (moveDir >= 0) {
        G.player.move(moveDir); moved = true;
        mapEventState.slideDir = moveDir; mapEventState.slideTicks = ICE_SLIDE_TICKS;
      } else if (mapEventState.active && mapEventState.type === 'ICE' &&
                 mapEventState.slideTicks > 0 && mapEventState.slideDir >= 0) {
        // 冰面：沒有輸入時仍沿最後方向滑行，直到滑行量用完（地圖事件 ICE = '坦克滑行慣性'）
        G.player.move(mapEventState.slideDir); moved = true; mapEventState.slideTicks--;
      }

      if (!moved) G.player.moving = false;

      for (let i = 0; i < G.powerUps.length; i++) {
        const pu = G.powerUps[i];
        if (!pu.alive) continue;
        if (G.player && G.player.alive &&
            Math.hypot(pu.x - G.player.x - G.player.size/2, pu.y - G.player.y - G.player.size/2) < TILE * 1.5) {
          activatePowerUp(pu.type);
          pu.alive = false;
          addScorePopup(G.player.x, G.player.y, POWER_UPS[pu.type].name);
        }
      }

      if (G.isVSMode) {
        let nearest = null;
        let minDist = Infinity;
        for (let i = 0; i < G.enemies.length; i++) {
          const e = G.enemies[i];
          if (e.alive) {
            const d = Math.hypot(e.x - G.player.x, e.y - G.player.y);
            if (d < minDist) { minDist = d; nearest = e; }
          }
        }
        if (nearest) {
          const dx = nearest.x - G.player.x;
          const dy = nearest.y - G.player.y;
          G.player.aimDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
          G.player.shoot();
        }
      } else {
        if (input.fire || G.touch.fire) G.player.shoot();
      }
    }

    updateDirector();
    updateDirectorEvents();

    updateVSModeDifficulty();

    if (mapEventState.active) {
      updateMapEvent();
    }

    updateSummonEntities();

    const maxOnScreen = G.isVSMode ? CONFIG.GAMEPLAY.MAX_ENEMIES_ON_SCREEN_VS : CONFIG.GAMEPLAY.MAX_ENEMIES_ON_SCREEN;
    if (G.enemiesSpawned < G.maxEnemies) {
      if (G.aliveEnemies < maxOnScreen) {
        if (--G.spawnTimer <= 0) {
          spawnEnemy();
          G.spawnTimer = effectiveSpawnInterval();
        }
      }
    }

    if (!fx.has('freeze')) {
      for (let i = 0; i < G.enemies.length; i++) {
        if (G.enemies[i].alive) updateEnemyAI(G.enemies[i]);
      }
    }

    const ba = bulletsPool.active;
    for (let i = 0; i < ba.length; i++) updateBullet(ba[i]);
    bulletsPool.sweep();

    compact(G.enemies);

    if (G.baseDestroyed && !G.isVSMode) {
      G.state = STATE.GAMEOVER;
      setTimeout(showGameOver, 1200);
    }

    updateEconomy();

    // 關卡結算：舊版只在 handleBulletHit（子彈命中）裡呼叫，用 BOMB／空襲／核融合／火山
    // 等範圍技清掉最後一批敵人時就永遠不會結算 —— 場上沒敵人、關卡不結束的軟鎖。
    // 這裡每個 tick 檢查一次（單一比較，成本可忽略），涵蓋所有擊殺路徑。
    checkLevelComplete();
  }

  if (G.shakeTimer > 0) {
    G.shakeTimer--;
    G.shakeIntensity *= CONFIG.GAMEPLAY.SHAKE_DECAY;
  }
  for (let i = G.spawnEffects.length - 1; i >= 0; i--) {
    if (--G.spawnEffects[i].life <= 0) G.spawnEffects.splice(i, 1);
  }
  updateScorePopups();
  updateParticles();
}

// 環境／召喚物造成的傷害：統一走 handleBulletHit，讓護盾、無敵與死亡判定維持同一條路徑
// （避免出现「血量變負但沒死」這種雙軌問題）。
const _hazardBullet = { x: 0, y: 0, size: TILE, power: 1, isPlayer: false, alive: true, hitTanks: [] };
function damagePlayerFromHazard(x, y, power) {
  if (!G.player || !G.player.alive) return;
  _hazardBullet.x = x; _hazardBullet.y = y; _hazardBullet.power = power;
  _hazardBullet.alive = true; _hazardBullet.hitTanks.length = 0;
  handleBulletHit(_hazardBullet, G.player);
}

function updateSummonEntities() {
  for (let i = G.summonEntities.length - 1; i >= 0; i--) {
    const se = G.summonEntities[i];
    se.life--;

    if (se.type === 'turret') {
      if (se.cooldown > 0) se.cooldown--;
      if (se.cooldown <= 0 && G.player) {
        const cx = se.x + TILE/2;
        const cy = se.y + TILE/2;
        let nearest = null;
        let minDist = 200;
        for (const e of G.enemies) {
          if (e.alive) {
            const d = Math.hypot(e.x - se.x, e.y - se.y);
            if (d < minDist) { minDist = d; nearest = e; }
          }
        }
        if (nearest) {
          const dx = nearest.x + TILE/2 - cx;
          const dy = nearest.y + TILE/2 - cy;
          let dir;
          if (Math.abs(dx) > Math.abs(dy)) {
            dir = dx > 0 ? RIGHT : LEFT;
          } else {
            dir = dy > 0 ? DOWN : UP;
          }
          spawnBullet(cx, cy, dir, true, false, se.damage);
        } else {
          const dirs = [UP, DOWN, LEFT, RIGHT];
          const randDir = dirs[(rnd() * 4) | 0];
          spawnBullet(cx, cy, randDir, true, false, se.damage);
        }
        se.cooldown = 25;
      }
    }

    // INTERFERER 放的炸彈：到期或玩家靠近就引爆（舊版沒有任何分支，只會倒數後消失）
    if (se.type === 'bomb') {
      const near = G.player && G.player.alive &&
        Math.hypot(G.player.x - se.x, G.player.y - se.y) < TILE;
      if (se.life <= 0 || near) {
        spawnExplosion(se.x, se.y, 'big');
        if (near) damagePlayerFromHazard(se.x, se.y, se.damage || 2);
        se.alive = false;
      }
    }

    // MINELAYER 放的地雷：玩家踩到就爆
    if (se.type === 'mine') {
      const near = G.player && G.player.alive &&
        Math.hypot(G.player.x - se.x, G.player.y - se.y) < TILE * 0.9;
      if (near) {
        spawnExplosion(se.x, se.y, 'tank');
        damagePlayerFromHazard(se.x, se.y, se.damage || 2);
        se.alive = false;
      }
    }

    if (se.life <= 0) se.alive = false;
  }

  compact(G.summonEntities);

  for (let i = G.powerUps.length - 1; i >= 0; i--) {
    const pu = G.powerUps[i];
    pu.life--;
    if (pu.life <= 0) pu.alive = false;
  }
  compact(G.powerUps);

  // 堡壘與時間凍結已納入 fx，由 update() 的單一進入點遞減
  // （順帶修正：暫停與商店期間不再倒數）
}

function drawSummonEntities() {
  for (const se of G.summonEntities) {
    if (!se.alive) continue;

    if (se.type === 'turret') {
      const tImg = art('turret');
      if (tImg) ctx.drawImage(tImg, se.x, se.y, TILE, TILE);
      else {
        ctx.fillStyle = '#44aa44';
        ctx.fillRect(se.x, se.y, TILE, TILE);
        ctx.fillStyle = '#88ff88';
        ctx.fillRect(se.x + 4, se.y + 4, TILE - 8, TILE - 8);
      }
      const hpRatio = se.life / se.maxLife;
      ctx.fillStyle = '#000';
      ctx.fillRect(se.x, se.y - 4, TILE, 2);
      ctx.fillStyle = '#44ff44';
      ctx.fillRect(se.x, se.y - 4, TILE * hpRatio, 2);
    } else if (se.type === 'mine') {
      // 地雷原本完全沒畫（只有踩到才知道）；有素材時畫出來，閃紅燈
      const mImg = art('mine');
      if (mImg) {
        ctx.globalAlpha = (G.frameCount & 16) ? 1 : 0.75;
        ctx.drawImage(mImg, se.x + 4, se.y + 4, TILE - 8, TILE - 8);
        ctx.globalAlpha = 1;
      }
    } else if (se.type === 'decoy') {
      ctx.fillStyle = `rgba(255,200,200,${se.life / se.maxLife * 0.5})`;
      ctx.fillRect(se.x, se.y, TILE, TILE);
    }
  }
}

function drawPowerUps() {
  for (const pu of G.powerUps) {
    if (!pu.alive) continue;
    const info = POWER_UPS[pu.type];
    const alpha = pu.life / pu.maxLife;
    const blink = (G.frameCount % 30 < 15) ? 1 : 0.5;
    const puImg = art('pu_' + pu.type);
    if (puImg) {
      ctx.globalAlpha = alpha * (blink === 1 ? 1 : 0.7);
      ctx.drawImage(puImg, pu.x - 13, pu.y - 13, 26, 26);
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.fillStyle = info.color;
    ctx.globalAlpha = alpha * blink;
    ctx.beginPath();
    ctx.arc(pu.x, pu.y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(info.icon, pu.x, pu.y + 4);
    ctx.textAlign = 'left';    // 舊版只還原 globalAlpha；textAlign='center' 會洩漏給之後的
    ctx.globalAlpha = 1;       // 菁英詞綴圖示與分數彈出（兩者都靠左對齊定位 → 位置會偏掉）
  }
}

function drawDirectorEvents() {
  for (const ev of G.directorEvents) {
    if (ev.type === 'orbital') {
      const reticle = art('orbital');
      for (const t of ev.targets) {
        const alpha = (ev.timer > 180) ? 1 : (ev.timer % 60 < 30) ? 0.5 : 0.8;
        if (reticle) {
          ctx.globalAlpha = alpha;
          drawRotated(ctx, reticle, t.x, t.y, TILE * 4, TILE * 4, G.frameCount * 0.02);
          ctx.globalAlpha = 1;
          continue;
        }
        ctx.strokeStyle = `rgba(255,0,0,${alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(t.x, t.y, TILE * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (ev.type === 'airdrop' && art('airdrop')) {
      ctx.globalAlpha = Math.sin(G.frameCount * 0.1) * 0.2 + 0.8;
      ctx.drawImage(art('airdrop'), ev.x - 13, ev.y - 13, 26, 26);
      ctx.globalAlpha = 1;
    } else if (ev.type === 'train' && art('train')) {
      const tr = art('train');
      ctx.drawImage(tr, ev.x, ev.y + TILE / 2 - (80 * tr.height / tr.width) / 2, 80, 80 * tr.height / tr.width);
    } else if (ev.type === 'airdrop') {
      ctx.fillStyle = `rgba(255,215,0,${Math.sin(G.frameCount * 0.1) * 0.3 + 0.5})`;
      ctx.fillRect(ev.x - 10, ev.y - 10, 20, 20);
    } else if (ev.type === 'train') {
      ctx.fillStyle = '#888';
      ctx.fillRect(ev.x, ev.y, 80, TILE);
      ctx.fillStyle = '#ff0';
      ctx.fillRect(ev.x + 10, ev.y + 5, 10, 10);
    }
  }

  if (G.directorEvents.length > 0 && G.directorEvents[0].name) {
    ctx.fillStyle = '#ffd700';
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(G.directorEvents[0].name, W/2, H - 20);
    ctx.textAlign = 'left';
  }
}

// 暫停時畫面是完全靜止的（frameCount 不再前進 → 水波相位、履帶相位、發光呼吸都凍結），
// 所以同一幀只需要畫一次：暫停中的 rAF 不再每幀重畫整個戰場（手機上暫停很久時的耗電來源）。
let _pausedRenderedFrame = -1;

function render() {
  if (G.state === STATE.PAUSED) {
    if (_pausedRenderedFrame === G.frameCount) return;
    _pausedRenderedFrame = G.frameCount;
  } else if (_pausedRenderedFrame !== -1) {
    _pausedRenderedFrame = -1;
  }

  const isGameplay = G.state === STATE.PLAYING || G.state === STATE.PAUSED || G.state === STATE.GAMEOVER;

  ctx.save();
  // 遊戲中的底色（含 NIGHT 事件底色）已經烘在 staticCanvas 裡 → 不必每幀全螢幕填色。
  // 非遊戲狀態（選單）沒有 staticCanvas 那一層，還是要自己填。
  // 注意：用 mapEventState（真正在跑的狀態機）判斷；G.mapEvent 只在 restartGame 被賦值，
  // rollMapEvent() 因為此時 G.level 已重置為 1（條件要求 level>=3）永遠回 null。
  if (!isGameplay) paintBackground(ctx, 0, 0, W, H);

  if (G.shakeTimer > 0) {
    ctx.translate((visualRnd() - 0.5) * G.shakeIntensity, (visualRnd() - 0.5) * G.shakeIntensity);
  }

  if (isGameplay) {
    ctx.drawImage(staticCanvas, 0, 0, W, H);
    const phase = ((G.frameCount >> 4) & 1);
    const tiles = G.dynamicTiles;
    for (let i = 0; i < tiles.length; i++) {
      const dt = tiles[i];
      if (dt.type === WATER) drawWaterDirect(ctx, dt.x, dt.y, phase);
      else if (dt.type === BASE) drawEagleDirect(ctx, dt.x, dt.y, false);
      else if (dt.type === BASE_DEAD) drawEagleDirect(ctx, dt.x, dt.y, true);
    }
  }

  drawMapEvent();

  for (let i = 0; i < G.spawnEffects.length; i++) {
    const sp = G.spawnEffects[i];
    drawNESSpawnEffect(sp.x, sp.y, sp.size, sp.life, sp.maxLife);
  }

  drawSummonEntities();
  drawPowerUps();
  for (let i = 0; i < G.enemies.length; i++) G.enemies[i].draw();
  // 暫停時也要畫玩家：舊版只在 PLAYING 畫，於是「按 P 暫停」會讓自己的坦克當場消失
  // （每一幀都會重畫整片戰場，所以那一格不會被保留下來）。GAMEOVER 不畫（死亡後 alive=false，
  // 但接關畫面不該留下上一條命的坦克）。
  if (G.player && (G.state === STATE.PLAYING || G.state === STATE.PAUSED)) G.player.draw();

  renderBullets();

  if (isGameplay) {
    // 樹林只貼有樹的格子：全螢幕貼一張 1040×1040 的透明圖層實測 1.1 ms／幀（DPR 2、SwiftShader），
    // 而一張地圖通常只有十幾格樹 → 實測降到 0.14 ms。
    // 四邊各多貼 1 個邏輯像素：樹叢的圓形 blob 中心可能落在格子邊界外（例如 x+size*0.15、半徑 4），
    // 抗鋸齒會溢出格子 1 個 device 像素以內；不帶這圈邊界就會少掉那一列半透明像素，
    // 雖然肉眼難辨，但「跟原本全螢幕貼法逐像素相同」是這個改動能被驗證的前提。
    // 來源座標是 device pixel，目的地是邏輯座標（ctx 已 setTransform(scale…)）。
    const ft = G.forestTiles;
    const pad = 1, span = TILE + pad * 2;
    for (let i = 0; i < ft.length; i++) {
      const f = ft[i];
      ctx.drawImage(forestCanvas,
        (f.x - pad) * RENDER_SCALE, (f.y - pad) * RENDER_SCALE, span * RENDER_SCALE, span * RENDER_SCALE,
        f.x - pad, f.y - pad, span, span);
    }
  }

  drawParticles();
  drawDirectorEvents();
  if (isGameplay) drawScorePopups();

  if (G.playerStats && G.playerStats.combo > 0 && isGameplay) {
    ctx.fillStyle = '#ff6600';
    ctx.font = '12px "Press Start 2P"';
    ctx.fillText(`${G.playerStats.combo} COMBO`, 10, H - 30);
    // 距離下一個連擊獎勵的進度條：沒有這條，玩家不知道「再 3 次會有東西」
    const every = COMBO_REWARDS.every;
    const progress = (G.playerStats.combo % every) / every;
    ctx.fillStyle = '#552200';
    ctx.fillRect(10, H - 25, 64, 3);
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(10, H - 25, (64 * progress) | 0, 3);
  }

  ctx.restore();
}

function gameLoop(now) {
  // 舊版的 requestAnimationFrame(gameLoop) 是函式最後一行：update()/render() 只要丟一次例外，
  // 下一幀就永遠不會被排程 —— 畫面整個凍結、只有 console 有訊息（實測塞一個 null 進 G.enemies
  // 就能讓 frameCount 永久停住）。這裡保證「無論如何都會排下一幀」。
  try {
  if (!_lastFrameTime) _lastFrameTime = now;
  let dt = now - _lastFrameTime;
  _lastFrameTime = now;
  if (dt > 250) dt = TICK_MS;
  _accumMs += dt * _speedMult;

  Perf.beginFrame();

  let updates = 0;
  while (!DETERMINISTIC && _accumMs >= TICK_MS && updates < _maxUpdatesPerFrame) {
    Perf.begin();
    if (G.state !== STATE.PAUSED) update();
    _accumMs -= TICK_MS;
    updates++;
  }
  if (_accumMs > TICK_MS * _maxUpdatesPerFrame) _accumMs = 0;

  render();
  Perf.end();
  Perf.updateUI();
  } catch (err) {
    reportRuntimeError(err);
  }
  requestAnimationFrame(gameLoop);
}

// 執行期錯誤：顯示一次提示（不要每幀洗版），並讓遊戲繼續跑 —— 單一敵人或粒子的資料異常
// 不該讓整場遊戲變成靜止畫面。
let _lastReportedError = null;
// ── 確定性測試用的鉤子（M2）──
// step(n)：同步跑 n 個 update()。測試靠這個「按 tick 驅動」，不受 rAF 排程與真實時間影響，
// 因此「同一組 seed + 同一串輸入」可以被精確重現。
function stepTicks(n) {
  for (let i = 0; i < n; i++) {
    if (G.state === STATE.PLAYING) update();
    else G.frameCount++;          // 非 PLAYING 也要推進，讓測試知道時間有在前進
  }
}

// checksum：把「會影響玩法結果」的狀態壓成一個數字。replay 測試比較這個值，
// 刻意不含粒子、爆炸、鏡頭抖動等純視覺狀態。
function gameChecksum() {
  const parts = [G.frameCount, G.score, G.level, G.state, G.playerStats.hp, G.playerStats.weapon,
    G.aliveEnemies, G.enemiesSpawned, Math.round(G.playerStats.weaponDamageBonus * 1000)];
  if (G.player) parts.push(Math.round(G.player.x * 100), Math.round(G.player.y * 100), Math.round(G.player.hp * 100), G.player.aimDir);
  for (const e of G.enemies) parts.push(e.type, Math.round(e.x * 100), Math.round(e.y * 100), Math.round(e.hp * 100));
  parts.push('bullets:' + bulletsPool.active.length, 'rng:' + rnd.state());
  const text = parts.join(',');
  let h = 2166136261 >>> 0;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}

function reportRuntimeError(err) {
  const msg = (err && err.message) || String(err);
  if (msg === _lastReportedError) return;
  _lastReportedError = msg;
  console.error('[tank-battle] 執行期錯誤（遊戲會繼續）:', err);
  const box = document.getElementById('errorBanner');
  if (box) {
    box.textContent = '⚠️ 執行期錯誤：' + msg + '（遊戲已繼續，可回報此訊息）';
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; _lastReportedError = null; }, 8000);
  }
}

window.addEventListener('error', (event) => reportRuntimeError(event.error || event.message));
window.addEventListener('unhandledrejection', (event) => reportRuntimeError(event.reason));

requestAnimationFrame(gameLoop);

/* ── Game speed & Bot loader ── */
(function(){
  var p = new URLSearchParams(location.search);
  var s = parseFloat(p.get('speed'));
  if (s > 0 && s <= 20) { _speedMult = s; _maxUpdatesPerFrame = Math.ceil(5 * s); console.log('[Speed] x' + s); }
  if (p.has('mute') || p.has('bot')) { Sound.enabled = false; Music.enabled = false; Music.stop(); if (Sound.ctx) Sound.ctx.suspend(); }
  if (!p.has('bot')) return;
  /* expose game internals so dynamically-loaded scripts can access them */
  // 模組化之後這些符號不再是 window 上的全域變數；驗證工具（tools/verify-game.mjs）
  // 需要它們才能驅動內部狀態，所以在 ?bot 時一併掛出來。
  window.__T = {
    // 驗證工具會呼叫的函式
    applyUpgrade, generateUpgradeOptions, buyItem, handleBulletHit, updateBullet, drawEagleDirect, eagleSprite,
    spawnEnemy, updateDirector, updateDirectorEvents, updateSummonEntities, damagePlayerFromHazard,
    stepTicks, gameChecksum, seed: SEED, deterministic: DETERMINISTIC, fx,
    // update／render 分開掛出來：headless 的 rAF 不可靠（實測空頁面只有 8.8 fps），
    // 效能工具必須能自行同步呼叫，才能把「模擬」與「繪製」的成本分開量。
    update, render, effectiveSpawnInterval, cacheStaticMap,
    applyPlayerSpeed, input, gameState, STATES, releaseAllInput,
    rngState: () => rnd.state(), setRngState: (v) => rnd.setState(v),
    drawParticles, drawPowerUps, drawMapEvent, buildTankSprite, rollMapEvent,
    activateMapEvent, deactivateMapEvent, updateMapEvent, spawnBullet,
    // 驗證工具會讀寫的模組層狀態（掛物件本身，屬性讀寫才有效）
    mapEventState, eagleCache, tankSpriteCache: _tankSpriteCache, smokeColor: SMOKE_COLOR,
    ctx, canvas,   // 主畫布與其 2D context（工具用來檢查繪圖狀態，例如 textAlign）
    // 資料表（工具用來做等價比對與死欄位掃描）
    WEAPON_REGISTRY, MAP_EVENTS, DIRECTOR_EVENTS, STARTER_WEAPONS, WEAPON_DROPS_T1, WEAPON_DROPS_T2,
    COMMON_DROPS, SPECIAL_ENEMY_TYPES: Array.from(SPECIAL_ENEMY_TYPES),
    G: G, STATE: STATE, CONFIG: CONFIG,
    UP: UP, DOWN: DOWN, LEFT: LEFT, RIGHT: RIGHT,
    DX: DX, DY: DY, TILE: TILE, W: W, H: H,
    EMPTY: EMPTY, BRICK: BRICK, STEEL: STEEL, WATER: WATER, FOREST: FOREST, BASE: BASE,
    bulletsPool: bulletsPool, particlesPool: particlesPool,
    WEAPON_TREE: WEAPON_TREE, POWER_UPS: POWER_UPS,
    BOSS_TYPES, BOSS_ORDER, bossTypeForLevel, COMBO_REWARDS, addCombo, explodeShell,
    ACTIVE_SKILLS: ACTIVE_SKILLS, PASSIVE_SKILLS: PASSIVE_SKILLS,
    ELITE_PREFIXES: ELITE_PREFIXES, SHOP_ITEMS: SHOP_ITEMS,
    Sound: Sound, Music: Music, Perf: Perf,
    Tank: Tank, Pool: Pool, SpatialGrid: SpatialGrid,
    generateMap: generateMap, startLevel: startLevel,
    restartGame: restartGame, continueGame: continueGame,
    showGameOver: showGameOver, showFinalGameOver: showFinalGameOver,
    openShop: openShop, closeShop: closeShop,
    togglePause: togglePause, checkLevelComplete: checkLevelComplete, showUpgradeScreen: showUpgradeScreen,
  };
  ['bot.js','data-collector.js'].forEach(function(src){
    var s = document.createElement('script');
    s.src = src;
    s.async = false;
    document.body.appendChild(s);
  });
})();
</script>
