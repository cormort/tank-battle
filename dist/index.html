        addScorePopup(G.player.x, G.player.y - 30, '火力 +20%', '#ffd700');
      } else if (currentWp.next) {
        const nextWp = WEAPON_TREE[currentWp.next];
        G.playerStats.weapon = nextWp.id;
        G.playerStats.weaponTier = nextWp.tier;
        G.playerStats.route = nextWp.route;
        G.player.applyTypeStats();
        addScorePopup(G.player.x, G.player.y - 30, nextWp.name, '#ffd700');
      } else {
        addScorePopup(G.player.x, G.player.y - 30, '已達最大等級!', '#ff4444');
      }
      break;
    }
    case 'TIME':
      fx.set('freeze', 600);
      break;
    case 'SHIELD':
      fx.set('invul', 600);
      break;
    case 'ONEUP':
      G.continues++;
      break;
    default:
      if (pu.weaponType) {
        applyLevelWeapon(pu.weaponType);
      }
      break;
  }
}

function applyLevelWeapon(weaponType) {
  const stackKey = weaponType;
  if (!G.levelWeaponStacks[stackKey]) {
    G.levelWeaponStacks[stackKey] = 0;
  }

  const weaponData = WEAPON_TREE[weaponType];
  if (!weaponData) return;

  const currentRoute = G.playerStats.route;
  const isSameRoute = currentRoute && currentRoute === weaponData.route;
  const isFirstWeapon = !currentRoute;

  if (isFirstWeapon) {
    // 第一次獲得武器，設定武器和路線
    G.playerStats.weapon = weaponType;
    G.playerStats.weaponTier = weaponData.tier;
    G.playerStats.route = weaponData.route;
    G.levelWeaponStacks[stackKey]++;
    if (G.player) G.player.applyTypeStats();
    addScorePopup(G.player.x, G.player.y - 20, weaponData.name);
  } else if (isSameRoute) {
    // 同路線：可以進化或疊加
    G.levelWeaponStacks[stackKey]++;

    if (G.levelClearedCount >= CONFIG.GAMEPLAY.UPGRADE_INTERVAL) {
      // 已通關足夠關卡：疊加傷害+20%
      G.playerStats.weaponDamageBonus = (G.playerStats.weaponDamageBonus || 0) + 0.2;
      addScorePopup(G.player.x, G.player.y - 20, `疊加 +20%`);
    } else {
      // 尚未通關足夠關卡：不疊加，只顯示提示
      addScorePopup(G.player.x, G.player.y - 20, weaponData.name);
    }
  } else {
    // 不同路線：不更換武器，只加少量傷害
    G.playerStats.weaponDamageBonus = (G.playerStats.weaponDamageBonus || 0) + 0.1;
    addScorePopup(G.player.x, G.player.y - 20, `+10%`);
  }
}

// ==================== 武器射擊系統（擴展） ====================
function spawnBullet(x, y, dir, isPlayer, pierce = false, power = 1) {
  const b = bulletsPool.acquire();
  b.x = x - 3; b.y = y - 3;
  b.dir = dir;
  b.isPlayer = isPlayer;
  b.pierce = pierce;
  let finalPower = power;
  if (isPlayer && G.playerStats.weaponDamageBonus) {
    finalPower = power + G.playerStats.weaponDamageBonus;
  }
  b.power = finalPower;
  b.vx = DX[dir];
  b.vy = DY[dir];
  b.speed = isPlayer ? CONFIG.BULLET.SPEED_PLAYER : CONFIG.BULLET.SPEED_ENEMY;
  b.hitTanks.length = 0;
}

function spawnChainBullet(x, y, target) {
  let nearest = null;
  let minDist = 80;
  for (const e of G.enemies) {
    if (e.alive && e !== target) {
      const d = Math.hypot(e.x - x, e.y - y);
      if (d < minDist) { minDist = d; nearest = e; }
    }
  }
  if (nearest) {
    const b = bulletsPool.acquire();
    b.x = target.x; b.y = target.y;
    b.dir = DOWN;
    const dx = nearest.x - target.x;
    const dy = nearest.y - target.y;
    const len = Math.hypot(dx, dy) || 1;
    b.vx = dx / len; b.vy = dy / len;
    b.speed = 8;
    b.isPlayer = true;
    const basePower = WEAPON_TREE[G.playerStats.weapon]?.basePower || 1;
    const powerBonus = G.playerStats.weaponDamageBonus || 0;
    b.power = 0.5 * basePower + powerBonus;
    b.chainCount = 1;
    b.hitTanks.length = 0;
  }
}

// OVERCHARGE 連鎖電擊：雷射擊殺後觸發
function chainLightning(x, y, source) {
  for (let i = 0; i < 3; i++) {
    let nearest = null;
    let minDist = 120;
    const exclude = source ? [source] : [];
    for (const e of G.enemies) {
      if (e.alive && !exclude.includes(e) && e !== source) {
        const d = Math.hypot(e.x - x, e.y - y);
        if (d < minDist) { minDist = d; nearest = e; }
      }
    }
    if (!nearest) break;
    const b = bulletsPool.acquire();
    b.x = x; b.y = y;
    b.dir = DOWN;
    const dx = nearest.x - x;
    const dy = nearest.y - y;
    const len = Math.hypot(dx, dy) || 1;
    b.vx = dx / len; b.vy = dy / len;
    b.speed = 10;
    b.isPlayer = true;
    b.pierce = false;
    const basePower = WEAPON_TREE[G.playerStats.weapon]?.basePower || 1;
    const powerBonus = G.playerStats.weaponDamageBonus || 0;
    b.power = basePower + powerBonus;
    b.type = 'PLASMA';
    b.hitTanks.length = 0;
    spawnExplosion(x, y, 'spark');
    x = nearest.x; y = nearest.y; source = nearest;
  }
}

// ==================== 物件池 ====================
class Pool {
  constructor(factory, reset, initial, maxSize) {
    this._factory = factory; this._reset = reset;
    this._pool = []; this.active = [];
    this._maxSize = maxSize || initial * 3;
    this._peakActive = 0;
    for (let i = 0; i < initial; i++) this._pool.push(factory());
  }
  acquire() {
    const obj = this._pool.length > 0 ? this._pool.pop() : this._factory();
    this._reset(obj); 
    this.active.push(obj);
    if (this.active.length > this._peakActive) this._peakActive = this.active.length;
    return obj;
  }
  release(obj) { 
    if (this._pool.length < this._maxSize) this._pool.push(obj); 
  }
  sweep() {
    let writeIdx = 0;
    for (let i = 0; i < this.active.length; i++) {
      if (this.active[i].alive) {
        if (writeIdx !== i) this.active[writeIdx] = this.active[i];
        writeIdx++;
      } else {
        this.release(this.active[i]);
      }
    }
    this.active.length = writeIdx;
  }
  clear() { 
    for (const obj of this.active) this.release(obj); 
    this.active.length = 0; 
  }
}

// ==================== 空間分割網格 ====================
class SpatialGrid {
  constructor(w, h, cellSize) {
    this.cellSize = cellSize;
    this.cols = Math.ceil(w / cellSize);
    this.rows = Math.ceil(h / cellSize);
    this.cells = [];
    for (let i = 0; i < this.cols * this.rows; i++) this.cells.push([]);
  }
  
  _idx(cx, cy) { return cy * this.cols + cx; }
  
  clear() {
    for (let i = 0; i < this.cells.length; i++) this.cells[i].length = 0;
  }
  
  insert(entity) {
    if (!entity.alive) return;
    const cx = (entity.x / this.cellSize) | 0;
    const cy = (entity.y / this.cellSize) | 0;
    if (cx >= 0 && cx < this.cols && cy >= 0 && cy < this.rows) {
      this.cells[this._idx(cx, cy)].push(entity);
    }
  }
  
  queryRect(x, y, w, h, out) {
    out.length = 0;
    const cx1 = Math.max(0, (x / this.cellSize) | 0);
    const cy1 = Math.max(0, (y / this.cellSize) | 0);
    const cx2 = Math.min(this.cols - 1, ((x + w) / this.cellSize) | 0);
    const cy2 = Math.min(this.rows - 1, ((y + h) / this.cellSize) | 0);
    
    for (let cy = cy1; cy <= cy2; cy++) {
      for (let cx = cx1; cx <= cx2; cx++) {
        const cell = this.cells[this._idx(cx, cy)];
        for (let i = 0; i < cell.length; i++) out.push(cell[i]);
      }
    }
    return out;
  }
}

const spatialGrid = new SpatialGrid(W, H, CONFIG.GRID.CELL_SIZE);
const _queryBuf = [];

// ==================== 地圖生成 ====================
function generateMap(level) {
  const map = Array.from({length: ROWS}, () => new Uint8Array(COLS));
  const baseR = ROWS - 2, baseC = (COLS / 2) | 0;

  if (G.isVSMode) {
    G.basePos = null;
    G.playerSpawnPos = { x: ((COLS/2)|0)*TILE, y: ((ROWS/2)|0)*TILE };
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) map[r][c] = STEEL;
        else if (rnd() < 0.03) map[r][c] = FOREST;
      }
    }
    return map;
  }

  G.basePos = { r: baseR, c: baseC };
  G.playerSpawnPos = { x: (baseC - 3) * TILE, y: (ROWS - 2) * TILE };
  map[baseR][baseC] = BASE;
  [[-1,-1],[-1,0],[-1,1],[0,-1],[0,1]].forEach(([dr,dc]) => map[baseR+dr][baseC+dc] = BRICK);

  const density = Math.min(0.45, 0.22 + level * 0.012);
  const steelRatio = Math.min(0.35, 0.06 + level * 0.015);
  for (let r = 2; r < ROWS - 2; r++) {
    for (let c = 1; c < COLS - 1; c++) {
      if (r >= ROWS - 4 && c >= baseC - 3 && c <= baseC + 3) continue;
      const roll = rnd();      // 不可命名為 rnd：會蓋掉全域產生器並自我引用（TDZ）
      if (roll < density * 0.55) map[r][c] = BRICK;
      else if (roll < density * (0.55 + steelRatio)) map[r][c] = STEEL;
      else if (roll < density * (0.55 + steelRatio + 0.04)) map[r][c] = WATER;
      else if (roll < density * (0.55 + steelRatio + 0.08)) map[r][c] = FOREST;
    }
  }
  return map;
}







// 離屏快取：基地老鷹是固定圖樣，舊版卻在 render() 每幀逐像素重畫
// （實測 ALIVE 有 127 個非零像素 → 每幀 127 次 fillStyle + 127 次 fillRect = 254 次 canvas API，
//   只為了畫一格 26×26 的圖磚；而且這條路徑在遊戲進行中是無條件執行的）。

function cacheStaticMap() {
  staticCtx.clearRect(0, 0, W, H);
  forestCtx.clearRect(0, 0, W, H);
  G.dynamicTiles = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = G.map[r][c], x = c*TILE, y = r*TILE;
      if (t === BRICK) drawBrickNES(staticCtx, x, y, TILE);
      else if (t === STEEL) drawSteelNES(staticCtx, x, y, TILE);
      else if (t === FOREST) drawForestNES(forestCtx, x, y, TILE);
      else if (t === WATER || t === BASE) {
        G.dynamicTiles.push({ type: t, x, y, r, c });
      }
    }
  }
}

function breakTile(c, r) { 
  G.map[r][c] = EMPTY; 
  staticCtx.clearRect(c*TILE, r*TILE, TILE, TILE); 
}

// ==================== 共用工具 ====================
function rectsOverlap(x1,y1,w1,h1, x2,y2,w2,h2) { 
  return x1<x2+w2 && x1+w1>x2 && y1<y2+h2 && y1+h1>y2; 
}

function clampPos(v) { 
  return Math.round(v / CONFIG.GAMEPLAY.POSITION_PRECISION) * CONFIG.GAMEPLAY.POSITION_PRECISION; 
}

function triggerShake(f, i) { G.shakeTimer = f; G.shakeIntensity = i; }

function addScorePopup(x, y, text) { 
  G.scorePopups.push({ x, y, text, life: 40, vy: -1 }); 
}

function checkTileCollision(x, y, size) {
  const c1 = (x/TILE)|0, r1 = (y/TILE)|0;
  const c2 = ((x+size-1)/TILE)|0, r2 = ((y+size-1)/TILE)|0;
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        const t = G.map[r][c];
        if (t === BRICK || t === STEEL || t === WATER || t === BASE || t === BASE_DEAD) return true;
      }
    }
  }
  return false;
}

// ==================== Tank 類別 ====================
class Tank {
  constructor(x, y, dir, type, isPlayer) {
    this.x = clampPos(x); this.y = clampPos(y); 
    this.dir = dir; this.aimDir = dir;
    this.isPlayer = isPlayer; this.type = type; 
    this.size = TILE - 4;
    this.bulletTimer = 0; this.alive = true; this.moving = false;
    this.flashTimer = 0; 
    this.aiChangeTimer = rnd() * 50; 
    this.aiDir = dir;
    this.lastDist = Infinity;
    this.applyTypeStats();
  }

  applyTypeStats() {
    if (this.isPlayer) {
      this.maxHp = G.playerStats.maxHp;
      this.hp = G.playerStats.hp;
      // 凍緩（FREEZING 詞綴）係數在這裡套用：換關會建立新的玩家 Tank，
      // 若只在外部的 applyPlayerSpeed() 調整，換關後速度就會被重設而失效。
      this.speed = 2.5 * G.playerStats.speedMult * (fx.has('slow') ? 0.5 : 1);
      this.weapon = G.playerStats.weapon || 'NORMAL';
      this.weaponTier = G.playerStats.weaponTier || 0;
      this.pierce = G.playerStats.pierce;
      this.color = '#4a7a2e';
      const baseCD = G.isVSMode ? CONFIG.BULLET.PLAYER_COOLDOWN_VS : CONFIG.BULLET.PLAYER_COOLDOWN;
      this.bulletCooldown = Math.max(3, Math.floor(baseCD / G.playerStats.speedMult));
    } else {
      this.weapon = 'NORMAL'; this.pierce = false;
      if (this.type === 'FAST') { this.speed = 2.2; this.color = '#d4d'; this.hp = this.maxHp = 1; this.bulletCooldown = CONFIG.BULLET.ENEMY_FAST; }
      else if (this.type === 'HEAVY') { this.speed = 0.8; this.color = '#38a'; this.hp = this.maxHp = 4; this.bulletCooldown = CONFIG.BULLET.ENEMY_HEAVY; }
      else if (this.type === 'SUICIDE') { this.speed = 2.0; this.color = '#f50'; this.hp = this.maxHp = 1; this.bulletCooldown = 999; }
      else if (this.type === 'BOSS') {
        this.speed = 0.6; this.color = '#800';
        this.hp = this.maxHp = 15 + G.level*5;
        this.size = TILE * 1.5; this.weapon = 'SPREAD';
        this.bulletCooldown = CONFIG.BULLET.BOSS;
        this.bossPhase = 1;
        this.bossPhaseTimer = 0;
      }
      else {
        this.speed = 1.0 + rnd() * 0.5;
        this.color = '#c33';
        this.hp = this.maxHp = 1;
        this.bulletCooldown = CONFIG.BULLET.ENEMY_NORMAL;
      }
      // 菁英詞綴
      this.elitePrefix = this.elitePrefix || null;
      if (this.elitePrefix && ELITE_PREFIXES[this.elitePrefix]) {
        const prefix = ELITE_PREFIXES[this.elitePrefix];
        this.maxHp = Math.ceil(this.maxHp * 1.5);
        this.hp = this.maxHp;
        this.eliteEffects = prefix;
      }
      // 特殊敵人類型初始化
      this.slowTimer = 0;
      this.shieldHits = this.elitePrefix === 'SHIELDED' ? 3 : 0;
      this.summonTimer = 0;
    }
  }

  update() {
    if (!this.alive) return;
    this.moving = false;
    if (this.bulletTimer > 0) this.bulletTimer--;
    if (this.flashTimer > 0) this.flashTimer--;
  }

  _hasEntityCollision(nx, ny) {
    spatialGrid.queryRect(nx, ny, this.size, this.size, _queryBuf);
    Perf.collisionChecks += _queryBuf.length;
    
    for (let i = 0; i < _queryBuf.length; i++) {
      const o = _queryBuf[i];
      if (o === this || !o.alive) continue;
      if (rectsOverlap(nx, ny, this.size, this.size, o.x, o.y, o.size, o.size)) return true;
    }
    
    if (!this.isPlayer && G.player && G.player.alive) {
      if (rectsOverlap(nx, ny, this.size, this.size, G.player.x, G.player.y, G.player.size, G.player.size)) return true;
    }
    if (this.isPlayer && G.enemies) {
      for (let i = 0; i < G.enemies.length; i++) {
        const e = G.enemies[i];
        if (e && e.alive && rectsOverlap(nx, ny, this.size, this.size, e.x, e.y, e.size, e.size)) return true;
      }
    }
    return false;
  }

  _canMoveTo(nx, ny) {
    if (nx < 1 || nx + this.size > W - 1 || ny < 1 || ny + this.size > H - 1) return false;
    if (checkTileCollision(nx, ny, this.size)) return false;
    return !this._hasEntityCollision(nx, ny);
  }

  move(dir) {
    if (!this.alive) return;
    this.dir = dir; 
    this.moving = true;
    
    if (!this.isPlayer || !G.isVSMode) this.aimDir = dir;

    let nx = clampPos(this.x + DX[dir] * this.speed);
    let ny = clampPos(this.y + DY[dir] * this.speed);

    if (nx < 1 || nx + this.size > W - 1 || ny < 1 || ny + this.size > H - 1) {
      if (this.isPlayer || G.isVSMode) this._trySlide(dir);
      else this.aiChangeTimer = 0;
      return;
    }
    if (checkTileCollision(nx, ny, this.size)) {
      if (this.isPlayer || G.isVSMode) this._trySlide(dir);
      else this.aiChangeTimer = 0;
      return;
    }
    if (this._hasEntityCollision(nx, ny)) {
      if (this.isPlayer || G.isVSMode) this._trySlide(dir);
      else this.aiChangeTimer = 0;
      return;
    }
    
    this.x = nx; this.y = ny;
  }

  _trySlide(dir) {
    const nudges = [2, 3, 4, 6];
    for (const nudge of nudges) {
      for (const sign of [-1, 1]) {
        let tx, ty;
        if (dir === UP || dir === DOWN) {
          tx = clampPos(this.x + sign * nudge);
          ty = clampPos(this.y + DY[dir] * this.speed);
        } else {
          tx = clampPos(this.x + DX[dir] * this.speed);
          ty = clampPos(this.y + sign * nudge);
        }
        if (this._canMoveTo(tx, ty)) { 
          this.x = tx; this.y = ty; 
          return; 
        }
      }
    }
  }

  shoot() {
    if (!this.alive || this.bulletTimer > 0) return;
    WeaponManager.fire(this);
  }

  draw() {
    if (!this.alive) return;

    if (this.isPlayer && this.flashTimer > 30) {
      drawNESShield(this.x, this.y, this.size);
    }

    if (this.flashTimer > 0 && (G.frameCount & 2)) return;

    const s = this.size;
    const x = this.x | 0;
    const y = this.y | 0;
    const trackOffset = (G.frameCount >> 2) & 1;
    // 履帶相位：移動中 0/1 交替；靜止固定用 seg 起點樣式（與原本 (trackOffset && moving) ? 0 : seg 一致）
    const phase = this.moving ? trackOffset : 0;

    // sprite 直接快取在坦克實例上：舊版每幀為每隻坦克組字串 key 再查 Map，
    // 字串串接會產生 rope，而 Map 雜湊必須先把它攤平（每次呼叫都多一次配置）。
    // 18 隻敵人 × 144Hz ≈ 每秒 2600 個短命字串，而組合只有 type × aimDir × phase 約 50 種。
    if (!this._spr || this._sprDir !== this.aimDir || this._sprPhase !== phase || this._sprSize !== s) {
      const key = (this.isPlayer ? 'P' : this.type) + '|' + this.aimDir + '|' + phase + '|' + s;
      let spr = _tankSpriteCache.get(key);
      if (!spr) {
        spr = buildTankSprite(this.isPlayer ? 'PLAYER' : this.type, this.aimDir, phase, s);
        _tankSpriteCache.set(key, spr);
      }
      this._spr = spr; this._sprDir = this.aimDir; this._sprPhase = phase; this._sprSize = s;
    }
    ctx.drawImage(this._spr, x, y);

    // 帶道具的敵人發光：glowTimer 原本只被寫入、沒有任何讀取端 → 玩家看不出哪隻會掉寶
    if (this.glowTimer > 0) {
      this.glowTimer--;
      const R = this.size * 1.8;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.25 + Math.sin(G.frameCount * 0.2) * 0.1;
      ctx.drawImage(glowCanvas('#ffd700'), x + this.size / 2 - R / 2, y + this.size / 2 - R / 2, R, R);
      ctx.restore();
    }

    if (this.elitePrefix && this.eliteEffects) {
      const eff = this.eliteEffects;
      ctx.fillStyle = eff.color;
      ctx.globalAlpha = 0.3 + Math.sin(G.frameCount * 0.1) * 0.2;
      ctx.fillRect(x - 1, y - 1, s + 2, s + 2);
      ctx.globalAlpha = 1;

      ctx.fillStyle = eff.color;
      ctx.font = '8px Arial';
      ctx.fillText(eff.icon, x + 2, y - 3);
    }

    if (this.maxHp > 1) {
      ctx.fillStyle = '#000';
      ctx.fillRect(x, y - 6, s, 3);
      ctx.fillStyle = this.isPlayer ? '#3cf03c' : '#ff4040';
      ctx.fillRect(x, y - 6, (s * (this.hp / this.maxHp)) | 0, 3);
    }
  }
}

// ==================== 坦克 Sprite 離屏快取 ====================
// 本體（履帶/車身/砲塔/砲管/BOSS 標記）靜態預渲染，僅按 型別|方向|相位|尺寸 快取。
// 動態層（elite 特效、HP bar、護盾、受擊閃爍）仍每幀繪製，保持原有視覺。
const _tankSpriteCache = new Map();

function buildTankSprite(type, aimDir, phase, s) {
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(s) + 1;
  cv.height = Math.ceil(s) + 1;
  const c2 = cv.getContext('2d');

  let colMain, colDark, colLight;
  if (type === 'PLAYER') {
    colMain = '#d4a72c';  colLight = '#fce560';  colDark = '#7a5a14';
  } else if (type === 'FAST') {
    colMain = '#dcdce8';  colLight = '#ffffff';  colDark = '#6a6a78';
  } else if (type === 'HEAVY') {
    colMain = '#5a8acc';  colLight = '#9ec0ff';  colDark = '#1c3a6a';
  } else if (type === 'SUICIDE') {
    colMain = '#e84418';  colLight = '#ff8c4a';  colDark = '#7a1a04';
  } else if (type === 'BOSS') {
    colMain = '#a02020';  colLight = '#e84040';  colDark = '#400000';
  } else {
    colMain = '#b8b8b8';  colLight = '#e8e8e8';  colDark = '#4a4a4a';
  }

  const x = 0, y = 0;
  const cx = s / 2;
  const cy = s / 2;
  const isHoriz = (aimDir === LEFT || aimDir === RIGHT);

  const trackW = Math.max(3, (s / 7) | 0);
  const seg = Math.max(2, (s / 6) | 0);
  const trackOffset = phase === 0 ? 0 : 1;

  c2.fillStyle = colDark;
  if (isHoriz) {
    c2.fillRect(x, y, s, trackW);
    c2.fillRect(x, y + s - trackW, s, trackW);
    c2.fillStyle = colMain;
    for (let i = trackOffset ? 0 : seg; i < s; i += seg * 2) {
      c2.fillRect(x + i, y, seg, trackW);
      c2.fillRect(x + i, y + s - trackW, seg, trackW);
    }
  } else {
    c2.fillRect(x, y, trackW, s);
    c2.fillRect(x + s - trackW, y, trackW, s);
    c2.fillStyle = colMain;
    for (let i = trackOffset ? 0 : seg; i < s; i += seg * 2) {
      c2.fillRect(x, y + i, trackW, seg);
      c2.fillRect(x + s - trackW, y + i, trackW, seg);
    }
  }

  const bodyPad = trackW + 1;
  c2.fillStyle = colMain;
  c2.fillRect(x + bodyPad, y + bodyPad, s - bodyPad * 2, s - bodyPad * 2);

  c2.fillStyle = colLight;
  if (isHoriz) {
    c2.fillRect(x + bodyPad, y + bodyPad, s - bodyPad * 2, 1);
  } else {
    c2.fillRect(x + bodyPad, y + bodyPad, 1, s - bodyPad * 2);
  }

  const turretSize = Math.max(6, (s * 0.45) | 0);
  const tx = (cx - turretSize / 2) | 0;
  const ty = (cy - turretSize / 2) | 0;
  c2.fillStyle = colMain;
  c2.fillRect(tx, ty, turretSize, turretSize);
  c2.fillStyle = colLight;
  c2.fillRect(tx, ty, turretSize, 1);
  c2.fillRect(tx, ty, 1, turretSize);
  c2.fillStyle = colDark;
  c2.fillRect(tx, ty + turretSize - 1, turretSize, 1);
  c2.fillRect(tx + turretSize - 1, ty, 1, turretSize);

  const barrelW = Math.max(2, (s / 8) | 0);
  const barrelL = Math.max(6, (s * 0.45) | 0);
  c2.fillStyle = colLight;
  if (aimDir === UP) {
    c2.fillRect((cx - barrelW / 2) | 0, y, barrelW, (cy - y) | 0);
  } else if (aimDir === DOWN) {
    c2.fillRect((cx - barrelW / 2) | 0, cy | 0, barrelW, (y + s - cy) | 0);
  } else if (aimDir === LEFT) {
    c2.fillRect(x, (cy - barrelW / 2) | 0, (cx - x) | 0, barrelW);
  } else {
    c2.fillRect(cx | 0, (cy - barrelW / 2) | 0, (x + s - cx) | 0, barrelW);
  }

  if (type === 'BOSS') {
    c2.fillStyle = colDark;
    c2.fillRect((cx - 2) | 0, (cy - 2) | 0, 4, 4);
  }

  return cv;
}


function drawNESShield(x, y, size) {
  const phase = (G.frameCount >> 1) & 1;
  ctx.save();
  ctx.fillStyle = phase ? '#ffffff' : '#74c0fc';
  const t = 2;
  if (phase) {
    ctx.fillRect(x + size/2 - t/2, y - 2, t, size + 4);
    ctx.fillRect(x - 2, y + size/2 - t/2, size + 4, t);
  } else {
    ctx.fillRect(x, y, t, t);
    ctx.fillRect(x + size - t, y, t, t);
    ctx.fillRect(x, y + size - t, t, t);
    ctx.fillRect(x + size - t, y + size - t, t, t);
    ctx.fillRect(x + size/2 - t/2, y - 2, t, t);
    ctx.fillRect(x + size/2 - t/2, y + size, t, t);
    ctx.fillRect(x - 2, y + size/2 - t/2, t, t);
    ctx.fillRect(x + size, y + size/2 - t/2, t, t);
  }
  ctx.restore();
}

// ==================== 子彈邏輯 ====================
function updateBullet(b) {
  if (!b.alive) return;

  // 有壽命的子彈（OMEGA 光束段）：laserLife 先前只被寫入、從不遞減，
  // 於是每次射擊留下 29 顆 vx=vy=0、ignoreTiles=true 的永久子彈 → 池無界成長、FPS 崩落。
  if (b.laserLife > 0 && --b.laserLife <= 0) { b.alive = false; return; }

  // 記錄移動前的位置，用於碰撞回溯
  const prevX = b.x, prevY = b.y;

  b.x += b.vx * b.speed;
  b.y += b.vy * b.speed;

  if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
    b.alive = false; return;
  }

  const bc = ((b.x + 3) / TILE) | 0, br = ((b.y + 3) / TILE) | 0;
  if (br >= 0 && br < ROWS && bc >= 0 && bc < COLS && !b.ignoreTiles) {
    const t = G.map[br][bc];
    if (t === BRICK) {
      b.alive = false; breakTile(bc, br);
      spawnExplosion(b.x, b.y, 'spark');
      Sound.hitBrick();
      return;
    }
    if (t === STEEL) {
      b.alive = false;
      spawnExplosion(b.x, b.y, 'spark');
      Sound.hitSteel();
      return;
    }
    if (t === BASE) {
      b.alive = false;
      if (fx.has('wall')) {
        spawnExplosion(b.x, b.y, 'spark');
        return;
      }
      G.map[br][bc] = BASE_DEAD;
      G.baseDestroyed = true;
      for (let i = 0; i < G.dynamicTiles.length; i++) {
        const dt = G.dynamicTiles[i];
        if (dt.r === br && dt.c === bc) { dt.type = BASE_DEAD; break; }
      }
      spawnExplosion(bc*TILE+13, br*TILE+13, 'big');
      triggerShake(20, 8);
      Sound.baseDestroyed();
      return;
    }
  }

  if (b.isPlayer) {
    // 擴大查詢範圍：覆蓋子彈移動距離 + 安全邊際
    const speed = b.speed;
    const margin = b.size + TILE; // 查詢範圍覆蓋整個格子
    const qx = Math.min(prevX, b.x) - margin;
    const qy = Math.min(prevY, b.y) - margin;
    const qw = Math.abs(b.x - prevX) + margin * 2;
    const qh = Math.abs(b.y - prevY) + margin * 2;
    spatialGrid.queryRect(qx, qy, qw, qh, _queryBuf);
    Perf.collisionChecks += _queryBuf.length;

    for (let i = 0; i < _queryBuf.length; i++) {
      const t = _queryBuf[i];
      if (!t.alive || t.isPlayer) continue;
      if (b.hitTanks.indexOf(t) !== -1) continue;

      // 掃描碰撞檢測：沿子彈軌跡取樣，避免高速穿透
      let hit = false;
      const steps = Math.max(1, Math.ceil(b.speed / 4)); // 每 4px 取樾
      for (let s = 0; s <= steps; s++) {
        const tLerp = s / steps;
        const bx = prevX + (b.x - prevX) * tLerp;
        const by = prevY + (b.y - prevY) * tLerp;
        const dx = (bx + b.size/2) - (t.x + t.size/2);
        const dy = (by + b.size/2) - (t.y + t.size/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < (b.size + t.size) * 0.45) {
          hit = true;
          break;
        }
      }

      if (hit) {
        handleBulletHit(b, t);
        if (!b.alive) return;
      }
    }
  } else {
    if (G.player && G.player.alive && G.player.flashTimer === 0) {
      Perf.collisionChecks++;
      // 掃描碰撞檢測：玩家子弹
      let hit = false;
      const steps = Math.max(1, Math.ceil(b.speed / 4));
      for (let s = 0; s <= steps; s++) {
        const tLerp = s / steps;
        const bx = prevX + (b.x - prevX) * tLerp;
        const by = prevY + (b.y - prevY) * tLerp;
        const dx = (bx + b.size/2) - (G.player.x + G.player.size/2);
        const dy = (by + b.size/2) - (G.player.y + G.player.size/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        const hitDist = (b.size + G.player.size) * 0.45;
        if (dist < hitDist) {
          hit = true;
          break;
        }
      }
      if (hit) {
        handleBulletHit(b, G.player);
      }
    }
  }
}

function handleBulletHit(b, t) {
  // t 是被击中的目标
  // b.isPlayer === true  → 玩家子弹击中敌人
  // b.isPlayer === false → 敌人子弹击中玩家

  // 装甲护盾：只在玩家目标时生效
  if (t === G.player) {
    if (t.shieldHits > 0) {
      t.shieldHits--;
      b.alive = false;
      spawnExplosion(b.x, b.y, 'shield');
      return;
    }
    // BARRIER：被打到時吸收該次傷害，並開啟 2 秒（120 tick）護盾；護盾期間再被打也一律吸收。
    // 舊版 barrierTimer 全檔沒有任何遞減（grep `barrierTimer--` = 0 次），所以第一次被打到
    // 之後就永久無敵 —— 玩家不會掉血、不會死，整局的平衡與計分都失去意義。
    if (G.playerStats.passives.includes('BARRIER') || fx.has('barrier')) {
      b.alive = false;
      spawnExplosion(b.x, b.y, 'shield');
      if (!fx.has('barrier')) fx.set('barrier', 120);
      return;
    }
    if (fx.has('invul')) {
      b.alive = false;
      spawnExplosion(b.x, b.y, 'shield');
      return;
    }
    // FREEZING 詞綴：凍緩 2 秒；到期時把速度還原（效果系統的 onExpire，不再需要 _slowed 旗標）
    if (b.freezing) {
      fx.set('slow', 120, { onExpire: applyPlayerSpeed });
      applyPlayerSpeed();
    }
  }

  // 计算伤害倍率
  let powerMult = 1;

  // RAGE 被动：受伤加倍（被击中时）
  if (G.playerStats.passives.includes('RAGE') && t === G.player) {
    const hpRatio = G.playerStats.hp / G.playerStats.maxHp;
    powerMult = hpRatio < 0.5 ? 2 : hpRatio < 0.75 ? 1.5 : 1;
  }

  // RAGE 攻击增益：玩家生命越低伤害越高
  if (b.isPlayer && G.playerStats.passives.includes('RAGE')) {
    const hpRatio = G.playerStats.hp / G.playerStats.maxHp;
    powerMult *= hpRatio < 0.5 ? 2 : hpRatio < 0.75 ? 1.5 : 1;
  }

  // WEAKEN 被动：对 Boss 额外伤害（只在敌人被玩家击中时）
  if (b.isPlayer && G.playerStats.passives.includes('WEAKEN') && t.type === 'BOSS') {
    powerMult *= 1.5;
  }

  b.hitTanks.push(t);
  if (!b.pierce) b.alive = false;

  // CLUSTER 分裂：擊中後分裂成 5 發小彈
  if (b.isPlayer && G.playerStats.weapon === 'CLUSTER' && !b._isChild) {
    const childPower = b.power * 0.5;
    const dir = b.dir;
    for (let i = 0; i < 5; i++) {
      const angle = 0.3 * (i - 2);
      const cos = Math.cos(angle), sin = Math.sin(angle);
      const c = bulletsPool.acquire();
      c.x = t.x + t.size/2 - 3; c.y = t.y + t.size/2 - 3;
      c.dir = dir;
      c.isPlayer = true;
      c.vx = DX[dir] * cos - DY[dir] * sin;
      c.vy = DX[dir] * sin + DY[dir] * cos;
      c.speed = CONFIG.BULLET.SPEED_PLAYER * 0.8;
      c.power = childPower;
      c._isChild = true;
    }
  }

  // CHAIN 被动：子彈彈跳到附近敵人
  if (b.isPlayer && G.playerStats.passives.includes('CHAIN') && !b._isChild) {
    spawnChainBullet(t.x + t.size/2, t.y + t.size/2, t);
  }

  t.hp -= b.power * powerMult;
  t.flashTimer = CONFIG.GAMEPLAY.PLAYER_HIT_FLASH;
  spawnExplosion(b.x, b.y, 'spark');

  if (t.hp <= 0) {
    t.alive = false;

    if (t.elitePrefix === 'EXPLOSIVE') {
      spawnExplosion(t.x + t.size/2, t.y + t.size/2, 'big');
      triggerShake(8, 6);
      if (G.player && G.player.alive && G.player.flashTimer === 0) {
        G.playerStats.hp -= 0.5;
      }
    }

    spawnExplosion(t.x + t.size/2, t.y + t.size/2, t.type === 'BOSS' ? 'big' : 'tank');
    if (t.type === 'BOSS') { triggerShake(15, 6); Sound.bigExplode(); }
    else Sound.explode();

    if (!b.isPlayer && t === G.player) {
      G.playerStats.hp -= 1;
      triggerShake(10, 5);
      Sound.hitPlayer();
      updateHUD();

      if (G.playerStats.hp <= 0) {
        setTimeout(showGameOver, 1000);
      } else {
        G.player.alive = true;
        G.player.flashTimer = CONFIG.GAMEPLAY.PLAYER_RESPAWN_INVUL;
        G.player.x = G.playerSpawnPos.x;
        G.player.y = G.playerSpawnPos.y;
        G.player.hp = G.playerStats.hp;
        spawnExplosion(G.player.x, G.player.y, 'spark');
      }
    } else {
      if (G.aliveEnemies > 0) G.aliveEnemies--;
      const pts = t.type === 'BOSS' ? 1000 : (t.type === 'SUICIDE' ? 50 : (t.elitePrefix ? 150 : 100));
      G.score += pts;
      addScorePopup(t.x, t.y, `+${pts}`);
      addCombo(true);

      if (t.hasPowerUp && t.powerUpType) {
        G.powerUps.push({
          type: t.powerUpType,
          x: t.x + t.size/2,
          y: t.y + t.size/2,
          life: 600,
          maxLife: 600,
          alive: true
        });
      }

      if (b.isPlayer && G.playerStats.route === 'C') {
        applyPassiveEffects(t, b, 'laser_kill');
      }

      if (G.playerStats.passives.includes('VAMPIRE')) {
        G.playerStats.hp = Math.min(G.playerStats.maxHp, G.playerStats.hp + 0.2);
      }

      updateHUD();

      checkLevelComplete();
    }
  }
}

// ==================== 粒子系統 ====================
function spawnExplosion(x, y, type) {
  let count;
  if (type === 'big') count = CONFIG.PARTICLE.BIG_COUNT;
  else if (type === 'tank') count = CONFIG.PARTICLE.TANK_DEATH_COUNT;
  else if (type === 'shield') count = 8;
  else count = CONFIG.PARTICLE.SPARK_COUNT;
  
  for (let i = 0; i < count; i++) {
    const angle = rnd() * Math.PI * 2;
    const speed = rnd() * (type === 'big' ? 4 : 2) + 0.5;

    const spark = particlesPool.acquire();
    spark.type = 'spark'; 
    spark.x = x; spark.y = y;
    spark.vx = Math.cos(angle) * speed; 
    spark.vy = Math.sin(angle) * speed;
    spark.life = spark.maxLife = 15 + rnd() * 20; 
    spark.size = rnd() * 3 + 1.5;
    
    if (type === 'shield') spark.color = '#5cd8ff';
    else spark.color = rnd() > 0.5 ? '#ffaa00' : '#ff3300';

    if (type === 'big' || type === 'tank') {
      const smoke = particlesPool.acquire();
      smoke.type = 'smoke'; 
      smoke.x = x; smoke.y = y;
      smoke.vx = Math.cos(angle) * speed * 0.3; 
      smoke.vy = Math.sin(angle) * speed * 0.3 - 0.5;
      smoke.life = smoke.maxLife = 30 + rnd() * 30; 
      smoke.size = rnd() * 4 + 4;
      smoke.color = 'rgba(100, 100, 100, 0.5)';
    }
  }
}

function updateParticles() {
  const arr = particlesPool.active;
  for (let i = 0; i < arr.length; i++) {
    const p = arr[i];
    if (!p.alive) continue;
    p.x += p.vx; p.y += p.vy; p.life--;
    p.vx *= 0.94; p.vy *= 0.94;
    if (p.type === 'smoke') p.size += 0.1;
    if (p.life <= 0) p.alive = false;
  }
  particlesPool.sweep();
}


function updateScorePopups() {
  for (let i = G.scorePopups.length - 1; i >= 0; i--) {
    const p = G.scorePopups[i];
    p.y += p.vy; p.vy *= 0.95; p.life--;
    if (p.life <= 0) G.scorePopups.splice(i, 1);
  }
}

// ==================== Director System（局內事件） ====================

function updateDirector() {
  if (!G.isVSMode || G.frameCount % 300 !== 0) return;

  if (rnd() < 0.15 && G.directorEvents.length === 0) {
    const events = Object.keys(DIRECTOR_EVENTS);
    const eventName = events[(rnd() * events.length) | 0];
    const event = DIRECTOR_EVENTS[eventName];
    event.activate();
    G.directorEvents.push({ name: event.name, desc: event.desc, life: event.duration, type: eventName });
  }
}

function updateDirectorEvents() {
  for (let i = G.directorEvents.length - 1; i >= 0; i--) {
    const ev = G.directorEvents[i];
    ev.life--;

    if (ev.life <= 0 && ev.type && DIRECTOR_EVENTS[ev.type] && DIRECTOR_EVENTS[ev.type].deactivate) {
      // 事件結束時呼叫 deactivate：SURGE 會把 spawnInterval 減半，舊版從來不還原 →
      // 敵軍生成速率在第一次 SURGE 之後就永久加倍（deactivate 宣告了卻沒有任何呼叫端）。
      DIRECTOR_EVENTS[ev.type].deactivate();
    }

    if (ev.type === 'airdrop') {
      // 舊版這裡是空分支：玩家看到「📦 空投來了」卻什麼都沒發生。
      // 空投箱落地時掉一個道具（用既有的 POWER_UPS 池與掉落清單）。
      if (ev.life % 30 === 0 && ev.life > 0) {
        const pool = COMMON_DROPS;
        const type = pool[(rnd() * pool.length) | 0];
        const px = Math.max(TILE, Math.min(W - TILE * 2, ev.x + (rnd() - 0.5) * TILE * 4));
        const py = Math.max(TILE, Math.min(H - TILE * 2, ev.y + (rnd() - 0.5) * TILE * 4));
        G.powerUps.push({ type, x: px, y: py, life: 600, maxLife: 600, alive: true });
      }
    } else if (ev.type === 'orbital') {
      ev.timer++;
      if (ev.timer % 60 === 0) {
        ev.stage++;
        const x = rnd() * W;
        const y = rnd() * H;
        ev.targets.push({ x, y, stage: ev.stage });
      }
      if (ev.timer > 240) {
        for (const t of ev.targets) {
          spawnExplosion(t.x, t.y, 'big');
        }
        ev.targets = [];
      }
    } else if (ev.type === 'train') {
      ev.x += 3;
      if (ev.x > W) ev.life = 0;
    }

    if (ev.life <= 0) {
      G.directorEvents.splice(i, 1);
    }
  }
}

// 地圖事件狀態
let mapEventState = {
  active: false,
  type: null,
  timer: 0,
  duration: 0,
  volcanoTimer: 0,
  iceFriction: false,
  volcanoTargets: []
};

function rollMapEvent() {
  if (!G.isVSMode || G.level < 3) return null;
  if (rnd() < 0.2) {
    const ev = MAP_EVENTS[(rnd() * MAP_EVENTS.length) | 0];
    return ev;
  }
  return null;
}

function activateMapEvent(ev) {
  mapEventState.active = true;
  mapEventState.type = ev.id;
  mapEventState.timer = ev.duration;
  mapEventState.duration = ev.duration;
  mapEventState.volcanoTimer = 0;
  mapEventState.volcanoTargets = [];
  mapEventState.iceFriction = false;

  if (ev.id === 'ICE') G.playerStats.speedMult *= 0.6; 
  if (ev.id === 'EMP') {
    for (const b of bulletsPool.active) {
      if (b.isPlayer && b.alive) b.speed *= 0.5;
    }
  }
  addScorePopup(W / 2, H / 2 - 50, `${ev.name} 事件!`);
}

function updateMapEvent() {
  if (!mapEventState.active) return;
  mapEventState.timer--;

  switch (mapEventState.type) {
    case 'DESERT':
      break;

    case 'ICE':
      if (G.player && G.player.alive && G.player.moving) {
        G.player.moving = true;
      }
      break;

    case 'VOLCANIC':
      mapEventState.volcanoTimer++;
      if (mapEventState.volcanoTimer % 90 === 0) {
        const rx = rnd() * (W - TILE * 4) + TILE * 2;
        const ry = rnd() * (H - TILE * 4) + TILE * 2;
        mapEventState.volcanoTargets.push({ x: rx, y: ry, life: 60 });
        if (G.player && G.player.alive && Math.hypot(G.player.x - rx, G.player.y - ry) < TILE * 3) {
          G.playerStats.hp -= 0.3;
          triggerShake(5, 3);
        }
        for (const e of G.enemies) {
          if (e.alive && Math.hypot(e.x - rx, e.y - ry) < TILE * 2) {
            e.hp -= 1;
          }
        }
      }
      for (let i = mapEventState.volcanoTargets.length - 1; i >= 0; i--) {
        const vt = mapEventState.volcanoTargets[i];
        vt.life--;
        if (vt.life <= 0) mapEventState.volcanoTargets.splice(i, 1);
      }
      break;

    case 'EMP':
      break;

    case 'NIGHT':
      break;

    case 'TOXIC':
      if (G.frameCount % 60 === 0 && G.player && G.player.alive) {
        G.playerStats.hp -= 0.15;
      }
      break;
  }

  if (mapEventState.timer <= 0) {
    deactivateMapEvent();
  }
}

function deactivateMapEvent() {
  const evType = mapEventState.type;
  mapEventState.active = false;
  mapEventState.type = null;

  if (evType === 'ICE') {
    G.playerStats.speedMult /= 0.6; 
  }
  if (evType === 'EMP') {
  }
}

let _nightGradient = null, _nightGradientX = 0, _nightGradientY = 0;

function drawMapEvent() {
  if (!mapEventState.active) return;

  switch (mapEventState.type) {
    case 'DESERT':
      ctx.fillStyle = 'rgba(204,136,68,0.05)';
      ctx.fillRect(0, 0, W, H);
      break;

    case 'ICE':
      ctx.fillStyle = 'rgba(136,204,255,0.04)';
      ctx.fillRect(0, 0, W, H);
      break;

    case 'VOLCANIC':
      ctx.fillStyle = 'rgba(255,68,34,0.06)';
      ctx.fillRect(0, 0, W, H);
      for (const vt of mapEventState.volcanoTargets) {
        const alpha = vt.life / 60;
        ctx.fillStyle = `rgba(255,100,0,${alpha * 0.4})`;
        ctx.beginPath();
        ctx.arc(vt.x, vt.y, TILE * 1.5 * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,200,0,${alpha * 0.6})`;
        ctx.beginPath();
        ctx.arc(vt.x, vt.y, TILE * 0.8 * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
      break;

    case 'EMP':
      ctx.fillStyle = 'rgba(170,68,255,0.04)';
      ctx.fillRect(0, 0, W, H);
      break;

    case 'NIGHT':
      ctx.fillStyle = 'rgba(0,0,20,0.55)';
      ctx.fillRect(0, 0, W, H);
      if (G.player && G.player.alive) {
        // 漸層只在玩家移動超過 8px 時重建：舊版每幀都 createRadialGradient + 兩次 addColorStop
        // （字串解析）＋ 520×520 全螢幕漸層填色，NIGHT 一觸發就是連續 10 秒的掉幀。
        const npx = G.player.x + TILE / 2, npy = G.player.y + TILE / 2;
        if (!_nightGradient || Math.abs(npx - _nightGradientX) > 8 || Math.abs(npy - _nightGradientY) > 8) {
          _nightGradient = ctx.createRadialGradient(npx, npy, 0, npx, npy, TILE * 8);
          _nightGradient.addColorStop(0, 'rgba(0,0,0,0)');
          _nightGradient.addColorStop(1, 'rgba(0,0,20,0.55)');
          _nightGradientX = npx; _nightGradientY = npy;
        }
        ctx.fillStyle = _nightGradient;
        ctx.fillRect(0, 0, W, H);
      }
      break;

    case 'TOXIC':
      ctx.fillStyle = 'rgba(68,255,68,0.04)';
      ctx.fillRect(0, 0, W, H);
      break;
  }
}

// ==================== COMBO 系統 ====================
function addCombo(kill = true) {
  if (!kill) return;
  G.playerStats.combo++;
  fx.set('combo', 120);

  const bonus = Math.min(G.playerStats.combo, 10) * 0.1;
  G.score += Math.floor((10 + G.level * 2) * (1 + bonus));

  if (G.playerStats.combo >= 10) {
    triggerShake(3, 5);
    addScorePopup(G.player.x, G.player.y - 20, '🔥 COMBO x10!');
  }
}


// ==================== 經濟系統 ====================
function getDynamicPrice(basePrice) {
  const turretCount = G.summonEntities.filter(e => e.type === 'turret').length;
  const priceMult = 1 + turretCount * 0.15;
  return Math.floor(basePrice * priceMult);
}

function updateEconomy() {
  if (G.frameCount % 600 === 0) {
    const interest = Math.floor(G.permanentStats.scr * 0.02);
    G.permanentStats.scr += interest;
  }
}

// ==================== 特殊敵人 AI ====================
function updateSpecialEnemyAI(e) {
  if (!e.alive) return;

  if (e.type === 'SNIPER') {
    if (G.player && G.player.alive) {
      const dx = G.player.x - e.x, dy = G.player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist > TILE * 8) {
        e.aimDir = Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? RIGHT : LEFT)
          : (dy > 0 ? DOWN : UP);
        if (G.frameCount % 90 === 0) e.shoot();
      }
    }
  }
  if (e.type === 'ENGINEER') {
    e.summonTimer = (e.summonTimer || 0) + 1;
    if (e.summonTimer >= 180) {
      e.summonTimer = 0;
      spawnEnemyAt(e.x, e.y);
    }
  }
  if (e.type === 'INTERFERER') {
    if (G.frameCount % 120 === 0 && G.player && G.player.alive) {
      G.summonEntities.push({
        type: 'bomb', x: G.player.x, y: G.player.y,
        life: 90, maxLife: 90, damage: 3, alive: true
      });
    }
  }
  if (e.type === 'GUARD') {
    if (G.player && G.player.alive) {
      const dx = G.player.x - e.x, dy = G.player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist > TILE * 6) {
        e.aimDir = Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? RIGHT : LEFT)
          : (dy > 0 ? DOWN : UP);
        e.move(e.aimDir);
      } else if (dist < TILE * 3) {
        e.aimDir = Math.abs(dx) > Math.abs(dy)
          ? (dx < 0 ? RIGHT : LEFT)
          : (dy < 0 ? DOWN : UP);
        e.move(e.aimDir);
      }
    }
  }
  if (e.type === 'MINELAYER') {
    e.mineTimer = (e.mineTimer || 0) + 1;
    if (e.mineTimer >= 60 && G.player && G.player.alive) {
      e.mineTimer = 0;
      G.summonEntities.push({
        type: 'mine', x: e.x, y: e.y,
        life: 600, maxLife: 600, damage: 2, alive: true
      });
    }
  }
}


function assignPowerUpDrop(e) {
  if (rnd() < 0.3) {
    e.hasPowerUp = true;
    let powerTypes = [];
    const playerRoute = G.playerStats.route;

    if (playerRoute) {
      const routeWeapons = Object.keys(WEAPON_TREE).filter(k => WEAPON_TREE[k].route === playerRoute);
      const playerWeapon = G.playerStats.weapon;
      const currentTier = WEAPON_TREE[playerWeapon]?.tier || 0;
      const availableWeapons = routeWeapons.filter(w => (WEAPON_TREE[w].tier || 0) <= currentTier + 1);
      if (availableWeapons.length > 0) {
        powerTypes = availableWeapons.map(w => w + '_DROP').filter(t => POWER_UPS[t]);
      }
    }

    if (powerTypes.length === 0) powerTypes = [...WEAPON_DROPS_T1];

    if (rnd() < 0.3 && G.playerStats.weaponTier >= 2) {
      powerTypes = powerTypes.concat(WEAPON_DROPS_T2);
    }

    // 15% 機率掉落非武器道具（BOMB/WALL/STAR 等）
    if (rnd() < 0.15) {
      e.powerUpType = COMMON_DROPS[(rnd() * COMMON_DROPS.length) | 0];
    } else {
      e.powerUpType = powerTypes[(rnd() * powerTypes.length) | 0];
    }
    e.glowTimer = 30;
  }
}

function spawnEnemyAt(x, y) {
  if (G.enemies.length >= G.maxEnemies) return;
  const types = ['NORMAL', 'FAST', 'HEAVY'];
  const type = types[(rnd() * types.length) | 0];
  const e = new Tank(
    clampPos(x + (rnd() - 0.5) * TILE * 4),
    clampPos(y + (rnd() - 0.5) * TILE * 4),
    (rnd() * 4) | 0, type, false
  );
  assignPowerUpDrop(e);
  G.enemies.push(e);
  G.aliveEnemies++;
}

// ==================== AI 系統（擴展菁英/BOSS） ====================

// 敌人排斥机制 - 防止互相挤压
Tank.prototype.applyRepulsion = function() {
  if (!this.alive) return;
  const range = this.size * 1.5;
  spatialGrid.queryRect(this.x - range, this.y - range, range * 2, range * 2, _queryBuf);
  for (const other of _queryBuf) {
    if (other === this || !other.alive || other.isPlayer) continue;
    const dx = this.x - other.x, dy = this.y - other.y;
    const dist = Math.sqrt(dx * dx + dy * dy);   // 熱路徑（每敵人每幀）不用 Math.hypot
    if (dist < this.size && dist > 0) {
      const push = 0.5;
      this.x += (dx / dist) * push;
      this.y += (dy / dist) * push;
    }
  }
};

function updateEnemyAI(e) {
  e.update();

  // 1. 排斥机制 - 先处理位置避免挤压
  e.applyRepulsion();

  let speedMult = 1;
  if (e.slowTimer > 0) { e.slowTimer--; speedMult = 0.5; }
  if (e.elitePrefix === 'BERSERKER') speedMult *= 1.8;
  if (e.elitePrefix === 'REGEN' && G.frameCount % 60 === 0) {
    e.hp = Math.min(e.maxHp, e.hp + 0.1);
  }
  if (e.elitePrefix === 'SUMMONER') {   // 舊版寫成 'SUMMON'，與 ELITE_PREFIXES 的 key 不符 → 召喚詞綴永遠不發動
    e.summonTimer = (e.summonTimer || 0) + 1;
    if (e.summonTimer >= 180) { e.summonTimer = 0; spawnEnemy(); }
  }

  if (e.type === 'BOSS') {
    e.bossPhaseTimer = (e.bossPhaseTimer || 0) + 1;
    const hpRatio = e.hp / e.maxHp;
    if (hpRatio <= 0.25 && e.bossPhase < 4) { e.bossPhase = 4; triggerShake(10, 5); }
    else if (hpRatio <= 0.5 && e.bossPhase < 3) { e.bossPhase = 3; for (let i = 0; i < 5; i++) spawnEnemy(); }
    else if (hpRatio <= 0.75 && e.bossPhase < 2) { e.bossPhase = 2; e.speed *= 1.5; }
    if (G.frameCount % 30 === 0) e.shoot();
  }

  if (SPECIAL_ENEMY_TYPES.has(e.type)) {
    updateSpecialEnemyAI(e);
  }

  // 2. AI 方向更新
  if (G.isVSMode && G.player && G.player.alive) {
    if (G.frameCount % CONFIG.AI.VS_UPDATE_INTERVAL === 0 || e.aiChangeTimer <= 0) {
      const dx = G.player.x - e.x;
      const dy = G.player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist <= CONFIG.AI.VISION_RANGE * 1.5) {
        e.aiDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
        if (Math.abs(dist - e.lastDist) < 0.5) e.aiDir = (e.aiDir + (rnd() < 0.5 ? 1 : 3)) % 4;
        e.lastDist = dist;
      } else {
        if (--e.aiChangeTimer <= 0) { e.aiDir = (rnd() * 4) | 0; e.aiChangeTimer = CONFIG.AI.CHANGE_INTERVAL + rnd() * 30; }
      }
    }
  } else if (--e.aiChangeTimer <= 0) {
    if (e.type === 'SUICIDE' && G.basePos) {
      const dx = G.basePos.c*TILE - e.x;
      const dy = G.basePos.r*TILE - e.y;
      e.aiDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
    } else {
      if (rnd() < 0.4 && G.player && G.player.alive) {
        const dx = G.player.x - e.x;
        const dy = G.player.y - e.y;
        e.aiDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
      } else { e.aiDir = (rnd() * 4) | 0; }
    }
    e.aiChangeTimer = CONFIG.AI.CHANGE_INTERVAL + rnd() * 50;
  }

  const actualSpeed = e.speed * speedMult;
  const savedSpeed = e.speed;
  e.speed = actualSpeed;
  e.move(e.aiDir);
  e.speed = savedSpeed;

  const shootChance = G.isVSMode ? 0.005 : 0.02;
  if (rnd() < shootChance) e.shoot();
}

// ==================== 敵人生成 ====================
function spawnEnemy() {
  if (G.baseDestroyed) return;
  
  let sx = -1, sy = -1;
  const isBoss = (!G.isVSMode && G.level % CONFIG.GAMEPLAY.BOSS_LEVEL_INTERVAL === 0 && G.enemiesSpawned === G.maxEnemies - 1);

  if (G.isVSMode) {
    const edge = (rnd() * 4) | 0;
    if (edge === 0) { sx = TILE + rnd()*(W-TILE*3); sy = TILE; }
    else if (edge === 1) { sx = W-TILE*2; sy = TILE + rnd()*(H-TILE*3); }
    else if (edge === 2) { sx = TILE + rnd()*(W-TILE*3); sy = H-TILE*2; }
    else { sx = TILE; sy = TILE + rnd()*(H-TILE*3); }
    
    sx = ((sx/TILE)|0)*TILE; 
    sy = ((sy/TILE)|0)*TILE;

    let free = true;
    spatialGrid.queryRect(sx, sy, TILE, TILE, _queryBuf);
    for (let i = 0; i < _queryBuf.length; i++) {
      if (rectsOverlap(_queryBuf[i].x, _queryBuf[i].y, TILE, TILE, sx, sy, TILE, TILE)) {
        free = false; break;
      }
    }
    if (G.player && G.player.alive && rectsOverlap(G.player.x, G.player.y, G.player.size, G.player.size, sx, sy, TILE, TILE)) free = false;
    if (!free) sx = -1;
  } else {
    const pts = [[TILE,TILE], [TILE,((COLS/2)|0)*TILE], [TILE,(COLS-1)*TILE]];
    
    if (isBoss) {
      let centerFree = true;
      spatialGrid.queryRect(pts[1][1], pts[1][0], TILE, TILE, _queryBuf);
      for (let i = 0; i < _queryBuf.length; i++) {
        if (rectsOverlap(_queryBuf[i].x, _queryBuf[i].y, TILE, TILE, pts[1][1], pts[1][0], TILE, TILE)) {
          centerFree = false; break;
        }
      }
      if (G.player && G.player.alive && rectsOverlap(G.player.x, G.player.y, G.player.size, G.player.size, pts[1][1], pts[1][0], TILE, TILE)) centerFree = false;
      if (centerFree) { sx = pts[1][1]; sy = pts[1][0]; }
    }
    
    if (sx < 0) {
      shuffle(pts);
      for (const sp of pts) {
        let free = true;
        spatialGrid.queryRect(sp[1], sp[0], TILE, TILE, _queryBuf);
        for (let i = 0; i < _queryBuf.length; i++) {
          if (rectsOverlap(_queryBuf[i].x, _queryBuf[i].y, TILE, TILE, sp[1], sp[0], TILE, TILE)) {
            free = false; break;
          }
        }
        if (G.player && G.player.alive && rectsOverlap(G.player.x, G.player.y, G.player.size, G.player.size, sp[1], sp[0], TILE, TILE)) free = false;
        if (free) { sx = sp[1]; sy = sp[0]; break; }
      }
    }
  }

  if (sx < 0) { 
    G.spawnTimer = 15; 
    return; 
  }

  let type = 'NORMAL';
  if (G.isVSMode) {
    const phase = Math.floor((G.frameCount - G.vsModeStartFrame) / 600);
    const roll = rnd();     // 同上：避免與全域 rnd 同名
    if (phase >= 2 && roll < 0.15) type = 'HEAVY';
    else if (roll < 0.35) type = 'FAST';
    else type = 'SUICIDE';
  } else if (isBoss) {
    type = 'BOSS';
    G.bossSpawned = true;
  } else if (G.level > 1) {
    const fastChance = Math.min(0.3, 0.1 + G.level * 0.01);
    const heavyChance = Math.min(0.25, 0.05 + G.level * 0.012);
    const suicideChance = Math.min(0.2, 0.05 + G.level * 0.008);
    const r = rnd();
    if (r < fastChance) type = 'FAST';
    else if (r < fastChance + heavyChance) type = 'HEAVY';
    else if (r < fastChance + heavyChance + suicideChance) type = 'SUICIDE';

    // 特殊敵人（SNIPER / ENGINEER / INTERFERER / GUARD / MINELAYER）：
    // updateSpecialEnemyAI 早就寫好了 58 行，但生成端從來沒有產生過這些型別 ——
    // 整段 AI 與 SPECIAL_ENEMY_TYPES 都是死碼。這裡在第 4 關之後以低機率生成。
    if (G.level >= 4 && rnd() < 0.07) {
      const specials = Array.from(SPECIAL_ENEMY_TYPES);
      type = specials[(rnd() * specials.length) | 0];
    }
  }

  let elitePrefix = null;
  if (G.isVSMode && G.level > 3 && rnd() < 0.1) {
    const prefixes = Object.keys(ELITE_PREFIXES);
    elitePrefix = prefixes[(rnd() * prefixes.length) | 0];
  }

  const e = new Tank(sx, sy, DOWN, type, false);
  e.elitePrefix = elitePrefix;
  // 菁英的 1.5 倍血與 eliteEffects（光環/圖示）都在 applyTypeStats 裡，而建構子已經先呼叫過一次
  // → 舊版在 new Tank 之後才指派 elitePrefix，等於這些效果永遠不會生效，菁英看起來跟小兵一樣。
  if (elitePrefix) e.applyTypeStats();
  e.slowTimer = 0;
  e.shieldHits = elitePrefix === 'SHIELDED' ? 3 : 0;
  e.summonTimer = 0;
  assignPowerUpDrop(e);
  G.enemies.push(e);
  G.enemiesSpawned++;
  G.aliveEnemies++;
  G.spawnEffects.push({ x: sx, y: sy, size: TILE, life: 24, maxLife: 24 });
  e.flashTimer = 24;
  Sound.spawn();
  updateHUD();
}

// ==================== 關卡與升級 ====================
function checkLevelComplete() {
  // BOSS 關：王是第 maxEnemies 隻才生，而結算條件是 enemiesSpawned >= maxEnemies-5
  // → 玩家在倒數 5 隻內清光場面就會直接跳關，王從來沒出現過。這裡等王真的出生才允許結算。
  if (!G.isVSMode && G.level % CONFIG.GAMEPLAY.BOSS_LEVEL_INTERVAL === 0 && !G.bossSpawned) return;
  if (G.aliveEnemies <= 0 && G.enemiesSpawned >= G.maxEnemies - 5 && G.player && G.player.alive) {
    G.state = STATE.LEVEL_COMPLETE;
    G.levelClearedCount++;
    if (G.level % CONFIG.GAMEPLAY.UPGRADE_INTERVAL === 0) {
      setTimeout(showUpgradeScreen, 1200);
    } else {
      setTimeout(() => { G.level++; startLevel(); }, 1200);
    }
  }
}

function updateVSModeDifficulty() {
  if (!G.isVSMode || G.frameCount % 60 !== 0) return;
  const elapsed = G.frameCount - G.vsModeStartFrame;
  const phase = Math.floor(elapsed / 600);
  G.spawnInterval = Math.max(8, 18 - phase * 2);
}

function startLevel() {
  G.isVSMode = (G.level % CONFIG.GAMEPLAY.VS_MODE_INTERVAL === 0);

  G.bossSpawned = false;      // 每關重新等待 BOSS 出生（見 checkLevelComplete）

  if (G.level % CONFIG.GAMEPLAY.UPGRADE_INTERVAL !== 0) {
    G.levelWeaponStacks = {};
    G.playerStats.weaponDamageBonus = 0;
  }

  if (G.isVSMode) {
    G.maxEnemies = 50 + G.level * 4;
    G.spawnInterval = 18;
    G.spawnTimer = 10;
    G.vsModeStartFrame = G.frameCount;
  } else {
    const diffMult = 1;
    G.maxEnemies = Math.floor((10 + G.level * 2) * diffMult);
    G.spawnInterval = Math.max(40, Math.floor((120 - G.level * 8) * 1));
    G.spawnTimer = 30;
  }

  G.enemiesSpawned = 0;
  G.aliveEnemies = 0;
  G.baseDestroyed = false;
  bulletsPool.clear();
  particlesPool.clear();
  G.enemies = [];
  G.scorePopups = [];
  G.spawnEffects = [];
  deactivateMapEvent();

  if (G.isVSMode && G.level >= 3 && rnd() < 0.25) {
    const ev = MAP_EVENTS[(rnd() * MAP_EVENTS.length) | 0];
    if (ev) activateMapEvent(ev);
  }

  G.map = generateMap(G.level);
  cacheStaticMap();

  const ps = G.playerStats;
  if (!ps.weapon) ps.weapon = 'NORMAL';
  G.player = new Tank(G.playerSpawnPos.x, G.playerSpawnPos.y, UP, ps.weapon, true);
  G.player.flashTimer = 60;
  G.state = STATE.PLAYING;
  document.getElementById('overlay').classList.add('hidden');
  updateMobileControlsForMode();
  updateHUD();
  Sound.jingleLevelStart();
  const isBossLevel = !G.isVSMode && G.level % CONFIG.GAMEPLAY.BOSS_LEVEL_INTERVAL === 0;
  Music.play(G.isVSMode ? 'BOSS' : isBossLevel ? 'BOSS' : 'LEVEL');
}

function restartGame() {
  G.score = 0;
  G.level = 1;
  G.continues = CONFIG.GAMEPLAY.STARTING_CONTINUES;
  G.levelWeaponStacks = {};
  G.levelClearedCount = 0;

  G.playerStats = {
    weapon: 'NORMAL', weaponTier: 0, pierce: false, speedMult: 1,
    maxHp: 3, hp: 3, route: null,
    passives: [], activeSkill: null,
    heatStacks: 0, rageMultiplier: 1,
    combo: 0, weaponDamageBonus: 0, shopFireRateBonus: 0
  };
  fx.clearAll();                 // 重新開始就該清空所有時效（契約由 verify-core 驗證）
  updateHUD();
  G.summonEntities = [];
  G.mapEvent = null;
  G.directorEvents = [];

}

document.addEventListener('keydown', e => {
  G.keys[e.code] = true;
  const tag = (e.target && e.target.tagName) || '';
  const editable = tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
  const result = applyKey(input, e.code, true, { editable, skillKey: activeSkillKey });
  if (result.preventDefault) e.preventDefault();
  if (!e.repeat) {
    if (e.code === 'F3') { e.preventDefault(); Perf.toggle(); }
    else if (e.code === 'KeyM') { e.preventDefault(); Sound.toggle(); }
    else if (e.code === 'KeyN') { e.preventDefault(); Music.toggle(); }
    else if (e.code === 'KeyP' && (G.state === STATE.PLAYING || G.state === STATE.PAUSED)) { e.preventDefault(); togglePause(); }
    else if (e.code === 'KeyB' && (G.state === STATE.PLAYING || G.state === STATE.PAUSED)) { 
      e.preventDefault(); 
      if (G.state === STATE.PAUSED) togglePause();
      openShop(); 
    }
    else if (e.code === 'Escape' && G.state === STATE.SHOP) { e.preventDefault(); closeShop(); }
    else if ((e.code === 'Enter' || e.code === 'Space') && G.state === STATE.MENU) {
      e.preventDefault();
      const startBtn = document.getElementById('startBtn');
      if (startBtn) startBtn.click();
    }
  }
  // Space／方向鍵的 preventDefault 由平台層依「是否聚焦在 UI 元件」決定
  // （舊版無條件攔截，導致已聚焦的按鈕按 Space 沒反應，只能用 Enter）。
});
document.addEventListener('keyup', e => {
  G.keys[e.code] = false;
  applyKey(input, e.code, false, { skillKey: activeSkillKey });
});

// ── 生命週期：切到背景或失去焦點 ──
// 舊版完全沒有 blur/visibilitychange 監聽（全檔 0 筆）：
//   1. 按著 D 再切到別的分頁／視窗，keyup 永遠收不到 → 回來時坦克一直往同方向跑。
//   2. 分頁被遮住時 rAF 只會被節流、不會停 → 玩家站著挨打直到死亡。
function releaseAllInput() {
  G.keys = {};
  releaseAllKeys(input);          // 平台層：意圖狀態
  releaseTouch(G.touch);          // 平台層：觸控狀態
  if (typeof MobileInput !== 'undefined' && MobileInput.reset) MobileInput.reset();
}
function autoPauseIfPlaying() {
  if (G.state === STATE.PLAYING) { G._autoPaused = true; togglePause(); }
}
function resumeAudioIfNeeded() {
  if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.resume();
}
// 事件 → 意圖的對應集中在 src/platform/lifecycle.js（可在 Node 用 stub 測）
bindLifecycle({

function buyItem(itemId) {
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  if (!item) return;
  if (item.type === 'pierce' && G.playerStats.pierce) {
    addScorePopup(G.player.x, G.player.y - 30, '已擁有穿甲能力!', '#888');
    return;
  }
  // 武器已滿級時要在「扣分之前」擋掉：舊版先扣分、才在 switch 裡發現不能升級，
  // 玩家花 1500 分只換到一句「已達最大等級!」。
  if (item.type === 'weapon') {
    const wp0 = WEAPON_TREE[G.playerStats.weapon];
    if (!wp0 || !wp0.next) {
      addScorePopup(G.player.x, G.player.y - 30, '已達最大等級!', '#ff4444');
      return;
    }
  }
  const price = getShopPrice(item.price);
  if (G.score < price) {
    addScorePopup(G.player.x, G.player.y - 30, '分數不足!', '#ff4444');
    return;
  }
  
  G.score -= price;
  updateHUD();
  
  switch (item.type) {
    case 'health':
      G.playerStats.maxHp++;
      G.playerStats.hp = G.playerStats.maxHp;
      addScorePopup(G.player.x, G.player.y - 30, '生命+1!', '#ff69b4');
      break;
    case 'speed':
      G.playerStats.speedMult *= 1.2;
      addScorePopup(G.player.x, G.player.y - 30, '速度+20%!', '#44ff44');
      break;
    case 'pierce':
      G.playerStats.pierce = true;
      addScorePopup(G.player.x, G.player.y - 30, '穿甲彈!', '#ffaa00');
      break;
    case 'rapid':
      G.playerStats.shopFireRateBonus = (G.playerStats.shopFireRateBonus || 0) + 0.2;
      addScorePopup(G.player.x, G.player.y - 30, '射速+20%!', '#ff6b00');
      break;
    case 'life':
      G.continues++;
      addScorePopup(G.player.x, G.player.y - 30, '額外生命+1!', '#ff0000');
      break;
    case 'wall':
      fx.set('wall', 900);
      addScorePopup(G.player.x, G.player.y - 30, '堡壘 15秒!', '#888888');
      break;
    case 'weapon': {
      const currentWp = WEAPON_TREE[G.playerStats.weapon];
      if (currentWp && currentWp.next) {
        const nextWp = WEAPON_TREE[currentWp.next];
        G.playerStats.weapon = nextWp.id;
        G.playerStats.weaponTier = nextWp.tier;
        G.playerStats.route = nextWp.route;
        if (G.player) G.player.applyTypeStats();
        addScorePopup(G.player.x, G.player.y - 30, nextWp.name, '#ffd700');
      } else {
        addScorePopup(G.player.x, G.player.y - 30, '已達最大等級!', '#ff4444');
      }
      break;
    }
  }
  
  Sound.pulse(660, 0.1, 0.3, 'square');
  openShop();
}

// 畫面流程（暫停／商店／接關／結束）：實作在 src/ui/screens.js
// 「按了按鈕會發生什麼」在這裡一眼看得出來（全部經由 hooks 注入）

const { togglePause, openShop, closeShop, showGameOver, showContinuePrompt, showFinalGameOver } = screens;
const updateMusicIcon = screens.updateMusicIcon;   // 音樂圖示（按鈕與 N 鍵共用）

// ==================== 主迴圈 (固定時間步長 60Hz 模擬, 任意刷新率渲染) ====================
const TICK_HZ = 60;
const TICK_MS = 1000 / TICK_HZ;
let _speedMult = 1;        // URL param: ?speed=N  (1-20)
let _maxUpdatesPerFrame = 5;
let _accumMs = 0;
let _lastFrameTime = 0;

function update() {
  if (window.__botPreUpdate) window.__botPreUpdate();
  G.frameCount++;

  if (G.state === STATE.PLAYING) {
    spatialGrid.clear();
    for (let i = 0; i < G.enemies.length; i++) {
      spatialGrid.insert(G.enemies[i]);
    }

    // 主動技能：按鍵由 ACTIVE_SKILLS[].key 決定（資料是唯一來源），且為邊緣觸發 ——
    // 平台層在 keydown 時設 skillPressed，這裡消費一次（不再每幀查表、也不會按住連發）
    if (input.skillPressed) { input.skillPressed = false; triggerActiveSkill(); }

    // 所有玩家／全域時效的唯一遞減進入點（舊版散在 5 處，其中兩處還在 PLAYING 之外，
    // 導致暫停與商店期間堡壘時間照样流失）。
    const expired = fx.tick();
    if (expired.includes('slow')) applyPlayerSpeed();
    if (expired.includes('combo')) G.playerStats.combo = 0;
    applyPassiveTick();

    if (G.player && G.player.alive) {
      G.player.update();
      let moved = false;

      // 移動方向由平台層的意圖決定（鍵盤優先，其次觸控搖桿）
      const moveDir = dirFromInput(input, G.touch.dir >= 0 ? G.touch.dir : -1);
      if (moveDir >= 0) { G.player.move(moveDir); moved = true; }

      if (!moved) G.player.moving = false;

      for (let i = 0; i < G.powerUps.length; i++) {
        const pu = G.powerUps[i];
        if (!pu.alive) continue;
        if (G.player && G.player.alive &&
            Math.hypot(pu.x - G.player.x - G.player.size/2, pu.y - G.player.y - G.player.size/2) < TILE * 1.5) {
          activatePowerUp(pu.type);
          pu.alive = false;
          addScorePopup(G.player.x, G.player.y, POWER_UPS[pu.type].name);
        }
      }

      if (G.isVSMode) {
        let nearest = null;
        let minDist = Infinity;
        for (let i = 0; i < G.enemies.length; i++) {
          const e = G.enemies[i];
          if (e.alive) {
            const d = Math.hypot(e.x - G.player.x, e.y - G.player.y);
            if (d < minDist) { minDist = d; nearest = e; }
          }
        }
        if (nearest) {
          const dx = nearest.x - G.player.x;
          const dy = nearest.y - G.player.y;
          G.player.aimDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
          G.player.shoot();
        }
      } else {
        if (input.fire || G.touch.fire) G.player.shoot();
      }
    }

    updateDirector();
    updateDirectorEvents();

    updateVSModeDifficulty();

    if (mapEventState.active) {
      updateMapEvent();
    }

    updateSummonEntities();

    const maxOnScreen = G.isVSMode ? CONFIG.GAMEPLAY.MAX_ENEMIES_ON_SCREEN_VS : CONFIG.GAMEPLAY.MAX_ENEMIES_ON_SCREEN;
    if (G.enemiesSpawned < G.maxEnemies) {
      if (G.aliveEnemies < maxOnScreen) {
        if (--G.spawnTimer <= 0) {
          spawnEnemy();
          G.spawnTimer = G.spawnInterval;
        }
      }
    }

    for (let i = 0; i < G.enemies.length; i++) {
      if (G.enemies[i].alive && !fx.has('freeze')) updateEnemyAI(G.enemies[i]);
    }

    const ba = bulletsPool.active;
    for (let i = 0; i < ba.length; i++) updateBullet(ba[i]);
    bulletsPool.sweep();

    compact(G.enemies);

    if (G.baseDestroyed && !G.isVSMode) {
      G.state = STATE.GAMEOVER;
      setTimeout(showGameOver, 1200);
    }

    updateEconomy();

    // 關卡結算：舊版只在 handleBulletHit（子彈命中）裡呼叫，用 BOMB／空襲／核融合／火山
    // 等範圍技清掉最後一批敵人時就永遠不會結算 —— 場上沒敵人、關卡不結束的軟鎖。
    // 這裡每個 tick 檢查一次（單一比較，成本可忽略），涵蓋所有擊殺路徑。
    checkLevelComplete();
  }

  if (G.shakeTimer > 0) {
    G.shakeTimer--;
    G.shakeIntensity *= CONFIG.GAMEPLAY.SHAKE_DECAY;
  }
  for (let i = G.spawnEffects.length - 1; i >= 0; i--) {
    if (--G.spawnEffects[i].life <= 0) G.spawnEffects.splice(i, 1);
  }
  updateScorePopups();
  updateParticles();
}

// 環境／召喚物造成的傷害：統一走 handleBulletHit，讓護盾、無敵與死亡判定維持同一條路徑
// （避免出现「血量變負但沒死」這種雙軌問題）。
const _hazardBullet = { x: 0, y: 0, size: TILE, power: 1, isPlayer: false, alive: true, hitTanks: [] };
function damagePlayerFromHazard(x, y, power) {
  if (!G.player || !G.player.alive) return;
  _hazardBullet.x = x; _hazardBullet.y = y; _hazardBullet.power = power;
  _hazardBullet.alive = true; _hazardBullet.hitTanks.length = 0;
  handleBulletHit(_hazardBullet, G.player);
}

function updateSummonEntities() {
  for (let i = G.summonEntities.length - 1; i >= 0; i--) {
    const se = G.summonEntities[i];
    se.life--;

    if (se.type === 'turret') {
      if (se.cooldown > 0) se.cooldown--;
      if (se.cooldown <= 0 && G.player) {
        const cx = se.x + TILE/2;
        const cy = se.y + TILE/2;
        let nearest = null;
        let minDist = 200;
        for (const e of G.enemies) {
          if (e.alive) {
            const d = Math.hypot(e.x - se.x, e.y - se.y);
            if (d < minDist) { minDist = d; nearest = e; }
          }
        }
        if (nearest) {
          const dx = nearest.x + TILE/2 - cx;
          const dy = nearest.y + TILE/2 - cy;
          let dir;
          if (Math.abs(dx) > Math.abs(dy)) {
            dir = dx > 0 ? RIGHT : LEFT;
          } else {
            dir = dy > 0 ? DOWN : UP;
          }
          spawnBullet(cx, cy, dir, true, false, se.damage);
        } else {
          const dirs = [UP, DOWN, LEFT, RIGHT];
          const randDir = dirs[(rnd() * 4) | 0];
          spawnBullet(cx, cy, randDir, true, false, se.damage);
        }
        se.cooldown = 25;
      }
    }

    // INTERFERER 放的炸彈：到期或玩家靠近就引爆（舊版沒有任何分支，只會倒數後消失）
    if (se.type === 'bomb') {
      const near = G.player && G.player.alive &&
        Math.hypot(G.player.x - se.x, G.player.y - se.y) < TILE;
      if (se.life <= 0 || near) {
        spawnExplosion(se.x, se.y, 'big');
        if (near) damagePlayerFromHazard(se.x, se.y, se.damage || 2);
        se.alive = false;
      }
    }

    // MINELAYER 放的地雷：玩家踩到就爆
    if (se.type === 'mine') {
      const near = G.player && G.player.alive &&
        Math.hypot(G.player.x - se.x, G.player.y - se.y) < TILE * 0.9;
      if (near) {
        spawnExplosion(se.x, se.y, 'tank');
        damagePlayerFromHazard(se.x, se.y, se.damage || 2);
        se.alive = false;
      }
    }

    if (se.type === 'fire') {
      for (const e of G.enemies) {
        if (e.alive && Math.hypot(e.x - se.x, e.y - se.y) < TILE * 1.5) {
          e.hp -= se.damage;
        }
      }
    }

    if (se.life <= 0) se.alive = false;
  }

  compact(G.summonEntities);

  for (let i = G.powerUps.length - 1; i >= 0; i--) {
    const pu = G.powerUps[i];
    pu.life--;
    if (pu.life <= 0) pu.alive = false;
  }
  compact(G.powerUps);

  // 堡壘與時間凍結已納入 fx，由 update() 的單一進入點遞減
  // （順帶修正：暫停與商店期間不再倒數）
}

function drawSummonEntities() {
  for (const se of G.summonEntities) {
    if (!se.alive) continue;

    if (se.type === 'turret') {
      ctx.fillStyle = '#44aa44';
      ctx.fillRect(se.x, se.y, TILE, TILE);
      ctx.fillStyle = '#88ff88';
      ctx.fillRect(se.x + 4, se.y + 4, TILE - 8, TILE - 8);
      const hpRatio = se.life / se.maxLife;
      ctx.fillStyle = '#000';
      ctx.fillRect(se.x, se.y - 4, TILE, 2);
      ctx.fillStyle = '#44ff44';
      ctx.fillRect(se.x, se.y - 4, TILE * hpRatio, 2);
    } else if (se.type === 'decoy') {
      ctx.fillStyle = `rgba(255,200,200,${se.life / se.maxLife * 0.5})`;
      ctx.fillRect(se.x, se.y, TILE, TILE);
    } else if (se.type === 'fire') {
      const alpha = se.life / se.maxLife * 0.4;
      ctx.fillStyle = `rgba(255,100,0,${alpha})`;
      ctx.beginPath();
      ctx.arc(se.x + TILE/2, se.y + TILE/2, TILE * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPowerUps() {
  for (const pu of G.powerUps) {
    if (!pu.alive) continue;
    const info = POWER_UPS[pu.type];
    const alpha = pu.life / pu.maxLife;
    const blink = (G.frameCount % 30 < 15) ? 1 : 0.5;
    ctx.fillStyle = info.color;
    ctx.globalAlpha = alpha * blink;
    ctx.beginPath();
    ctx.arc(pu.x, pu.y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(info.icon, pu.x, pu.y + 4);
    ctx.textAlign = 'left';    // 舊版只還原 globalAlpha；textAlign='center' 會洩漏給之後的
    ctx.globalAlpha = 1;       // 菁英詞綴圖示與分數彈出（兩者都靠左對齊定位 → 位置會偏掉）
  }
}

function drawDirectorEvents() {
  for (const ev of G.directorEvents) {
    if (ev.type === 'orbital') {
      for (const t of ev.targets) {
        const alpha = (ev.timer > 180) ? 1 : (ev.timer % 60 < 30) ? 0.5 : 0.8;
        ctx.strokeStyle = `rgba(255,0,0,${alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(t.x, t.y, TILE * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (ev.type === 'airdrop') {
      ctx.fillStyle = `rgba(255,215,0,${Math.sin(G.frameCount * 0.1) * 0.3 + 0.5})`;
      ctx.fillRect(ev.x - 10, ev.y - 10, 20, 20);
    } else if (ev.type === 'train') {
      ctx.fillStyle = '#888';
      ctx.fillRect(ev.x, ev.y, 80, TILE);
      ctx.fillStyle = '#ff0';
      ctx.fillRect(ev.x + 10, ev.y + 5, 10, 10);
    }
  }

  if (G.directorEvents.length > 0 && G.directorEvents[0].name) {
    ctx.fillStyle = '#ffd700';
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(G.directorEvents[0].name, W/2, H - 20);
    ctx.textAlign = 'left';
  }
}

function render() {
  ctx.save();
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);

  // 用 mapEventState（真正在跑的狀態機）：G.mapEvent 只在 restartGame 被賦值，而 rollMapEvent()
  // 因為此時 G.level 已重置為 1（條件要求 level>=3）永遠回 null → 這層暗幕從來沒生效過。
  if (mapEventState.active && mapEventState.type === 'NIGHT') {
    ctx.fillStyle = 'rgba(0,0,30,0.5)';
    ctx.fillRect(0, 0, W, H);
  }

  if (G.shakeTimer > 0) {
    ctx.translate((rnd() - 0.5) * G.shakeIntensity, (rnd() - 0.5) * G.shakeIntensity);
  }

  const isGameplay = G.state === STATE.PLAYING || G.state === STATE.PAUSED || G.state === STATE.GAMEOVER;

  if (isGameplay) {
    ctx.drawImage(staticCanvas, 0, 0);
    const phase = ((G.frameCount >> 4) & 1);
    const tiles = G.dynamicTiles;
    for (let i = 0; i < tiles.length; i++) {
      const dt = tiles[i];
      if (dt.type === WATER) drawWaterDirect(ctx, dt.x, dt.y, phase);
      else if (dt.type === BASE) drawEagleDirect(ctx, dt.x, dt.y, false);
      else if (dt.type === BASE_DEAD) drawEagleDirect(ctx, dt.x, dt.y, true);
    }
  }

  drawMapEvent();

  for (let i = 0; i < G.spawnEffects.length; i++) {
    const sp = G.spawnEffects[i];
    drawNESSpawnEffect(sp.x, sp.y, sp.size, sp.life, sp.maxLife);
  }

  drawSummonEntities();
  drawPowerUps();
  for (let i = 0; i < G.enemies.length; i++) G.enemies[i].draw();
  if (G.player && G.state === STATE.PLAYING) G.player.draw();

  renderBullets();

  if (isGameplay) ctx.drawImage(forestCanvas, 0, 0);

  drawParticles();
  drawDirectorEvents();
  if (isGameplay) drawScorePopups();

  if (G.playerStats && G.playerStats.combo > 0 && isGameplay) {
    ctx.fillStyle = '#ff6600';
    ctx.font = '12px "Press Start 2P"';
    ctx.fillText(`${G.playerStats.combo} COMBO`, 10, H - 30);
  }

  ctx.restore();
}

function gameLoop(now) {
  // 舊版的 requestAnimationFrame(gameLoop) 是函式最後一行：update()/render() 只要丟一次例外，
  // 下一幀就永遠不會被排程 —— 畫面整個凍結、只有 console 有訊息（實測塞一個 null 進 G.enemies
  // 就能讓 frameCount 永久停住）。這裡保證「無論如何都會排下一幀」。
  try {
  if (!_lastFrameTime) _lastFrameTime = now;
  let dt = now - _lastFrameTime;
  _lastFrameTime = now;
  if (dt > 250) dt = TICK_MS;
  _accumMs += dt * _speedMult;

  Perf.beginFrame();

  let updates = 0;
  while (!DETERMINISTIC && _accumMs >= TICK_MS && updates < _maxUpdatesPerFrame) {
    Perf.begin();
    if (G.state !== STATE.PAUSED) update();
    _accumMs -= TICK_MS;
    updates++;
  }
  if (_accumMs > TICK_MS * _maxUpdatesPerFrame) _accumMs = 0;

  render();
  Perf.end();
  Perf.updateUI();
  } catch (err) {
    reportRuntimeError(err);
  }
  requestAnimationFrame(gameLoop);
}

// 執行期錯誤：顯示一次提示（不要每幀洗版），並讓遊戲繼續跑 —— 單一敵人或粒子的資料異常
// 不該讓整場遊戲變成靜止畫面。
let _lastReportedError = null;
// ── 確定性測試用的鉤子（M2）──
// step(n)：同步跑 n 個 update()。測試靠這個「按 tick 驅動」，不受 rAF 排程與真實時間影響，
// 因此「同一組 seed + 同一串輸入」可以被精確重現。
function stepTicks(n) {
  for (let i = 0; i < n; i++) {
    if (G.state === STATE.PLAYING) update();
    else G.frameCount++;          // 非 PLAYING 也要推進，讓測試知道時間有在前進
  }
}

// checksum：把「會影響玩法結果」的狀態壓成一個數字。replay 測試比較這個值，
// 刻意不含粒子、爆炸、鏡頭抖動等純視覺狀態。
function gameChecksum() {
  const parts = [G.frameCount, G.score, G.level, G.state, G.playerStats.hp, G.playerStats.weapon,
    G.aliveEnemies, G.enemiesSpawned, Math.round(G.playerStats.weaponDamageBonus * 1000)];
  if (G.player) parts.push(Math.round(G.player.x * 100), Math.round(G.player.y * 100), Math.round(G.player.hp * 100), G.player.aimDir);
  for (const e of G.enemies) parts.push(e.type, Math.round(e.x * 100), Math.round(e.y * 100), Math.round(e.hp * 100));
  parts.push('bullets:' + bulletsPool.active.length, 'rng:' + rnd.state());
  const text = parts.join(',');
  let h = 2166136261 >>> 0;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}

function reportRuntimeError(err) {
  const msg = (err && err.message) || String(err);
  if (msg === _lastReportedError) return;
  _lastReportedError = msg;
  console.error('[tank-battle] 執行期錯誤（遊戲會繼續）:', err);
  const box = document.getElementById('errorBanner');
  if (box) {
    box.textContent = '⚠️ 執行期錯誤：' + msg + '（遊戲已繼續，可回報此訊息）';
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; _lastReportedError = null; }, 8000);
  }
}

window.addEventListener('error', (event) => reportRuntimeError(event.error || event.message));
window.addEventListener('unhandledrejection', (event) => reportRuntimeError(event.reason));

requestAnimationFrame(gameLoop);

/* ── Game speed & Bot loader ── */
(function(){
  var p = new URLSearchParams(location.search);
  var s = parseFloat(p.get('speed'));
  if (s > 0 && s <= 20) { _speedMult = s; _maxUpdatesPerFrame = Math.ceil(5 * s); console.log('[Speed] x' + s); }
  if (p.has('mute') || p.has('bot')) { Sound.enabled = false; Music.enabled = false; Music.stop(); if (Sound.ctx) Sound.ctx.suspend(); }
  if (!p.has('bot')) return;
  /* expose game internals so dynamically-loaded scripts can access them */
  // 模組化之後這些符號不再是 window 上的全域變數；驗證工具（tools/verify-game.mjs）
  // 需要它們才能驅動內部狀態，所以在 ?bot 時一併掛出來。
  window.__T = {
    // 驗證工具會呼叫的函式
    applyUpgrade, buyItem, handleBulletHit, updateBullet, drawEagleDirect, eagleSprite,
    spawnEnemy, updateDirector, updateDirectorEvents, updateSummonEntities, damagePlayerFromHazard,
    stepTicks, gameChecksum, seed: SEED, deterministic: DETERMINISTIC, fx,
    applyPlayerSpeed, input, gameState, STATES, releaseAllInput,
    rngState: () => rnd.state(), setRngState: (v) => rnd.setState(v),
    drawParticles, drawPowerUps, drawMapEvent, buildTankSprite, rollMapEvent,
    // 驗證工具會讀寫的模組層狀態（掛物件本身，屬性讀寫才有效）
    mapEventState, eagleCache, tankSpriteCache: _tankSpriteCache, smokeColor: SMOKE_COLOR,
    ctx, canvas,   // 主畫布與其 2D context（工具用來檢查繪圖狀態，例如 textAlign）
    // 資料表（工具用來做等價比對與死欄位掃描）
    WEAPON_REGISTRY, MAP_EVENTS, DIRECTOR_EVENTS, STARTER_WEAPONS, WEAPON_DROPS_T1, WEAPON_DROPS_T2,
    COMMON_DROPS, SPECIAL_ENEMY_TYPES: Array.from(SPECIAL_ENEMY_TYPES),
    G: G, STATE: STATE, CONFIG: CONFIG,
    UP: UP, DOWN: DOWN, LEFT: LEFT, RIGHT: RIGHT,
    DX: DX, DY: DY, TILE: TILE, W: W, H: H,
    EMPTY: EMPTY, BRICK: BRICK, STEEL: STEEL, WATER: WATER, FOREST: FOREST, BASE: BASE,
    bulletsPool: bulletsPool, particlesPool: particlesPool,
    WEAPON_TREE: WEAPON_TREE, POWER_UPS: POWER_UPS,
    ACTIVE_SKILLS: ACTIVE_SKILLS, PASSIVE_SKILLS: PASSIVE_SKILLS,
    ELITE_PREFIXES: ELITE_PREFIXES, SHOP_ITEMS: SHOP_ITEMS,
    Sound: Sound, Music: Music, Perf: Perf,
    Tank: Tank, Pool: Pool, SpatialGrid: SpatialGrid,
    generateMap: generateMap, startLevel: startLevel,
    restartGame: restartGame, continueGame: continueGame,
    showGameOver: showGameOver, showFinalGameOver: showFinalGameOver,
    openShop: openShop, closeShop: closeShop,
    togglePause: togglePause, checkLevelComplete: checkLevelComplete, showUpgradeScreen: showUpgradeScreen,
  };
  ['bot.js','data-collector.js'].forEach(function(src){
    var s = document.createElement('script');
    s.src = src;
    s.async = false;
    document.body.appendChild(s);
  });
})();
</script>
