<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>坦克大戰 v2 - 優化版</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #1a1a26 0%, #0a0a10 50%, #050508 100%), #0a0a0e;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: 'Press Start 2P', 'Courier New', monospace;
    flex-direction: column; user-select: none; position: relative;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 4px 4px; pointer-events: none; z-index: 100;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%); pointer-events: none; z-index: 101;
  }

  #hud, #powerStatus, #gameContainer, #controls, #perfMonitor { position: relative; z-index: 2; }
  #gameContainer {
    position: relative; border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(255,215,0,0.08), 0 0 30px rgba(255,170,0,0.1), 0 0 60px rgba(0,0,0,0.85);
  }
  
  canvas { 
    /* 桌機窄視窗（<530px）時原本固定 520px 會超出並被 overflow:hidden 裁掉且無法捲動 */
    display: block; width: min(520px, 100vw); border: 3px solid #3a3a45;
    border-top: none; background-color: #000; image-rendering: pixelated; box-sizing: border-box;
    border-radius: 0 0 6px 6px;
  }
  
  #hud {
    display: flex; justify-content: space-between; align-items: center; width: min(520px, 100vw); gap: 8px;
    background: linear-gradient(180deg, #1e1e28 0%, #14141c 60%, #0e0e15 100%); color: #fff; font-size: 11px;
    border: 3px solid #3a3a45; border-bottom: none; border-radius: 6px 6px 0 0;
  }
  .hud-item { display: flex; align-items: center; gap: 6px; }
  .label { color: #6a6a78; font-size: 9px; }
  .value { font-weight: bold; }
  .value.lives { color: #ff6b6b; text-shadow: 0 0 10px rgba(255,107,107,0.6); }
  .value.level { color: #6cc3ff; text-shadow: 0 0 10px rgba(108,195,255,0.6); }
  .value.score { color: #ffdd55; text-shadow: 0 0 12px rgba(255,221,85,0.7); }
  .vs-alert { color: #ff0055 !important; text-shadow: 0 0 15px rgba(255,0,85,0.9) !important; animation: blink 1s infinite; }
  #soundToggle {
    background: transparent; border: 1px solid #2a2a35; color: #ffd700;
    font-size: 14px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
    font-family: inherit; line-height: 1;
  }
  #soundToggle:hover, #soundToggle:active { background: rgba(255,215,0,0.1); border-color: #ffd700; }
  #pauseToggle {
    background: transparent; border: 1px solid #2a2a35; color: #ffd700;
    font-size: 14px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
    font-family: inherit; line-height: 1;
  }
  #pauseToggle:hover, #pauseToggle:active { background: rgba(255,215,0,0.1); border-color: #ffd700; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  
  #powerStatus {
    width: 520px; height: 26px; padding: 0; background: linear-gradient(180deg, #0a0a10, #0e0e16);
    border-left: 3px solid #3a3a45; border-right: 3px solid #3a3a45;
    border-bottom: 3px solid #3a3a45;
    color: #fff; font-size: 9px; display: flex; align-items: center; gap: 8px;
  }
  #powerStatus:empty::before { content: '◇ SYSTEM STANDBY'; color: #2a2a35; letter-spacing: 2px; }
  .power-chip { display: inline-flex; padding: 2px 8px; border-radius: 9px; background: #111; border: 1px solid #2a2a35; color: #5cd8ff; }
  
  #overlay, #upgradeUI {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column;
    justify-content: center; align-items: center; background: rgba(0,0,0,0.85); color: #fff; z-index: 10; backdrop-filter: blur(4px);
    padding: 20px;
    /* 小螢幕（尤其手機橫向）內容會超出容器；不能捲動的話「退出商店」按不到 → 玩家卡在商店 */
    overflow-y: auto;
    touch-action: pan-y;
    overscroll-behavior: contain;
  }
  body.mobile .shop-grid { grid-template-columns: repeat(2, 1fr); }
  #overlay.hidden, #upgradeUI.hidden { display: none !important; }
  #overlay.translucent { background: rgba(0,0,0,0.7); }
  #overlay h1, #upgradeUI h1 { font-size: 32px; color: #ffd700; text-shadow: 3px 3px 0 #8b0000; margin-bottom: 8px; animation: titlePulse 2.4s infinite; text-align: center; }
  @keyframes titlePulse { 0%,100% { transform: scale(1); text-shadow: 3px 3px 0 #8b0000, 0 0 35px rgba(255,215,0,0.5); } 50% { transform: scale(1.03); text-shadow: 3px 3px 0 #8b0000, 0 0 60px rgba(255,215,0,0.8); } }
  #overlay h2 { font-size: 24px; color: #ff5050; margin-bottom: 14px; text-shadow: 2px 2px 0 #500; text-align: center; }
  #overlay p { font-size: 10px; color: #aaa; margin: 6px 0; line-height: 1.8; text-align: center; }
  
  .card-container { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; justify-content: center; max-width: 480px; }
  .upgrade-card {
    background: linear-gradient(180deg, #1e1e28, #111); border: 2px solid #3a3a45; padding: 20px 15px; width: 140px;
    border-radius: 6px; cursor: pointer; transition: all 0.2s ease; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .upgrade-card:hover, .upgrade-card:active, .upgrade-card:focus { border-color: #ffd700; transform: translateY(-5px); box-shadow: 0 8px 20px rgba(255,215,0,0.3); outline: none; }
  .card-title { color: #5cd8ff; font-size: 11px; margin-bottom: 12px; line-height: 1.4; text-shadow: 0 0 5px rgba(92,216,255,0.4); }
  .card-desc { color: #888; font-size: 8px; line-height: 1.6; }

  .shop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 520px; margin: 15px auto; }
  .shop-item {
    background: linear-gradient(180deg, #1e1e28, #111); border: 2px solid #3a3a45; padding: 12px 8px;
    border-radius: 6px; cursor: pointer; transition: all 0.2s ease; text-align: center;
  }
  .shop-item:hover { border-color: #ffd700; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(255,215,0,0.3); }

  .start-btn {
    margin-top: 28px; padding: 14px 40px; font-size: 14px; font-family: 'Press Start 2P', monospace;
    background: linear-gradient(180deg, rgba(255,215,0,0.08), rgba(255,170,0,0.02)); color: #ffd700;
    border: 2px solid #ffd700; border-radius: 4px; cursor: pointer; text-shadow: 0 0 8px rgba(255,215,0,0.5);
  }
  .start-btn:hover, .start-btn:active { background: linear-gradient(180deg, #ffe14d, #ffb700); color: #000; text-shadow: none; box-shadow: 0 0 25px rgba(255,215,0,0.7); }
  #controls { color: #6a6a78; font-size: 8px; margin-top: 12px; text-align: center; letter-spacing: 2px; }
  
  /* 性能監測面板 */
  #perfMonitor {
    position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #6cff6c;
    padding: 8px 12px; font-size: 9px; border: 1px solid #2a2a35; border-radius: 4px;
    /* pointer-events:none：z-index 200 的浮層在窄視窗會蓋住 HUD 按鈕，讓它們點不到 */
    z-index: 200; min-width: 130px; line-height: 1.6; display: none; pointer-events: none;
  }
  #perfMonitor.show { display: block; }
  #perfMonitor .row { display: flex; justify-content: space-between; }
  #perfMonitor .lbl { color: #6a6a78; }
  #perfMonitor .warn { color: #ffaa00; }
  #perfMonitor .bad { color: #ff5050; }

  /* ==================== 手機操作介面 ==================== */
  #mobileControls {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 220px; pointer-events: none; z-index: 50;
    padding: 0 20px 30px;
    padding-bottom: calc(30px + env(safe-area-inset-bottom));
  }
  body.mobile #mobileControls { display: block; }

  /* 虛擬搖桿 */
  #joystickArea {
    position: absolute; left: 0; bottom: 0;
    width: 50%; height: 100%;
    pointer-events: auto;
    touch-action: none;
  }
  #joystickBase {
    position: absolute; left: 30px; bottom: 30px;
    width: 130px; height: 130px;
    border: 3px solid rgba(255, 215, 0, 0.35);
    background: radial-gradient(circle, rgba(255,215,0,0.08) 0%, rgba(0,0,0,0.4) 70%);
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(255,170,0,0.2), inset 0 0 15px rgba(0,0,0,0.6);
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #joystickStick {
    position: absolute;
    left: 50%; top: 50%;
    width: 56px; height: 56px;
    margin-left: -28px; margin-top: -28px;
    background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255,215,0,0.7);
    pointer-events: none;
  }
  /* 方向指示 */
  #joystickBase::before {
    content: ''; position: absolute; inset: 8px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 12%, rgba(255,215,0,0.25) 0%, transparent 12%),
      radial-gradient(circle at 88% 50%, rgba(255,215,0,0.25) 0%, transparent 12%),
      radial-gradient(circle at 50% 88%, rgba(255,215,0,0.25) 0%, transparent 12%),
      radial-gradient(circle at 12% 50%, rgba(255,215,0,0.25) 0%, transparent 12%);
  }

  /* 射擊按鈕 */
  #fireButton {
    position: absolute; right: 30px; bottom: 35px;
    width: 110px; height: 110px;
    border: 3px solid #ff5050;
    background: radial-gradient(circle, rgba(255,80,80,0.3) 0%, rgba(80,0,0,0.6) 100%);
    border-radius: 50%;
    color: #ffcccc;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    text-shadow: 0 0 8px rgba(255,80,80,0.8);
    box-shadow: 0 0 20px rgba(255,80,80,0.4), inset 0 0 15px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    transition: transform 0.05s, box-shadow 0.05s;
  }
  #fireButton.pressed {
    transform: scale(0.92);
    background: radial-gradient(circle, rgba(255,140,140,0.5) 0%, rgba(120,0,0,0.7) 100%);
    box-shadow: 0 0 30px rgba(255,80,80,0.8), inset 0 0 20px rgba(0,0,0,0.5);
  }
  #fireButton.auto {
    border-color: #5cd8ff;
    background: radial-gradient(circle, rgba(92,216,255,0.2) 0%, rgba(0,40,80,0.6) 100%);
    color: #88e8ff;
    text-shadow: 0 0 8px rgba(92,216,255,0.8);
    box-shadow: 0 0 20px rgba(92,216,255,0.4), inset 0 0 15px rgba(0,0,0,0.6);
  }

  /* 響應式：行動版佈局 */
  body.mobile {
    align-items: stretch;
    justify-content: flex-start;
    padding-top: env(safe-area-inset-top);
  }
  body.mobile #hud,
  body.mobile #powerStatus,
  body.mobile #gameContainer { 
    width: 100%; max-width: 100vw; 
  }
  body.mobile #hud {
    border-radius: 0; border-left: none; border-right: none;
    font-size: 10px;
    padding: 8px 10px;
  }
  body.mobile #hud .label { font-size: 8px; }
  body.mobile #powerStatus {
    border-left: none; border-right: none;
    font-size: 8px;
    padding: 0 10px;
  }
  body.mobile canvas {
    /* 用 min(100vw, 可用高度) 而不是固定 100%：畫布是正方形，橫向手機（844×390）下
       100% 會變成 844 高，把 START GAME 推到畫面外（elementFromPoint 為 null），
       而 body 是 overflow:hidden + touch-action:none → 手機橫向連遊戲都開不起來。 */
    width: min(100vw, calc(100dvh - 96px)) !important;
    height: auto !important;
    max-width: 100vw;
    margin: 0 auto;
    border-left: none;
    border-right: none;
  }
  body.mobile #hud {
    width: min(100vw, calc(100dvh - 96px));
    margin: 0 auto;
  }
  /* 觸控目標：原本 36×20 / 27×20 px，遠低於 44×44 的可點範圍，手機常誤觸中斷遊戲 */
  body.mobile #hud button { min-width: 44px; min-height: 44px; font-size: 16px; padding: 0 6px; }
  body.mobile #hud { gap: 6px; padding: 4px 8px; }
  body.mobile #pauseToggle { margin-left: 6px; }
  body.mobile #controls { display: none; }
  /* 行動版升級卡縮小 */
  body.mobile #overlay h1,
  body.mobile #upgradeUI h1 { font-size: 22px; }
  body.mobile #overlay h2 { font-size: 18px; }
  body.mobile #overlay p { font-size: 9px; }
  body.mobile .upgrade-card { width: 105px; padding: 14px 10px; }
  body.mobile .card-title { font-size: 9px; }
  body.mobile .card-desc { font-size: 7px; }
  body.mobile .card-container { gap: 10px; max-width: 100%; }
  body.mobile .start-btn { padding: 16px 36px; font-size: 13px; }

  /* 橫向手機 */
  @media (orientation: landscape) and (max-height: 500px) {
    body.mobile #hud { padding: 4px 10px; font-size: 9px; }
    body.mobile #powerStatus { height: 20px; }
    body.mobile #mobileControls { height: 180px; padding-bottom: 15px; }
    body.mobile #joystickBase { width: 110px; height: 110px; left: 20px; bottom: 20px; }
    body.mobile #fireButton { width: 95px; height: 95px; right: 20px; bottom: 25px; }
  }
</style>

<body>

<div id="hud">
  <div class="hud-item"><span class="label">SCR</span><span class="value score" id="scoreDisplay">0</span></div>
  <div class="hud-item"><span class="label">LV</span><span class="value level" id="levelDisplay">1</span></div>
  <div class="hud-item"><span class="label">HP</span><span class="value lives" id="livesDisplay">♥♥♥</span></div>
  <div class="hud-item"><span class="label">EN</span><span class="value" id="enemiesDisplay">0</span></div>
  <button id="soundToggle" title="切換音效 (M)" aria-label="切換音效">🔊</button>
  <button id="musicToggle" title="切換音樂 (N)" aria-label="切換音樂" style="background:transparent;border:1px solid #2a2a35;color:#ffd700;font-size:14px;padding:2px 8px;border-radius:4px;cursor:pointer;font-family:inherit;line-height:1;">🎵</button>
  <button id="shopToggle" title="商店 (B)" aria-label="商店" style="background:transparent;border:1px solid #2a2a35;color:#ffd700;font-size:14px;padding:2px 8px;border-radius:4px;cursor:pointer;font-family:inherit;line-height:1;">🏪</button>
  <button id="pauseToggle" title="暫停 (P)" aria-label="暫停">⏸</button>
</div>
<div id="powerStatus"></div>

<div id="gameContainer">
  <canvas id="gameCanvas" width="520" height="520"></canvas>
  
  <div id="overlay">
    <h1>TANK WARS v2</h1>
    <p>消滅敵軍,每 10 關進入生存割草模式!</p>
    <p style="margin-top:12px; color:#ffd700;" class="kbd-hint">WASD / 方向鍵 <b>移動</b></p>
    <p style="color:#ffd700;" class="kbd-hint">空白鍵 <b>射擊</b> · F3 <b>性能監測</b></p>
    <p style="margin-top:12px; color:#ffd700;" class="touch-hint" hidden>左搖桿 <b>移動</b></p>
    <p style="color:#ffd700;" class="touch-hint" hidden>右按鈕 <b>射擊</b></p>
    <button class="start-btn" id="startBtn">START GAME</button>
  </div>

  <div id="upgradeUI" class="hidden">
    <h1>LEVEL CLEAR</h1>
    <p style="color: #6cc3ff;">選擇安裝升級模組</p>
    <div class="card-container" id="cards"></div>
  </div>
</div>
<div id="errorBanner" role="alert" style="display:none; position:fixed; left:50%; transform:translateX(-50%); bottom:12px; z-index:300; background:rgba(80,0,0,0.92); color:#ffd0d0; border:1px solid #ff5050; border-radius:4px; padding:8px 14px; font-size:10px; max-width:90vw; text-align:center;"></div>
<div id="controls">WASD / ARROWS MOVE &nbsp; · &nbsp; SPACE FIRE &nbsp; · &nbsp; F3 PERF &nbsp; · &nbsp; N MUSIC</div>

<div id="mobileControls">
  <div id="joystickArea">
    <div id="joystickBase">
      <div id="joystickStick"></div>
    </div>
  </div>
  <button id="fireButton">FIRE</button>
</div>

<div id="perfMonitor">
  <div class="row"><span class="lbl">FPS</span><span id="perfFPS">--</span></div>
  <div class="row"><span class="lbl">FRAME</span><span id="perfFrame">-- ms</span></div>
  <div class="row"><span class="lbl">ENEMIES</span><span id="perfEnemies">0</span></div>
  <div class="row"><span class="lbl">BULLETS</span><span id="perfBullets">0</span></div>
  <div class="row"><span class="lbl">PARTICLES</span><span id="perfParticles">0</span></div>
  <div class="row"><span class="lbl">COL.CHK</span><span id="perfCollisions">0</span></div>
  <div class="row"><span class="lbl">POOL PK</span><span id="perfPeak">0</span></div>
</div>

<script>
/* 由 tools/build-single-file.mjs 產生 —— 請勿直接編輯；改 src/ 或 index.html 後重新打包。
 * 內含 25 個模組：src/data/bosses.js、src/data/config.js、src/data/enemies.js、src/data/events.js、src/data/pickups.js、src/data/rewards.js、src/data/shop.js、src/data/upgrades.js、src/data/weapons.js、src/data/index.js、src/core/rng.js、src/core/effects.js、src/platform/viewport.js、src/platform/input.js、src/core/state.js、src/platform/audio.js、src/platform/lifecycle.js、src/platform/touch-ui.js、src/render/tiles.js、src/render/sprites.js、src/render/wh40k-art.js、src/render/wh40k-data.js、src/render/effects.js、src/ui/hud.js、src/ui/screens.js
 */
// ── src/data/bosses.js ──
// BOSS 原型：每 5 關一隻，三型輪替。
//
// 為什麼要有這個：舊版每一隻 BOSS 都是同一個東西 —— 血很多的紅色大坦克、只會發散彈、
// 血量到 75% / 50% / 25% 時加速／召喚／抖一下，打法完全一樣。玩到第 20 關的王跟第 5 關的王
// 是同一個沙包，只是血變多。這裡把「王長什麼樣、怎麼攻擊」抽成資料表，行為在 index.html 依
// `pattern` 分派（ARTILLERY／CHARGE／SPAWN），所以新增一隻王＝加一筆資料 + 一個 pattern 分支。
//
// 數值刻意讓三型的「威脅類型」不同（不是同一組數值換皮）：
//   SIEGE   血厚、慢、遠程炮擊 → 逼玩家移動，不能站樁輸出
//   HUNTER  血薄、快、貼身衝撞 → 逼玩家預判，抓牠衝撞後的硬直反打
//   SWARMER 血最薄、持續召喚    → 逼玩家清場，否則小兵會把場地淹掉

const BOSS_TYPES = {
  SIEGE: {
    id: 'SIEGE',
    name: '攻城核心',
    pattern: 'ARTILLERY',
    color: '#b06000',
    icon: '💣',
    hpMult: 1.2,          // 血最厚：站樁打不死，要靠走位躲炮
    speedMult: 0.7,
    sizeMult: 1.7,
    volleyCooldown: 100,  // 每 100 tick 一輪炮擊
    volleyCount: 3,       // 一輪 3 發
    shellSpeed: 2.2,
    shellFuse: 150,       // 砲彈最多飛 150 tick（≈330px），沒打到東西也會炸
    blastRadius: 34,      // 爆炸半徑（px）
    blastPower: 1,
  },
  HUNTER: {
    id: 'HUNTER',
    name: '獵殺者',
    pattern: 'CHARGE',
    color: '#a020a0',
    icon: '🗡️',
    hpMult: 0.85,
    speedMult: 1.1,
    sizeMult: 1.4,
    chargeWindup: 45,     // 蓄力 45 tick（畫面有警示圈）
    chargeTicks: 28,      // 衝刺 28 tick
    chargeSpeed: 4.2,
    recoverTicks: 55,     // 撞牆後硬直（這段時間是輸出窗口）
  },
  SWARMER: {
    id: 'SWARMER',

/** 三型的固定輪替順序（讓相鄰兩隻王不會是同型）。 */
const BOSS_ORDER = ['SIEGE', 'HUNTER', 'SWARMER'];

/**
 * 第 level 關要用哪一隻王。`level` 必須是 BOSS 關（level % interval === 0），
 * 但這裡對任意 level 都給得出答案（取 floor(level/interval)），確保呼叫端不會拿到 undefined。
 * @param {number} level
 * @param {number} interval 幾關一隻王（呼叫端傳 CONFIG.GAMEPLAY.BOSS_LEVEL_INTERVAL）
 */
function bossTypeForLevel(level, interval = 5) {
  const stage = Math.max(1, Math.floor((Number(level) || interval) / interval));
  return BOSS_ORDER[(stage - 1) % BOSS_ORDER.length];
}

// 資料層入口：只做 re-export，讓 index.html 一行取用全部資料表。
// ── src/core/rng.js ──
// 可重現亂數（M2 的基礎）。
//
// 為什麼要這個：整局遊戲的隨機都走同一個產生器之後，「同一組 seed + 同一串輸入」就必然
// 產生同一個結果 —— 這是 replay 測試的前提，也讓「玩一局」變成 CI 能跑的事。
// 原本 59 處直接呼叫 Math.random()，任何一次呼叫都會讓兩次執行分岔，無法回放。
//
// 演算法選 xorshift32：狀態只有 32 bit、純整數運算、不需要種子表，對這個規模足夠，
// 而且好處是「可序列化」—— 存下 state 就能從中斷點續跑。

/** 字串 → 32 bit 整數 seed（讓 ?seed=abc 這種可讀的種子也能用）。 */
function hashSeed(input) {
  if (input === null || input === undefined) return 1;
  const text = String(input).trim();
  if (text === '') return 1;             // ?seed= 空字串視為「沒有指定」

  if (/^\d+$/.test(text)) return (Number(text) >>> 0) || 1;
  let h = 2166136261 >>> 0;              // FNV-1a
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h || 1;
}

/**
 * 建立一個 xorshift32 產生器。
 * 回傳的函式像 Math.random() 一樣回傳 [0,1)，另外附上 state 讀寫與整數/範圍輔助。
 */
function makeRng(seed = 1) {
  let state = (seed >>> 0) || 1;

  const next = () => {
    state ^= state << 13; state >>>= 0;
    state ^= state >>> 17;
    state ^= state << 5;  state >>>= 0;
    return state / 4294967296;
  };

  next.state = () => state;
  next.setState = (value) => { state = (value >>> 0) || 1; };
  next.int = (maxExclusive) => Math.floor(next() * maxExclusive);
  next.range = (min, max) => min + next() * (max - min);
  return next;
}

/** 預設種子：沒有指定 ?seed 時用時間（正常遊玩每次都不同），方便重現時可覆寫。 */
function defaultSeed() {
  return ((Date.now() ^ (performance.now() * 1000)) >>> 0) || 1;
}
// ── src/core/effects.js ──
// 時效系統（M2）：把「有持續時間的效果」集中管理。
//
// 為什麼要這個：這些計時器原本散在 5 個地方各自 `--`（update 主區塊、updateCombo、
// 以及 PLAYING 判斷之外的兩行），於是出現過兩種 bug：
//   1. `barrierTimer` 只被寫入、沒有任何遞減端 → 拿了 BARRIER 就整局無敵。
//   2. `wallTimer`／`timeFreezeTimer` 的遞減寫在 PLAYING 之外 → 暫停與商店期間也會持續倒數，
//      玩家在商店待久一點，堡壘時間就白白流失。
// 集中之後：**只有一個 tick 進入點**，到期行為用 callback 宣告（不再需要 `_slowed` 之類的旗標補救），
// 而且 `clearAll()` 讓「重新開始就該清空」變成一個可測試的契約。
//
// 設計取捨：刻意不做通用 ECS，只是一個 id → 剩餘 tick 的 Map，外加到期 callback。

function makeEffects() {
  /** @type {Map<string, {left:number, onExpire?:Function, onTick?:Function}>} */
  const timers = new Map();

  const api = {
    /** 設定時效（覆蓋現有的）。ticks <= 0 等於立即清除。 */
    set(id, ticks, hooks = {}) {
      if (!(ticks > 0)) { timers.delete(id); return 0; }
      timers.set(id, { left: ticks, onExpire: hooks.onExpire, onTick: hooks.onTick });
      return ticks;
    },

    /** 取較長者（例如連續吃到同一個道具時不該縮短）。 */
    extend(id, ticks, hooks = {}) {
      const current = timers.get(id);
      if (current && current.left >= ticks) return current.left;
      return api.set(id, ticks, hooks);
    },

    has(id) { return timers.has(id); },
    left(id) { const t = timers.get(id); return t ? t.left : 0; },
    ids() { return Array.from(timers.keys()); },
    /** 供 UI／存檔用：{ id: 剩餘 tick } */
    snapshot() { return Object.fromEntries(Array.from(timers, ([id, t]) => [id, t.left])); },

    clear(id) { timers.delete(id); },
    clearAll() { timers.clear(); },

    /**
     * 推進一個 tick。這是**唯一**該被呼叫的遞減入口。
     * @returns {string[]} 這一個 tick 到期的效果 id
     */
    tick() {
      const expired = [];
      for (const [id, timer] of timers) {
        if (timer.onTick) timer.onTick(timer.left);
        timer.left -= 1;
        if (timer.left <= 0) {
          timers.delete(id);
          expired.push(id);
          if (timer.onExpire) timer.onExpire();
        }
      }
      return expired;
    },
  };

  return api;
}
// ── src/platform/viewport.js ──
// 平台層：視窗／畫布尺寸與裝置判定（M3）。
//
// 為什麼要這個：DPR 與觸控判定原本直接寫在 index.html 的頂層，於是
//   * DPR 完全沒處理（DPR 3 手機每個繪圖像素被放大 2.25 倍，只用掉 44% 解析度）
//   * iPadOS 被判成桌機（UA 是 Macintosh、寬度 > 820 → 沒有搖桿與 FIRE 鍵，完全不能玩）
// 抽成純函式之後可以在 Node 測，也不必為了驗證而開瀏覽器。

/** 畫布解析度倍率：上限 2（DPR 3 全螢幕填色的成本會翻 4~9 倍，而這遊戲每幀都在全螢幕填色）。 */
function computeRenderScale(devicePixelRatio) {
  const dpr = Number(devicePixelRatio) || 1;
  return Math.max(1, Math.min(dpr, 2));
}

/**
 * 觸控裝置判定。iPadOS 13+ 的 UA 是 Macintosh 且螢幕寬度 834/1024/1180 都 > 820，
 * 所以主要訊號是 `pointer: coarse`，UA 與窄畫面只是輔助。
 * @param {{maxTouchPoints?:number, coarsePointer?:boolean, narrowViewport?:boolean, userAgent?:string}} env
 */
function detectMobile({ maxTouchPoints = 0, coarsePointer = false, narrowViewport = false, userAgent = '' } = {}) {
  const hasTouch = maxTouchPoints > 0;
  const mobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
  return hasTouch && (coarsePointer || narrowViewport || mobileUA);
}

/** 由瀏覽器環境取得判定所需的輸入（讓 detectMobile 保持可測試）。 */
function readEnv(win = globalThis) {
  return {
    maxTouchPoints: win.navigator?.maxTouchPoints || 0,
    coarsePointer: !!win.matchMedia?.('(pointer: coarse)').matches,
    narrowViewport: !!win.matchMedia?.('(max-width: 820px)').matches,
    userAgent: win.navigator?.userAgent || '',
  };
}

/**
 * 設定 canvas 的 backing store 與繪圖座標系（邏輯座標固定為 width×height）。
 * @returns {{scale:number, width:number, height:number}}
 */
function applyCanvasScale(canvas, ctx, width, height, scale) {
  canvas.width = width * scale;
  canvas.height = height * scale;
  if (ctx) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.imageSmoothingEnabled = false;      // 像素風格：放大用最近鄰
  }
  return { scale, width, height };
}
// ── src/platform/input.js ──
// 平台層：輸入（M3）。
//
// 為什麼要這個：鍵盤與觸控原本各自直接讀寫 `G.keys` 與 `G.touch`，
// 於是出現過「按著 D 切到別的分頁，keyup 永遠收不到 → 坦克一直往同方向跑」這種 bug，
// 而修正只能靠在事件監聽裡手寫 `G.keys = {}`。抽出來之後：
//   1. 按鍵 → intent 的對應是一張表（不再散在 update() 的 if 串裡）；
//   2. 「放開所有輸入」只有一個實作（`releaseAll`），鍵盤與觸控共用；
//   3. 全部是純函式，可在 Node 測（`tools/verify-core.mjs`）。

/** 方向 intent 的列舉（與 index.html 的 UP/RIGHT/DOWN/LEFT 對齊）。 */
const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };

/** 按鍵 → intent 的對應表。同一個 intent 可以有多個按鍵。 */
const KEY_BINDINGS = {
  ArrowUp: 'up', KeyW: 'up',
  ArrowRight: 'right', KeyD: 'right',
  ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left',
  Space: 'fire', KeyJ: 'fire',
};

/** 遊戲中要攔截預設行為的按鍵（方向鍵與空白鍵會捲動頁面）。 */
const PREVENT_DEFAULT = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);

function makeInputState() {
  return { up: false, right: false, down: false, left: false, fire: false, skill: false };
}

/**
 * 套用一次按鍵事件。
 * @param {object} state makeInputState() 的結果（會被就地修改）
 * @param {string} code  KeyboardEvent.code
 * @param {boolean} down true = keydown
 * @param {{editable?: boolean, skillKey?: string}} options
 *        editable：焦點在 UI 元件上時不攔截預設行為（否則按鈕無法用 Space 啟動）
 * @returns {{intent: string|null, isSkill: boolean, skillPressed: boolean, preventDefault: boolean, changed: boolean}}
 */
function applyKey(state, code, down, { editable = false, skillKey = 'KeyQ' } = {}) {
  const intent = KEY_BINDINGS[code] || null;
  const isSkill = code === skillKey;
  // 主動技能是邊緣觸發：只在 0 → 1 的那一次算「按下」，避免按住期間每幀重複施放
  const skillPressed = isSkill && !!down && !state.skill;

  if (intent) state[intent] = !!down;
  if (isSkill) state.skill = !!down;

  return {
    intent,
    isSkill,
    skillPressed,
    preventDefault: !editable && PREVENT_DEFAULT.has(code),
    changed: !!intent || isSkill,
  };
}

/** 依 intent 決定移動方向（沿用原本的優先序：上 → 右 → 下 → 左）。 */
function dirFromInput(state, fallback = -1) {
  if (state.up) return DIR.UP;
  if (state.right) return DIR.RIGHT;
  if (state.down) return DIR.DOWN;
  if (state.left) return DIR.LEFT;
  return fallback;
}

/** 放開所有輸入（失去焦點、切到背景、結算畫面時呼叫）。 */
function releaseAll(state) {
  state.up = state.right = state.down = state.left = state.fire = false;
  state.skill = false;
  return state;
}

/** 觸控狀態（搖桿 + FIRE 鍵）的統一形狀。 */
function makeTouchState() {
  // 只有 dir 與 fire 會被遊戲讀取；joyActive／joyDx／joyDy 曾經存在但沒有任何讀取端
  // （搖桿是四方向離散移動），已由 verify-core 的 Y 組掃描揪出並移除。
  return { dir: -1, fire: false };
}

function releaseTouch(state) {
  state.dir = -1;
  state.fire = false;
  return state;
}
// ── src/core/state.js ──
// 遊戲狀態機（M3）。
//
// 為什麼要這個：狀態原本是散在各處的 `G.state = STATE.X`（9 處）。沒有白名單時，
// 「從 gameover 直接跳 playing」「商店中又開升級畫面」這類錯誤轉移不會有任何跡象，
// 只會表現成畫面卡住或計時器亂跑（這一輪就修過一次：暫停期間堡壘仍持續倒數）。
//
// 設計取捨：**觀測優先於強制**。不在白名單內的轉移仍然允許（遊戲不會因為一個漏寫的
// 白名單就卡死），但會登記一筆警告 —— 測試用「實際跑完所有流程後警告數為 0」當閘門，
// 既不會誤殺玩家，又能抓到沒被宣告的轉移。

const STATES = {
  MENU: 'menu',
  PLAYING: 'playing',
  PAUSED: 'paused',
  UPGRADE: 'upgrade',
  SHOP: 'shop',
  GAMEOVER: 'gameover',
  LEVEL_COMPLETE: 'levelComplete',
};

// 允許的轉移（白名單）。來源為 index.html 內實際的 9 個賦值點與遊戲流程。
const ALLOWED = {
  [STATES.MENU]: [STATES.PLAYING],
  [STATES.PLAYING]: [STATES.PAUSED, STATES.SHOP, STATES.UPGRADE, STATES.LEVEL_COMPLETE, STATES.GAMEOVER, STATES.MENU],
  [STATES.PAUSED]: [STATES.PLAYING, STATES.SHOP, STATES.MENU, STATES.GAMEOVER],
  [STATES.SHOP]: [STATES.PLAYING, STATES.MENU, STATES.GAMEOVER],
  [STATES.UPGRADE]: [STATES.PLAYING, STATES.MENU],
  [STATES.LEVEL_COMPLETE]: [STATES.PLAYING, STATES.UPGRADE, STATES.GAMEOVER, STATES.MENU],
  [STATES.GAMEOVER]: [STATES.MENU, STATES.PLAYING, STATES.UPGRADE],
};

function isKnownState(state) {
  return Object.values(STATES).includes(state);
}

/**
 * @param {{initial?: string, onChange?: Function, onUnexpected?: Function}} options
 */
function makeStateMachine({ initial = STATES.MENU, onChange, onUnexpected } = {}) {
  let current = initial;
  const history = [];
  const warnings = [];

  const machine = {
    get() { return current; },
    is(state) { return current === state; },
    can(next) { return (ALLOWED[current] || []).includes(next); },
    history() { return history.slice(); },
    warnings() { return warnings.slice(); },

    /**
     * 設定狀態。回傳 { ok, applied, reason }：
     *   ok      = 這次轉移在白名單內
     *   applied = 狀態是否真的被改變（未知狀態值不會被套用）
     */
    set(next) {
      if (!isKnownState(next)) {
        warnings.push(`未知狀態 ${JSON.stringify(next)}（忽略）`);
        if (onUnexpected) onUnexpected({ from: current, to: next, reason: 'unknown-state' });
        return { ok: false, applied: false, reason: 'unknown-state' };
      }
      if (next === current) return { ok: true, applied: false, reason: 'same-state' };

      const ok = machine.can(next);
      if (!ok) {
        warnings.push(`未宣告的轉移 ${current} → ${next}`);
        if (onUnexpected) onUnexpected({ from: current, to: next, reason: 'undeclared-transition' });
      }
      const previous = current;
      current = next;
      history.push({ from: previous, to: next, ok });
      if (onChange) onChange({ from: previous, to: next, ok });
      return { ok, applied: true, reason: ok ? 'ok' : 'undeclared-transition' };
    },

    /** 重新開始：回到初始狀態並清空觀測紀錄（契約有測試）。 */
    reset() {
      current = initial;
      history.length = 0;
      warnings.length = 0;
    },
  };

  return machine;
}
// ── src/platform/audio.js ──
// 平台層：音效（M3）。
//
// 從 index.html 原封搬過來，只做兩件事：
//   1. 把 `document.getElementById('soundToggle')` 換成注入的 `onIconChange` hook
//      —— 平台層不直接碰 DOM，UI 圖示由呼叫端決定。
//   2. 包成工廠 `makeSound()`，讓「建立音訊引擎」與「使用它」分開（也方便測試替身）。
//
// 這裡保留了先前修過的兩個要點：同時發聲上限 8 個（避免轟炸流削波）、
// 以及 `onended` 時 disconnect（舊版節點從不回收）。

function makeSound({ onIconChange, rng = Math.random } = {}) {
  const sound = {
    ctx: null,
    master: null,
    noiseBuf: null,
    enabled: true,
    ready: false,

    init() {
      if (this.ready) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.18;
        this.master.connect(this.ctx.destination);
        // 預生成 1 秒白噪音 buffer
        const sr = this.ctx.sampleRate;
        const buf = this.ctx.createBuffer(1, sr, sr);
        const data = buf.getChannelData(0);
        // 噪音 buffer 的隨機來源由呼叫端注入（原本這裡直接用遊戲的 rnd()，
      // 搬進模組後那個變數不在作用域內 → init() 拋錯被 catch 吞掉 → 整個遊戲沒聲音）
      for (let i = 0; i < sr; i++) data[i] = rng() * 2 - 1;
        this.noiseBuf = buf;
        this.ready = true;
      } catch (e) {
      // 不要靜默：音訊初始化失敗（例如沒有 AudioContext）要留下痕跡，
      // 否則「沒有聲音」會被誤認為「使用者關了音效」而查不出原因。
      this.error = e;
      console.warn('[audio] 初始化失敗:', e && e.message ? e.message : e);
    }
    },

    resume() {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },

    toggle() {
      this.enabled = !this.enabled;
      if (this.master) this.master.gain.value = this.enabled ? 0.18 : 0;
      if (onIconChange) onIconChange(this.enabled);
    },

    // 同時發聲上限：轟炸/空襲會在極短時間內排 20~30 個爆炸音，全部疊上去會讓音訊執行緒
    // 尖峰並削波（聽起來像破音）。超過 8 個同時發聲就丟掉新的（玩家感受不到差異）。
    _activeVoices: 0,
    _voiceSlot() {
      if (this._activeVoices >= 8) return false;
      this._activeVoices++;
      return true;
    },
    // 節點回收：舊版 osc.stop() 之後從不 disconnect()，節點會一直掛在長命的 master 上，
    // 高射速武器（每秒約 30 發 × 2 個節點）長期累積會讓音訊圖越來越肥。
    _releaseOnEnd(node, extra) {
      node.onended = () => {
        try { node.disconnect(); } catch (e) { /* 已斷開 */ }
        if (extra) { try { extra.disconnect(); } catch (e) { /* 已斷開 */ } }
        this._activeVoices = Math.max(0, this._activeVoices - 1);
      };
    },

    // 脈波 (方波) — NES pulse channel
    pulse(freq, dur, vol = 0.4, type = 'square', sweep = 0) {
      if (!this.ready || !this.enabled) return;
      const t = this.ctx.currentTime;
      if (!this._voiceSlot()) return;      // 同時發聲上限（避免轟炸流疊 20~30 個 voice 造成削波）
      const osc = this.ctx.createOscillator();
      const gn = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (sweep) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t + dur);
      gn.gain.setValueAtTime(vol, t);
      gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gn).connect(this.master);
      this._releaseOnEnd(osc, gn);
      osc.start(t);
      osc.stop(t + dur);
    },

    // 噪音 — NES noise channel (爆炸/打擊)
    noise(dur, vol = 0.4, freq = 1200, q = 1) {
      if (!this.ready || !this.enabled) return;
      if (!this._voiceSlot()) return;
      const t = this.ctx.currentTime;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.value = freq;
      filt.Q.value = q;
      const gn = this.ctx.createGain();
      gn.gain.setValueAtTime(vol, t);
      gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(filt).connect(gn).connect(this.master);
      this._releaseOnEnd(src, gn);
      src.start(t);
      src.stop(t + dur);
    },

    // 序列播放 (簡易 jingle)
    seq(notes) {
      if (!this.ready || !this.enabled) return;
      let offset = 0;
      for (const [freq, dur, vol] of notes) {
        setTimeout(() => this.pulse(freq, dur, vol ?? 0.35), offset * 1000);
        offset += dur * 0.9;
      }
    },

    // ===== 遊戲音效 =====
    shoot()        { this.pulse(880, 0.05, 0.25, 'square', -700); },
    hitBrick()     { this.noise(0.07, 0.35, 1800, 1.5); },
    hitSteel()     { this.pulse(2200, 0.05, 0.3, 'square'); this.noise(0.05, 0.2, 4000, 2); },
    explode()      { this.noise(0.25, 0.5, 600, 0.7); this.pulse(120, 0.18, 0.3, 'triangle', -80); },
    bigExplode()   { this.noise(0.5, 0.6, 300, 0.5); this.pulse(80, 0.4, 0.4, 'triangle', -50); },
    spawn()        { this.pulse(220, 0.04, 0.2); setTimeout(() => this.pulse(440, 0.04, 0.2), 60); setTimeout(() => this.pulse(660, 0.06, 0.2), 120); },
    hitPlayer()    { this.pulse(180, 0.15, 0.45, 'square', -100); this.noise(0.15, 0.3, 800, 1); },
    baseDestroyed(){ this.noise(0.6, 0.6, 200, 0.5); this.pulse(60, 0.5, 0.5, 'triangle', -30); },

    // ===== Jingles =====
    jingleLevelStart() {
      this.seq([[523, 0.1], [659, 0.1], [784, 0.18]]);
    },
    jingleLevelClear() {
      this.seq([[523, 0.12], [659, 0.12], [784, 0.12], [1047, 0.25]]);
    },
    jingleGameOver() {
      this.seq([[440, 0.18], [392, 0.18], [349, 0.18], [262, 0.45]]);
    },
  };
  return sound;
}

/**
 * 背景音樂：程序化編曲（沿用原本的曲目表與排程器）。
 * @param {object} sound makeSound() 的結果（用它的 pulse 發聲）
 * @param {{onIconChange?:Function, isPlaying?:Function}} hooks
 *        isPlaying：遊戲是否在進行中（決定重新開啟時播 LEVEL 還是 MENU 曲目）
 */
function makeMusic(sound, { onIconChange, isPlaying = () => false } = {}) {
  const music = {
    _timer: null, _track: null, _beat: 0,
    enabled: true,

    TRACKS: {
      MENU: {
        bpm: 100,
        bass: [73.42, 73.42, 98.00, 110.00],
        melody: [
          293.66, 349.23, 440.00, 587.33,
          523.25, 440.00, 349.23, 293.66,
          392.00, 493.88, 587.33, 659.25,
          587.33, 523.25, 440.00, 392.00,
          293.66, 349.23, 440.00, 587.33,
          523.25, 440.00, 349.23, 293.66,
          392.00, 440.00, 493.88, 523.25,
          587.33, 0, 523.25, 0,
        ]

// 平台層：生命週期（M3）。
//
// 為什麼要這個：原本 `visibilitychange`／`blur`／`focus`／`pointerdown` 四個監聽散在
// index.html 裡，各自做不同的事（放開輸入、自動暫停、恢復音訊），而且漏掉任何一個都會
// 變成難查的 bug —— 例如「按著 D 切到別的分頁回來，坦克一直往同方向跑」（keyup 收不到）
// 或「從背景回來後永久無聲」（iOS 需要新的使用者手勢才能 resume AudioContext）。
//
// 抽出來之後：事件與意圖的對應集中在一處，而且可用 stub 的 win/doc 在 Node 測。

/**
 * @param {{
 *   onLeave?: Function,     // 失去焦點或切到背景：放開輸入 + 自動暫停
 *   onReturn?: Function,    // 回到前景或取得焦點：恢復音訊等
 *   win?: object, doc?: object,
 * }} options
 * @returns {Function} 解除綁定（測試與切換頁面時用）
 */
function bindLifecycle({ onLeave, onReturn, win = globalThis, doc = globalThis.document } = {}) {
  const leave = () => { if (onLeave) onLeave(); };
  const back = () => { if (onReturn) onReturn(); };

  const onVisibility = () => { if (doc && doc.hidden) leave(); else back(); };

  if (doc) doc.addEventListener('visibilitychange', onVisibility);
  if (win) {
    win.addEventListener('blur', leave);
    win.addEventListener('focus', back);
    // iOS 從背景回來後 AudioContext 需要新的使用者手勢才能恢復
    win.addEventListener('pointerdown', back);
  }

  return function unbind() {
    if (doc) doc.removeEventListener('visibilitychange', onVisibility);
    if (win) {
      win.removeEventListener('blur', leave);
      win.removeEventListener('focus', back);
      win.removeEventListener('pointerdown', back);
    }
  };
}

// 平台層：觸控 UI（M3）。
//
// 螢幕搖桿與 FIRE 鍵原本寫在 index.html 裡，直接讀寫 `G.touch` 與 `CONFIG.MOBILE`、
// 也直接綁 document/window。抽到平台層後依賴改成注入：
//   touch（狀態物件）、getConfig()、isMobile()、dirs、doc/win。
// 這樣「按著 FIRE 切到別的分頁」這類狀態殘留可以用 stub 在 Node 測（見 verify-core 的 L 組）。
//
// reset() 是關鍵介面：失去焦點／切到背景／結算畫面時必須強制放開搖桿與射擊鍵。

const DEFAULT_DIR = DIR;

/**
 * @param {{
 *   touch: object,                 // 平台層的觸控狀態（makeTouchState()）
 *   getConfig: Function,           // () => ({ JOYSTICK_MAX_RADIUS, JOYSTICK_DEADZONE })
 *   isMobile: Function,            // () => boolean
 *   dirs?: object,                 // DIR 列舉（預設用 input.js 的）
 *   doc?: object, win?: object,
 * }} options
 */
function makeTouchInput({
  touch, getConfig, isMobile,
  dirs = DEFAULT_DIR,
  doc = globalThis.document,
  win = globalThis.window,
} = {}) {
  const DIR = dirs;
  const touchInput = {
    joyArea: doc ? doc.getElementById('joystickArea') : null,
    joyBase: doc ? doc.getElementById('joystickBase') : null,
    joyStick: doc ? doc.getElementById('joystickStick') : null,
    fireBtn: doc ? doc.getElementById('fireButton') : null,
  
    joyTouchId: null,
    fireTouchId: null,
    joyCenterX: 0,
    joyCenterY: 0,
  
    init() {
      if (!isMobile()) return;
    
      this._updateJoyCenter();
      win.addEventListener('resize', () => this._updateJoyCenter());
      win.addEventListener('orientationchange', () => setTimeout(() => this._updateJoyCenter(), 200));
    
      this.joyArea.addEventListener('touchstart', this._onJoyStart.bind(this), { passive: false });
      this.joyArea.addEventListener('touchmove', this._onJoyMove.bind(this), { passive: false });
      this.joyArea.addEventListener('touchend', this._onJoyEnd.bind(this), { passive: false });
      this.joyArea.addEventListener('touchcancel', this._onJoyEnd.bind(this), { passive: false });
    
      this.fireBtn.addEventListener('touchstart', this._onFireStart.bind(this), { passive: false });
      this.fireBtn.addEventListener('touchend', this._onFireEnd.bind(this), { passive: false });
      this.fireBtn.addEventListener('touchcancel', this._onFireEnd.bind(this), { passive: false });
    
      doc.addEventListener('gesturestart', e => e.preventDefault());
      doc.addEventListener('dblclick', e => e.preventDefault());
    },
  
    // 強制放開所有觸控狀態（失去焦點、切到背景、或結算畫面時呼叫）。
    // 舊版沒有這個介面，所以「按著 FIRE 切到別的分頁」回來後會持續射擊、搖桿也卡在偏移位置。
    reset() {
      this.joyTouchId = null;
      this.fireTouchId = null;
      touch.dir = -1;
      touch.fire = false;
      if (this.joyStick) { this.joyStick.style.left = '50%'; this.joyStick.style.top = '50%'; }
      if (this.fireBtn) this.fireBtn.classList.remove('pressed');
      if (this.joyBase) {
        // 回到 CSS 的預設位置（橫向 media query 會把它改成 left:20px/bottom:20px，
        // 舊版寫死 left:30px/bottom:30px，橫向放開搖桿時位置會跳一下）
        this.joyBase.style.left = '';
        this.joyBase.style.bottom = '';
      }
      this._updateJoyCenter();
    },

    _updateJoyCenter() {
      // 平台層不假設 DOM 一定存在（元素可能還沒進 DOM、或測試環境沒有 DOM）
      if (!this.joyBase || typeof this.joyBase.getBoundingClientRect !== 'function') return;
      const rect = this.joyBase.getBoundingClientRect();
      this.joyCenterX = rect.left + rect.width / 2;
      this.joyCenterY = rect.top + rect.height / 2;
    },
  
    _onJoyStart(e) {
      e.preventDefault();
      if (this.joyTouchId !== null) return;
    
      const touch = e.changedTouches[0];
      this.joyTouchId = touch.identifier;
    
      const areaRect = this.joyArea.getBoundingClientRect();
      let cx = touch.clientX;
      let cy = touch.clientY;
    
      cx = Math.max(areaRect.left + 70, Math.min(areaRect.right - 70, cx));
      cy = Math.max(areaRect.top + 70, Math.min(areaRect.bottom - 70, cy));
    
      this.joyBase.style.left = (cx - areaRect.left - 65) + 'px';
      this.joyBase.style.bottom = (win.innerHeight - cy - 65) + 'px';
      this.joyCenterX = cx;
      this.joyCenterY = cy;
    
      this._processJoy(touch.clientX, touch.clientY);
    },
  
    _onJoyMove(e) {
      if (this.joyTouchId === null) return;
      e.preventDefault();
    
      for (const t of e.changedTouches) {
        if (t.identifier === this.joyTouchId) {
          this._processJoy(t.clientX, t.clientY);
          break;
        }
      }
    },
  
    _onJoyEnd(e) {
      if (this.joyTouchId === null) return;
    
      for (const t of e.changedTouches) {
        if (t.identifier === this.joyTouchId) {
          e.preventDefault();
          this.joyTouchId = null;
          touch.dir = -1;
          this.joyStick.style.left = '50%';
          this.joyStick.style.top = '50%';
          this.joyBase.style.left = '30px';
          this.joyBase.style.bottom = '30px';
          this._updateJoyCenter();
          break;
        }
      }
    },
  
    _processJoy(touchX, touchY) {
      const dx = touchX - this.joyCenterX;
      const dy = touchY - this.joyCenterY;
      const dist = Math.hypot(dx, dy);
      const maxR = getConfig().JOYSTICK_MAX_RADIUS;
    
      const clampedDist = Math.min(dist, maxR);
      const ratio = dist > 0 ? clampedDist / dist : 0;
      const visualDx = dx * ratio;
      const visualDy = dy * ratio;
    
      this.joyStick.style.left = `calc(50% + ${visualDx}px)`;
      this.joyStick.style.top = `calc(50% + ${visualDy}px)`;
    
      const normDist = clampedDist / maxR;
      if (normDist < getConfig().JOYSTICK_DEADZONE) {
        touch.dir = -1;
      } else {
        touch.dir = Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? DIR.RIGHT : DIR.LEFT)
          : (dy > 0 ? DIR.DOWN : DIR.UP);
      }
    },
  
    _onFireStart(e) {
      e.preventDefault();
      if (this.fireTouchId !== null) return;
      this.fireTouchId = e.changedTouches[0].identifier;
      touch.fire = true;
      this.fireBtn.classList.add('pressed');
    },
  
    _onFireEnd(e) {
      if (this.fireTouchId === null) return;
      for (const t of e.changedTouches) {
        if (t.identifier === this.fireTouchId) {
          e.preventDefault();
          this.fireTouchId = null;
          touch.fire = false;
          this.fireBtn.classList.remove('pressed');
          break;
        }
      }
    }
  };
  return touchInput;
}

// 渲染層：地形與基地圖磚（M4）。

const EAGLE_ALIVE_SPRITE = [

const EAGLE_DEAD_SPRITE = [

  [3,3,0,0,0,3,3,3,0,0,0,3,3],

/**
 * @param {{TILE:number, renderScale?:number, doc?:object}} deps
 */
function makeTileRenderer({ TILE, renderScale = 1, doc = globalThis.document, art = () => null } = {}) {
  const _eagleCache = { alive: null, dead: null, scale: 0 };
  let _waterFlip = null;   // 水面第二幀：同一張圖水平翻轉（建一次）

  function drawBrickNES(cx2d, x, y, size) {
    const img = art('tile_brick');
    if (img) { cx2d.drawImage(img, x, y, size, size); return; }
    const half = size / 2;
    cx2d.fillStyle = '#7a7a7a';
    cx2d.fillRect(x, y, size, size);
    cx2d.fillStyle = '#b8401c';
    cx2d.fillRect(x + 1, y + 1, half - 2, half - 2);
    cx2d.fillRect(x + half + 1, y + 1, half - 2, half - 2);
    cx2d.fillRect(x + 1, y + half + 1, (half / 2) - 1, half - 2);
    cx2d.fillRect(x + (half / 2) + 1, y + half + 1, half - 2, half - 2);
    cx2d.fillRect(x + size - (half / 2), y + half + 1, (half / 2) - 1, half - 2);
    cx2d.fillStyle = '#d96846';
    cx2d.fillRect(x + 1, y + 1, half - 2, 1);
    cx2d.fillRect(x + half + 1, y + 1, half - 2, 1);
    cx2d.fillRect(x + 1, y + half + 1, (half / 2) - 1, 1);
    cx2d.fillRect(x + (half / 2) + 1, y + half + 1, half - 2, 1);
    cx2d.fillRect(x + size - (half / 2), y + half + 1, (half / 2) - 1, 1);
  }

  function drawSteelNES(cx2d, x, y, size) {
    const img = art('tile_steel');
    if (img) { cx2d.drawImage(img, x, y, size, size); return; }
    const half = size / 2;
    for (let qy = 0; qy < 2; qy++) {
      for (let qx = 0; qx < 2; qx++) {
        const px = x + qx * half;
        const py = y + qy * half;
        cx2d.fillStyle = '#9a9aa8';
        cx2d.fillRect(px, py, half, half);
        cx2d.fillStyle = '#dcdce8';
        cx2d.fillRect(px, py, half - 1, 1);
        cx2d.fillRect(px, py, 1, half - 1);
        cx2d.fillStyle = '#5a5a66';
        cx2d.fillRect(px + 1, py + half - 1, half - 1, 1);
        cx2d.fillRect(px + half - 1, py + 1, 1, half - 1);
      }
    }
  }

  function drawForestNES(cx2d, x, y, size) {
    const img = art('tile_forest');
    if (img) { cx2d.drawImage(img, x, y, size, size); return; }
    cx2d.fillStyle = '#0a4a0a';
    cx2d.fillRect(x, y, size, size);
    cx2d.fillStyle = '#1f7a1f';
    const blobs = [
      [size*0.25, size*0.30, 5],
      [size*0.70, size*0.30, 5],
      [size*0.40, size*0.65, 5],
      [size*0.80, size*0.75, 4],
      [size*0.15, size*0.75, 4],
    ];
    for (const [bx, by, br] of blobs) {
      cx2d.beginPath(); cx2d.arc(x+bx, y+by, br, 0, Math.PI*2); cx2d.fill();
    }
    cx2d.fillStyle = '#2eaf2e';
    for (const [bx, by, br] of blobs) {
      cx2d.fillRect(x+bx-1, y+by-br+1, 2, 2);
    }
  }

  function drawWaterDirect(cx2d, x, y, phase) {
    const img = art('tile_water');
    if (img) {
      if (phase && !_waterFlip) {
        _waterFlip = doc.createElement('canvas');
        _waterFlip.width = img.width; _waterFlip.height = img.height;
        const w = _waterFlip.getContext('2d');
        w.translate(img.width, 0); w.scale(-1, 1); w.drawImage(img, 0, 0);
      }
      cx2d.drawImage(phase ? _waterFlip : img, x, y, TILE, TILE);
      return;
    }
    cx2d.fillStyle = '#1c4ca8';
    cx2d.fillRect(x, y, TILE, TILE);
    cx2d.fillStyle = '#74c0fc';
    const half = TILE / 2;
    if (phase === 0) {
      cx2d.fillRect(x+2, y+4, 6, 2); cx2d.fillRect(x+half+2, y+4, 6, 2);
      cx2d.fillRect(x+4, y+half+4, 6, 2); cx2d.fillRect(x+half+4, y+half+4, 4, 2);
      cx2d.fillRect(x, y+half+4, 2, 2);
    } else {
      cx2d.fillRect(x+4, y+4, 6, 2); cx2d.fillRect(x+half+4, y+4, 4, 2);
      cx2d.fillRect(x, y+4, 2, 2); cx2d.fillRect(x+2, y+half+4, 6, 2);
      cx2d.fillRect(x+half+2, y+half+4, 6, 2);
    }
  }

  function buildEagleSprite(dead) {
    const scale = typeof renderScale === 'number' ? renderScale : 1;
    const cv = doc.createElement('canvas');
    cv.width = TILE * scale; cv.height = TILE * scale;
    const c = cv.getContext('2d');
    c.setTransform(scale, 0, 0, scale, 0, 0);
    c.imageSmoothingEnabled = false;
    const sprite = dead ? EAGLE_DEAD_SPRITE : EAGLE_ALIVE_SPRITE;
    c.fillStyle = '#000';
    c.fillRect(0, 0, TILE, TILE);
    const px = TILE / 13;
    const palette = dead ? { 1: '#404040', 2: '#202020', 3: '#a02020' } : { 1: '#d0d0d0', 2: '#ffffff', 3: '#404040' };
    for (let py = 0; py < 13; py++) {
      for (let pxi = 0; pxi < 13; pxi++) {
        const v = sprite[py][pxi];
        if (v !== 0) {
          c.fillStyle = palette[v];
          c.fillRect(pxi * px, py * px, px + 1, px + 1);
        }
      }
    }
    return cv;
  }

  function eagleSprite(dead) {
    const scale = typeof renderScale === 'number' ? renderScale : 1;
    if (_eagleCache.scale !== scale || !_eagleCache.alive) {
      _eagleCache.alive = buildEagleSprite(false);
      _eagleCache.dead = buildEagleSprite(true);
      _eagleCache.scale = scale;
    }
    return dead ? _eagleCache.dead : _eagleCache.alive;
  }

  function drawEagleDirect(cx2d, x, y, dead) {
    const img = art(dead ? 'eagle_dead' : 'eagle_alive');
    if (img) { cx2d.drawImage(img, x, y, TILE, TILE); return; }
    cx2d.drawImage(eagleSprite(dead), x, y, TILE, TILE);
  }

  // eagleCache 也曝露出來：驗證工具用它確認「快取真的建起來了」（不是每幀重畫）
  return { drawBrickNES, drawSteelNES, drawForestNES, drawWaterDirect, buildEagleSprite, eagleSprite, drawEagleDirect, eagleCache: _eagleCache };
}

// 渲染層：精靈與光暈（M4）。
//
// `glowCanvas(color)` 是「把一個顏色做成離屏的徑向光暈，之後到處 drawImage 重複使用」的 helper。
// 它原本**不存在**——M2 實作「帶道具的敵人發光」時直接呼叫了這個名字，於是每一幀、每一隻帶道具的
// 敵人（約 30%）都丟 `glowCanvas is not defined`，錯誤被主迴圈的 try/catch 接住、遊戲繼續跑，
// 但該幀 render 的後半段（子彈、粒子、分數彈出）全部被跳過，而且畫面會一直顯示錯誤提示。
//
// 教訓寫在 tools/verify-core.mjs：新增了一條「呼叫了但沒有定義的裸函式」靜態掃描，
// 這種錯誤現在會在 CI 就被擋下來，而不是等到玩家看到錯誤橫幅。

/** '#rrggbb' → 'rgba(r,g,b,a)'（光暈需要透明度漸層）。 */
function hexToRgba(hex, alpha) {
  const value = String(hex || '').replace('#', '');
  const full = value.length === 3 ? value.split('').map((ch) => ch + ch).join('') : value;
  const num = parseInt(full.slice(0, 6) || 'ffffff', 16);
  const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

/**
 * 建立一個「顏色 → 光暈畫布」的快取產生器。
 * @param {{size?:number, doc?:object}} deps
 */
function makeGlowCanvas({ size = 64, doc = globalThis.document } = {}) {
  const cache = new Map();

  return function glowCanvas(color) {
    if (cache.has(color)) return cache.get(color);
    const canvas = doc.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const c = canvas.getContext('2d');
    const half = size / 2;
    const gradient = c.createRadialGradient(half, half, 0, half, half, half);
    gradient.addColorStop(0, hexToRgba(color, 0.95));
    gradient.addColorStop(0.45, hexToRgba(color, 0.35));
    gradient.addColorStop(1, hexToRgba(color, 0));
    c.fillStyle = gradient;
    c.fillRect(0, 0, size, size);
    cache.set(color, canvas);
    return canvas;
  };
}

// 渲染層：WH40K 風格點陣圖素材（agy + Nano Banana 繪製，資料在 wh40k-data.js）。
//
// 圖片解碼是非同步的：載入完成前 art(name) 回 null，各繪製函式退回原本的程序化 NES 畫法，
// 所以 Node 的假 context 驗證與「圖還沒解完的前幾幀」都不受影響。全部解完後呼叫 onReady
// （呼叫端用它清掉以程序化畫法建好的坦克快取、重烘靜態地圖）。

/**
 * @param {{data:Object<string,string>, doc?:object, onReady?:Function}} deps
 * @returns {(name:string)=>HTMLImageElement|null}
 */
function makeArt({ data, doc = globalThis.document, onReady = () => {} } = {}) {
  const ready = new Map();
  const names = Object.keys(data || {});
  if (!doc || typeof Image === 'undefined' || names.length === 0) return () => null;
  let pending = names.length;
  const done = () => { if (--pending === 0) onReady(); };
  for (const name of names) {
    const img = new Image();
    img.onload = () => { ready.set(name, img); done(); };
    img.onerror = done;   // ponytail: 單張壞圖就退回程序化畫法，不重試
    img.src = data[name];
  }
  return (name) => ready.get(name) || null;
}

/** 以 (cx,cy) 為中心、旋轉 angle（弧度）畫一張圖。 */
function drawRotated(c, img, cx, cy, w, h, angle) {
  if (!angle) { c.drawImage(img, cx - w / 2, cy - h / 2, w, h); return; }
  c.save();
  c.translate(cx, cy);
  c.rotate(angle);
  c.drawImage(img, -w / 2, -h / 2, w, h);
  c.restore();
}

// 渲染層：粒子、生成特效、分數彈出、子彈（M4）。
//
// 從 index.html 搬過來，依賴改成注入（ctx／pools／getGame／dirs），因此可以用假 context
// 在 Node 驗證「畫了幾次、用了什麼顏色」—— 粒子批次化（固定色 + globalAlpha，不再每顆配
// rgba 字串）就是靠這樣量出來的。

/**
 * @param {{ctx:object, particlesPool:object, bulletsPool:object, getGame:Function,
 *          smokeColor?:string, dirs?:{UP:number,DOWN:number,LEFT:number}}} deps
 */


function makeEffectRenderer({ ctx, particlesPool, bulletsPool, getGame, smokeColor = '#505050', dirs = { UP: 0, DOWN: 2, LEFT: 3 }, art = () => null }) {
  // WH40K 素材版：火花／煙霧改成貼圖（alpha 隨壽命淡出）。素材未載入時走下面的原始畫法。
  function drawParticlesArt(sparkImg, smokeImg) {
    const arr = particlesPool.active;
    ctx.save();
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];
      if (!p.alive || p.type !== 'smoke') continue;
      const sz = p.size * 1.6;
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife) * 0.6;
      ctx.drawImage(smokeImg, p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];
      if (!p.alive || p.type !== 'spark') continue;
      const t = p.life / p.maxLife;
      const sz = p.size * (p.color === '#5cd8ff' ? 2 : 3) * (0.6 + t * 0.6);
      ctx.globalAlpha = Math.min(1, t * 1.4);
      ctx.drawImage(sparkImg, p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ctx.restore();
  }

  function drawParticles() {
    const sparkImg = art('spark'), smokeImg = art('smoke');
    if (sparkImg && smokeImg) { drawParticlesArt(sparkImg, smokeImg); return; }
    const arr = particlesPool.active;
    ctx.save();
    // 顏色只在「真的變了」的時候才指派：指派 fillStyle 要解析字串（實測 800 顆火花
    // 每顆都指派一次 ≈ 0.32 ms／幀，改成記住上一個顏色 ≈ 0.22 ms）。
    // 繪製順序完全不變（不像分色批次化那樣會改變重疊時的疊序），所以畫面逐像素相同。
    let lastFill = null;
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];
      if (!p.alive || p.type !== 'spark') continue;
      const t = p.life / p.maxLife;
      const fill = p.color === '#5cd8ff'
        ? (t > 0.5 ? '#ffffff' : '#74c0fc')
        : (t > 0.7 ? '#ffeb50' : t > 0.4 ? '#ff9020' : '#c03030');
      if (fill !== lastFill) { ctx.fillStyle = fill; lastFill = fill; }
      const sz = (p.size + 0.5) | 0;
      ctx.fillRect(p.x | 0, p.y | 0, sz, sz);
    }
    const smokeFill = smokeColor;      // 固定色 + globalAlpha（純數值）：不再為每顆煙霧配 rgba 字串
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];
      if (!p.alive || p.type !== 'smoke') continue;
      const a = Math.max(0, p.life / p.maxLife);
      if (lastFill !== smokeFill) { ctx.fillStyle = smokeFill; lastFill = smokeFill; }
      ctx.globalAlpha = a * 0.5;
      ctx.fillRect(p.x | 0, p.y | 0, p.size | 0, p.size | 0);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawNESSpawnEffect(x, y, size, life, maxLife) {
    const warp = art('warp');
    if (warp) {
      const t = life / maxLife;                       // 1 → 0：裂隙張開後收束
      const sz = size * 1.6 * Math.sin(Math.PI * Math.min(1, (1 - t) * 1.2 + 0.1));
      ctx.save();
      ctx.globalAlpha = 0.9;
      drawRotated(ctx, warp, x + size / 2, y + size / 2, sz, sz, (maxLife - life) * 0.25);
      ctx.restore();
      return;
    }
    ctx.save();
    const frame = (((maxLife - life) >> 2) % 4);
    const cx = x + size / 2;
    const cy = y + size / 2;
    const r = size / 2;
    ctx.fillStyle = '#ffffff';
    if (frame === 0) {
      ctx.fillRect((cx - 1) | 0, y, 2, size);
      ctx.fillRect(x, (cy - 1) | 0, size, 2);
    } else if (frame === 1) {
      ctx.fillRect((cx - 1) | 0, y, 2, size);
      ctx.fillRect(x, (cy - 1) | 0, size, 2);
      for (let i = -r + 2; i <= r - 2; i += 2) {
        ctx.fillRect((cx + i) | 0, (cy + i) | 0, 2, 2);
        ctx.fillRect((cx + i) | 0, (cy - i) | 0, 2, 2);
      }
    } else if (frame === 2) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, y);    ctx.lineTo(x + size, cy);
      ctx.lineTo(cx, y + size);  ctx.lineTo(x, cy);
      ctx.closePath();
      ctx.stroke();
    } else {
      ctx.fillRect((cx - 3) | 0, (cy - 3) | 0, 6, 6);
    }
    ctx.restore();
  }

  function drawScorePopups() {
    ctx.save();
    ctx.font = '10px "Press Start 2P"';
    ctx.fillStyle = '#ffe680';
    for (let i = 0; i < getGame().scorePopups.length; i++) {
      const p = getGame().scorePopups[i];
      ctx.globalAlpha = p.life / 40;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.restore();
  }

  function renderBullets() {
    const bullets = bulletsPool.active;
    if (bullets.length === 0) return;

    const shellImg = art('shell'), pImg = art('bullet_player'), eImg = art('bullet_enemy');
    ctx.save();
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      if (!b.alive) continue;
      const cx = (b.x + b.size / 2) | 0;
      const cy = (b.y + b.size / 2) | 0;
      const img = b.shell ? shellImg : (b.isPlayer ? pImg : eImg);
      if (img) {
        // 素材朝上；方向取速度向量（散彈有斜向），速度為 0 的光束段退回 dir
        const ang = (b.vx || b.vy) ? Math.atan2(b.vy, b.vx) + Math.PI / 2
          : [0, Math.PI / 2, Math.PI, -Math.PI / 2][b.dir] || 0;
        const sz = b.shell ? 18 : 13;
        drawRotated(ctx, img, cx, cy, sz, sz, ang);
        continue;
      }

      // BOSS 砲彈（攻城核心）：比一般子彈大、橘紅色外框 + 引信閃爍，讓玩家有時間離開落點。
      // 一般子彈是 6×6 的 NES 小點，砲彈必須一眼就分得出來（否則「範圍傷害」完全來不及反應）。
      if (b.shell) {
        const blink = (b.fuse >> 2) & 1;
        ctx.fillStyle = '#000';
        ctx.fillRect(cx - 5, cy - 5, 10, 10);
        ctx.fillStyle = blink ? '#ffcc33' : '#ff4422';
        ctx.fillRect(cx - 4, cy - 4, 8, 8);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(cx - 2, cy - 2, 2, 2);
        continue;
      }
      ctx.fillStyle = '#000';
      ctx.fillRect(cx - 3, cy - 3, 6, 6);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 2, cy - 2, 4, 4);
      if (b.dir === dirs.UP)         ctx.fillRect(cx - 1, cy - 4, 2, 2);
      else if (b.dir === dirs.DOWN)  ctx.fillRect(cx - 1, cy + 2, 2, 2);
      else if (b.dir === dirs.LEFT)  ctx.fillRect(cx - 4, cy - 1, 2, 2);
      else                       ctx.fillRect(cx + 2, cy - 1, 2, 2);
    }
    ctx.restore();
  }

  return { drawParticles, drawNESSpawnEffect, drawScorePopups, renderBullets };
}

// UI 層：HUD（M4）。
//
// 從 index.html 搬過來，依賴改成注入（元素集合／狀態取值器／時效系統／資料表），
// 因此可以在 Node 用假 DOM 驗證「分數、生命、狀態晶片字串」的組法。

/**
 * @param {{els:object, getGame:Function, fx:object, tables:{weapons:object, activeSkills:Array}, config:object}} deps
 */
function makeHud({ els, getGame, fx, tables, config }) {
  function update() {
    els.score.textContent = getGame().score;
    els.lives.textContent = '♥'.repeat(Math.max(0, Math.ceil(getGame().playerStats.hp)));
    els.enemies.textContent = getGame().maxEnemies - getGame().enemiesSpawned + getGame().aliveEnemies;

    if (getGame().isVSMode) {
      els.level.textContent = 'SURVIVAL';
      els.level.className = 'value level vs-alert';
    } else {
      els.level.textContent = getGame().level + (getGame().level % config.GAMEPLAY.BOSS_LEVEL_INTERVAL === 0 ? '(BOSS)' : '');
      els.level.className = 'value level';
    }

    const chips = [];
    const weapon = getGame().playerStats.weapon || 'NORMAL';
    if (weapon !== 'NORMAL') {
      const wp = tables.weapons[weapon];
      chips.push(`<span class="power-chip" style="border-color:${wp ? wp.color : '#5cd8ff'}">${weapon}</span>`);
    }
    if (getGame().playerStats.pierce) chips.push(`<span class="power-chip">PIERCE</span>`);
    if (getGame().playerStats.speedMult > 1) chips.push(`<span class="power-chip">SPEED+</span>`);
    if (getGame().playerStats.shopFireRateBonus > 0) chips.push(`<span class="power-chip">RAPID+</span>`);
    if (getGame().playerStats.passives.length > 0) {
      chips.push(`<span class="power-chip" style="background:#330033;border-color:#ff00ff">P${getGame().playerStats.passives.length}</span>`);
    }
    if (getGame().playerStats.activeSkill) {
      const cdPct = Math.floor((fx.left('skill') / 30) * 100);
      const skillDef = tables.activeSkills.find((s) => s.id === getGame().playerStats.activeSkill);
      const keyLabel = skillDef && skillDef.key ? skillDef.key.replace('Key', '') : 'Q';
      chips.push(`<span class="power-chip" style="background:#003300;border-color:#00ff00">[${keyLabel}]${getGame().playerStats.activeSkill}${cdPct > 0 ? '(' + cdPct + ')' : ''}</span>`);
    }
    if (fx.has('boost')) {
      chips.push(`<span class="power-chip" style="background:#ff0000;border-color:#ff6600">OVERCLOCK</span>`);
    }
    if (fx.has('wall')) {
      const sec = Math.ceil(fx.left('wall') / 60);
      chips.push(`<span class="power-chip" style="background:#444;border-color:#888">🧱${sec}s</span>`);
    }
    if (fx.has('freeze')) {
      const sec = Math.ceil(fx.left('freeze') / 60);
      chips.push(`<span class="power-chip" style="background:#004;border-color:#00ffff">⏱️${sec}s</span>`);
    }
    chips.push(`<span class="power-chip" style="background:#300;border-color:#f88">❤️${getGame().continues}</span>`);
    els.power.innerHTML = chips.join('');
  }

  return { update };
}

// UI 層：畫面流程（M4）—— 暫停／商店／接關／結束。

// 這些函式是「畫面流程」：操作 DOM，也會改動遊戲狀態（`G.state`）或呼叫玩法函式

/**
 * @param {{
 *   doc: object, getGame: Function, states: object,
 *   tables: { shopItems: Array },
 *   hooks: {
 *     getShopPrice: Function, buyItem: Function, restartGame: Function, continueGame: Function,
 *     updateMobileControls: Function, playSound: Function, playMusic: Function, jingleGameOver: Function,
 *   },
 * }} deps
 */
function makeScreens({ doc, getGame, states, tables, hooks }) {
  function togglePause() {
    const game = getGame();
    const ov = doc.getElementById('overlay');
    if (game.state === states.PLAYING) {
      game.state = states.PAUSED;
      ov.classList.add('translucent');
      ov.classList.remove('hidden');
      ov.innerHTML = `<h2>PAUSED</h2><p>按 <b>P</b> 繼續</p>
        <button class="start-btn" id="resumeBtn" style="margin-top:15px;">繼續</button>
        <button class="start-btn" id="shopBtn" style="margin-top:10px;background:linear-gradient(180deg,rgba(255,215,0,0.08),rgba(255,170,0,0.02));border-color:#ffd700;color:#ffd700;">商店 (B)</button>`;
      doc.getElementById('resumeBtn').onclick = togglePause;
      doc.getElementById('shopBtn').onclick = () => { togglePause(); openShop(); };
      doc.getElementById('resumeBtn').focus();
      hooks.playSound(440, 0.05, 0.2, 'square');
    } else if (game.state === states.PAUSED) {
      game.state = states.PLAYING;
      ov.classList.remove('translucent');
      ov.classList.add('hidden');
      hooks.playSound(440, 0.05, 0.2, 'square');
    }
  }

  function openShop() {
    const game = getGame();
    if (game.state !== states.PLAYING) return;
    game.state = states.SHOP;
  
    const ov = doc.getElementById('overlay');
    ov.classList.remove('hidden');
    ov.classList.remove('translucent');
  
    let shopHTML = `<h1>🏪 商店</h1>
      <p style="color:#ffd700;margin-bottom:15px;">分數: ${game.score}</p>
      <div class="shop-grid">`;
  
    for (const item of tables.shopItems) {
      const price = hooks.getShopPrice(item.price);
      const canAfford = game.score >= price;
      const disabled = !canAfford || (item.type === 'pierce' && game.playerStats.pierce);
      const btnClass = disabled ? 'shop-item disabled' : 'shop-item';
      shopHTML += `
        <div class="${btnClass}" data-id="${item.id}" ${disabled ? 'style="opacity:0.4;pointer-events:none;"' : ''}>
          <div style="font-size:24px;">${item.icon}</div>
          <div class="card-title" style="color:${item.color}">${item.name}</div>
          <div class="card-desc">${item.desc}</div>
          <div style="color:#ffd700;font-size:9px;margin-top:5px;">💰 ${price}</div>
        </div>
      `;
    }
  
    shopHTML += `</div>
      <button class="start-btn" id="closeShopBtn" style="margin-top:15px;background:#333;border-color:#666;color:#aaa;">❌ 退出商店</button>
      <p style="margin-top:10px;color:#888;font-size:8px;">按 <b>B</b> 或 <b>ESC</b> 關閉商店</p>`;
  
    ov.innerHTML = shopHTML;
  
    doc.querySelectorAll('.shop-item').forEach(el => {
      el.onclick = () => hooks.buyItem(el.dataset.id);
    });
  
    const closeBtn = doc.getElementById('closeShopBtn');
    if (closeBtn) closeBtn.onclick = closeShop;
  }

  function closeShop() {
    const game = getGame();
    game.state = states.PLAYING;
    doc.getElementById('overlay').classList.add('hidden');
  }

  function showGameOver() {
    const game = getGame();
    game.state = states.GAMEOVER;
    hooks.jingleGameOver();
    hooks.playMusic('GAMEOVER');
    if (game.continues > 0) showContinuePrompt();
    else showFinalGameOver();
  }

  function showContinuePrompt() {
    const game = getGame();
    const ov = doc.getElementById('overlay');
    ov.classList.remove('hidden');
    ov.innerHTML = `<h2>CONTINUE?</h2>
      <p>剩 <span style="color:#ffd700;">${game.continues}</span> 次接關</p>
      <p style="color:#888; font-size:8px; margin-top:6px;">分數 + 升級保留 · 從本關重啟</p>
      <div style="display:flex; gap:14px; margin-top:22px; flex-wrap:wrap; justify-content:center;">
        <button class="start-btn" id="continueBtn">CONTINUE</button>
        <button class="start-btn" id="quitBtn" style="border-color:#ff5050; color:#ff5050; text-shadow:0 0 8px rgba(255,80,80,0.5);">QUIT</button>
      </div>`;
    const cb = doc.getElementById('continueBtn');
    cb.onclick = hooks.continueGame;
    doc.getElementById('quitBtn').onclick = showFinalGameOver;
    setTimeout(() => cb.focus(), 0);
    hooks.updateMobileControls();
  }

  function showFinalGameOver() {
    const game = getGame();
    const ov = doc.getElementById('overlay');
    ov.classList.remove('hidden');
    ov.innerHTML = `<h2>SYSTEM FAILURE</h2>
      <p>SCORE: <span style="color:#ffd700;">${game.score}</span></p>
      <p>LEVEL: <span style="color:#6cc3ff;">${game.level}</span></p>
      <button class="start-btn" id="restartBtn">REBOOT</button>`;
    const rb = doc.getElementById('restartBtn');
    rb.onclick = () => { hooks.playMusic('MENU'); hooks.restartGame(); };
    setTimeout(() => rb.focus(), 0);      // 讓 Enter/Space 可以直接重開（配合 preventDefault 收斂）
    hooks.updateMobileControls();
  }

  /**
   * 升級三選一：只負責畫卡片與回報選擇（選卡後的規則在遊戲層的 applyUpgrade）。
   * @param {Array} options generateUpgradeOptions() 的結果
   * @param {Function} onPick 被選中的選項
   */
  function renderUpgrade(options, onPick) {
    const game = getGame();
    game.state = states.UPGRADE;
    hooks.jingleLevelClear();
    hooks.stopMusic();
    const ui = doc.getElementById('upgradeUI');
    const container = doc.getElementById('cards');
    ui.classList.remove('hidden');
    container.innerHTML = '';
    options.forEach((opt) => {
      const div = doc.createElement('div');
      div.className = 'upgrade-card';
      div.style.borderColor = opt.color;
      div.style.boxShadow = `0 0 15px ${opt.color}33`;
      div.tabIndex = 0;
      div.setAttribute('role', 'button');
      div.innerHTML = `
        <div style="font-size:24px;margin-bottom:8px;">${opt.icon || '⬆️'}</div>
        <div class="card-title" style="color:${opt.color}">${opt.title}</div>
        <div class="card-desc">${opt.desc}</div>
      `;
      div.onclick = () => onPick(opt);
      div.onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(opt); }
      };
      container.appendChild(div);
    });
    setTimeout(() => container.firstChild && container.firstChild.focus(), 0);
  }

  /** 標題畫面（restartGame 會呼叫）：只負責 overlay 內容，遊戲狀態重置留在遊戲層。 */
  function renderMenu() {
    doc.getElementById('overlay').innerHTML = `
      <h1>TANK WARS v2</h1>
      <p>四條武器流派 · 被動技能 · 菁英詞綴 · 主動技能</p>
      <p>選擇你的流派，每局玩法都不同!</p>
      ${hooks.isMobile()
        ? '<p style="margin-top:12px; color:#ffd700;">左搖桿 <b>移動</b></p><p style="color:#ffd700;">右按鈕 <b>射擊</b></p>'
        : '<p style="margin-top:12px; color:#ffd700;">WASD / 方向鍵 <b>移動</b></p><p style="color:#ffd700;">空白鍵 <b>射擊</b> · Q <b>主動技能</b></p>'
      }
    `;
  }

  /** 音樂開關的圖示與 tooltip（按鈕與 N 鍵共用）。 */
  function updateMusicIcon() {
    const btn = doc.getElementById('musicToggle');
    if (!btn) return;
    const on = hooks.isMusicEnabled();
    btn.textContent = on ? '🎵' : '🔇';
    btn.style.opacity = on ? '1' : '0.45';
    btn.title = on ? '切換音樂 (N)：開' : '切換音樂 (N)：關';
  }

  return { togglePause, openShop, closeShop, showGameOver, showContinuePrompt, showFinalGameOver, renderUpgrade, renderMenu, updateMusicIcon };
}

// ==================== 性能監測系統 ====================
const Perf = {
  enabled: false,
  frameStart: 0,
  frameTimes: new Float64Array(60),
  frameTimeIdx: 0,
  frameTimeCount: 0,
  fpsTimer: 0,
  fps: 60,
  collisionChecks: 0,

  // 量「整幀」（update + render）而不是只看 update：舊版把 begin/end 放在固定時間步長的
  // while 迴圈內，一幀跑多次 update 時數字會互相覆蓋，而且完全沒有量到 render。
  beginFrame() {
    if (!this.enabled) return;
    this.frameStart = performance.now();
    this.collisionChecks = 0;
    this.updatesThisFrame = 0;
  },

  begin() {
    this.updatesThisFrame = (this.updatesThisFrame || 0) + 1;
  },

  end() {
    if (!this.enabled) return;
    const dt = performance.now() - this.frameStart;
    this.frameTimes[this.frameTimeIdx] = dt;
    this.frameTimeIdx = (this.frameTimeIdx + 1) % 60;
    if (this.frameTimeCount < 60) this.frameTimeCount++;
  },

  _els: null,
  updateUI() {
    if (!this.enabled || G.frameCount % 15 !== 0) return;
    // 元素快取 + 只在值真的變了才寫 DOM：舊版每次 flush 都 5 次 getElementById 且無條件賦值
    // （開著 F3 時這 4Hz 的成本剛好疊在被量測的對象上）。
    if (!this._els) {
      this._els = {
        fps: document.getElementById('perfFPS'), frame: document.getElementById('perfFrame'),
        enemies: document.getElementById('perfEnemies'), bullets: document.getElementById('perfBullets'),
        particles: document.getElementById('perfParticles'), collisions: document.getElementById('perfCollisions'),
        peak: document.getElementById('perfPeak'),
      };
    }
    const set = (el, value) => { if (el && el.textContent !== String(value)) el.textContent = value; };

    let avgFrame = 0;
    if (this.frameTimeCount > 0) {
      for (let i = 0; i < this.frameTimeCount; i++) avgFrame += this.frameTimes[i];
      avgFrame /= this.frameTimeCount;
    }
    const fps = avgFrame > 0 ? Math.min(60, Math.round(1000 / avgFrame)) : 60;

    const fpsEl = this._els.fps, frameEl = this._els.frame;
    set(fpsEl, fps);
    // 不再用 Math.min(60, ...) 蓋掉真實掉幀：低於 60 就照實顯示
    const fpsClass = fps < 30 ? 'bad' : fps < 50 ? 'warn' : '';
    if (fpsEl && fpsEl.className !== fpsClass) fpsEl.className = fpsClass;

    set(frameEl, avgFrame.toFixed(1) + ' ms');
    const frameClass = avgFrame > 20 ? 'bad' : avgFrame > 12 ? 'warn' : '';
    if (frameEl && frameEl.className !== frameClass) frameEl.className = frameClass;

    set(this._els.enemies, G.enemies.length);
    set(this._els.bullets, bulletsPool.active.length);
    set(this._els.particles, particlesPool.active.length);
    set(this._els.collisions, this.collisionChecks);
    // 池峰值：Pool 早就在記錄 _peakActive 卻從來沒顯示，調 BULLET_MAX / POOL_SIZE 只能靠猜
    if (this._els.peak) {
      set(this._els.peak, `${Math.max(bulletsPool._peakActive, particlesPool._peakActive)}`);
    }
  },

  toggle() {
    this.enabled = !this.enabled;
    document.getElementById('perfMonitor').classList.toggle('show', this.enabled);
  }
};

// Fisher-Yates 洗牌
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 陣列原地壓縮（移除 !alive 的元素）
function compact(arr, aliveKey = 'alive') {
  let w = 0;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i][aliveKey]) { if (w !== i) arr[w] = arr[i]; w++; }
  }
  arr.length = w;
  return arr;
}

// 距離平方（取代 Math.hypot 進行中）
function distSq(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx * dx + dy * dy;
}

// ==================== 武器管理器 (Weapon Manager) ====================
const WeaponManager = {
  fire(tank) {
    if (!tank.isPlayer) {
      // 敵人：維持原本行為（單發、各自冷卻、BOSS 用專用彈速、不觸發震屏/音效/特效）
      if (!tank.alive || tank.bulletTimer > 0) return;
      const hs = tank.size / 2;
      const cx = tank.x + hs;
      const cy = tank.y + hs;
      const b = bulletsPool.acquire();
      b.dir = tank.aimDir;
      b.isPlayer = false;
      b.pierce = false;
      b.x = cx - 3 + DX[tank.aimDir] * (hs + 2);
      b.y = cy - 3 + DY[tank.aimDir] * (hs + 2);
      b.speed = bulletSpeed(tank.type === 'BOSS' ? CONFIG.BULLET.SPEED_BOSS : CONFIG.BULLET.SPEED_ENEMY);
      b.vx = DX[tank.aimDir]; b.vy = DY[tank.aimDir];
      b.power = tank.weapon === 'SPREAD' ? 2 : 1;
      b.hitTanks.length = 0;
      tank.bulletTimer = tank.bulletCooldown;
      return;
    }

    const weaponKey = tank.weapon || 'NORMAL';
    const config = WEAPON_REGISTRY[weaponKey] || WEAPON_REGISTRY.NORMAL;
    
    // 攻速計算
    let cooldownMult = getHeatStacksMultiplier();
    // cooldownMult 是冷卻倍率（越小越快；HEAT 也是用 1/(1+stacks*0.03) 變快）。
    // 舊版寫 *= 2 讓「超頻爆發」期間冷卻加倍＝射速砍半，按下去是懲罰而不是爆發。
    if (fx.has('boost')) cooldownMult *= 0.5;
    const fireRateBonus = G.playerStats.shopFireRateBonus || 0;
    const actualCD = Math.max(2, Math.floor(config.fireRate * cooldownMult * (1 - fireRateBonus)));
    tank.bulletTimer = actualCD;

    // 获取基础伤害
    const basePower = config.power;
    const weaponData = WEAPON_TREE[weaponKey];
    const weaponTreePower = weaponData ? weaponData.basePower : 1.0;
    const damageBonus = tank.isPlayer ? (G.playerStats.weaponDamageBonus || 0) : 0;
    const finalPower = weaponTreePower * basePower + damageBonus;

    // 生成子弹
    for (let i = 0; i < config.count; i++) {
      const angle = config.spread * (i - (config.count - 1) / 2);
      this.spawnBullet(tank, angle, finalPower, config.effect);
    }

    // 触发特殊效果
    if (config.effect === 'BOMBARD') this.triggerBombard();
    if (config.effect === 'SPAWN_TURRET') this.spawnTurret(tank);

    triggerShake(2, 1);
    Sound.shoot();
    if (tank.isPlayer) applyPassiveEffects(null, tank, 'shoot');
  },

  spawnBullet(tank, angle, power, effect) {
    const hs = tank.size / 2;
    const cx = tank.x + hs;
    const cy = tank.y + hs;
    
    const baseDir = tank.aimDir;
    const dx = DX[baseDir], dy = DY[baseDir];
    const cos = Math.cos(angle), sin = Math.sin(angle);
    
    const vx = dx * cos - dy * sin;
    const vy = dx * sin + dy * cos;

    const b = bulletsPool.acquire();
    b.x = cx - 3; b.y = cy - 3;
    b.dir = baseDir;
    b.isPlayer = tank.isPlayer;
    b.freezing = !tank.isPlayer && tank.elitePrefix === 'FREEZING';   // FREEZING 精英的子彈會凍緩玩家
    b.vx = vx; b.vy = vy;
    b.speed = bulletSpeed(tank.isPlayer ? CONFIG.BULLET.SPEED_PLAYER : CONFIG.BULLET.SPEED_ENEMY);
    b.power = power;
    b.pierce = (effect === 'PIERCE' || effect === 'LASER_BEAM' || tank.pierce);
    b.hitTanks.length = 0;
    b.ignoreTiles = (effect === 'LASER_BEAM');
    
    if (effect === 'LASER_BEAM') {
      b.laserLife = 15;
      for (let i = 1; i < 30; i++) {
        const lb = bulletsPool.acquire();
        lb.x = tank.x + i * 15 * DX[baseDir];
        lb.y = tank.y + i * 15 * DY[baseDir];
        lb.dir = baseDir;
        lb.isPlayer = true;
        lb.vx = 0; lb.vy = 0;
        lb.speed = 0;
        lb.power = power;
        lb.laserLife = 15;
        lb.ignoreTiles = true;
        lb.hitTanks.length = 0;
      }
    }
  },

  triggerBombard() {
    if (G.frameCount % 180 === 0) {
      for (let i = 0; i < 20; i++) {
        const bx = rnd() * W;
        const by = rnd() * H;
        setTimeout(() => {
          if (G.level === G.level && G.state === STATE.PLAYING) {
            spawnExplosion(bx, by, 'big');
            triggerShake(4, 5);
          }
        }, i * 50);
      }
    }
  },

  spawnTurret(tank) {
    const maxTurrets = 1 + (tank.weaponTier || 0);
    const existingTurrets = G.summonEntities.filter(e => e.type === 'turret').length;
    if (existingTurrets < maxTurrets) {
      G.summonEntities.push({
        type: 'turret',
        x: tank.x,
        y: tank.y,
        life: 300 + (tank.weaponTier || 0) * 100,
        maxLife: 300 + (tank.weaponTier || 0) * 100,
        damage: 1 + (tank.weaponTier || 0),
        cooldown: 0,
        alive: true
      });
    }
  }
};

function upgradeCard(type, data, titlePrefix = '') {
  return {
    type,
    id: data.id,
    title: `${titlePrefix}${data.name}`,
    desc: data.desc,
    icon: data.icon,

  };
